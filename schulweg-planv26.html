<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulwegplan</title>
<style>
  :root{
    --paper:#FFFDF8;
    --paper-raised:#FFFFFF;
    --ink:#2E2A22;
    --ink-soft:#7A7364;
    --line:#EDE6D6;
    --amber:#F2A93B;
    --amber-soft:#FDECC9;
    --teal:#2E9E8F;
    --teal-soft:#D9F1EC;
    --brick:#EF6F5B;
    --brick-soft:#FDE1DA;
    --violet:#8B7FD9;
    --violet-soft:#EAE6FB;
    --pink:#EE7FA8;
    --pink-soft:#FCE3ED;
    --blue:#4FA3D1;
    --blue-soft:#DDF0FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 92% 0%, var(--blue-soft) 0%, transparent 40%),
      radial-gradient(circle at 4% 8%, var(--pink-soft) 0%, transparent 35%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,h3,.rounded{font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;}
  header{
    padding:22px 18px 14px;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:2px solid var(--line);
  }
  header h1{
    margin:0 0 4px;
    font-size:29px;
    font-weight:700;
    color:var(--teal);
  }
  header p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .datebar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .datenav-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper-raised);
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  #dateInput{
    flex:1;
    font-family:-apple-system,system-ui,sans-serif;
    font-size:15px;
    font-weight:600;
    padding:9px 10px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .today-btn{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:13px;
    font-weight:600;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:10px;
    padding:0 14px;
    height:38px;
    cursor:pointer;
    flex-shrink:0;
  }
  .weekday-chip{
    font-family: ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:var(--ink-soft);
    border-radius:8px;
    padding:9px 10px;
    flex-shrink:0;
    min-width:30px;
    text-align:center;
  }
  .dateinfo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
  }
  .dateinfo-row .today-btn{margin-left:auto;}
  .lang-btn{
    font-size:20px;
    background:none;
    border:2px solid transparent;
    border-radius:8px;
    padding:2px 4px;
    cursor:pointer;
    opacity:0.5;
  }
  .lang-btn.selected{opacity:1;border-color:var(--teal);}
  .weather-chip{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper-raised);
    border:2px solid var(--line);
    border-radius:20px;
    padding:5px 12px;
  }

  .school-photo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
  }
  .school-photo-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    font-size:20px;
    background:#fff;
    border:2px solid var(--line);
    border-radius:12px;
    cursor:pointer;
  }
  .photo-check{
    position:absolute;
    top:-6px;
    right:-6px;
    background:var(--teal);
    color:#fff;
    width:16px;
    height:16px;
    border-radius:50%;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .school-photo-view{
    font-size:16px;
    text-decoration:none;
  }
  .school-photo-status{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .topsave-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .save-btn-top{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:10px;
    padding:9px 16px;
    cursor:pointer;
  }
  .topsave-status{
    font-size:12px;
    color:var(--ink-soft);
    flex:1;
  }
  .topsave-status.error{
    color:var(--brick);
    font-weight:700;
  }
  .reset-link{
    font-size:11.5px;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
    flex-shrink:0;
  }
  .weekday-badge{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:15px;
    font-weight:700;
  }
  main{padding:18px;max-width:560px;margin:0 auto;}

  .c-pink-dark{background:#F6BAD5 !important;border-color:#E85A93 !important;}
  .c-blue-dark{background:#A9D8EF !important;border-color:#2E86BE !important;}

  .savebar{
    margin-top:10px;
  }
  .save-btn{
    width:100%;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:17px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:14px;
    padding:15px;
    cursor:pointer;
  }
  .save-btn:active{background:#267C70;}

  /* --- day panel --- */
  .daypanel h2.daytitle{
    font-size:27px;
    margin:0 0 6px;
    font-weight:700;
  }
  .day-status-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:16px;
  }
  .holiday-banner{
    background:var(--brick);
    color:#fff;
    font-weight:700;
    font-size:14px;
    padding:10px 14px;
    border-radius:12px;
    margin-bottom:14px;
  }
  .day-status-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    background:var(--line);
    color:var(--ink-soft);
  }
  .day-status-chip .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:currentColor;
    opacity:0.6;
  }
  .day-status-chip.tone-ok{background:var(--teal-soft);color:#1F6D5E;}
  .day-status-chip.tone-warn{background:var(--amber-soft);color:#8A5A0F;}
  .day-status-chip.tone-alert{background:var(--brick-soft);color:#A23F2C;}
  .day-status-chip.tone-info{background:var(--violet-soft);color:#5A4FA0;}
  section.field{
    margin-bottom:16px;
    padding:16px 16px 18px;
    border-radius:16px;
    border:2px solid var(--line);
  }
  .field label.field-label{
    display:block;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:10px;
  }
  section.field.c-amber{background:var(--amber-soft);border-color:#F3D796;}
  section.field.c-teal{background:var(--teal-soft);border-color:#AEE0D6;}
  section.field.c-blue{background:var(--blue-soft);border-color:#B7DCEE;}
  section.field.c-brick{background:var(--brick-soft);border-color:#F4C1B3;}
  section.field.c-violet{background:var(--violet-soft);border-color:#CBC1F2;}
  section.field.c-pink{background:var(--pink-soft);border-color:#F5BFD5;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{
    padding:8px 15px;
    border-radius:20px;
    border:2px solid rgba(0,0,0,0.08);
    background:#fff;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .chip.selected{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  select, input[type=text]{
    font-family:-apple-system,system-ui,sans-serif;
    font-size:14.5px;
    padding:10px 10px;
    border-radius:10px;
    border:2px solid rgba(0,0,0,0.08);
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  textarea.autogrow{
    font-family:-apple-system,system-ui,sans-serif;
    font-size:14.5px;
    padding:10px 10px;
    border-radius:10px;
    border:2px solid rgba(0,0,0,0.08);
    background:#fff;
    color:var(--ink);
    width:100%;
    resize:none;
    overflow:hidden;
    line-height:1.4;
  }
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .subrow{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    font-size:13.5px;
  }
  .subrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--brick);}
  .kidblock{
    background:#fff;
    border:2px solid rgba(0,0,0,0.06);
    border-radius:12px;
    padding:12px 14px;
    margin-top:10px;
  }
  .kidblock .kidname{font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--brick);}
  .readiness-grid{display:flex;gap:10px;margin-top:2px;}
  .readiness-grid > div{flex:1;}
  .readiness-grid label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .exception-reason{margin-top:8px;}
  .dua-note{
    margin-top:10px;
    padding:10px 12px;
    background:#fff;
    border:2px dashed var(--pink);
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    color:#B4527A;
  }
  .add-btn{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    background:var(--violet);
    border:none;
    border-radius:10px;
    padding:9px 14px;
    cursor:pointer;
    margin-top:4px;
  }
  .entry-card{
    background:#fff;
    border:2px solid rgba(0,0,0,0.06);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .entry-card .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .remove-btn{
    background:none;
    border:none;
    color:var(--brick);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:4px 6px;
  }
  .savestate{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:24px;
    min-height:16px;
    padding:0 8px;
  }
  .savestate.error{
    color:var(--brick);
    font-weight:700;
    font-size:13.5px;
  }
  .participant-hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .bus-times-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:12px;
  }
  .bus-time-pill{
    font-size:12.5px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    background:#fff;
    border:2px solid rgba(0,0,0,0.06);
    border-radius:8px;
    padding:5px 8px;
  }
  .sy-month-chips{
    margin-bottom:12px;
    overflow-x:auto;
    flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
  }
  .sy-month-chips .chip{flex-shrink:0;}
  .sy-entry-row{
    background:#fff;
    border:2px solid rgba(0,0,0,0.06);
    border-radius:10px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .sy-entry-summary{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    cursor:pointer;
  }
  .sy-entry-date{
    font-weight:700;
    font-size:13px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    color:var(--violet);
  }
  .sy-entry-text-preview{
    flex:1;
    font-size:13px;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sy-entry-arrow{
    font-size:12px;
    color:var(--ink-soft);
  }
  .collapse-toggle-btn{
    display:inline-block;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:rgba(0,0,0,0.18);
    border:none;
    border-radius:10px;
    padding:8px 14px;
    cursor:pointer;
  }
  .doc-link{
    display:inline-block;
    background:#fff;
    border:2px solid rgba(0,0,0,0.08);
    border-radius:10px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    color:var(--ink);
  }
  .doc-card{
    background:#fff;
    border:2px solid rgba(0,0,0,0.08);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .doc-card .doc-name{
    width:100%;
    box-sizing:border-box;
    border:none;
    font-size:13.5px;
    font-weight:600;
    resize:none;
    padding:0;
    margin-bottom:8px;
  }
  .doc-card-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .chips-locked{
    opacity:0.55;
    pointer-events:none;
  }
  .contact-block{margin-top:4px;}
  .contact-school-name{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--violet);
    margin-bottom:6px;
  }
  .contact-line{
    font-size:13px;
    color:var(--ink);
    line-height:1.5;
  }
  .contact-line a{color:var(--teal);}
  .contact-sub{
    font-weight:400;
    color:var(--ink-soft);
    font-size:12.5px;
  }
  .contact-divider{
    border-top:1px dashed var(--line);
    margin:12px 0 8px;
  }
  .contact-group-title{
    font-weight:800;
    font-size:13.5px;
    color:var(--violet);
    margin-bottom:2px;
  }
  .homepage-btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    text-align:center;
    margin-top:20px;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:15px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:14px;
    padding:14px;
    text-decoration:none;
  }
  .stat-bar-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .stat-bar-name{
    width:56px;
    flex-shrink:0;
    font-size:12px;
    font-weight:700;
  }
  .stat-bar-track{
    flex:1;
    background:rgba(0,0,0,0.06);
    border-radius:8px;
    height:16px;
    overflow:hidden;
  }
  .stat-bar-fill{
    height:100%;
    border-radius:8px;
  }
  .stat-bar-count{
    width:24px;
    text-align:right;
    font-size:12px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .stat-titles{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }
  .stat-title-card{
    background:#fff;
    border:2px solid rgba(0,0,0,0.06);
    border-radius:12px;
    padding:10px 12px;
    flex:1;
    min-width:130px;
  }
  .stat-title-name{
    font-weight:800;
    font-size:14px;
    margin-bottom:4px;
  }
  .stat-title-line{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .sy-kid-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;
    height:20px;
    border-radius:50%;
    color:#fff;
    font-size:11px;
    font-weight:700;
    flex-shrink:0;
  }
  .sy-entry-detail{
    padding:0 12px 12px;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .photos-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  .photo-thumb{
    width:88px;
  }
  .photo-thumb img{
    width:88px;
    height:88px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid rgba(0,0,0,0.08);
    display:block;
  }
  .photo-thumb .photo-name{
    font-size:11px;
    padding:5px 6px;
    margin-top:4px;
    width:88px;
  }
  .photo-thumb .photo-remove{
    background:none;
    border:none;
    color:var(--brick);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    padding:2px 0;
  }
  .photo-add-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:2px dashed rgba(0,0,0,0.15);
    border-radius:10px;
    padding:8px 12px;
    cursor:pointer;
  }
  .photo-add-btn input[type=file]{
    display:none;
  }
  .photo-status{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-left:8px;
  }  .pin-gate{
    position:fixed;
    inset:0;
    z-index:1000;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .pin-gate .emoji{font-size:44px;margin-bottom:8px;}
  .pin-gate h2{margin:0 0 6px;font-size:24px;color:var(--teal);}
  .pin-gate p{margin:0 0 18px;color:var(--ink-soft);font-size:14px;}
  .pin-gate input{
    font-size:32px;
    letter-spacing:14px;
    text-align:center;
    width:180px;
    padding:14px 10px;
    border-radius:12px;
    border:2px solid var(--line);
    background:#fff;
  }
  .pin-gate button{
    margin-top:16px;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:16px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:12px;
    padding:12px 28px;
    cursor:pointer;
  }
  .pin-gate .error{color:var(--brick);margin-top:12px;font-size:13px;font-weight:600;min-height:16px;}
</style>
</head>
<body>

<div class="pin-gate" id="pinGate">
  <div class="emoji">🔒</div>
  <h2 id="pinTitle">Schulwegplan</h2>
  <p id="pinPrompt">Bitte 4-stelligen Code eingeben</p>
  <input type="tel" inputmode="numeric" maxlength="4" id="pinInput" autocomplete="off">
  <br>
  <button type="button" id="pinSubmit">Freischalten</button>
  <div class="error" id="pinError"></div>
</div>

<header>
  <h1 id="appTitle">🎒 Schulwegplan <span style="font-size:13px;color:var(--ink-soft);font-weight:400;">v4</span></h1>
  <div class="datebar" id="datebar">
    <button class="datenav-btn" id="prevDayBtn" aria-label="Vorheriger Tag">‹</button>
    <input type="date" id="dateInput">
    <span class="weekday-chip" id="weekdayChip"></span>
    <button class="datenav-btn" id="nextDayBtn" aria-label="Nächster Tag">›</button>
  </div>
  <div class="dateinfo-row">
    <span class="weekday-badge" id="weekdayBadge"></span>
    <span class="weather-chip" id="weatherChip" style="display:none;"></span>
    <button class="lang-btn" id="langAt" title="Deutsch">🇦🇹</button>
    <button class="lang-btn" id="langTr" title="Türkçe">🇹🇷</button>
    <button class="today-btn" id="todayBtn">Heute</button>
  </div>
  <div class="topsave-row">
    <button type="button" class="save-btn-top" id="saveDayBtnTop">💾 Speichern</button>
    <span class="topsave-status" id="topSaveStatus"></span>
    <button type="button" class="reset-link" id="resetDayBtn">Tag leeren</button>
  </div>
  <div class="school-photo-row">
    <label class="school-photo-btn" for="bringPhotoInput" id="bringPhotoBtn">
      🎒<span class="photo-check" id="bringPhotoCheck" style="display:none;">✓</span>
    </label>

// ---- Österreichische Feiertage (Wien) ----
function easterSunday(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, month-1, day);
}
function addDaysToDate(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function austrianHolidays(year){
  const easter = easterSunday(year);
  const fixed = [
    [0,1,"Neujahr"], [0,6,"Heilige Drei Könige"], [4,1,"Staatsfeiertag"],
    [7,15,"Mariä Himmelfahrt"], [9,26,"Nationalfeiertag"], [10,1,"Allerheiligen"],
    [11,8,"Mariä Empfängnis"], [11,25,"Christtag"], [11,26,"Stefanitag"]
  ];
  const map = {};
  fixed.forEach(([m,d,name])=>{ map[dateKey(new Date(year,m,d))] = name; });
  map[dateKey(addDaysToDate(easter,1))]  = "Ostermontag";
  map[dateKey(addDaysToDate(easter,39))] = "Christi Himmelfahrt";
  map[dateKey(addDaysToDate(easter,50))] = "Pfingstmontag";
  map[dateKey(addDaysToDate(easter,60))] = "Fronleichnam";
  return map;
}
let HOLIDAYS = {};
function refreshHolidays(year){

function mergeDay(parsed){
  const day = emptyDay();
  day.bring = Object.assign({people:[],time:""}, parsed.bring||{});

  day.bringPhoto = (parsed.bringPhoto && parsed.bringPhoto.url) ? {url:parsed.bringPhoto.url, name:parsed.bringPhoto.name||""} : {url:"",name:""};
  day.abholPhoto = (parsed.abholPhoto && parsed.abholPhoto.url) ? {url:parsed.abholPhoto.url, name:parsed.abholPhoto.name||""} : {url:"",name:""};
  const oldReadiness = parsed.readiness || {};
  if(typeof oldReadiness.child !== "undefined"){
    day.readiness = Object.assign({child:"",time:""}, oldReadiness);
  }else if(oldReadiness.eflin){
    day.readiness = {child:"eflin", time:oldReadiness.eflin};
  }else if(oldReadiness.nezir){
    day.readiness = {child:"nezir", time:oldReadiness.nezir};
  }
  day.exceptions = {
    eflin: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).eflin||{}),
    nezir: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).nezir||{})
  };
  day.dua = Object.assign({mustPickup:false,wishTime:"",byTime:"",notices:[],kindergartenEvents:[]}, parsed.dua||{});
  day.dua.notices = Array.isArray(day.dua.notices) ? day.dua.notices.map(normalizeDuaNotice) : [];
  day.dua.kindergartenEvents = Array.isArray(day.dua.kindergartenEvents) ? day.dua.kindergartenEvents.map(normalizeKindergartenEvent) : [];
  day.schoolEvents = Array.isArray(parsed.schoolEvents) ? parsed.schoolEvents.map(ev=>{
    const merged = Object.assign({name:"",timeStart:"",timeEnd:"",hasEndTime:false,location:"",participants:[],kids:[],photos:[]}, ev);
    if(!merged.timeStart && ev.time) merged.timeStart = ev.time; // altes Format "time" übernehmen
    merged.photos = normalizePhotos(merged.photos);
    return merged;
  }) : [];
  day.notices = Array.isArray(parsed.notices) ? parsed.notices.map(normalizeNotice) : [];
  day.elternHinweise = Array.isArray(parsed.elternHinweise) ? parsed.elternHinweise.map(normalizeElternHinweis) : [];
  return day;
}

function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function addDays(d, n){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+n);
  return nd;
}
function startOfToday(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}
function isWeekend(d){
  const wd = d.getDay();
  return wd===0 || wd===6;
}
function snapToWeekday(d){
  // Samstag/Sonntag überspringen, landet auf dem nächsten Montag
  const nd = new Date(d);
  if(nd.getDay()===6) nd.setDate(nd.getDate()+2);
  else if(nd.getDay()===0) nd.setDate(nd.getDate()+1);
  return nd;
}
function stepWeekday(d, direction){
  // einen Tag in Richtung "direction" (+1/-1), Wochenenden werden übersprungen
  const nd = new Date(d);
  do{
    nd.setDate(nd.getDate()+direction);
  }while(isWeekend(nd));
  return nd;
}

  day.notices.forEach((n, i)=>{

    if(n.kids.length===0) errors.push(`Hinweis ${i+1}: Kind wählen`);

  return errors;

    const result = await cloudStore.set(key, JSON.stringify(currentDay));

    if(attempt < 3){
      setTimeout(()=>saveNow(attempt+1), 800 * attempt);
    }else{
      const msg = (e && e.message) ? e.message : "unbekannter Fehler";
      setSaveState(t("statusSaveFailed") + msg + t("statusRetry"), true);

  }
}

/* ---------------- Wetter (nächste 5 Tage) ---------------- */
const WEATHER_LAT = 48.135;   // Liesing, Wien
const WEATHER_LON = 16.283;
let weatherByDate = {};
let weatherError = "";

function weatherEmoji(code){
  if(code===0) return "☀️";
  if(code===1||code===2) return "🌤️";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if(code>=51&&code<=57) return "🌦️";
  if(code>=61&&code<=67) return "🌧️";
  if(code>=71&&code<=77) return "❄️";
  if(code>=80&&code<=82) return "🌦️";
  if(code>=85&&code<=86) return "🌨️";
  if(code>=95) return "⛈️";
  return "🌡️";
}

async function loadWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FVienna&forecast_days=7`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const days = data.daily;
    if(!days || !days.time) throw new Error("unerwartetes Datenformat");
    const map = {};
    days.time.forEach((dateStr, i)=>{
      map[dateStr] = {
        code: days.weather_code[i],
        tmax: Math.round(days.temperature_2m_max[i]),
        tmin: Math.round(days.temperature_2m_min[i])
      };
    });
    weatherByDate = map;
    weatherError = "";
  }catch(e){
    weatherError = (e && e.message) ? e.message : "unbekannter Fehler";
  }
  renderWeatherChip();
}

function renderWeatherChip(){
  const chip = document.getElementById("weatherChip");
  if(!chip) return;
  const diffDays = Math.round((currentDate - startOfToday()) / 86400000);
  const withinRange = diffDays>=0 && diffDays<=4;
  if(!withinRange){
    chip.style.display = "none";
    return;
  }
  const w = weatherByDate[dateKey(currentDate)];
  if(w){
    chip.textContent = `${weatherEmoji(w.code)} ${w.tmin}° / ${w.tmax}°`;
    chip.style.display = "inline-block";
  }else if(weatherError){
    chip.textContent = "Wetter nicht verfügbar (" + weatherError + ")";
    chip.style.display = "inline-block";
  }else{
    chip.style.display = "none";
  }
}

    chip.style.color = "";

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function uploadPhoto(file, pathPrefix){
  if(!firebase.storage){
    throw new Error("Storage-SDK nicht geladen");
  }
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${pathPrefix}/${Date.now()}_${safeName}`;
  const fileRef = firebase.storage().ref().child(path);

  const timeout = new Promise((_, reject)=>{
    setTimeout(()=> reject(new Error("Zeitüberschreitung — Storage evtl. nicht aktiviert")), 20000);
  });

  await Promise.race([fileRef.put(file), timeout]);
  const url = await Promise.race([fileRef.getDownloadURL(), timeout]);
  return { url, name: file.name };
}

function photosHtml(photos){
  return `
    <div class="photos-row">
      ${photos.map((p, i)=>`
        <div class="photo-thumb" data-pidx="${i}">
          <a href="${p.url}" target="_blank" rel="noopener"><img src="${p.url}" alt=""></a>
          <input type="text" class="photo-name" placeholder="${t("photoNameOptional")}" value="${escapeHtml(p.name)}">
          <button type="button" class="photo-remove">${t("remove")}</button>
        </div>
      `).join("")}
    </div>
    <label class="photo-add-btn">
      📷 ${t("photos")}
      <input type="file" accept="image/*" multiple class="photo-input">
    </label>
    <span class="photo-status"></span>
  `;
}

function bindPhotoWidget(card, photos, pathPrefix, rerender, dirtyFn){
  const markAsDirty = dirtyFn || markDirty;
  card.querySelectorAll(".photo-remove").forEach((btn, i)=>{
    btn.onclick = ()=>{ photos.splice(i,1); markAsDirty(); rerender(); };
  });
  card.querySelectorAll(".photo-name").forEach((inp, i)=>{
    inp.oninput = e=>{ photos[i].name = e.target.value; markAsDirty(); };
  });
  const fileInput = card.querySelector(".photo-input");
  const statusEl = card.querySelector(".photo-status");
  if(fileInput){
    fileInput.onchange = async (e)=>{
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      statusEl.textContent = "lädt hoch…";
      for(const file of files){
        try{
          const uploaded = await uploadPhoto(file, pathPrefix);
          photos.push(uploaded);
        }catch(err){
          statusEl.textContent = "Hochladen fehlgeschlagen (" + ((err && err.message) || "Fehler") + ")";
          return;
        }
      }
      markAsDirty();
      rerender();
    };
  }
}

function autoGrow(el){
  el.style.height = "auto";

}

const GLOBAL_KEY = "global:settings";
let globalData = { remarks:{eflin:[], nezir:[]}, grandparentsEnabled:false, schoolYearEnabled:false, schoolYearEvents:[], speiseplan:{url:"",name:""}, dokumente:[] };
let globalDirty = false;

function normalizeRemark(r){
  return { name:r.name||"", days:Array.isArray(r.days)?r.days:[], timeStart:r.timeStart||"", timeEnd:r.timeEnd||"", photos:normalizePhotos(r.photos) };
}

function normalizeSchoolYearEvent(e){
  return {
    startDate:e.startDate||"", hasEndDate:!!e.hasEndDate, endDate:e.endDate||"",
    hasTime:!!e.hasTime, timeStart:e.timeStart||"", hasEndTime:!!e.hasEndTime, timeEnd:e.timeEnd||"",
    kid:(e.kid==="eflin"||e.kid==="nezir")?e.kid:"",
    text:e.text||"", photos:normalizePhotos(e.photos)
  };
}

async function loadGlobalData(){
  try{
    const res = await cloudStore.get(GLOBAL_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      globalData.remarks = {
        eflin: Array.isArray(parsed.remarks && parsed.remarks.eflin) ? parsed.remarks.eflin.map(normalizeRemark) : [],
        nezir: Array.isArray(parsed.remarks && parsed.remarks.nezir) ? parsed.remarks.nezir.map(normalizeRemark) : []
      };
      globalData.grandparentsEnabled = !!parsed.grandparentsEnabled;
      globalData.schoolYearEnabled = !!parsed.schoolYearEnabled;
      globalData.schoolYearEvents = Array.isArray(parsed.schoolYearEvents) ? parsed.schoolYearEvents.map(normalizeSchoolYearEvent) : [];
      globalData.speiseplan = (parsed.speiseplan && parsed.speiseplan.url) ? {url:parsed.speiseplan.url, name:parsed.speiseplan.name||""} : {url:"",name:""};
      globalData.dokumente = Array.isArray(parsed.dokumente) ? parsed.dokumente.map(d=>({url:d.url||"", name:d.name||""})) : [];
    }
  }catch(e){ /* noch nichts gespeichert — Standardwerte bleiben */ }
  grandparentsEnabled = globalData.grandparentsEnabled;
  renderGlobalPanel();
  renderDay(); // damit z. B. der Speiseplan-Bereich im Tagesbereich die geladenen Daten zeigt
}

async function saveGlobalData(){
  const statusEl = document.getElementById("globalStatus");
  statusEl.textContent = t("statusSaving");
  try{
    await cloudStore.set(GLOBAL_KEY, JSON.stringify(globalData));
    globalDirty = false;
    statusEl.textContent = t("globalSaved");
  }catch(e){
    statusEl.textContent = t("globalSaveFailed") + ((e&&e.message)||"Fehler") + ")";
  }
}

function remarkCardHtml(kidKey, r, idx){
  return `
    <div class="entry-card" data-kid="${kidKey}" data-idx="${idx}">
      <div class="entry-top">
        <textarea class="rk-text autogrow" rows="1" placeholder="${t("placeholderRemark")}">${escapeHtml(r.name)}</textarea>
        <button type="button" class="remove-btn rk-remove">${t("remove")}</button>
      </div>
      <label class="field-label" style="margin-top:10px;font-size:13px;">${t("whichDays")}</label>
      <div class="chips rk-days">
        ${getWeekdayShortList().map(w=>`<button type="button" class="chip ${r.days.includes(w.k)?"selected":""}" data-day="${w.k}">${w.l}</button>`).join("")}
      </div>
      <div class="row2" style="margin-top:10px;">
        <div>${selectHtml("rkStart"+kidKey+idx, TIMES_15, r.timeStart)}</div>
        <div>${selectHtml("rkEnd"+kidKey+idx, TIMES_15, r.timeEnd)}</div>
      </div>
      <label class="field-label" style="margin-top:10px;font-size:13px;">${t("photos")}</label>
      ${photosHtml(r.photos)}
    </div>
  `;
}

function renderRemarksList(kidKey){
  const wrap = document.getElementById("remarks-"+kidKey);
  const list = globalData.remarks[kidKey];
  wrap.innerHTML = list.map((r,idx)=>remarkCardHtml(kidKey,r,idx)).join("") || `<p class="participant-hint">${t("noRemark")}</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const r = list[idx];
    card.querySelector(".rk-text").oninput = e=>{ r.name = e.target.value; autoGrow(e.target); globalDirty = true; };
    card.querySelector(`#rkStart${kidKey}${idx}`).onchange = e=>{ r.timeStart = e.target.value; globalDirty = true; };
    card.querySelector(`#rkEnd${kidKey}${idx}`).onchange = e=>{ r.timeEnd = e.target.value; globalDirty = true; };
    card.querySelectorAll(".rk-days .chip").forEach(chip=>{
      chip.onclick = ()=>{
        const d = chip.dataset.day;
        const i = r.days.indexOf(d);
        if(i>-1) r.days.splice(i,1); else r.days.push(d);
        chip.classList.toggle("selected");
        globalDirty = true;
      };
    });
    card.querySelector(".rk-remove").onclick = ()=>{ list.splice(idx,1); renderRemarksList(kidKey); globalDirty = true; };
    bindPhotoWidget(card, r.photos, `photos/global/${kidKey}${idx}`, ()=>renderRemarksList(kidKey), ()=>{globalDirty=true;});
  });
  initAutoGrow(wrap);
}

function getRankTitle(count, titles){
  let result = null;
  for(const tier of titles){ if(count >= tier.threshold) result = tier; }
  if(!result) return null;
  return { label: (LANG==="tr" ? result.tr : result.de), emoji: result.emoji };
}

async function renderStatistics(){
  const body = document.getElementById("statisticsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const bringCounts = {};
  const abholCounts = {};
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-"); // "tag_2026_09_07" -> "2026-09-07"
    if(dateStr < STAT_START || dateStr >= todayKey) return; // nur abgeschlossene Tage ab Startdatum
    const d = allData[key];
    if(!d) return;
    if(d.bring && Array.isArray(d.bring.people)){
      d.bring.people.forEach(n=>{ bringCounts[n] = (bringCounts[n]||0)+1; });
    }
    if(d.abhol && Array.isArray(d.abhol.people)){
      d.abhol.people.forEach(n=>{ abholCounts[n] = (abholCounts[n]||0)+1; });
    }
  });

  const allNames = Array.from(new Set([...getActiveNames(), ...Object.keys(bringCounts), ...Object.keys(abholCounts)]));
  const maxBring = Math.max(1, ...allNames.map(n=>bringCounts[n]||0));
  const maxAbhol = Math.max(1, ...allNames.map(n=>abholCounts[n]||0));

  function barRow(n, count, max){
    const pct = Math.max(4, Math.round((count/max)*100));
    const color = PERSON_COLORS[n] || "#999";
    return `
      <div class="stat-bar-row">
        <span class="stat-bar-name">${n}</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <span class="stat-bar-count">${count}</span>
      </div>`;
  }

  body.innerHTML = `
    <label class="field-label" style="font-size:14px;font-weight:800;">${t("statBring")}</label>
    ${allNames.map(n=>barRow(n, bringCounts[n]||0, maxBring)).join("")}
    <label class="field-label" style="font-size:14px;font-weight:800;margin-top:14px;">${t("statAbhol")}</label>
    ${allNames.map(n=>barRow(n, abholCounts[n]||0, maxAbhol)).join("")}
    <div class="stat-titles">
      ${allNames.map(n=>{
        const bT = getRankTitle(bringCounts[n]||0, BRING_TITLES);
        const aT = getRankTitle(abholCounts[n]||0, ABHOL_TITLES);
        return `
          <div class="stat-title-card">
            <div class="stat-title-name" style="color:${PERSON_COLORS[n]||'#999'};">${n}</div>
            <div class="stat-title-line">${bT ? bT.emoji+" "+bT.label : "🎒 "+t("statNone")}</div>
            <div class="stat-title-line">${aT ? aT.emoji+" "+aT.label : "🏡 "+t("statNone")}</div>
          </div>`;
      }).join("")}
    </div>
  `;
}

const MONTH_NAMES_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTH_NAMES_TR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const MONTH_SHORT_DE = ["Jän","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTH_SHORT_TR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

function schoolYearMonths(){
  // 12 aufeinanderfolgende Monate ab dem laufenden Schuljahresstart (September)
  const now = startOfToday();
  const startYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear()-1; // Monat-Index 8 = September
  const months = [];
  for(let i=0;i<12;i++){
    const m = (8+i) % 12;
    const y = startYear + Math.floor((8+i)/12);
    months.push({ y, m, key: y+"-"+String(m+1).padStart(2,"0"), color: MONTH_COLORS[i] });
  }
  return months;
}
let selectedSchoolYearMonth = null;
let expandedSchoolYearEntries = new Set();

function renderSchoolYearList(){
  const months = schoolYearMonths();
  if(!selectedSchoolYearMonth){
    const now = startOfToday();
    const nowKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    selectedSchoolYearMonth = months.find(mo=>mo.key===nowKey) ? nowKey : months[0].key;
  }
  const shortNames = LANG==="tr" ? MONTH_SHORT_TR : MONTH_SHORT_DE;
  const wrap = document.getElementById("schoolYearList");

  const monthChips = months.map(mo=>{
    const sel = mo.key === selectedSchoolYearMonth;
    const style = sel ? ` style="background:${mo.color};border-color:${mo.color};color:#fff;"` : "";
    return `<button type="button" class="chip sy-month-chip" data-key="${mo.key}"${style}>${shortNames[mo.m]}</button>`;
  }).join("");

  const sorted = globalData.schoolYearEvents
    .map((e, idx)=>({e, idx}))
    .filter(o=>(o.e.startDate||"").slice(0,7) === selectedSchoolYearMonth)
    .sort((a,b)=> (a.e.startDate||"").localeCompare(b.e.startDate||""));

  const listHtml = sorted.map(({e, idx})=>{
    const expanded = expandedSchoolYearEntries.has(idx);
    const dateLabel = e.startDate ? new Date(e.startDate+"T00:00:00").toLocaleDateString(LANG==="tr"?"tr-TR":"de-AT",{day:"numeric",month:"short"}) : t("selectPlaceholder");
    const dateRangeLabel = e.hasEndDate && e.endDate ? ` – ${new Date(e.endDate+"T00:00:00").toLocaleDateString(LANG==="tr"?"tr-TR":"de-AT",{day:"numeric",month:"short"})}` : "";
    const timeLabel = e.hasTime && e.timeStart ? ` · ${e.timeStart}${e.hasEndTime && e.timeEnd ? "–"+e.timeEnd : ""}` : "";
    const kidColor = e.kid==="eflin" ? KID_COLORS.eflin : (e.kid==="nezir" ? KID_COLORS.nezir : "var(--violet)");
    const kidBadge = e.kid ? `<span class="sy-kid-badge" style="background:${kidColor};">${e.kid==="eflin"?"E":"N"}</span>` : "";
    return `
      <div class="sy-entry-row" data-idx="${idx}">
        <div class="sy-entry-summary">
          ${kidBadge}
          <span class="sy-entry-date" style="color:${kidColor};">${dateLabel}${dateRangeLabel}${timeLabel}</span>
          <span class="sy-entry-text-preview">${escapeHtml((e.text||"").slice(0,40))}${(e.text||"").length>40?"…":""}</span>
          <span class="sy-entry-arrow">${expanded?"▾":"▸"}</span>
        </div>
        <div class="sy-entry-detail" style="display:${expanded?"block":"none"};">
          <textarea class="sy-text autogrow" rows="1" placeholder="${t("schoolYearTextPlaceholder")}">${escapeHtml(e.text)}</textarea>
          <label class="field-label" style="margin-top:10px;font-size:13px;">${t("whichKid")}</label>
          <div class="chips sy-kid-chips">
            <button type="button" class="chip ${e.kid==="eflin"?"selected":""}" data-kid="eflin"${e.kid==="eflin"?` style="background:${KID_COLORS.eflin};border-color:${KID_COLORS.eflin};color:#fff;"`:""}>E — Eflin</button>
            <button type="button" class="chip ${e.kid==="nezir"?"selected":""}" data-kid="nezir"${e.kid==="nezir"?` style="background:${KID_COLORS.nezir};border-color:${KID_COLORS.nezir};color:#fff;"`:""}>N — Nezir</button>
          </div>
          <div class="row2" style="margin-top:10px;">
            <div><input type="date" class="sy-start-date" value="${e.startDate}"></div>
          </div>
          <div class="subrow">
            <input type="checkbox" class="sy-has-end-date" ${e.hasEndDate?"checked":""}>
            <label>${t("schoolYearEndDateLabel")}</label>
          </div>
          ${e.hasEndDate ? `<div class="row2" style="margin-top:6px;"><div><input type="date" class="sy-end-date" value="${e.endDate}"></div></div>` : ""}
          <div class="subrow">
            <input type="checkbox" class="sy-has-time" ${e.hasTime?"checked":""}>
            <label>${t("schoolYearTimeLabel")}</label>
          </div>
          ${e.hasTime ? `
            <div class="row2" style="margin-top:6px;">
              <div>${selectHtml("syTimeStart"+idx, TIMES_15, e.timeStart)}</div>
              ${e.hasEndTime ? `<div>${selectHtml("syTimeEnd"+idx, TIMES_15, e.timeEnd)}</div>` : ""}
            </div>
            <div class="subrow">
              <input type="checkbox" class="sy-has-end-time" ${e.hasEndTime?"checked":""}>
              <label>${t("endTime")}</label>
            </div>
          ` : ""}
          <label class="field-label" style="margin-top:10px;font-size:13px;">${t("photos")}</label>
          ${photosHtml(e.photos)}
          <button type="button" class="remove-btn sy-remove" style="margin-top:8px;">${t("remove")}</button>
        </div>
      </div>
    `;
  }).join("") || `<p class="participant-hint">${t("noSchoolYearEvents")}</p>`;

  const prevScrollWrap = wrap.querySelector(".sy-month-chips");
  const prevScrollLeft = prevScrollWrap ? prevScrollWrap.scrollLeft : 0;
  wrap.innerHTML = `<div class="chips sy-month-chips">${monthChips}</div><div class="sy-entries">${listHtml}</div>`;
  const newScrollWrap = wrap.querySelector(".sy-month-chips");
  if(newScrollWrap) newScrollWrap.scrollLeft = prevScrollLeft;

  wrap.querySelectorAll(".sy-month-chip").forEach(chip=>{
    chip.onclick = ()=>{
      selectedSchoolYearMonth = chip.dataset.key;
      renderSchoolYearList();
    };
  });

  wrap.querySelectorAll(".sy-entry-row").forEach(row=>{
    const idx = Number(row.dataset.idx);
    const e = globalData.schoolYearEvents[idx];
    row.querySelector(".sy-entry-summary").onclick = ()=>{
      if(expandedSchoolYearEntries.has(idx)) expandedSchoolYearEntries.delete(idx);
      else expandedSchoolYearEntries.add(idx);
      renderSchoolYearList();
    };
    const detail = row.querySelector(".sy-entry-detail");
    if(!detail) return;
    const textEl = detail.querySelector(".sy-text");
    if(textEl) textEl.oninput = ev=>{ e.text = ev.target.value; autoGrow(ev.target); globalDirty = true; };
    const startEl = detail.querySelector(".sy-start-date");
    if(startEl) startEl.onchange = ev=>{ e.startDate = ev.target.value; globalDirty = true; renderSchoolYearList(); };
    const endToggle = detail.querySelector(".sy-has-end-date");
    if(endToggle) endToggle.onchange = ev=>{ e.hasEndDate = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const endEl = detail.querySelector(".sy-end-date");
    if(endEl) endEl.onchange = ev=>{ e.endDate = ev.target.value; globalDirty = true; };
    const timeToggle = detail.querySelector(".sy-has-time");
    if(timeToggle) timeToggle.onchange = ev=>{ e.hasTime = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const timeStartEl = detail.querySelector(`#syTimeStart${idx}`);
    if(timeStartEl) timeStartEl.onchange = ev=>{ e.timeStart = ev.target.value; globalDirty = true; };
    const endTimeToggle = detail.querySelector(".sy-has-end-time");
    if(endTimeToggle) endTimeToggle.onchange = ev=>{ e.hasEndTime = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const timeEndEl = detail.querySelector(`#syTimeEnd${idx}`);
    if(timeEndEl) timeEndEl.onchange = ev=>{ e.timeEnd = ev.target.value; globalDirty = true; };
    detail.querySelectorAll(".sy-kid-chips .chip").forEach(chip=>{
      chip.onclick = ()=>{
        e.kid = (e.kid === chip.dataset.kid) ? "" : chip.dataset.kid;
        globalDirty = true;
        renderSchoolYearList();
      };
    });
    const removeBtn = detail.querySelector(".sy-remove");
    if(removeBtn) removeBtn.onclick = ()=>{
      globalData.schoolYearEvents.splice(idx,1);
      expandedSchoolYearEntries.delete(idx);
      renderSchoolYearList();
      globalDirty = true;
    };
    bindPhotoWidget(detail, e.photos, `photos/global/schuljahr${idx}`, renderSchoolYearList, ()=>{globalDirty=true;});
  });
  initAutoGrow(wrap);
}

    document.getElementById("bringChips").querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = day.bring.people.indexOf(n);
        if(i>-1) day.bring.people.splice(i,1); else day.bring.people.push(n);
        setChipColor(chip, n, day.bring.people.includes(n));
        markDirty();
      };
    });
  }
  document.getElementById("bringTime").onchange = e=>{ day.bring.time = e.target.value; markDirty(); };

  if(!isPastDay){
    document.getElementById("abholChips").querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = day.abhol.people.indexOf(n);
        if(i>-1) day.abhol.people.splice(i,1); else day.abhol.people.push(n);
        setChipColor(chip, n, day.abhol.people.includes(n));
        markDirty();
      };
    });
  }
  document.getElementById("abholTime").onchange = e=>{ day.abhol.time = e.target.value; markDirty(); };

  const readinessChips = document.querySelectorAll("#readinessChildChips .chip");
  readinessChips.forEach(chip=>{
    chip.onclick = ()=>{
      day.readiness.child = chip.dataset.child; // einmal gewählt, bleibt ein Kind gewählt — kein Zurück auf "keines"
      markDirty();
      renderDay(); // komplett neu aufbauen, damit die Uhrzeit garantiert erscheint
    };
  });
  document.getElementById("readyTime").onchange = e=>{ day.readiness.time = e.target.value; markDirty(); };

  if(exceptionsOpen){
    ["eflin","nezir"].forEach(key=>{
      const block = document.querySelector(`.kidblock[data-kid="${key}"]`);
      if(!block) return;
      const ex = day.exceptions[key];

      const noBring = block.querySelector(".exc-noBring");
      const noBringReasonWrap = block.querySelector(".exc-noBring").closest(".subrow").nextElementSibling;
      noBring.onchange = e=>{
        ex.noBring = e.target.checked;
        noBringReasonWrap.style.display = ex.noBring ? "block" : "none";
        markDirty();
      };
      block.querySelector(".exc-noBringReason").oninput = e=>{ ex.noBringReason = e.target.value; markDirty(); };

      const noAbhol = block.querySelector(".exc-noAbhol");
      const noAbholReasonWrap = block.querySelector(".exc-noAbhol").closest(".subrow").nextElementSibling;
      noAbhol.onchange = e=>{
        ex.noAbhol = e.target.checked;
        noAbholReasonWrap.style.display = ex.noAbhol ? "block" : "none";
        markDirty();
      };
      block.querySelector(".exc-noAbholReason").oninput = e=>{ ex.noAbholReason = e.target.value; markDirty(); };
    });
  }

  document.getElementById("addEventBtn").onclick = ()=>{
    day.schoolEvents.push({name:"", timeStart:"", timeEnd:"", hasEndTime:false, location:"", participants:[], kids:[], photos:[]});
    renderEventsList();
    markDirty();
  };

  document.getElementById("addNoticeBtn").onclick = ()=>{
    day.notices.push({text:"", kids:[], photos:[], location:""});
    renderNoticesList();
    markDirty();
  };

  const duaToggle = document.getElementById("duaToggleLabel");
  if(duaToggle) duaToggle.onclick = ()=>{ duaOpen = !duaOpen; renderDay(); };

  if(duaOpen){
    document.getElementById("duaPickup").onchange = e=>{
      day.dua.mustPickup = e.target.checked;
      document.getElementById("duaTimeWrap").style.display = day.dua.mustPickup ? "block" : "none";
      updateDuaNote();
      markDirty();
    };
    document.getElementById("duaWishTime").onchange = e=>{
      day.dua.wishTime = e.target.value;
      updateDuaNote();
      markDirty();
    };
    document.getElementById("duaTime").onchange = e=>{
      day.dua.byTime = e.target.value;
      updateDuaNote();
      markDirty();
    };

    document.getElementById("addDuaEventBtn").onclick = ()=>{
      day.dua.kindergartenEvents.push({timeStart:"", timeEnd:"", text:"", photos:[]});
      renderDuaEventsList();
      markDirty();
    };

    document.getElementById("addDuaNoticeBtn").onclick = ()=>{
      day.dua.notices.push({text:"", photos:[]});
      renderDuaNoticesList();
      markDirty();
    };
  }

  document.getElementById("addElternHinweisBtn").onclick = ()=>{
    day.elternHinweise.push({person:"", text:"", timeStart:"", timeEnd:"", photos:[]});
    renderElternHinweiseList();
    markDirty();
  };

  document.getElementById("saveDayBtn").onclick = performSave;
}

document.getElementById("saveDayBtnTop").onclick = performSave;
document.getElementById("resetDayBtn").onclick = resetCurrentDay;
document.getElementById("prevDayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = stepWeekday(currentDate,-1);
  loadDay();
};
document.getElementById("nextDayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = stepWeekday(currentDate,1);
  loadDay();
};
document.getElementById("todayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = snapToWeekday(startOfToday());
  loadDay();
};
document.getElementById("dateInput").onchange = e=>{
  if(!confirmLeaveIfDirty()){
    renderDateNav(); // Datumsfeld auf den bisherigen Wert zurücksetzen
    return;
  }
  const [y,m,d] = e.target.value.split("-").map(Number);
  if(!y||!m||!d) return;
  currentDate = snapToWeekday(new Date(y, m-1, d));
  loadDay();
};

const APP_PIN = "1999";

function startApp(){
  refreshHolidays(new Date().getFullYear());
  loadGlobalData();
  loadDay();
  loadWeather();
}

function tryUnlock(){
  const val = document.getElementById("pinInput").value.trim();
  if(val === APP_PIN){
    localStorage.setItem("schulweg-unlocked", "yes");
    document.getElementById("pinGate").style.display = "none";
    startApp();
  }else{
    document.getElementById("pinError").textContent = "Falscher Code, bitte nochmal.";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }
}
document.getElementById("pinSubmit").onclick = tryUnlock;
document.getElementById("pinInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") tryUnlock();
});
document.getElementById("langAt").onclick = ()=> setLang("de");
document.getElementById("langTr").onclick = ()=> setLang("tr");

// Ausgangstexte gemäß gespeicherter Sprache setzen (vor dem eigentlichen App-Start)
document.getElementById("langAt").classList.toggle("selected", LANG==="de");
document.getElementById("langTr").classList.toggle("selected", LANG==="tr");
document.getElementById("appTitle").innerHTML = t("title") + ' <span style="font-size:13px;color:var(--ink-soft);font-weight:400;">v4</span>';
document.getElementById("todayBtn").textContent = t("today");
document.getElementById("saveDayBtnTop").textContent = t("saveTop");
document.getElementById("resetDayBtn").textContent = t("resetDay");
document.getElementById("pinTitle").textContent = t("pinTitle");
document.getElementById("pinPrompt").textContent = t("pinPrompt");
document.getElementById("pinSubmit").textContent = t("pinButton");

if(localStorage.getItem("schulweg-unlocked") === "yes"){
  document.getElementById("pinGate").style.display = "none";
  startApp();
}else{
  document.getElementById("pinInput").focus();
}
</script>
</body>
</html>
