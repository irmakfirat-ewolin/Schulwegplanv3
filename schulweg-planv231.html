              <input type="checkbox" class="sy-has-end-time" ${e.hasEndTime?"checked":""}>
              <label>${t("endTime")}</label>
            </div>
          ` : ""}
          <label class="field-label" style="margin-top:10px;font-size:13px;">${t("photos")}</label>
          ${photosHtml(e.photos)}
          <button type="button" class="remove-btn sy-remove" style="margin-top:8px;">${t("remove")}</button>
        </div>
      </div>
    `;
  }).join("") || `<p class="participant-hint">${t("noSchoolYearEvents")}</p>`;

  const prevScrollWrap = wrap.querySelector(".sy-month-chips");
  const prevScrollLeft = prevScrollWrap ? prevScrollWrap.scrollLeft : 0;
  wrap.innerHTML = `<div class="chips sy-month-chips">${monthChips}</div><div class="sy-entries">${listHtml}</div>`;
  const newScrollWrap = wrap.querySelector(".sy-month-chips");
  if(newScrollWrap) newScrollWrap.scrollLeft = prevScrollLeft;

  wrap.querySelectorAll(".sy-month-chip").forEach(chip=>{
    chip.onclick = ()=>{
      selectedSchoolYearMonth = chip.dataset.key;
      renderSchoolYearList();
    };
  });

  wrap.querySelectorAll(".sy-entry-row").forEach(row=>{
    const idx = Number(row.dataset.idx);
    const e = globalData.schoolYearEvents[idx];
    row.querySelector(".sy-entry-summary").onclick = ()=>{
      if(expandedSchoolYearEntries.has(idx)) expandedSchoolYearEntries.delete(idx);
      else expandedSchoolYearEntries.add(idx);
      renderSchoolYearList();
    };
    const detail = row.querySelector(".sy-entry-detail");
    if(!detail) return;
    const textEl = detail.querySelector(".sy-text");
    if(textEl) textEl.oninput = ev=>{ e.text = ev.target.value; autoGrow(ev.target); globalDirty = true; };
    const locEl = detail.querySelector(".sy-location");
    if(locEl) locEl.oninput = ev=>{ e.location = ev.target.value; globalDirty = true; };
    const startEl = detail.querySelector(".sy-start-date");
    if(startEl) startEl.onchange = ev=>{ e.startDate = ev.target.value; globalDirty = true; renderSchoolYearList(); };
    const endToggle = detail.querySelector(".sy-has-end-date");
    if(endToggle) endToggle.onchange = ev=>{ e.hasEndDate = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const endEl = detail.querySelector(".sy-end-date");
    if(endEl) endEl.onchange = ev=>{ e.endDate = ev.target.value; globalDirty = true; };
    const timeToggle = detail.querySelector(".sy-has-time");
    if(timeToggle) timeToggle.onchange = ev=>{ e.hasTime = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const timeStartEl = detail.querySelector(`#syTimeStart${idx}`);
    if(timeStartEl) timeStartEl.onchange = ev=>{ e.timeStart = ev.target.value; globalDirty = true; };
    const endTimeToggle = detail.querySelector(".sy-has-end-time");
    if(endTimeToggle) endTimeToggle.onchange = ev=>{ e.hasEndTime = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const timeEndEl = detail.querySelector(`#syTimeEnd${idx}`);
    if(timeEndEl) timeEndEl.onchange = ev=>{ e.timeEnd = ev.target.value; globalDirty = true; };
    const schoolFreeEl = detail.querySelector(".sy-schoolfree");
    if(schoolFreeEl) schoolFreeEl.onchange = ev=>{ e.schoolFree = ev.target.checked; globalDirty = true; };
    detail.querySelectorAll(".sy-kid-chips .chip").forEach(chip=>{
      chip.onclick = ()=>{
        e.kid = (e.kid === chip.dataset.kid) ? "" : chip.dataset.kid;
        globalDirty = true;
        renderSchoolYearList();
      };
    });
    detail.querySelectorAll(".sy-participant-chips .chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = e.participants.indexOf(n);
        if(i>-1) e.participants.splice(i,1); else e.participants.push(n);
        setChipColor(chip, n, e.participants.includes(n));
        globalDirty = true;
        renderSchoolYearList();
      };
    });
    const removeBtn = detail.querySelector(".sy-remove");
    if(removeBtn) removeBtn.onclick = ()=>{
      globalData.schoolYearEvents.splice(idx,1);
      expandedSchoolYearEntries.delete(idx);
      renderSchoolYearList();
      globalDirty = true;
    };
    bindPhotoWidget(detail, e.photos, `photos/global/schuljahr${idx}`, renderSchoolYearList, ()=>{globalDirty=true;});
  });
  initAutoGrow(wrap);
}

function bindEvents(){
  const day = currentDay;
  const isPastDay = dateKey(currentDate) < dateKey(startOfToday());
  const isToday = dateKey(currentDate) === dateKey(startOfToday());
  const nowHour = new Date().getHours();
  const dayUnlocked = bringAbholAdminUnlockedDates.has(dateKey(currentDate));
  const bringLocked = (isPastDay || (isToday && nowHour >= 11)) && !dayUnlocked;
  const abholLocked = (isPastDay || (isToday && nowHour >= 18)) && !dayUnlocked;
  const snackLocked = isPastDay || (isToday && nowHour >= 9);
  const readinessLocked = isPastDay || (isToday && nowHour >= 9);
  const bothSickToday = !!(day.sick && day.sick.eflin.active && day.sick.nezir.active);
  const otherLocKid = courseOtherLocationChildToday(currentDate);
  const quickJumpBtn = document.getElementById("quickJumpBtn");
  if(quickJumpBtn) quickJumpBtn.onclick = openQuickJumpMenu;

  document.querySelectorAll(".chip-jump").forEach(btn=>{
    btn.onclick = ()=> jumpToChipTarget(btn.dataset.key);
  });

  document.getElementById("bringPhotoCheck").style.display = day.bringPhoto.url ? "flex" : "none";
  document.getElementById("abholPhotoCheck").style.display = day.abholPhoto.url ? "flex" : "none";
  const bringView = document.getElementById("bringPhotoView");
  bringView.style.display = day.bringPhoto.url ? "inline" : "none";
  bringView.href = day.bringPhoto.url || "#";
  const abholView = document.getElementById("abholPhotoView");
  abholView.style.display = day.abholPhoto.url ? "inline" : "none";
  abholView.href = day.abholPhoto.url || "#";
  const lunchView = document.getElementById("lunchPhotoView");
  if(lunchView){
    lunchView.style.display = day.lunchPhoto.url ? "inline" : "none";
    lunchView.href = day.lunchPhoto.url || "#";
  }

  document.getElementById("bringPhotoInput").onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById("schoolPhotoStatus");
    statusEl.textContent = t("statusLoading");
    try{
      const uploaded = await uploadPhoto(file, `photos/${dateKey(currentDate)}/bringPhoto`);
      currentDay.bringPhoto = uploaded;
      markDirty();
      statusEl.textContent = "";
      document.getElementById("bringPhotoCheck").style.display = "flex";
      const v = document.getElementById("bringPhotoView");
      v.style.display = "inline"; v.href = uploaded.url;
    }catch(err){
      statusEl.textContent = t("statusSaveFailed") + ((err&&err.message)||"") + t("statusRetry");
    }
  };
  document.getElementById("abholPhotoInput").onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById("schoolPhotoStatus");
    statusEl.textContent = t("statusLoading");
    try{
      const uploaded = await uploadPhoto(file, `photos/${dateKey(currentDate)}/abholPhoto`);
      currentDay.abholPhoto = uploaded;
      markDirty();
      statusEl.textContent = "";
      document.getElementById("abholPhotoCheck").style.display = "flex";
      const v = document.getElementById("abholPhotoView");
      v.style.display = "inline"; v.href = uploaded.url;
    }catch(err){
      statusEl.textContent = t("statusSaveFailed") + ((err&&err.message)||"") + t("statusRetry");
    }
  };

  const exceptionsToggle = document.getElementById("exceptionsToggleLabel");
  if(exceptionsToggle) exceptionsToggle.onclick = ()=>{ exceptionsOpen = !exceptionsOpen; renderDay(); };

  if(!bringLocked && !bothSickToday){
    document.getElementById("bringChips").querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = day.bring.people.indexOf(n);
        const nowSelected = i===-1;
        if(i>-1) day.bring.people.splice(i,1); else day.bring.people.push(n);
        setChipColor(chip, n, day.bring.people.includes(n));
        markDirty();
        refreshStatusChips();
        if(nowSelected) showRankTitlePopup("bringTitlePopup", n, "bring", BRING_TITLES);
      };
    });
  }
  document.getElementById("bringTime").onchange = e=>{ day.bring.time = e.target.value; markDirty(); renderSchoolCountdown(); };

  document.querySelectorAll(".admin-unlock-link[data-unlock-date]").forEach(btn=>{
    btn.onclick = ()=>{
      const dk = btn.dataset.unlockDate;
      const input = prompt(t("classPhotosPasswordPrompt"));
      if(input === null) return;
      if(!checkClassPhotosPassword(input)){ alert(t("adminUnlockWrongPassword")); return; }
      bringAbholAdminUnlockedDates.add(dk);
      appendAuditLog(dk, [`Bring/Abhol-Korrektur für vergangenen Tag freigeschaltet`]);
      renderDay();
    };
  });
  const abholManualSplitEl = document.getElementById("abholManualSplit");
  if(abholManualSplitEl) abholManualSplitEl.onchange = e=>{
    day.abhol.manualSplit = e.target.checked;
    markDirty();
    renderDay();
  };
  const abholChipsEl = document.getElementById("abholChips");
  if(!abholLocked && !bothSickToday && abholChipsEl){
    abholChipsEl.querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = day.abhol.people.indexOf(n);
        const nowSelected = i===-1;
        if(i>-1) day.abhol.people.splice(i,1); else day.abhol.people.push(n);
        setChipColor(chip, n, day.abhol.people.includes(n));
        markDirty();
        refreshStatusChips();
        if(nowSelected) showRankTitlePopup("abholTitlePopup", n, "abhol", ABHOL_TITLES);
      };
    });
  }
  const abholTimeEl = document.getElementById("abholTime");
  if(abholTimeEl) abholTimeEl.onchange = e=>{ day.abhol.time = e.target.value; markDirty(); renderSchoolCountdown(); };
  const ownHomeCheckbox = document.getElementById("ownHomeIfNotPicked");
  if(ownHomeCheckbox) ownHomeCheckbox.onchange = e=>{
    day.abhol.ownHomeIfNotPicked = e.target.checked;
    markDirty();
    renderDay();
  };

  // Manuell gesplittete Abholung (z.B. krankes Kind muss separat abgeholt werden) — eigene,
  // voneinander unabhängige Personen/Zeit je Kind. Dieselbe Person kann bewusst in beiden Feldern
  // stehen, falls sie wirklich zweimal fahren muss — zählt dann auch bewusst zweimal in der Statistik.
  if(day.abhol.manualSplit && !abholLocked){
    ["eflin","nezir"].forEach(kid=>{
      const chipsEl = document.getElementById("abhol"+(kid==="eflin"?"Eflin":"Nezir")+"Chips");
      if(chipsEl) chipsEl.querySelectorAll(".chip").forEach(chip=>{
        chip.onclick = ()=>{
          const n = chip.dataset.name;
          const arr = day.abhol[kid+"People"];
          const i = arr.indexOf(n);
          if(i>-1) arr.splice(i,1); else arr.push(n);
          setChipColor(chip, n, arr.includes(n));
          markDirty();
        };
      });
      const timeEl = document.getElementById("abhol"+(kid==="eflin"?"Eflin":"Nezir")+"Time");
      if(timeEl) timeEl.onchange = e=>{ day.abhol[kid+"Time"] = e.target.value; markDirty(); };
    });
  }

  if(otherLocKid && !abholLocked && !day.abhol.manualSplit){
    const secondChipsEl = document.getElementById("abholSecondChips");
    if(secondChipsEl) secondChipsEl.querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = day.abhol.secondPeople.indexOf(n);
        if(i>-1) day.abhol.secondPeople.splice(i,1); else day.abhol.secondPeople.push(n);
        setChipColor(chip, n, day.abhol.secondPeople.includes(n));
        markDirty();
      };
    });
  }
  const abholSecondTimeEl = document.getElementById("abholSecondTime");
  if(abholSecondTimeEl) abholSecondTimeEl.onchange = e=>{ day.abhol.secondTime = e.target.value; markDirty(); };

  if(!readinessLocked){
    const readinessChips = document.querySelectorAll("#readinessChildChips .chip[data-child]");
    readinessChips.forEach(chip=>{
      chip.onclick = ()=>{
        const clicked = chip.dataset.child;
        const wasDeselect = day.readiness.child === clicked;
        day.readiness.child = wasDeselect ? "" : clicked; // erneutes Klicken wählt wieder ab
        if(day.readiness.child !== "nezir"){ day.readiness.transport = ""; } // Scooter/Bike gibt es nur bei Nezir
        // Beim Auswählen eines Kindes (nicht beim Abwählen) auf 7:30 vorbelegen — spart in den
        // allermeisten Fällen einen extra Tipp, kann danach aber jederzeit manuell geändert werden.
        if(!wasDeselect) day.readiness.time = "07:30";

(function initSwipeDayNav(){
  // Auf dem ganzen Body statt nur im Tagesbereich, damit der Swipe auch
  // nach dem Runterscrollen in die globalen Bereiche funktioniert.
  const HSCROLL_SELECTOR = ".weather-upcoming-row, .sy-month-chips, .quiz-filter-bar, .mp-month-chips, .mr-month-chips";
  let sx = 0, sy = 0, st = 0, tracking = false;
  document.body.addEventListener("touchstart", e=>{
    if(e.touches.length !== 1) return;
    if(e.target.closest && e.target.closest(HSCROLL_SELECTOR)){ tracking = false; return; }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    st = Date.now();
    tracking = true;
  }, {passive:true});
  document.body.addEventListener("touchend", e=>{
    if(!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - sx;
    const dy = touch.clientY - sy;
    const dt = Date.now() - st;
    if(Math.abs(dx) < 70) return;   // zu kurze Bewegung
    if(Math.abs(dy) > 60) return;   // eher vertikales Scrollen als Swipe
    if(dt > 700) return;            // zu langsam für einen Swipe
    if(dx < 0) goToNextDay(); else goToPrevDay();
  }, {passive:true});
})();

function formatAuditDay(dayStr){
  if(!dayStr) return "Allgemein";
  const [y,m,d] = dayStr.split("-");
  return `${d}.${m}.${y}`;
}
function formatAuditTimestamp(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric"}) + ", " + d.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"}) + " Uhr";
}
function renderAuditLogBody(){
  const body = document.getElementById("auditLogBody");
  if(!body) return;
  if(!auditLog.length){
    body.innerHTML = `<p class="participant-hint">Noch keine Änderungen aufgezeichnet.</p>`;
    return;
  }
  const sorted = auditLog.slice().sort((a,b)=> b.ts - a.ts);
  body.innerHTML = sorted.map(entry=>`
    <div class="audit-log-entry">
      <div class="audit-log-entry-head">
        <span class="audit-log-entry-day">📅 ${escapeHtml(formatAuditDay(entry.day))}</span>
        <span class="audit-log-entry-time">${escapeHtml(formatAuditTimestamp(entry.ts))}</span>
      </div>
      <ul>${entry.changes.map(c=>`<li>${escapeHtml(c)}</li>`).join("")}</ul>
    </div>
  `).join("") + `<button type="button" class="audit-log-clear-btn" id="auditLogClearBtn">Verlauf leeren</button>`;
  const clearBtn = document.getElementById("auditLogClearBtn");
  if(clearBtn) clearBtn.onclick = async ()=>{
    if(!confirm("Gesamten Änderungsverlauf wirklich löschen?")) return;
    auditLog = [];
    try{ await cloudStore.set(AUDIT_KEY, JSON.stringify(auditLog)); }catch(e){}
    renderAuditLogBody();
  };
}

  document.getElementById("auditLogOverlay").style.display = "flex";

const SEASONAL_EMOJI = {
  halloween: ["🎃","👻","🦇","🕸️","🧙"],
  christmas: ["❄️","🎄","⭐","🎅","🔔"],
  easter: ["🐰","🥚","🌷","🐣"],
  birthday: ["🎂","🎈","🎉","🎁","🥳"]

function renderSeasonalDecor(){
  const old = document.getElementById("seasonalDecor");
  if(old) old.remove();
  if(seasonalTheme === "none" || !SEASONAL_EMOJI[seasonalTheme]) return;
  const emojis = SEASONAL_EMOJI[seasonalTheme];
  const wrap = document.createElement("div");
  wrap.className = "seasonal-decor";
  wrap.id = "seasonalDecor";
  let html = "";
  for(let i=0;i<16;i++){
    const emoji = emojis[i % emojis.length];
    const left = Math.round(Math.random()*96);
    const duration = (9 + Math.random()*10).toFixed(1);
    const delay = (-Math.random()*18).toFixed(1);
    const size = (16 + Math.random()*14).toFixed(0);
    html += `<span style="left:${left}%;font-size:${size}px;animation-duration:${duration}s;animation-delay:${delay}s;">${emoji}</span>`;
  }
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
}
