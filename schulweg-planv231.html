async function loadWordGameAdminData(){
  const body = document.getElementById("wordGameAdminBody");
  if(body) body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  const days = [];
  for(let i=0;i<10;i++){
    const d = new Date(startOfToday());
    d.setDate(d.getDate()-i);
    days.push(dateKey(d));
  }
  const results = [];
  for(const dateStr of days){
    let data = {}, wheel = {};
    try{
      const res = await cloudStore.get(wordGameKey(dateStr));
      data = (res && res.value) ? JSON.parse(res.value) : {};
    }catch(e){ /* leer bleibt leer */ }
    try{
      const wres = await cloudStore.get(wordGameWheelResultKey(dateStr));
      wheel = (wres && wres.value) ? JSON.parse(wres.value) : {};
    }catch(e){ /* leer bleibt leer */ }
    results.push({dateStr, results:data, wheel});
  }
  wordGameAdminDays = results;
  // Ohne das hier zeigt der <select> zwar visuell "heute" an (Browser-Standard: erste Option),
  // aber wordGameAdminSelectedDate blieb null — dayEntry fand dadurch nichts, Liste UND
  // Übungsprotokoll blieben leer, bis man die Auswahl manuell nochmal antippte.
  if(wordGameAdminSelectedDate === null && results.length){
    wordGameAdminSelectedDate = results[0].dateStr;
  }
  renderWordGameAdminBody();
}
let wordGameAdminSelectedDate = null;

// Zeigt im Admin-Bereich kompakt, was beim Drehrad rauskam: Zeit-/Hinweis-Bonus bzw. -Nachteil,
// "Geç"/"Übersprungen", oder — wenn für diesen Tag/diese Person kein Eintrag existiert (z.B. ein
// Tag vor Einführung des Rads, oder noch gar nicht gespielt) — ein schlichter Strich.
function formatWheelAdminEntry(entry){
  if(!entry) return "—";
  if(entry.type === "skip") return "🎡 " + t("wordGameAdminSkipped");
  if(entry.type === "time") return "🎡 " + (entry.value>=0 ? "+"+entry.value+"s" : entry.value+"s");
  if(entry.type === "hint") return "🎡 " + (entry.value<0 ? entry.value+"💡" : "+"+entry.value+"💡");
  if(entry.type === "empty") return "🎡 😶";
  return "🎡 ?";
}

function renderWordGameAdminBody(){
  const body = document.getElementById("wordGameAdminBody");
  if(!body) return;
  if(!wordGameAdminSelectedDate) wordGameAdminSelectedDate = wordGameAdminDays[0] ? wordGameAdminDays[0].dateStr : null;

  const selectHtmlStr = `
    <select class="wg-admin-date-select" id="wgAdminDateSelect">
      ${wordGameAdminDays.map(d=>`<option value="${d.dateStr}" ${d.dateStr===wordGameAdminSelectedDate?"selected":""}>${escapeHtml(d.dateStr)}</option>`).join("")}
    </select>
  `;

  const dayEntry = wordGameAdminDays.find(d=>d.dateStr===wordGameAdminSelectedDate);
  // Immer alle 6 Personen zeigen — nicht nur die, die schon gespielt haben — samt ihrem
  // jeweiligen Lösungswort für diesen Tag, admin-intern, unabhängig vom Spielstatus.
  const names = NAMES_BASE.concat(GRANDPARENT_NAMES);
  const dayDateObj = dayEntry ? new Date(dayEntry.dateStr+"T00:00:00") : null;
  const listHtml = dayEntry ? names.map(n=>{
    const played = dayEntry.results.hasOwnProperty(n);
    const word = getPuzzleForDate(dayDateObj, n).answer || "—";
    return `
    <div class="wg-admin-row-entry">
      <span style="color:${PERSON_COLORS[n]||'#999'};font-weight:700;">${escapeHtml(n)}</span>
      <span class="wg-admin-word">${escapeHtml(word)}</span>
      <span class="wg-admin-wheel">${played ? formatWheelAdminEntry((dayEntry.wheel||{})[n]) : "—"}</span>
      <span class="wg-admin-status">${played ? `${dayEntry.results[n]} ${t("wordGameHintsShort")}` : t("wordGameNotPlayed")}</span>
      <button type="button" class="wg-admin-edit" data-date="${dayEntry.dateStr}" data-name="${n}">✏️</button>
      ${played ? `<button type="button" class="wg-admin-remove" data-date="${dayEntry.dateStr}" data-name="${n}">🗑️</button>` : ``}
    </div>
  `;
  }).join("") : `<p class="participant-hint">${t("wordGameAdminNone")}</p>`;

  // Casino-Kupon-Einlösungen, die noch bearbeitet werden müssen: pro eingelöstem Kupon soll der
  // Admin der Person 1 Hinweis beim Tagesspiel-Ergebnis abziehen, dann hier als erledigt markieren.
  const redemptionsHtml = `
    <div class="wg-admin-redemptions-section">
      <div class="wg-admin-redemptions-title">🎰 ${t("slotRedemptionsAdminTitle")}</div>
      ${slotRedemptionsAdmin.length ? slotRedemptionsAdmin.map(r=>{
        const timeStr = new Date(r.ts).toLocaleString(LANG==="tr"?"tr-TR":"de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
        return `<div class="wg-admin-redemption-row">
          <span style="color:${PERSON_COLORS[r.name]||'#999'};font-weight:700;">${escapeHtml(r.name)}</span>
          <span>${r.coinsSpent} 🪙 → ${r.couponsGained} 🎫</span>
          <span class="wg-admin-redemption-time">${timeStr}</span>
          <button type="button" class="wg-admin-redemption-done" data-redeem-id="${r.id}">✓ ${t("slotRedemptionHandled")}</button>
        </div>`;
      }).join("") : `<p class="participant-hint">${t("slotRedemptionsNone")}</p>`}
      <p class="participant-hint" style="margin-top:8px;">${t("slotRedemptionsAdminNote")}</p>
      <div class="wg-admin-grant-section">
        <div class="wg-admin-redemptions-title">🪙 ${t("slotAdminGrantTitle")}</div>
        <div class="chips" id="slotAdminGrantChips">
          ${(NAMES_BASE.concat(GRANDPARENT_NAMES)).map(n=>`<button type="button" class="chip" data-grantname="${n}" style="border-color:${PERSON_COLORS[n]||'#999'};color:${PERSON_COLORS[n]||'#999'};">${n}</button>`).join("")}
        </div>
        <div class="wg-admin-redemptions-title" style="margin-top:12px;">🎟️ ${t("slotAdminGrantSpinsTitle")}</div>
        <div class="chips" id="slotAdminGrantSpinsChips">
          ${(NAMES_BASE.concat(GRANDPARENT_NAMES)).map(n=>`<button type="button" class="chip" data-grantspinsname="${n}" style="border-color:${PERSON_COLORS[n]||'#999'};color:${PERSON_COLORS[n]||'#999'};">${n}</button>`).join("")}
        </div>
        ${slotAdminGrantMsg ? `<p class="slot-cashier-confirm">${slotAdminGrantMsg}</p>` : ``}
      </div>
    </div>
  `;

  body.innerHTML = selectHtmlStr + listHtml + redemptionsHtml;
  body.querySelectorAll(".wg-admin-redemption-done").forEach(btn=>{
    btn.onclick = ()=> markSlotRedemptionHandled(btn.dataset.redeemId);
  });
  body.querySelectorAll("#slotAdminGrantChips .chip").forEach(chip=>{
    chip.onclick = ()=> adminGrantSlotCoins(chip.dataset.grantname);
  });
  body.querySelectorAll("#slotAdminGrantSpinsChips .chip").forEach(chip=>{
    chip.onclick = ()=> adminGrantSlotSpins(chip.dataset.grantspinsname);
  });

  const selectEl = document.getElementById("wgAdminDateSelect");
  if(selectEl) selectEl.onchange = e=>{ wordGameAdminSelectedDate = e.target.value; renderWordGameAdminBody(); };

  body.querySelectorAll(".wg-admin-edit").forEach(btn=>{
    btn.onclick = async ()=>{
      const {date, name} = btn.dataset;
      const dayEntry = wordGameAdminDays.find(d=>d.dateStr===date);
      if(!dayEntry) return;
      const current = dayEntry.results.hasOwnProperty(name) ? dayEntry.results[name] : 0;
      const input = prompt(t("wordGameCorrectPrompt") + " (" + name + ", " + date + ")", String(current));
      if(input === null) return;
      const num = parseInt(input, 10);
      if(isNaN(num) || num < 0) return;
      // Schreibt nur das eine Kindfeld (diese eine Person) per Firebase-Kindpfad, ganz ohne
      // vorheriges Lesen — dadurch von Natur aus race-condition-sicher: ein zwischenzeitlich (z.B.
      // während der Admin das Panel offen hatte) von jemand anderem eingetragenes Ergebnis bleibt
      // garantiert unangetastet. Lokal trotzdem sofort mit aktualisieren für die Anzeige.
      dayEntry.results[name] = num;
      try{
        await cloudStore.setChild(wordGameKey(date), name, num);
        appendAuditLog(date, [`Tägliches Spiel nachträglich korrigiert: ${name} -> ${num} Hinweise`]);
      }catch(e){ /* nicht kritisch */ }
      if(date === dateKey(startOfToday())){ wordGameResults = dayEntry.results; renderWordGame(); }
      renderWordGameAdminBody();
    };
  });
  body.querySelectorAll(".wg-admin-remove").forEach(btn=>{
    btn.onclick = async ()=>{
      const {date, name} = btn.dataset;
      if(!confirm(t("evConfirmDelete"))) return;
      const dayEntry = wordGameAdminDays.find(d=>d.dateStr===date);
      if(!dayEntry) return;
      // Entfernt nur das eine Kindfeld per Firebase-Kindpfad — alle anderen Personen-Ergebnisse
      // dieses Tages bleiben garantiert unangetastet, egal wann sie eingetragen wurden.
      delete dayEntry.results[name];
      try{
        await cloudStore.deleteChild(wordGameKey(date), name);
        appendAuditLog(date, [`Tägliches Spiel Ergebnis entfernt: ${name} (${date})`]);
      }catch(e){ /* nicht kritisch */ }
      // Auch das Drehrad-Ergebnis dieser Person für diesen Tag mit löschen — sonst bliebe ein
      // "verwaistes" altes Rad-Ergebnis stehen (in Statistik und Ergebnistafel sichtbar), obwohl
      // das zugehörige Spielergebnis gar nicht mehr existiert.
      if(dayEntry.wheel && dayEntry.wheel.hasOwnProperty(name)){
        delete dayEntry.wheel[name];
        try{
          await cloudStore.deleteChild(wordGameWheelResultKey(date), name);
        }catch(e){ /* nicht kritisch */ }
      }
      if(date === dateKey(startOfToday())){
        wordGameResults = dayEntry.results;
        if(todaysWheelCache.hasOwnProperty(name)) delete todaysWheelCache[name];
        // Admin-Reset soll wirklich bei Null starten können — Geräte-Sperre, Drehrad-Sperre
        // und einen evtl. noch laufenden/gelösten lokalen Stand für genau diese Person löschen.
        try{
          if(getWordGameDeviceClaim() === name) localStorage.removeItem(wordGameDeviceClaimKey(date));
          localStorage.removeItem(wordGameWheelKey(name, date));
        }catch(e){ /* nicht kritisch */ }
        if(wordGameActivePlayer === name){
          wordGameActivePlayer = null;
          wordGameRevealed = new Set();
          wordGameLetterCount = 0;
          wordGameStartOffset = 0;
          wordGameSolved = false;
          wordGameStarted = false;
          wordGameTimerDeadline = null;
          clearWordGameTimerInterval();
          saveWordGameProgress();
          clearWordGameLiveState();
        }
        renderWordGame();
      }
      renderWordGameAdminBody();
    };
  });
}

function saveWordGameProgress(){
  try{
    localStorage.setItem(WORDGAME_PROGRESS_KEY, JSON.stringify({
      date: dateKey(startOfToday()),
      revealed: Array.from(wordGameRevealed),
      letterCount: wordGameLetterCount,
      startOffset: wordGameStartOffset,
      solved: wordGameSolved,
      started: wordGameStarted,
      activePlayer: wordGameActivePlayer,
      timerDeadline: wordGameTimerDeadline
    }));
  }catch(e){ /* localStorage evtl. nicht verfügbar — kein Problem, nur weniger Schutz */ }
  // Zusätzlich in die Cloud spiegeln: localStorage gilt nur für DIESEN Browser/DIESES Gerät.
  // Ohne das könnte man bei zu vielen Hinweisen einfach Safari verlassen, die Homescreen-App
  // oder einen anderen Browser/Laptop öffnen und dort unbemerkt frisch neu anfangen.
  if(wordGameActivePlayer && !wordGameSolved){
    saveWordGameLiveState();
  }else if(wordGameSolved){
    clearWordGameLiveState();
  }
}

async function saveWordGameLiveState(){
  try{
    await cloudStore.set(wordGameLiveKey(dateKey(startOfToday())), JSON.stringify({
      name: wordGameActivePlayer,
      revealed: Array.from(wordGameRevealed),
      letterCount: wordGameLetterCount,
      startOffset: wordGameStartOffset,
      // Direkt den absoluten Ablaufzeitpunkt speichern statt ihn aus der festen Standardzeit
      // zurückzurechnen — sonst ginge bei Drehrad-Zeitbonus auf einem zweiten Gerät die
      // gewonnene Bonuszeit beim Fortsetzen wieder verloren.
      timerDeadline: wordGameTimerDeadline
    }));
  }catch(e){ /* nicht kritisch — im schlimmsten Fall greift der Schutz einmal nicht */ }
}
async function clearWordGameLiveState(){
  try{ await cloudStore.delete(wordGameLiveKey(dateKey(startOfToday()))); }catch(e){ /* nicht kritisch */ }
}

// Prüft beim Öffnen, ob laut Cloud schon jemand mitten im Rätsel steckt (auf einem anderen
// Gerät/Browser) — und übernimmt dann genau diesen Stand, statt einen neuen, frischen Versuch
// zuzulassen. So kann man nicht einfach das Gerät wechseln, um bei zu vielen Hinweisen neu zu
// starten.
let wordGameLiveResumeOffer = null; // {name, revealed, letterCount, startOffset, timerDeadline} — wartet auf Bestätigung, bevor irgendetwas übernommen wird
async function syncWordGameLiveState(){
  try{
    const res = await cloudStore.get(wordGameLiveKey(dateKey(startOfToday())));
    if(!res || !res.value) return;
    const live = JSON.parse(res.value);
    const graceMs = 90 * 1000; // großzügiger Puffer, falls jemand die Seite einfach verlassen hat
    if(!live.timerDeadline || Date.now() - live.timerDeadline > graceMs) return; // als verlassen betrachten
    if(wordGameResults.hasOwnProperty(live.name)) return; // inzwischen anderweitig schon abgeschlossen
    // WICHTIG: Nicht blind übernehmen! Das hier läuft bei JEDEM Laden der Seite, auf JEDEM Gerät —
    // auch wenn in Wirklichkeit eine ANDERE Person das Gerät gerade aufmacht, während zufällig
    // irgendwer anderes (z.B. Murat) auf seinem eigenen Handy noch mitten im Rätsel steckt. Ohne
    // diese Prüfung würde das fremde Gerät sofort und ohne Rückfrage in Murats laufendes Spiel
    // hineingezogen — genau der gemeldete Fehler. Nur wenn DIESES Gerät bereits für GENAU diese
    // Person claimed ist (sie wechselt also wirklich nur ihr eigenes Gerät), wird automatisch
    // weitergemacht. Sonst wird nur ein Angebot angezeigt, das die Person selbst bestätigen muss.
    const existingClaim = getWordGameDeviceClaim();
    const resumeData = {
      name: live.name,
      revealed: live.revealed || [],
      letterCount: live.letterCount || 0,
      startOffset: live.startOffset || 0,
      timerDeadline: live.timerDeadline
    };
    if(existingClaim === live.name){
      applyWordGameLiveResume(resumeData);
    }else if(!existingClaim){
      wordGameLiveResumeOffer = resumeData;
      renderWordGame();
    }
    // Ist das Gerät schon für eine ANDERE Person claimed, wird das Angebot gar nicht erst gezeigt —
    // für diese Person ist an diesem Gerät ohnehin nur ihr eigenes Spiel relevant.
  }catch(e){ /* nicht kritisch — im schlimmsten Fall greift der Schutz einmal nicht */ }
}
function applyWordGameLiveResume(resumeData){
  setWordGameDeviceClaim(resumeData.name);
  wordGameActivePlayer = resumeData.name;
  wordGameRevealed = new Set(resumeData.revealed);
  wordGameLetterCount = resumeData.letterCount;
  wordGameStartOffset = resumeData.startOffset;
  wordGameSolved = false;
  wordGameStarted = true;
  wordGameTimerDeadline = resumeData.timerDeadline;
  wordGameLiveResumeOffer = null;
  saveWordGameProgress();
  renderWordGame();
}

// Verhindert, dass auf EINEM Gerät mehrere verschiedene Namen an einem Tag spielen — z.B. dass
// jemand "für" eine andere Person mitspielt, die das Handy nie selbst angefasst hat. Pro Gerät
// und Tag wird der erste gewählte Name festgehalten; ein anderer Name kann an diesem Gerät an
// diesem Tag nicht mehr starten.
function wordGameDeviceClaimKey(dateStr){ return "wordgame_device_claim:" + dateStr; }
function getWordGameDeviceClaim(){

}
function setWordGameDeviceClaim(name){
  try{ localStorage.setItem(wordGameDeviceClaimKey(dateKey(startOfToday())), name); }catch(e){ /* nicht kritisch */ }
}

let wordGamePendingPlayer = null;
function openWordGameStartConfirm(name){

  if(!overlay) return;

  document.getElementById("wgStartConfirmWarning").textContent = t("wgStartConfirmWarning");

function closeWordGameStartConfirm(){

  const overlay = document.getElementById("wgStartConfirmOverlay");

}
// Bonusrad vor dem Rätsel: 8 Felder, einmal pro Person und Tag drehbar. Zeit-Felder verlängern
// die Rätselzeit, Hinweis-Felder geben einen Vorsprung (Start bei -1/-2 statt 0 Hinweisen).
const WORDGAME_WHEEL_FIELDS = [
  {type:"time", value:5},   {type:"time", value:10}, {type:"time", value:15}, {type:"hint", value:-1},
  {type:"time", value:20},  {type:"hint", value:-2}, {type:"time", value:25}, {type:"time", value:30},
  {type:"hint", value:1},   {type:"time", value:-10}, {type:"respin"},        {type:"empty"}
];
const WORDGAME_WHEEL_SEGMENT_DEG = 360 / WORDGAME_WHEEL_FIELDS.length;
let wordGameWheelBonus = {time:0, hint:0}; // wird einmalig beim Start des Rätsels angewandt, danach zurückgesetzt
let wordGameWheelSpinning = false;
// Farbcodierung für die Hinweisanzahl in der Ergebnistafel: grün = sehr gut, gelb = mittel,
// rot = viele Hinweise gebraucht. Mittelsatte Töne gewählt, damit sie sowohl im Hell- als auch
// im Dunkelmodus gut lesbar bleiben (nicht zu hell auf weiß, nicht zu dunkel auf schwarz).
function wordGameHintColor(count){
  if(count <= 2) return "#1ba34a";   // grün
  if(count <= 6) return "#c98a00";   // gelb/amber
  return "#e1382f";                  // rot
}
let todaysWheelCache = {};
let todaysWheelCacheDate = "";
// Lädt die Drehrad-Ergebnisse von heute einmal pro Tag nach (nicht blockierend) — damit in der
// normalen "Heutige Ergebnisse"-Tafel auch zu sehen ist, was jede Person am Rad bekommen hat,
// nicht nur im Admin-Bereich.
async function loadTodaysWheelCache(){
  const todayStr = dateKey(startOfToday());
  if(todaysWheelCacheDate === todayStr) return;
  try{
    const res = await cloudStore.get(wordGameWheelResultKey(todayStr));
    todaysWheelCache = (res && res.value) ? JSON.parse(res.value) : {};
  }catch(e){ todaysWheelCache = {}; }
  todaysWheelCacheDate = todayStr;
  renderWordGame();
}
let wordGameWheelCurrentRotation = 0; // damit ein "Nochmal drehen"-Ergebnis sauber von der aktuellen Position weiterdreht

function wordGameWheelKey(name, dateStr){ return "wordgame_wheel:" + dateStr + ":" + name; }
function hasSpunWheelToday(name){
  try{ return localStorage.getItem(wordGameWheelKey(name, dateKey(startOfToday()))) !== null; }catch(e){ return false; }
}
function markWheelSpun(name){
  try{ localStorage.setItem(wordGameWheelKey(name, dateKey(startOfToday())), "1"); }catch(e){ /* nicht kritisch */ }
}

function handleWordGameGoClick(){
  const name = wordGamePendingPlayer;
  if(!name) return;
  closeWordGameStartConfirm(); // setzt wordGamePendingPlayer zurück auf null
  wordGamePendingPlayer = name; // sofort wieder setzen — wird gleich weiter gebraucht (Rad oder Start)
  if(hasSpunWheelToday(name)){
    confirmWordGameStart(); // schon gedreht (z.B. Sitzung fortgesetzt) — direkt weiter zum Rätsel
  }else{
    openWordGameWheel(name);
  }
}

function openWordGameWheel(name){
  wordGamePendingPlayer = name; // für confirmWordGameStart() danach weiter verfügbar
  const overlay = document.getElementById("wgWheelOverlay");
  if(!overlay) return;
  document.getElementById("wgWheelTitle").innerHTML = "🎡 " + t("wgWheelTitle");
  document.getElementById("wgWheelResult").textContent = "";
  document.getElementById("wgWheelLegend").innerHTML = t("wgWheelLegendText");
  document.getElementById("wgWheelSkipBtn").textContent = t("wgWheelSkipBtn");
  document.getElementById("wgWheelSkipBtn").style.display = "";
  const spinBtn = document.getElementById("wgWheelSpinBtn");
  spinBtn.textContent = "🎡 " + t("wgWheelSpinBtn");
  spinBtn.disabled = false;
  spinBtn.onclick = spinWordGameWheel;
  const disc = document.getElementById("wgWheelDisc");
  disc.style.transition = "none";
  disc.style.transform = "rotate(0deg)";
  void disc.offsetWidth; // Reflow erzwingen, damit die nächste Drehung wieder animiert
  disc.style.transition = "";
  wordGameWheelSpinning = false;
  wordGameWheelCurrentRotation = 0;
  lockBodyScrollForQuickJump(); // derselbe einfache overflow:hidden-Schutz wie beim Kompass-Menü
  overlay.style.display = "flex";
}
function closeWordGameWheel(){
  const overlay = document.getElementById("wgWheelOverlay");
  if(overlay) overlay.style.display = "none";
  unlockBodyScrollForQuickJump();
}
function cancelWordGameWheel(){
  // Komplett aussteigen, OHNE die Runde zu starten — anders als "Überspringen" (das spielt man
  // trotzdem, nur ohne Bonus). Kein Timer läuft, also auch keine Zeitablauf-Strafe möglich.
  if(wordGameWheelSpinning) return; // während der Drehung nicht abbrechbar — Ergebnis erst abwarten
  wordGamePendingPlayer = null;
  wordGameWheelBonus = {time:0, hint:0};
  closeWordGameWheel();
  renderWordGame();
}
function skipWordGameWheel(){
  const name = wordGamePendingPlayer;
  if(name){
    markWheelSpun(name);
    const entry = {type:"skip"};
    saveWordGameWheelResult(name, dateKey(startOfToday()), entry);
    todaysWheelCache[name] = entry; // sofort lokal sichtbar, nicht erst nach dem nächsten Nachladen
  }
  wordGameWheelBonus = {time:0, hint:0};
  closeWordGameWheel();
  confirmWordGameStart();
}
function spinWordGameWheel(){
  if(wordGameWheelSpinning) return;
  wordGameWheelSpinning = true;
  document.getElementById("wgWheelSkipBtn").style.display = "none";
  const spinBtn = document.getElementById("wgWheelSpinBtn");
  spinBtn.disabled = true;
  const idx = Math.floor(Math.random() * WORDGAME_WHEEL_FIELDS.length);
  const field = WORDGAME_WHEEL_FIELDS[idx];
  const segCenter = idx * WORDGAME_WHEEL_SEGMENT_DEG + WORDGAME_WHEEL_SEGMENT_DEG/2;
  // Immer mindestens eine volle Drehung ÜBER die aktuelle Position hinaus, damit es bei einem
  // "Nochmal drehen"-Ergebnis (Rad steht schon irgendwo) trotzdem wieder rund aussieht.
  const currentRotation = wordGameWheelCurrentRotation;
  const currentMod = ((currentRotation % 360) + 360) % 360;
  let delta = (360 - segCenter) - currentMod;
  while(delta <= 0) delta += 360;
  const extraSpins = 4;
  const finalRotation = currentRotation + delta + extraSpins*360;
  wordGameWheelCurrentRotation = finalRotation;
  const disc = document.getElementById("wgWheelDisc");
  disc.style.transform = "rotate(" + finalRotation + "deg)";
  setTimeout(()=>{
    wordGameWheelSpinning = false;
    const resultEl = document.getElementById("wgWheelResult");
    const name = wordGamePendingPlayer;

    if(field.type === "respin"){
      resultEl.textContent = "🔄 " + t("wgWheelResultRespin");
      document.getElementById("wgWheelSkipBtn").style.display = "";
      spinBtn.disabled = false;
      spinBtn.textContent = "🎡 " + t("wgWheelSpinBtn");
      spinBtn.onclick = spinWordGameWheel; // nicht gewertet — nochmal drehen erlaubt, noch nicht "verbraucht"
      return;
    }

    if(name) markWheelSpun(name);
    if(field.type === "time"){
      wordGameWheelBonus = {time: field.value, hint: 0};
      resultEl.textContent = field.value >= 0
        ? "🎉 +" + field.value + " " + t("wgWheelResultSeconds")
        : "😬 " + (-field.value) + " " + t("wgWheelResultSecondsBad");
    }else if(field.type === "hint"){
      wordGameWheelBonus = {time: 0, hint: field.value};
      resultEl.textContent = field.value < 0
        ? "🎉 " + field.value + " " + t("wgWheelResultHints")
        : "😬 +" + field.value + " " + t("wgWheelResultHintsBad");
    }else{ // "empty"
      wordGameWheelBonus = {time: 0, hint: 0};
      resultEl.textContent = "😶 " + t("wgWheelResultEmpty");
    }
    if(name){
      const entry = {type: field.type, value: field.value||0};
      saveWordGameWheelResult(name, dateKey(startOfToday()), entry);
      todaysWheelCache[name] = entry; // sofort lokal sichtbar
    }
    spinBtn.disabled = false;
    spinBtn.textContent = "➡️ " + t("wgWheelContinueBtn");
    spinBtn.onclick = ()=>{ closeWordGameWheel(); confirmWordGameStart(); };
  }, 3300);
}

// "Rätsel anderer probieren" — rein zum Spaß, nachdem man selbst fertig ist. Komplett getrennter
// Zustand vom echten Spiel: keine Wertung, kein Eintrag in wordGameResults, kein Drehrad, einfach
// 120 Sekunden zum Reinschnuppern in das Wort einer anderen Person, die heute schon fertig ist.
let practiceWgActive = false;
let practiceWgTargetName = "";

let practiceWgAnswer = "";
let practiceWgCategory = "";
let practiceWgRevealed = new Set();
let practiceWgLetterCount = 0;
let practiceWgSolved = false;
let practiceWgTimerDeadline = null;
let practiceWgTimerInterval = null;

function startPracticeWordGame(name){
  const puzzle = getTodayPuzzle(name);
  if(!puzzle.answer) return;
  practiceWgActive = true;
  practiceWgTargetName = name;
  practiceWgAnswer = puzzle.answer;
  practiceWgCategory = puzzle.category;
  practiceWgRevealed = new Set();
  practiceWgLetterCount = 0;
  practiceWgSolved = false;
  practiceWgTimerDeadline = Date.now() + WORDGAME_TIME_LIMIT_SEC * 1000;
  lockBodyScrollForQuickJump();
  document.getElementById("practiceWgOverlay").style.display = "flex";
  renderPracticeWordGame();
  clearInterval(practiceWgTimerInterval);
  practiceWgTimerInterval = setInterval(practiceWgTimerTick, 500);
  practiceWgTimerTick();
}
function closePracticeWordGame(){
  practiceWgActive = false;
  clearInterval(practiceWgTimerInterval);
  practiceWgTimerInterval = null;
  const overlay = document.getElementById("practiceWgOverlay");
  if(overlay) overlay.style.display = "none";
  unlockBodyScrollForQuickJump();
  renderWordGame(); // Einladungs-Chips im Hauptbereich evtl. neu, falls inzwischen jemand gespielt hat
}
function practiceWgTimerTick(){
  if(!practiceWgTimerDeadline || practiceWgSolved) return;
  const remainMs = practiceWgTimerDeadline - Date.now();
  if(remainMs <= 0){
    practiceWgSolved = true; // Zeit abgelaufen — einfach als beendet behandeln, zeigt die Lösung
    clearInterval(practiceWgTimerInterval);
    renderPracticeWordGame();
    return;
  }
  const el = document.getElementById("practiceWgTimerDisplay");
  if(el) el.textContent = "⏱️ " + Math.ceil(remainMs/1000) + "s";
}
// Türkisch braucht die korrekte Possessiv-Endung am Namen ("Ebru'nun bulmacası"), Deutsch kommt
// mit einem einfachen "s" überall aus ("Ebrus Rätsel") — deshalb pro Sprache eigens gebaut statt
// mit einem einzigen {name}-Platzhalter.
function practiceWgTryingText(name){
  return LANG === "tr"
    ? `${turkishPossessive(escapeHtml(name))} bulmacasını deniyorsun`
    : `${escapeHtml(name)}s Rätsel`;
}
function renderPracticeWgOtherChips(){
  // Weder das gerade geübte Rätsel nochmal anbieten, noch den echten Spieler selbst — der
  // übt ja fremde Rätsel, nicht sein eigenes.
  const others = NAMES_BASE.concat(GRANDPARENT_NAMES).filter(n => n !== practiceWgTargetName && n !== wordGameActivePlayer && wordGameResults.hasOwnProperty(n));
  if(!others.length) return "";
  return `<div class="practice-wg-invite-title" style="margin-top:10px;">🔍 ${t("practiceWgTryAnother")}</div>` +
    others.map(n=>`<button type="button" class="practice-wg-chip" data-practice-name="${escapeHtml(n)}" style="background:${PERSON_COLORS[n]||'#999'};">${escapeHtml(n)}</button>`).join("");
}
function renderPracticeWordGame(){
  const panel = document.getElementById("practiceWgPanel");
  if(!panel) return;
  const name = practiceWgTargetName;
  const theirCount = wordGameResults[name];

  if(practiceWgSolved){
    const myCount = practiceWgLetterCount;
    let compareMsg;
    if(myCount < theirCount) compareMsg = t("practiceWgBetter").replace("{name}", name);
    else if(myCount > theirCount) compareMsg = t("practiceWgWorse").replace("{name}", name);
    else compareMsg = t("practiceWgTie").replace("{name}", name);
    const allRevealed = new Set(practiceWgAnswer.split("").filter(isWordGameLetter));
    panel.innerHTML = `
      <button type="button" class="audit-log-close practice-wg-close" id="practiceWgCloseBtn">✕</button>
      <div class="practice-wg-badge">🔍 ${t("practiceWgBadge")} v2</div>
      <div class="wg-wheel-title">🔍 <strong style="color:${PERSON_COLORS[name]||'#fff'};">${escapeHtml(name)}</strong></div>
      <div class="wg-title-banner">${t("wordGameTodaySearch")}: <strong>${escapeHtml(practiceWgCategory)}</strong></div>
      <div class="wg-blanks">${wordGameBlanks(practiceWgAnswer, allRevealed)}</div>
      <div class="practice-wg-result">
        ${t("wordGameUsed")}: <strong>${myCount}</strong> ${t("wordGameHintsShort")} —
        ${escapeHtml(name)}: <strong>${theirCount}</strong> ${t("wordGameHintsShort")}<br><br>
        ${compareMsg}
      </div>
      ${renderPracticeWgOtherChips()}
    `;
    document.getElementById("practiceWgCloseBtn").onclick = closePracticeWordGame;
    panel.querySelectorAll(".practice-wg-chip").forEach(chip=>{
      chip.onclick = ()=> startPracticeWordGame(chip.dataset.practiceName);
    });
    return;
  }

  panel.innerHTML = `
    <button type="button" class="audit-log-close practice-wg-close" id="practiceWgCloseBtn">✕</button>
    <div class="practice-wg-badge">🔍 ${t("practiceWgBadge")} v2</div>
    <div class="wg-wheel-title">${practiceWgTryingText(name)}</div>
    <div class="wg-title-banner">🔍 ${t("wordGameTodaySearch")}: <strong>${escapeHtml(practiceWgCategory)}</strong> (${practiceWgAnswer.split("").filter(isWordGameLetter).length} ${t("wordGameLetters")})</div>
    <div class="wg-timer" id="practiceWgTimerDisplay">⏱️ ${WORDGAME_TIME_LIMIT_SEC}s</div>
    <div class="wg-blanks">${wordGameBlanks(practiceWgAnswer, practiceWgRevealed)}</div>
    <p class="participant-hint">${t("wordGameUsed")}: <strong>${practiceWgLetterCount}</strong></p>
    <div class="wg-keyboard">
      ${getWordGameKeys().map(k=>`<button type="button" class="wg-key ${practiceWgRevealed.has(k)?"used":""}" data-letter="${k}" ${practiceWgRevealed.has(k)?"disabled":""}>${k}</button>`).join("")}
    </div>
    <div class="wg-guess-row">
      <input type="text" id="practiceWgGuessInput" placeholder="${t("wordGameGuessPlaceholder")}" autocomplete="off">
      <button type="button" class="add-btn" id="practiceWgGuessBtn">${t("wordGameGuessBtn")}</button>
    </div>
  `;
  document.getElementById("practiceWgCloseBtn").onclick = closePracticeWordGame;
  panel.querySelectorAll(".wg-key").forEach(btn=>{
    btn.onclick = ()=>{
      const letter = btn.dataset.letter;
      if(practiceWgRevealed.has(letter) || practiceWgSolved) return;
      practiceWgRevealed.add(letter);
      practiceWgLetterCount++;
      if(checkWordGameAutoSolved(practiceWgAnswer, practiceWgRevealed)){
        practiceWgSolved = true;
        clearInterval(practiceWgTimerInterval);
      }
      renderPracticeWordGame();
    };
  });
  const guessBtn = document.getElementById("practiceWgGuessBtn");
  const guessInput = document.getElementById("practiceWgGuessInput");
  const submitPracticeGuess = ()=>{
    const val = normalizeWordGameText(guessInput.value);
    const target = normalizeWordGameText(practiceWgAnswer);
    if(val === target){
      practiceWgAnswer.split("").forEach(ch=>{ if(isWordGameLetter(ch)) practiceWgRevealed.add(ch); });
      practiceWgSolved = true;
      clearInterval(practiceWgTimerInterval);
      renderPracticeWordGame();
    }else{
      practiceWgLetterCount++;
      guessInput.value = "";
      renderPracticeWordGame();
    }
  };
  if(guessBtn) guessBtn.onclick = submitPracticeGuess;
  if(guessInput) guessInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitPracticeGuess(); });
}
document.getElementById("practiceWgBackdrop").onclick = closePracticeWordGame;

function confirmWordGameStart(){
  const name = wordGamePendingPlayer;
  closeWordGameStartConfirm();
  if(!name) return;
  // Jede Person beginnt komplett frisch — eigener Buchstaben-Stand, eigene Zeit. Kein Anknüpfen
  // an das, was eine andere Person zuvor schon aufgedeckt hat.
  setWordGameDeviceClaim(name);
  wordGameActivePlayer = name;
  wordGameRevealed = new Set();
  wordGameLetterCount = wordGameWheelBonus.hint; // ggf. -1/-2 Vorsprung vom Drehrad
  wordGameStartOffset = wordGameWheelBonus.hint; // für die Anzeige gemerkt — Spieler sieht trotzdem bei 0 beginnend
  wordGameSolved = false;
  wordGameJustSolved = false;
  wordGameWrongGuessMsg = "";
  wordGameStarted = true;
  wordGameTimerDeadline = Date.now() + (WORDGAME_TIME_LIMIT_SEC + wordGameWheelBonus.time) * 1000;
  wordGameWheelBonus = {time:0, hint:0}; // verbraucht
  saveWordGameProgress();
  renderWordGame();
}

function clearWordGameTimerInterval(){
  if(wordGameTimerInterval){ clearInterval(wordGameTimerInterval); wordGameTimerInterval = null; }
}

function wordGameApplyTimeoutPenalty(){
  if(wordGameSolved) return;
  wordGameLetterCount += WORDGAME_TIMEOUT_PENALTY;
  wordGameWrongGuessMsg = t("wordGameTimeoutPenalty");
  wordGameTimerDeadline = null;
  clearWordGameTimerInterval();
  saveWordGameProgress();
  renderWordGame();
}

function wordGameTimerTick(){
  if(!wordGameTimerDeadline){ clearWordGameTimerInterval(); return; }
  const remainMs = wordGameTimerDeadline - Date.now();
  if(remainMs <= 0){
    wordGameApplyTimeoutPenalty();
    return;
  }
  const el = document.getElementById("wgTimerDisplay");
  if(el) el.textContent = "⏱️ " + Math.ceil(remainMs/1000) + "s";
}

function startWordGameTimerIfNeeded(){
  clearWordGameTimerInterval();
  if(!wordGameStarted || wordGameSolved || !wordGameTimerDeadline) return;
  wordGameTimerInterval = setInterval(wordGameTimerTick, 500);
  wordGameTimerTick();
}

// Holt einen Speicherversuch nach, der beim letzten Mal evtl. nicht fertig wurde (z.B. weil die
// Seite direkt nach dem Lösen geschlossen wurde, noch bevor die Cloud geantwortet hat). Wird bei
// jedem Laden des heutigen Tages aufgerufen; ist nichts vorgemerkt, passiert einfach nichts.
async function retryUnsavedWordGameResult(){
  const todayStr = dateKey(startOfToday());
  let pending = null;
  try{
    const raw = localStorage.getItem("wg_unsaved_result:"+todayStr);
    if(raw) pending = JSON.parse(raw);
  }catch(e){ return; }
  if(!pending || !pending.name) return;
  try{
    await cloudStore.setChild(wordGameKey(todayStr), pending.name, pending.count);
    localStorage.removeItem("wg_unsaved_result:"+todayStr);
    wordGameResults[pending.name] = pending.count;
    renderWordGame();
  }catch(e){ /* noch immer nicht erreichbar — bleibt vorgemerkt, nächster Ladevorgang versucht es wieder */ }
}

async function loadWordGameResults(){
  try{
    const res = await cloudStore.get(wordGameKey(dateKey(startOfToday())));
    wordGameResults = (res && res.value) ? JSON.parse(res.value) : {};
  }catch(e){
    wordGameResults = {};
  }
  wordGameLoaded = true;
}

function wordGameBlanks(answer, revealed){
  return answer.split("").map(ch=>{
    if(ch === " ") return '<span class="wg-wordgap"></span>';
    if(!isWordGameLetter(ch)) return `<span class="wg-letter">${escapeHtml(ch)}</span>`; // Bindestrich/Apostroph immer sichtbar
    const shown = revealed.has(ch) ? ch : "&nbsp;";
    return `<span class="wg-letter">${shown}</span>`;
  }).join("");
}

function checkWordGameAutoSolved(answer, revealed){
  const uniqueLetters = new Set(answer.split("").filter(isWordGameLetter));
  for(const c of uniqueLetters){ if(!revealed.has(c)) return false; }
  return true;
}

async function fetchAllWordGameResults(){
  const allData = await cloudStore.listAll();
  const out = []; // {date, name, count}
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("wortspiel_")) return;
    const dateStr = key.slice("wortspiel_".length).replace(/_/g, "-");
    const entryData = allData[key];
    if(!entryData) return;
    Object.keys(entryData).forEach(name=>{
      out.push({date: dateStr, name, count: entryData[name]});
    });
  });
  return out;
}

function computeLeaderboard(allResults, period){
  const todayStr = dateKey(startOfToday());
  const today = startOfToday();
  const WORDGAME_LAUNCH_DATE = new Date(2026, 8, 11); // Start des Spiels — davor gab es keine Rätsel
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  let fromDate;
  if(period === "today"){ fromDate = today; }
  else if(period === "week"){ fromDate = getMondayOfCurrentWeek(today); }
  else if(period === "month"){ fromDate = new Date(today.getFullYear(), today.getMonth(), 1); }
  else { fromDate = WORDGAME_LAUNCH_DATE; }
  if(fromDate < WORDGAME_LAUNCH_DATE) fromDate = WORDGAME_LAUNCH_DATE;
  const fromStr = dateKey(fromDate);

  // Nur bereits abgeschlossene Tage (bis gestern) werden automatisch mit einer Strafe belegt,
  // falls nicht gespielt wurde. Der heutige Tag ist noch nicht vorbei — er zählt nur mit,
  // wenn bereits gespielt wurde, sonst gibt es dafür (noch) keine Strafe.
  const requiredDateKeys = (fromDate <= yesterday) ? getWeekdayDatesInRange(fromDate, yesterday).map(d=>dateKey(d)) : [];

  const filtered = allResults.filter(r => r.date >= fromStr && r.date <= todayStr);
  const byName = {};
  filtered.forEach(r=>{
    if(!byName[r.name]) byName[r.name] = {};
    byName[r.name][r.date] = r.count;
  });
  // Alle Namen einbeziehen, auch wer noch nie gespielt hat — sonst fehlt die Strafe komplett
  NAMES_BASE.concat(GRANDPARENT_NAMES).forEach(n=>{
    if(!byName[n]) byName[n] = {};
  });

  const rows = Object.keys(byName).map(name=>{
    let total = 0, playedCount = 0, dayCount = 0;
    requiredDateKeys.forEach(dk=>{
      dayCount++;
      if(byName[name].hasOwnProperty(dk)){
        total += byName[name][dk];
        playedCount++;
      }else{
        total += WORDGAME_MISSED_PENALTY;
      }
    });
    if(byName[name].hasOwnProperty(todayStr) && fromStr <= todayStr){
      total += byName[name][todayStr];
      playedCount++;
      dayCount++;
    }
    return {
      name,
      avg: dayCount>0 ? total/dayCount : null,
      played: playedCount,
      totalDays: dayCount
    };
  });
  rows.sort((a,b)=> {
    if(a.avg===null && b.avg===null) return 0;
    if(a.avg===null) return 1;
    if(b.avg===null) return -1;
    return a.avg - b.avg;
  });
  return rows;
}

function getMondayOfCurrentWeek(d){
  const nd = new Date(d);
  const wd = nd.getDay();
  const diff = wd===0 ? -6 : 1-wd;
  nd.setDate(nd.getDate()+diff);
  return nd;
}

  const isWeekend = isSchoolFreeDate(realToday) || isWordGameOffToday; // Wochenende, Feiertag, schulfrei ODER eigens vom Spiel ausgenommen — an all diesen Tagen kein Spiel

  let puzzle = null, displayLen = 0, activeNames = [];

        // Hinweis-Stand ist für alle offen sichtbar — nur das Lösungswort selbst bleibt

        // Man sieht das eigene Wort nur im Moment des eigenen Lösens (Banner oben).
        const wheelNote = played && todaysWheelCache[n] ? ` <span class="wg-today-wheel">${formatWheelAdminEntry(todaysWheelCache[n])}</span>` : "";
        const hintsText = played ? `${t("wordGamePlayedWith")} <strong style="color:${wordGameHintColor(wordGameResults[n])};font-size:15px;">${wordGameResults[n]} ${t("wordGameHintsShort")}</strong>` : t("wordGameNotPlayed");
        return `<div class="wg-today-row"><span style="color:${PERSON_COLORS[n]||'#999'};font-weight:700;">${n}</span><span>${hintsText}${wheelNote}</span></div>`;
      }).join("")}
    </div>
    ${(() => {
      const played = Object.entries(wordGameResults);
      if(played.length===0) return "";
      const winner = played.reduce((a,b)=> b[1]<a[1] ? b : a);
      return `<div class="wg-winner-banner">🏆 ${t("wordGameWinnerToday")}: <strong style="color:${PERSON_COLORS[winner[0]]||'#999'};">${winner[0]}</strong> (${winner[1]} ${t("wordGameHintsShort")})</div>`;

    <button type="button" class="collapse-toggle-btn" id="wgLeaderboardToggle" style="margin-top:12px;">${t("wordGameOverallList")} ${wordGameLeaderboardPeriod?"▾":"▸"}</button>
    ${wordGameLeaderboardPeriod ? `
      <div class="wg-lb-tabs">
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="today"?"selected":""}" data-period="today">${t("wordGameToday")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="week"?"selected":""}" data-period="week">${t("wordGameThisWeek")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="month"?"selected":""}" data-period="month">${t("wordGameThisMonth")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="all"?"selected":""}" data-period="all">${t("wordGameAllTime")}</button>
      </div>
      <p class="participant-hint">${t("wordGameFewerBetter")}</p>

    <button type="button" class="collapse-toggle-btn" id="mpToggle" style="margin-top:12px;">🏆 ${t("monthlyPrizeToggle")} ${monthlyPrizeOpen?"▾":"▸"}</button>
    ${monthlyPrizeOpen ? `<div id="mpBody"></div>` : ``}

  `;

  async function recordResult(name, count){
    const todayStr = dateKey(startOfToday());
    wordGameResults[name] = count; // sofort lokal sichtbar, noch bevor die Cloud überhaupt geantwortet hat
    // VOR dem eigentlichen Speicherversuch synchron vormerken — falls der Tab/die App genau jetzt
    // geschlossen wird (z.B. direkt nach dem Lösen weggewischt), bleibt dieser Vermerk trotzdem im
    // Gerät stehen, weil localStorage.setItem synchron und sofort passiert, noch bevor überhaupt
    // ein Netzwerk-Request losgeschickt wurde. Jedes Mal wenn das Spiel neu geladen wird, wird
    // nach genau so einem übrig gebliebenen Vermerk gesucht und der Speicherversuch nachgeholt.
    try{ localStorage.setItem("wg_unsaved_result:"+todayStr, JSON.stringify({name, count})); }catch(e){}
    let saveOk = false;
    try{
      // Schreibt NUR das eigene Feld (z.B. nur "Murat": 8) direkt per Firebase-Kindpfad — ohne
      // vorheriges Lesen. Das ist race-condition-sicher von Natur aus: Firebase berührt dabei
      // ausschließlich diesen einen Pfad, die Ergebnisse aller anderen Personen (egal ob gerade
      // erst von einem anderen Gerät gespeichert oder schon länger da) bleiben garantiert
      // unangetastet — ganz ohne Lese-Ändern-Schreiben-Zyklus, der durch eine zwischenzeitliche
      // fremde Änderung veraltet sein könnte. Das war die Ursache des "gespielt, aber zeigt nicht
      // an"-Fehlers.
      await cloudStore.setChild(wordGameKey(todayStr), name, count);
      saveOk = true;
    }catch(e){ /* stiller Fehlschlag, lokal bleibt es trotzdem sichtbar; wordGameSaveRetryCheck holt es später nach */ }
    appendAuditLog(todayStr, [`Tägliches Spiel gespielt: ${name} mit ${count} ${count===1?"Hinweis":"Hinweisen"}`]);
    if(saveOk){
      try{ localStorage.removeItem("wg_unsaved_result:"+todayStr); }catch(e){}
    } // bei Fehlschlag bleibt der Vermerk bewusst stehen, bis retryUnsavedWordGameResult es nachholt
    // Belohnung fürs Mitspielen beim Tagesspiel: 10 zusätzliche Casino-Drehungen für heute, egal
    // ob das Tagesspiel selbst gewonnen wurde — einfach fürs Mitmachen. Technisch durch Verringern
    // der "schon benutzt"-Zählung, da sich "übrige Drehungen" daraus errechnet (derselbe Trick wie
    // beim 🎁-Bonussymbol im Slot).
    if(saveOk){
      try{
        // Den aktuellsten Stand direkt aus der Cloud holen statt dem evtl. veralteten lokalen
        // slotSpinsUsedToday zu vertrauen (das ist nur geladen, wenn der Casino-Bereich diese
        // Sitzung schon mal geöffnet wurde) — sonst würde ein schon heute an einem anderen Gerät
        // verbrauchter Stand hier versehentlich auf 0 zurückgesetzt statt nur um 10 verringert.
        const spinsRes = await cloudStore.get(slotSpinsUsedKey(todayStr));
        const spinsData = (spinsRes && spinsRes.value) ? JSON.parse(spinsRes.value) : {};
        // WICHTIG: hier NICHT bei 0 abschneiden (kein Math.max(0,...))! Sonst geht der Bonus
        // verloren, wenn heute noch gar nichts gedreht wurde (0 - 10 würde sonst fälschlich zu 0
        // statt -10, und genau das war der gemeldete Fehler — der Bonus kam einfach nicht an.
        // Negative "schon benutzt"-Werte sind durchaus gewollt: slotSpinsAvailable() rechnet daraus
        // ganz normal mehr als 30 übrige Drehungen aus.
        const newUsed = (spinsData[name]||0) - 10;
        spinsData[name] = newUsed;
        slotSpinsUsedToday[name] = newUsed; // lokalen Stand auch aktualisieren, falls Casino offen ist
        await cloudStore.setChild(slotSpinsUsedKey(todayStr), name, newUsed);
      }catch(e){ /* nicht kritisch — Tagesspiel-Ergebnis selbst ist trotzdem gespeichert */ }
    }
    renderWordGame();
  }

  if(!isWeekend){
    body.querySelectorAll(".wg-pick-player").forEach(btn=>{
      btn.onclick = ()=> openWordGameStartConfirm(btn.dataset.name);
    });

    // Muss hier (innerhalb von renderWordGame selbst) gebunden werden, nicht nur im äußeren
    // bindEvents — denn direkt nach dem Lösen ruft der Tastatur-Handler renderWordGame() ganz
    // allein auf, ohne dass bindEvents danach nochmal läuft. Sonst bleiben die frisch
    // eingeblendeten Übungsmodus-Chips ohne Klick-Funktion.
    body.querySelectorAll(".practice-wg-chip[data-practice-name]").forEach(chip=>{
      chip.onclick = ()=> startPracticeWordGame(chip.dataset.practiceName);
    });

    if(wordGameActivePlayer && !wordGameSolved){
      body.querySelectorAll(".wg-key").forEach(btn=>{
        btn.onclick = ()=>{
          const letter = btn.dataset.letter;
          if(wordGameRevealed.has(letter)) return;
          wordGameRevealed.add(letter);
          wordGameLetterCount++;
          wordGameWrongGuessMsg = "";
          if(checkWordGameAutoSolved(puzzle.answer, wordGameRevealed)){
            wordGameSolved = true;
            wordGameJustSolved = true;
            wordGameTimerDeadline = null;
            clearWordGameTimerInterval();
            recordResult(wordGameActivePlayer, wordGameLetterCount);
          }
          saveWordGameProgress();
          renderWordGame();
        };
      });
      const guessBtn = document.getElementById("wordGameGuessBtn");
      const guessInput = document.getElementById("wordGameGuessInput");
      const submitGuess = ()=>{
        const val = normalizeWordGameText(guessInput.value);
        const target = normalizeWordGameText(puzzle.answer);
        if(val === target){
          puzzle.answer.split("").forEach(ch=>{ if(isWordGameLetter(ch)) wordGameRevealed.add(ch); });
          wordGameSolved = true;
          wordGameJustSolved = true;
          wordGameWrongGuessMsg = "";
          wordGameTimerDeadline = null;
          clearWordGameTimerInterval();
          recordResult(wordGameActivePlayer, wordGameLetterCount);
          saveWordGameProgress();
          renderWordGame();
        }else{
          wordGameLetterCount++;
          wordGameWrongGuessMsg = t("wordGameWrongGuess");
          guessInput.value = "";
          saveWordGameProgress();
          renderWordGame();
        }
      };
      if(guessBtn) guessBtn.onclick = submitGuess;
      if(guessInput) guessInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitGuess(); });
    }

  }

  const lbToggle = document.getElementById("wgLeaderboardToggle");
  if(lbToggle) lbToggle.onclick = ()=>{
    wordGameLeaderboardPeriod = wordGameLeaderboardPeriod ? null : "today";
    renderWordGame();
    if(wordGameLeaderboardPeriod) loadWordGameLeaderboard();
  };
  body.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = ()=>{
      wordGameLeaderboardPeriod = btn.dataset.period;
      renderWordGame();
      loadWordGameLeaderboard();
    };
  });
  if(wordGameLeaderboardPeriod) loadWordGameLeaderboard();

  const mpToggle = document.getElementById("mpToggle");
  if(mpToggle) mpToggle.onclick = ()=>{
    monthlyPrizeOpen = !monthlyPrizeOpen;
    renderWordGame();
    if(monthlyPrizeOpen) renderMonthlyPrizeBody();
  };
  if(monthlyPrizeOpen) renderMonthlyPrizeBody();
  loadTodaysWheelCache();

  const wgLiveResumeYesBtn = document.getElementById("wgLiveResumeYes");
  if(wgLiveResumeYesBtn) wgLiveResumeYesBtn.onclick = ()=>{
    if(wordGameLiveResumeOffer) applyWordGameLiveResume(wordGameLiveResumeOffer);
  };
  const wgLiveResumeNoBtn = document.getElementById("wgLiveResumeNo");
  if(wgLiveResumeNoBtn) wgLiveResumeNoBtn.onclick = ()=>{
    // Nur das Angebot verwerfen — NICHTS an diesem Gerät claimen oder übernehmen. Die Person kann
    // danach ganz normal (wie an jedem anderen Tag) ihren eigenen Namen auswählen.
    wordGameLiveResumeOffer = null;
    renderWordGame();
  };

  startWordGameTimerIfNeeded();
}

async function loadWordGameLeaderboard(){
  const el = document.getElementById("wgLeaderboardBody");
  if(!el) return;
  try{
    const all = await fetchAllWordGameResults();
    const rows = computeLeaderboard(all, wordGameLeaderboardPeriod);
    const targetEl = document.getElementById("wgLeaderboardBody");
    if(!targetEl) return;
    if(rows.length===0){
      targetEl.innerHTML = `<p class="participant-hint">${t("wordGameNoData")}</p>`;
      return;
    }
    targetEl.innerHTML = rows.map((r,i)=>`
      <div class="wg-rank-row">
        <span class="wg-rank-num">${RANK_EMOJIS[i] || (i+1)+"."}</span>
        <span class="wg-rank-name" style="color:${PERSON_COLORS[r.name]||'#999'};">${r.name}</span>
        <span class="wg-rank-avg">${r.avg===null ? t("wordGameNoDataYet") : (r.avg % 1 === 0 ? r.avg.toFixed(0) : r.avg.toFixed(1)) + " " + t("wordGameHintsShort")}</span>
      </div>
    `).join("");
  }catch(e){
    const targetEl = document.getElementById("wgLeaderboardBody");
    if(targetEl) targetEl.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
  }
}

async function renderStatistics(){
  const body = document.getElementById("statisticsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const bringCounts = {};
  const abholCounts = {};
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-"); // "tag_2026_09_07" -> "2026-09-07"
    if(dateStr < STAT_START || dateStr >= todayKey) return; // nur abgeschlossene Tage ab Startdatum
    const d = allData[key];
    if(!d) return;
    if(d.bring && Array.isArray(d.bring.people)){
      d.bring.people.forEach(n=>{ bringCounts[n] = (bringCounts[n]||0)+1; });
    }
    if(d.abhol && Array.isArray(d.abhol.people)){
      d.abhol.people.forEach(n=>{ abholCounts[n] = (abholCounts[n]||0)+1; });
    }
    // Zweite Abholung (Kurstag mit anderem Standort) zählt genauso mit — die Person holt ja auch ab.
    if(d.abhol && Array.isArray(d.abhol.secondPeople)){
      d.abhol.secondPeople.forEach(n=>{ abholCounts[n] = (abholCounts[n]||0)+1; });
    }
    if(d.abhol && Array.isArray(d.abhol.eflinPeople)){
      d.abhol.eflinPeople.forEach(n=>{ abholCounts[n] = (abholCounts[n]||0)+1; });
    }
    if(d.abhol && Array.isArray(d.abhol.nezirPeople)){
      d.abhol.nezirPeople.forEach(n=>{ abholCounts[n] = (abholCounts[n]||0)+1; });
    }
  });

  const allNames = Array.from(new Set([...getActiveNames(), ...Object.keys(bringCounts), ...Object.keys(abholCounts)]));
  const maxBring = Math.max(1, ...allNames.map(n=>bringCounts[n]||0));
  const maxAbhol = Math.max(1, ...allNames.map(n=>abholCounts[n]||0));

  // Beste Serie (aufeinanderfolgende Schultage) je Person, getrennt fuer Bringen/Abholen
  const statStartDate = new Date(2026, 8, 7);
  const yesterday = new Date(startOfToday());
  yesterday.setDate(yesterday.getDate() - 1);
  const seriesDates = statStartDate <= yesterday ? getWeekdayDatesInRange(statStartDate, yesterday) : [];
  const bestBringStreak = {}, bestAbholStreak = {};
  const curBringStreak = {}, curAbholStreak = {};
  seriesDates.forEach(d=>{
    const key = "tag_" + dateKey(d);
    const dd = allData[key];
    // Waren beide Kinder krank, gab es an diesem Tag gar kein Bringen/Abholen zu tun — der Tag
    // zählt weder als Treffer noch als Lücke und wird komplett übersprungen, damit die Serie von
    // niemandem deswegen abreißt (genau wie an schulfreien Tagen).
    if(dd && dd.sick && dd.sick.eflin && dd.sick.eflin.active && dd.sick.nezir && dd.sick.nezir.active) return;
    const bringPeople = (dd && dd.bring && Array.isArray(dd.bring.people)) ? dd.bring.people : [];
    const abholPeopleMain = (dd && dd.abhol && Array.isArray(dd.abhol.people)) ? dd.abhol.people : [];
    const abholPeopleSecond = (dd && dd.abhol && Array.isArray(dd.abhol.secondPeople)) ? dd.abhol.secondPeople : [];
    const abholPeopleEflinSplit = (dd && dd.abhol && Array.isArray(dd.abhol.eflinPeople)) ? dd.abhol.eflinPeople : [];
    const abholPeopleNezirSplit = (dd && dd.abhol && Array.isArray(dd.abhol.nezirPeople)) ? dd.abhol.nezirPeople : [];
    // Zweite Abholung (Kurstag mit anderem Standort) und manuell gesplittete Abholung (z.B. krankes
    // Kind) zählen für die Serie genauso wie die normale.
    const abholPeople = abholPeopleMain.concat(abholPeopleSecond, abholPeopleEflinSplit, abholPeopleNezirSplit);
    allNames.forEach(n=>{
      if(bringPeople.includes(n)){
        curBringStreak[n] = (curBringStreak[n]||0)+1;
        bestBringStreak[n] = Math.max(bestBringStreak[n]||0, curBringStreak[n]);
      }else{
        curBringStreak[n] = 0;
      }
      if(abholPeople.includes(n)){
        curAbholStreak[n] = (curAbholStreak[n]||0)+1;
        bestAbholStreak[n] = Math.max(bestAbholStreak[n]||0, curAbholStreak[n]);
      }else{
        curAbholStreak[n] = 0;
      }
    });
  });

  function barRow(n, count, max){
    const pct = Math.max(4, Math.round((count/max)*100));
    const color = PERSON_COLORS[n] || "#999";
    return `
      <div class="stat-bar-row">
        <span class="stat-bar-name">${n}</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <span class="stat-bar-count">${count}</span>
      </div>`;
  }

  function titleLine(n, titleObj){
    if(!titleObj) return "";
    const nameColor = PERSON_COLORS[n] || "#999";
    const sentence = LANG === "tr"
      ? `${n} ${titleObj.label}`
      : `${n} ${titleObj.article} ${titleObj.label}`;
    return `<div class="stat-rank-line"><span style="color:${nameColor};">${titleObj.emoji} ${escapeHtml(sentence)}</span></div>`;
  }

  body.innerHTML = `
    <label class="field-label" style="font-size:14px;font-weight:800;">${t("statBring")}</label>
    ${allNames.map(n=>barRow(n, bringCounts[n]||0, maxBring)).join("")}
    <div class="stat-rank-group">
      ${allNames.map(n=>titleLine(n, getRankTitle(bringCounts[n]||0, BRING_TITLES, n))).join("")}
    </div>

    <hr class="stat-divider">
    <label class="field-label" style="font-size:14px;font-weight:800;">${t("statAbhol")}</label>
    ${allNames.map(n=>barRow(n, abholCounts[n]||0, maxAbhol)).join("")}
    <div class="stat-rank-group">
      ${allNames.map(n=>titleLine(n, getRankTitle(abholCounts[n]||0, ABHOL_TITLES, n))).join("")}
    </div>

    <hr class="stat-divider">
    <label class="field-label" style="font-size:14px;font-weight:800;">${t("statSeriesBringTitle")}</label>
    <div class="stat-rank-group">
      ${(()=>{
        const sorted = allNames.filter(n=>(bestBringStreak[n]||0)>0).sort((a,b)=>(bestBringStreak[b]||0)-(bestBringStreak[a]||0));
        return sorted.length ? sorted.map((n,i)=>{
          const emoji = RANK_EMOJIS[i] || "▪️";
          const size = Math.max(11, 20 - i*1.6);
          return `<div class="stat-rank-line"><span style="color:${PERSON_COLORS[n]||'#999'};font-size:${size}px;">${emoji} ${escapeHtml(n)}: ${bestBringStreak[n]}</span></div>`;
        }).join("") : `<p class="participant-hint">${t("statNoSeries")}</p>`;
      })()}
    </div>

    <hr class="stat-divider">
    <label class="field-label" style="font-size:14px;font-weight:800;">${t("statSeriesAbholTitle")}</label>
    <div class="stat-rank-group">
      ${(()=>{
        const sorted = allNames.filter(n=>(bestAbholStreak[n]||0)>0).sort((a,b)=>(bestAbholStreak[b]||0)-(bestAbholStreak[a]||0));
        return sorted.length ? sorted.map((n,i)=>{
          const emoji = RANK_EMOJIS[i] || "▪️";
          const size = Math.max(11, 20 - i*1.6);
          return `<div class="stat-rank-line"><span style="color:${PERSON_COLORS[n]||'#999'};font-size:${size}px;">${emoji} ${escapeHtml(n)}: ${bestAbholStreak[n]}</span></div>`;
        }).join("") : `<p class="participant-hint">${t("statNoSeries")}</p>`;
      })()}
    </div>
  `;
}

async function renderSnackStats(){
  const body = document.getElementById("snackStatsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint" style="margin:4px 0 0;">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint" style="margin:4px 0 0;">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  const entries = []; // {date, child}
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-");
    if(dateStr < STAT_START || dateStr > todayKey) return; // heute zählt schon mit, falls schon eingetragen
    const d = allData[key];
    if(!d || !d.snack || !d.snack.child) return;
    entries.push({date:dateStr, child:d.snack.child});
  });

  const today = startOfToday();
  const mondayStr = dateKey(getMondayOfCurrentWeek(today));
  const monthPrefix = todayKey.slice(0,7);

  function countFor(filterFn){
    const out = {eflin:0, nezir:0};
    entries.filter(filterFn).forEach(e=>{ if(out.hasOwnProperty(e.child)) out[e.child]++; });
    return out;
  }
  const groups = {
    week: countFor(e=>e.date>=mondayStr),
    month: countFor(e=>e.date.slice(0,7)===monthPrefix),
    all: countFor(()=>true)
  };
  const periodTabs = [
    {key:"week", label:t("snackStatsWeek")},
    {key:"month", label:t("snackStatsMonth")},
    {key:"all", label:t("snackStatsTotal")}
  ];
  const g = groups[snackStatsPeriod] || groups.week;
  const maxCount = Math.max(1, g.eflin, g.nezir);

  body.innerHTML = `
    <div class="wg-lb-tabs">
      ${periodTabs.map(tb=>`<button type="button" class="chip" data-snackperiod="${tb.key}" ${snackStatsPeriod===tb.key?"style=\"background:var(--teal);border-color:var(--teal);color:#fff;\"":""}>${tb.label}</button>`).join("")}
    </div>
    <div style="margin-top:8px;">
      <div class="stat-bar-row">
        <span class="stat-bar-name" style="color:${KID_COLORS.eflin};font-weight:700;">Eflin</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.max(4, Math.round((g.eflin/maxCount)*100))}%;background:${KID_COLORS.eflin};"></div></div>
        <span class="stat-bar-count">${g.eflin}</span>
      </div>
      <div class="stat-bar-row">
        <span class="stat-bar-name" style="color:${KID_COLORS.nezir};font-weight:700;">Nezir</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.max(4, Math.round((g.nezir/maxCount)*100))}%;background:${KID_COLORS.nezir};"></div></div>
        <span class="stat-bar-count">${g.nezir}</span>
      </div>
    </div>
  `;

  body.querySelectorAll("[data-snackperiod]").forEach(btn=>{
    btn.onclick = ()=>{
      snackStatsPeriod = btn.dataset.snackperiod;
      renderSnackStats();
    };
  });
}

async function renderPickupTimeStats(){
  const body = document.getElementById("pickupStatsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  const entries = [];
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-");
    if(dateStr < STAT_START || dateStr >= todayKey) return; // nur abgeschlossene Tage
    const d = allData[key];
    if(!d || !d.abhol || !d.abhol.time) return;
    const wd = new Date(dateStr+"T00:00:00").getDay();
    entries.push({date:dateStr, time:d.abhol.time, weekday:wd});
  });

  const today = startOfToday();
  const mondayStr = dateKey(getMondayOfCurrentWeek(today));
  const monthPrefix = todayKey.slice(0,7);

  function timeToMinutes(tm){ const p = tm.split(":"); return Number(p[0])*60+Number(p[1]); }
  function minutesToTime(m){ const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }

  function computeGroup(filterFn){
    const filtered = entries.filter(filterFn);
    const counts = {};
    filtered.forEach(e=>{ counts[e.time] = (counts[e.time]||0)+1; });
    const times = Object.keys(counts).sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
    let avg=null, min=null, max=null;
    if(filtered.length>0){
      const mins = filtered.map(e=>timeToMinutes(e.time));
      avg = minutesToTime(Math.round(mins.reduce((a,b)=>a+b,0)/mins.length));
      min = minutesToTime(Math.min(...mins));
      max = minutesToTime(Math.max(...mins));
    }
    return {counts, times, avg, min, max, total:filtered.length};
  }

  const groups = {
    week: computeGroup(e=>e.date>=mondayStr),
    month: computeGroup(e=>e.date.slice(0,7)===monthPrefix),
    all: computeGroup(()=>true),
    1: computeGroup(e=>e.weekday===1),
    2: computeGroup(e=>e.weekday===2),
    3: computeGroup(e=>e.weekday===3),
    4: computeGroup(e=>e.weekday===4),
    5: computeGroup(e=>e.weekday===5)
  };

  const wdLabels = getWeekdayShortList(); // [{k,l}] fuer mo..fr, index 0-4 -> Wochentag 1-5

  const periodTabs = [
    {key:"week", label:t("pickupStatsWeek")},
    {key:"month", label:t("pickupStatsMonth")},
    {key:"all", label:t("pickupStatsAll")}
  ];
  const weekdayTabs = [
    {key:"1", label:wdLabels[0].l},
    {key:"2", label:wdLabels[1].l},
    {key:"3", label:wdLabels[2].l},
    {key:"4", label:wdLabels[3].l},
    {key:"5", label:wdLabels[4].l}
  ];

  const g = groups[pickupStatsPeriod] || groups.all;
  const maxCount = Math.max(1, ...g.times.map(tm=>g.counts[tm]));

  body.innerHTML = `
    <div class="wg-lb-tabs">
      ${periodTabs.map(tb=>`<button type="button" class="chip pickup-tab-period ${pickupStatsPeriod===tb.key?"selected":""}" data-period="${tb.key}">${tb.label}</button>`).join("")}
    </div>
    <div class="wg-lb-tabs" style="margin-top:6px;">
      ${weekdayTabs.map(tb=>`<button type="button" class="chip pickup-tab-weekday ${pickupStatsPeriod===tb.key?"selected":""}" data-period="${tb.key}">${tb.label}</button>`).join("")}
    </div>
    ${g.total===0 ? `<p class="participant-hint" style="margin-top:10px;">${t("pickupStatsNoData")}</p>` : `
      ${g.avg ? `<p class="participant-hint" style="margin-top:10px;">${t("pickupStatsAvg")}: <strong>${g.avg}</strong> · ${t("pickupStatsMin")}: <strong>${g.min}</strong> · ${t("pickupStatsMax")}: <strong>${g.max}</strong></p>` : ``}
      <div style="margin-top:8px;">
        ${g.times.map(tm=>{
          const cnt = g.counts[tm];
          const pct = Math.max(4, Math.round((cnt/maxCount)*100));
          return `
            <div class="stat-bar-row">
              <span class="stat-bar-name">${tm}</span>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:var(--blue);"></div></div>
              <span class="stat-bar-count">${cnt}</span>
            </div>`;
        }).join("")}
      </div>
    `}
  `;

  body.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = ()=>{
      pickupStatsPeriod = btn.dataset.period;
      renderPickupTimeStats();
    };
  });
}

function kidsQuizBodyHtml(){
  const totalQuestions = KIDS_QUIZ.reduce((s,cat)=>s+cat.questions.length, 0);
  const totalPlayed = KIDS_QUIZ.reduce((s,cat)=>s + cat.questions.filter((_, qi)=>!!kidsQuizPlayed[cat.id+"__"+qi]).length, 0);
  const filterBar = `
    <div class="quiz-progress-total">🎮 ${totalPlayed}/${totalQuestions} Spiele gespielt</div>
    <button type="button" class="quiz-play-btn" id="quizRandomBtn">🎲 Jetzt spielen</button>
    <div class="quiz-filter-bar" id="kidsQuizFilterBar">
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="all"?"selected":""}" data-filter="all">Alle</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="unplayed"?"selected":""}" data-filter="unplayed">Noch nie gespielt</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="played"?"selected":""}" data-filter="played">Schon gespielt</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="over1m"?"selected":""}" data-filter="over1m">&gt;1 Monat her</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="over3m"?"selected":""}" data-filter="over3m">&gt;3 Monate her</button>
    </div>
  `;

  const catsHtml = KIDS_QUIZ.map(cat=>{
    const total = cat.questions.length;
    const playedCount = cat.questions.filter((_, qi)=>!!kidsQuizPlayed[cat.id+"__"+qi]).length;

    // Nur Fragen, die zum aktiven Filter passen
    const visibleIdx = cat.questions
      .map((_, qi)=>qi)
      .filter(qi=>quizMatchesFilter(kidsQuizPlayed[cat.id+"__"+qi], kidsQuizFilter));
    if(kidsQuizFilter !== "all" && visibleIdx.length === 0) return ""; // Kategorie ohne Treffer ausblenden

    const catExpanded = expandedQuizCategories.has(cat.id);
    // Ungespielte Fragen zuerst, gespielte ans Ende — damit man immer neue bekommt
    const orderedIdx = visibleIdx.slice().sort((a,b)=>{
      const aTs = kidsQuizPlayed[cat.id+"__"+a] || 0;
      const bTs = kidsQuizPlayed[cat.id+"__"+b] || 0;
      const aPlayed = aTs ? 1 : 0;
      const bPlayed = bTs ? 1 : 0;
      if(aPlayed !== bPlayed) return aPlayed - bPlayed;
      return a - b;
    });

    return `
      <div class="quiz-cat ${cat.color}" data-cat="${cat.id}">
        <div class="quiz-cat-header-row">
          <button type="button" class="quiz-cat-header">
            <span class="quiz-cat-title">${cat.title}</span>
            <span class="quiz-cat-meta">${playedCount}/${total} gespielt ${catExpanded?"▾":"▸"}</span>
          </button>
          <button type="button" class="quiz-cat-up-btn" aria-label="Nach oben zu den Filtern">⬆️</button>
        </div>
        ${catExpanded ? `
          <div class="quiz-questions">
            ${orderedIdx.map(qi=>{
              const item = cat.questions[qi];
              const qKey = cat.id + "__" + qi;
              const qExpanded = expandedQuizQuestions.has(qKey);
              const ts = kidsQuizPlayed[qKey];
              const ageClass = quizPlayedAgeClass(ts);
              return `
                <div class="quiz-question ${ts?"quiz-question-played":""} ${ageClass}" data-qkey="${qKey}">
                  <div class="quiz-question-row">
                    <button type="button" class="quiz-check-btn" aria-label="Als gespielt markieren">${ts?"✅":"⬜"}</button>
                    <button type="button" class="quiz-question-btn">
                      <span>${escapeHtml(item.q)}</span>
                      <span class="quiz-q-arrow">${qExpanded?"▾":"▸"}</span>
                    </button>
                  </div>
                  ${ts ? `<div class="quiz-age-label">${escapeHtml(quizPlayedAgeLabel(ts))}</div>` : ``}
                  ${qExpanded ? `<div class="quiz-answer">${escapeHtml(item.a)}</div>` : ``}
                </div>
              `;
            }).join("")}
          </div>
        ` : ``}
      </div>
    `;
  }).join("");

  return filterBar + (catsHtml.trim() ? catsHtml : `<p class="participant-hint">Keine Fragen für diesen Filter — versuch's mit einem anderen!</p>`);
}

function renderKidsQuizBody(){

function minutesUntilNextBus(times){
  const now = new Date();
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  for(const tm of times){
    const p = tm.split(":");
    const t = Number(p[0])*60 + Number(p[1]);
    if(t >= nowMinutes) return t - nowMinutes;
  }
  return null;

function schoolYearMonths(){
  // 12 aufeinanderfolgende Monate ab dem laufenden Schuljahresstart (September)
  const now = startOfToday();
  const startYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear()-1; // Monat-Index 8 = September
  const months = [];
  for(let i=0;i<12;i++){
    const m = (8+i) % 12;
    const y = startYear + Math.floor((8+i)/12);
    months.push({ y, m, key: y+"-"+String(m+1).padStart(2,"0"), color: MONTH_COLORS[i] });
  }
  return months;
}

function classPhotosSearchResults(query){
  const q = query.trim().toLocaleLowerCase(LANG==="tr"?"tr":"de");
  if(!q) return [];
  const results = [];
  ["eflin","nezir"].forEach(kidKey=>{
    const kidObj = globalData.classPhotos[kidKey];
    ["1","2","3","4"].forEach(gradeKey=>{
      kidObj.grades[gradeKey].classmates.forEach(c=>{
        const full = ((c.firstName||"")+" "+(c.lastName||"")).toLocaleLowerCase(LANG==="tr"?"tr":"de");
        if(full.includes(q)){
          results.push({ kidKey, gradeKey, classmate:c, className:kidObj.className });
        }

    });

  return results;

function renderClassPhotosBody(){

  if(!body) return;
  // Nur wenn das Suchfeld GERADE schon fokussiert war (man tippt also aktiv), soll es nach dem
  // Neuaufbau wieder fokussiert werden — sonst poppt bei jedem Öffnen/Zuklappen ungewollt die
  // Tastatur auf, obwohl man gar nichts eingeben wollte.
  const searchWasFocused = document.activeElement && document.activeElement.id === "cpSearchInput";
  // Diese Funktion baut bei jeder Änderung (Kamerad hinzufügen, Foto hochladen, …) den ganzen
  // Bereich neu auf. Ohne das hier würde die Seite dabei jedes Mal ganz nach oben springen.
  const scrollBefore = window.scrollY;
  const restoreScroll = ()=>{
    holdScrollPosition(scrollBefore, 12);
  };

  const searchResults = classPhotosSearchResults(classPhotosSearchQuery);

    searchResults.length ? searchResults.map(r=>{

      const tag = hasPhoto ? "a" : "button";

        ${hasPhoto ? `<img src="${r.classmate.photo.url}" class="cp-classmate-thumb" alt="">` : `<div class="cp-classmate-thumb cp-classmate-noPhoto">🙂</div>`}
        <span>${escapeHtml(r.classmate.firstName)} ${escapeHtml(r.classmate.lastName)} — ${r.kidKey==="eflin"?"Eflin":"Nezir"} (${r.className}, ${GRADE_LABELS[r.gradeKey]} ${t("classPhotosGradeShort")})</span>
      </${tag}>
    `;}).join("") : `<p class="participant-hint">${t("classPhotosSearchNone")}</p>`
  ) : "";

  const kidBlockHtml = kidKey=>{
    const kidObj = globalData.classPhotos[kidKey];
    const kidLabel = kidKey==="eflin" ? "Eflin" : "Nezir";
    return `
      <div class="cp-kid-block">
        <h3 class="cp-kid-title" style="color:${KID_COLORS[kidKey]};">${kidLabel} — ${t("classPhotosClassLabel")} ${kidObj.className}</h3>
        ${["1","2","3","4"].map(gradeKey=>{
          const ek = kidKey+"_"+gradeKey;
          const expanded = classPhotosExpandedGrades.has(ek);
          return `
            <div class="cp-grade-block" id="cpGrade_${ek}">
              <button type="button" class="collapse-toggle-btn cp-grade-toggle" data-ek="${ek}">${GRADE_LABELS[gradeKey]} ${t("classPhotosGradeLabel")} ${expanded?"▾":"▸"}</button>
              ${expanded ? `<div class="cp-grade-content">${classPhotosUnlocked ? classGradeEditHtml(kidKey,gradeKey) : classGradeReadHtml(kidKey,gradeKey)}</div>` : ``}
            </div>
          `;
        }).join("")}
      </div>
    `;
  };

  const cousinBlockHtml = ()=>{
    return `
      <div class="cp-kid-block cp-cousin-block">
        <h3 class="cp-kid-title" style="color:var(--amber);">🧡 ${t("classPhotosCousinsTitle")}</h3>
        ${["1","2","3","4"].map(gradeKey=>{
          const ek = "cousins_"+gradeKey;
          const expanded = classPhotosExpandedGrades.has(ek);
          const grade = globalData.classPhotos.cousins.grades[gradeKey];
          return `
            <div class="cp-grade-block" id="cpGrade_${ek}">
              <button type="button" class="collapse-toggle-btn cp-grade-toggle" data-ek="${ek}">${GRADE_LABELS[gradeKey]} ${t("classPhotosGradeLabel")} ${expanded?"▾":"▸"}</button>
              ${expanded ? `
                <div class="cp-grade-content">
                  <label class="field-label bp-label cp-section-label">🧡 ${t("classPhotosCousinsTitle")}</label>
                  ${classPhotosUnlocked
                    ? `<div class="cp-cousin-photos-edit-wrap">${photosHtml(grade.photos, false)}</div>`
                    : classGradePhotosReadHtml(grade.photos)}
                </div>
              ` : ``}
            </div>
          `;
        }).join("")}
      </div>
    `;
  };

  body.innerHTML = `
    <div class="cp-search-wrap">
      <input type="text" class="cp-search-input" id="cpSearchInput" placeholder="${t("classPhotosSearchPlaceholder")}" value="${escapeHtml(classPhotosSearchQuery)}">
    </div>
    ${searchResultsHtml ? `<div class="cp-search-results">${searchResultsHtml}</div>` : ``}

    <div class="cp-lock-row">
      ${classPhotosUnlocked
        ? `<span class="cp-unlocked-note">🔓 ${t("classPhotosUnlocked")}</span> <button type="button" class="reset-link" id="cpLockBtn">${t("classPhotosLockAgain")}</button>`
        : `<button type="button" class="add-btn" id="cpUnlockBtn">🔒 ${t("classPhotosUnlockBtn")}</button>`}
    </div>

    ${kidBlockHtml("eflin")}
    ${kidBlockHtml("nezir")}
    ${cousinBlockHtml()}
  `;

  const searchInput = document.getElementById("cpSearchInput");
  if(searchInput){
    searchInput.oninput = e=>{ classPhotosSearchQuery = e.target.value; renderClassPhotosBody(); };
    if(searchWasFocused){
      // Fokus nur erhalten, wenn man gerade aktiv getippt hat — das Feld wird bei jedem
      // Tastendruck neu aufgebaut und würde sonst den Fokus verlieren.
      searchInput.focus();
      searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
    }
  }
  body.querySelectorAll(".cp-search-result").forEach(btn=>{
    if(btn.dataset.hasPhoto === "1") return; // ist ein <a>, öffnet das Foto direkt groß — kein JS nötig
    btn.onclick = ()=>{
      classPhotosExpandedGrades.add(btn.dataset.kid+"_"+btn.dataset.grade);
      classPhotosSearchQuery = "";
      suppressScrollRestore = true; // hier soll bewusst zur Klasse gesprungen werden
      renderClassPhotosBody();
      const target = document.getElementById("cpGrade_"+btn.dataset.kid+"_"+btn.dataset.grade);
      if(target && target.scrollIntoView) target.scrollIntoView({behavior:"smooth", block:"start"});
    };
  });

  const unlockBtn = document.getElementById("cpUnlockBtn");
  if(unlockBtn) unlockBtn.onclick = ()=>{
    const input = prompt(t("classPhotosPasswordPrompt"));
    if(input === null) return;
    if(checkClassPhotosPassword(input)){
      classPhotosUnlocked = true;
      renderClassPhotosBody();
    }else{
      alert(t("classPhotosWrongPassword"));
    }
  };
  const lockBtn = document.getElementById("cpLockBtn");
  if(lockBtn) lockBtn.onclick = ()=>{ classPhotosUnlocked = false; renderClassPhotosBody(); };

  body.querySelectorAll(".cp-filter-chip").forEach(chip=>{
    chip.onclick = ()=>{
      classPhotosGenderFilter = chip.dataset.filter;
      renderClassPhotosBody();
    };
  });
  body.querySelectorAll(".cp-grade-toggle").forEach(btn=>{
    btn.onclick = ()=>{
      const ek = btn.dataset.ek;
      if(classPhotosExpandedGrades.has(ek)) classPhotosExpandedGrades.delete(ek);
      else classPhotosExpandedGrades.add(ek);
      renderClassPhotosBody();
    };
  });

  if(!classPhotosUnlocked) return; // Rest sind nur Bearbeitungs-Bindings

  ["eflin","nezir"].forEach(kidKey=>{
    ["1","2","3","4"].forEach(gradeKey=>{
      const ek = kidKey+"_"+gradeKey;
      if(!classPhotosExpandedGrades.has(ek)) return;
      const grade = globalData.classPhotos[kidKey].grades[gradeKey];
      const gradeBlock = document.getElementById("cpGrade_"+ek);
      const wrap = gradeBlock ? gradeBlock.querySelector(".cp-grade-content") : null;
      if(!wrap) return;

      const individualWrap = wrap.querySelector(".cp-individual-photos-edit-wrap");
      if(individualWrap) bindPhotoWidget(individualWrap, grade.individualPhotos, `classPhotos/${kidKey}/${gradeKey}/individual`, renderClassPhotosBody, ()=>{globalDirty=true;});
      const classWrap = wrap.querySelector(".cp-photos-edit-wrap");
      if(classWrap) bindPhotoWidget(classWrap, grade.photos, `classPhotos/${kidKey}/${gradeKey}`, renderClassPhotosBody, ()=>{globalDirty=true;});

      wrap.querySelectorAll(".cp-classmate-firstname").forEach(inp=>{
        inp.oninput = e=>{ grade.classmates[Number(inp.dataset.cidx)].firstName = e.target.value; globalDirty = true; };
      });
      wrap.querySelectorAll(".cp-classmate-lastname").forEach(inp=>{
        inp.oninput = e=>{ grade.classmates[Number(inp.dataset.cidx)].lastName = e.target.value; globalDirty = true; };
      });
      wrap.querySelectorAll(".cp-gender-chip").forEach(chip=>{
        chip.onclick = ()=>{
          const idx = Number(chip.dataset.cidx);
          const g = chip.dataset.gender;
          grade.classmates[idx].gender = (grade.classmates[idx].gender === g) ? "" : g; // erneutes Klicken wählt wieder ab
          globalDirty = true;
          renderClassPhotosBody();
        };
      });
      wrap.querySelectorAll(".cp-classmate-remove").forEach(btn=>{
        btn.onclick = ()=>{
          if(!confirm(t("evConfirmDelete"))) return;
          grade.classmates.splice(Number(btn.dataset.cidx),1);
          globalDirty = true;
          renderClassPhotosBody();
        };
      });
      wrap.querySelectorAll(".cp-classmate-photo-input").forEach(inp=>{
        inp.onchange = async e=>{
          const file = e.target.files && e.target.files[0];
          if(!file) return;
          const statusEl = wrap.querySelector(".cp-classmate-photo-status");
          if(statusEl) statusEl.textContent = t("statusLoading");
          try{
            const uploaded = await uploadPhoto(file, `classPhotos/${kidKey}/${gradeKey}/classmates`);
            grade.classmates[Number(inp.dataset.cidx)].photo = uploaded;
            globalDirty = true;
            renderClassPhotosBody();
          }catch(err){
            if(statusEl) statusEl.textContent = t("statusSaveFailed") + ((err&&err.message)||"");
          }
        };
      });
      const addBtn = wrap.querySelector(".cp-classmate-add");
      if(addBtn) addBtn.onclick = ()=>{
        grade.classmates.push({firstName:"", lastName:"", gender:"", photo:null});
        globalDirty = true;
        renderClassPhotosBody();
      };
    });
  });

  ["1","2","3","4"].forEach(gradeKey=>{
    const ek = "cousins_"+gradeKey;
    if(!classPhotosExpandedGrades.has(ek)) return;
    const grade = globalData.classPhotos.cousins.grades[gradeKey];
    const gradeBlock = document.getElementById("cpGrade_"+ek);
    const wrap = gradeBlock ? gradeBlock.querySelector(".cp-grade-content") : null;
    if(!wrap) return;
    const cousinWrap = wrap.querySelector(".cp-cousin-photos-edit-wrap");
    if(cousinWrap) bindPhotoWidget(cousinWrap, grade.photos, `classPhotos/cousins/${gradeKey}`, renderClassPhotosBody, ()=>{globalDirty=true;});
  });

  if(suppressScrollRestore){ suppressScrollRestore = false; }
  else{ restoreScroll(); }
}
