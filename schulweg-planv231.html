async function loadWeather(){
  try{
    const district = VIENNA_DISTRICTS.find(d=>d.id===weatherDistrict) || VIENNA_DISTRICTS[22];
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${district.lat}&longitude=${district.lon}`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,relative_humidity_2m_mean,sunrise,sunset`
      + `&hourly=temperature_2m,weather_code,precipitation_probability,wind_gusts_10m,relative_humidity_2m,apparent_temperature`
      + `&timezone=Europe%2FVienna&forecast_days=7`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const days = data.daily;
    const hrs = data.hourly;
    if(!days || !days.time) throw new Error("unerwartetes Datenformat");
    const hourlyIndex = {};
    const byDayHumidity = {};   // dateStr -> [values] für Tages-Fallback
    const byDayAppTemp = {};    // dateStr -> [values] für Tages-Fallback
    if(hrs && hrs.time){
      hrs.time.forEach((ts, i)=>{
        const humidityVal = hrs.relative_humidity_2m ? hrs.relative_humidity_2m[i] : null;
        const appTempVal = hrs.apparent_temperature ? hrs.apparent_temperature[i] : null;
        hourlyIndex[ts] = {
          temp: hrs.temperature_2m[i],
          code: hrs.weather_code[i],
          precip: hrs.precipitation_probability ? hrs.precipitation_probability[i] : null,
          gust: hrs.wind_gusts_10m ? hrs.wind_gusts_10m[i] : null,
          humidity: humidityVal,
          appTemp: appTempVal
        };
        const dayPrefix = ts.slice(0, 10);
        if(humidityVal!=null){
          (byDayHumidity[dayPrefix] = byDayHumidity[dayPrefix] || []).push(humidityVal);
        }
        if(appTempVal!=null){
          (byDayAppTemp[dayPrefix] = byDayAppTemp[dayPrefix] || []).push(appTempVal);
        }
      });
    }
    const map = {};
    days.time.forEach((dateStr, i)=>{
      const slot = h => hourlyIndex[`${dateStr}T${h}`] || null;
      const middaySlot = slot("13:00");

      // Tageswert bevorzugt, sonst aus den Stundenwerten des Tages berechnet
      let appTmax = (days.apparent_temperature_max && days.apparent_temperature_max[i]!=null) ? days.apparent_temperature_max[i] : null;
      let appTmin = (days.apparent_temperature_min && days.apparent_temperature_min[i]!=null) ? days.apparent_temperature_min[i] : null;
      if((appTmax==null || appTmin==null) && byDayAppTemp[dateStr] && byDayAppTemp[dateStr].length){
        const vals = byDayAppTemp[dateStr];
        if(appTmax==null) appTmax = Math.max(...vals);
        if(appTmin==null) appTmin = Math.min(...vals);
      }

      let humidity = (days.relative_humidity_2m_mean && days.relative_humidity_2m_mean[i]!=null) ? days.relative_humidity_2m_mean[i] : null;
      if(humidity==null && byDayHumidity[dateStr] && byDayHumidity[dateStr].length){
        const vals = byDayHumidity[dateStr];
        humidity = vals.reduce((s,v)=>s+v,0) / vals.length;
      }else if(humidity==null && middaySlot && middaySlot.humidity!=null){
        humidity = middaySlot.humidity;
      }

      map[dateStr] = {
        code: days.weather_code[i],
        tmax: Math.round(days.temperature_2m_max[i]),
        tmin: Math.round(days.temperature_2m_min[i]),
        appTmax: appTmax!=null ? Math.round(appTmax) : null,
        appTmin: appTmin!=null ? Math.round(appTmin) : null,
        precipProbMax: (days.precipitation_probability_max && days.precipitation_probability_max[i]!=null) ? Math.round(days.precipitation_probability_max[i]) : null,
        windGustMax: (days.wind_gusts_10m_max && days.wind_gusts_10m_max[i]!=null) ? Math.round(days.wind_gusts_10m_max[i]) : null,
        humidity: humidity!=null ? Math.round(humidity) : null,
        sunrise: days.sunrise ? days.sunrise[i] : null,
        sunset: days.sunset ? days.sunset[i] : null,
        morning: slot("08:00"),
        bring7: slot("07:00"),
        midday: middaySlot,
        afternoon: slot("16:00"),
        pickup17: slot("17:00"),
        evening: slot("19:00")
      };
    });
    weatherByDate = map;
    weatherError = "";
  }catch(e){
    weatherError = (e && e.message) ? e.message : "unbekannter Fehler";
  }
  renderWeatherChip();
  renderWeatherDetailBody();
}

  {key:"grass_pollen", labelDe:"Gräser", labelTr:"Çimen"},

function pollenLevel(value){
  if(value == null) return null;
  if(value < 10) return "low";
  if(value < 50) return "medium";
  return "high";
}

async function loadPollen(){
  try{
    const district = VIENNA_DISTRICTS.find(d=>d.id===weatherDistrict) || VIENNA_DISTRICTS[22];
    const varsParam = POLLEN_TYPES.map(p=>p.key).join(",");
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${district.lat}&longitude=${district.lon}`
      + `&hourly=${varsParam}&timezone=Europe%2FVienna&forecast_days=6`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const hrs = data.hourly;
    if(!hrs || !hrs.time) throw new Error("unerwartetes Datenformat");
    const map = {};
    hrs.time.forEach((ts, i)=>{
      const dayPrefix = ts.slice(0,10);
      if(!map[dayPrefix]) map[dayPrefix] = {};
      POLLEN_TYPES.forEach(p=>{
        const val = hrs[p.key] ? hrs[p.key][i] : null;
        if(val == null) return;
        if(map[dayPrefix][p.key] == null || val > map[dayPrefix][p.key]) map[dayPrefix][p.key] = val;
      });
    });
    pollenByDate = map;
    pollenError = "";
  }catch(e){
    pollenError = (e && e.message) ? e.message : "unbekannter Fehler";
  }
  renderWeatherDetailBody();
}

  if(code===1) return LANG==="tr" ? "genelde açık" : "überwiegend klar";
  if(code===2) return LANG==="tr" ? "parçalı bulutlu" : "teilweise bewölkt";
  if(code===3) return LANG==="tr" ? "çok bulutlu" : "stark bewölkt";
  if(code===45||code===48) return LANG==="tr" ? "sisli" : "neblig";
  if(code>=51&&code<=57) return LANG==="tr" ? "hafif çisenti" : "leichter Nieselregen";
  if(code>=61&&code<=67) return LANG==="tr" ? "yağmurlu" : "Regen";
  if(code>=71&&code<=77) return LANG==="tr" ? "kar yağışı" : "Schneefall";
  if(code>=80&&code<=82) return LANG==="tr" ? "sağanak yağış" : "Regenschauer";
  if(code>=85&&code<=86) return LANG==="tr" ? "kar sağanağı" : "Schneeschauer";
  if(code>=95) return LANG==="tr" ? "gök gürültülü fırtına" : "Gewitter";
  return LANG==="tr" ? "değişken" : "wechselhaft";
}

function tempDescText(t){
  if(t==null) return "";
  if(LANG==="tr"){
    if(t<0) return "dondurucu";
    if(t<11) return "serin";
    if(t<17) return "ılık";
    if(t<23) return "hoş sıcaklıkta";
    if(t<28) return "sıcak";
    return "çok sıcak";
  }
  if(t<0) return "frostig";
  if(t<11) return "kühl";
  if(t<17) return "mild";
  if(t<23) return "angenehm warm";
  if(t<28) return "warm";
  return "heiß";
}

function formatHM(iso){
  if(!iso) return "";
  const parts = iso.split("T");
  return parts[1] ? parts[1].slice(0,5) : "";
}

function needsUmbrella(w){
  if(!w) return false;
  const rainCode = (w.code>=51&&w.code<=67) || (w.code>=80&&w.code<=82) || w.code>=95;
  return (w.precipProbMax!=null && w.precipProbMax>=40) || rainCode;
}

function needsUmbrellaSlot(slot){
  if(!slot) return false;
  const rainCode = (slot.code>=51&&slot.code<=67) || (slot.code>=80&&slot.code<=82) || slot.code>=95;
  return (slot.precip!=null && slot.precip>=40) || rainCode;
}

function needsUmbrellaPickup(w){
  if(!w) return false;
  if(needsUmbrellaSlot(w.afternoon) || needsUmbrellaSlot(w.pickup17)) return true;
  return needsUmbrella(w); // Fallback, falls keine Stundenwerte vorliegen
}

function needsUmbrellaBring(w){
  if(!w) return false;
  if(needsUmbrellaSlot(w.bring7) || needsUmbrellaSlot(w.morning)) return true;
  return needsUmbrella(w); // Fallback, falls keine Stundenwerte vorliegen
}

function weatherDistrictName(){
  const d = VIENNA_DISTRICTS.find(x=>x.id===weatherDistrict) || VIENNA_DISTRICTS[22];
  return d.name;
}

function weatherWeekOutlookText(startDate){
  const days = [];
  let d = new Date(startDate);
  for(let i=0;i<5;i++){
    const w = weatherByDate[dateKey(d)];
    if(w) days.push(w);
    d = stepWeekday(d, 1);
  }
  if(days.length===0) return null;
  const rainyCount = days.filter(w=>needsUmbrella(w)).length;
  const avgMax = Math.round(days.reduce((s,w)=>s+w.tmax,0) / days.length);
  const windyCount = days.filter(w=>w.windGustMax!=null && w.windGustMax>=35).length;

  if(LANG==="tr"){
    let txt;
    if(rainyCount===0) txt = `Önümüzdeki günler büyük ölçüde kuru geçecek, ortalama ${avgMax}° civarında.`;
    else if(rainyCount>=days.length-1) txt = `Önümüzdeki günler değişken ve çoğunlukla yağışlı, ortalama ${avgMax}° civarında.`;
    else txt = `Önümüzdeki günler değişken, ${rainyCount} gün yağış olasılığı yüksek, ortalama ${avgMax}° civarında.`;
    if(windyCount>0) txt += ` Bazı günlerde rüzgar hamleleri olabilir.`;
    return `🔭 ${txt}`;
  }
  let txt;
  if(rainyCount===0) txt = `Die kommenden Tage bleiben größtenteils trocken, im Schnitt um die ${avgMax}°.`;
  else if(rainyCount>=days.length-1) txt = `Die kommenden Tage werden unbeständig mit häufigerem Regen, im Schnitt um die ${avgMax}°.`;
  else txt = `Die kommenden Tage sind wechselhaft, an ${rainyCount} von ${days.length} Tagen ist Regen wahrscheinlich, im Schnitt um die ${avgMax}°.`;
  if(windyCount>0) txt += ` An manchen Tagen ist mit böigem Wind zu rechnen.`;
  return `🔭 ${txt}`;
}

function weatherFeelsLikeText(w){
  if(!w || w.appTmax==null || w.appTmin==null) return null;
  if(LANG==="tr"){
    return `🌡️ Hissedilen sıcaklık: ${w.appTmin}° / ${w.appTmax}°`;
  }
  return `🌡️ Gefühlte Temperatur: ${w.appTmin}° / ${w.appTmax}°`;
}

function weatherHumidityText(w){
  if(!w || w.humidity==null) return null;
  if(LANG==="tr"){
    return `💧 Nem oranı: %${w.humidity}`;
  }
  return `💧 Luftfeuchtigkeit: ${w.humidity}%`;
}

function weatherNarrativeParts(dateStr){
  const w = weatherByDate[dateStr];
  if(!w) return null;
  let mainText;
  if(LANG==="tr"){
    if(w.morning && w.afternoon){
      mainText = `Sabah ${tempDescText(w.morning.temp)} (${Math.round(w.morning.temp)}°), öğleden sonra ${tempDescText(w.afternoon.temp)}, ${Math.round(w.afternoon.temp)}° civarı. Gökyüzü: ${weatherCloudText(w.code)}.`;
    }else{
      mainText = `Gün içinde ${w.tmin}° ile ${w.tmax}° arası. Gökyüzü: ${weatherCloudText(w.code)}.`;
    }
    const umbrellaText = needsUmbrella(w) ? `☂️ Şemsiye alın${w.precipProbMax!=null?` (yağış olasılığı %${w.precipProbMax})`:""}.` : `☂️ Şemsiyeye muhtemelen gerek yok.`;
    const windText = (w.windGustMax!=null && w.windGustMax>=35) ? `💨 Rüzgar hamleleri ${w.windGustMax} km/s'e kadar.` : null;
    const sunriseText = w.sunrise ? `🌅 Gün doğumu: ${formatHM(w.sunrise)}` : null;
    const sunsetText = w.sunset ? `🌇 Gün batımı: ${formatHM(w.sunset)}` : null;
    return {mainText, umbrellaText, windText, sunriseText, sunsetText};
  }
  if(w.morning && w.afternoon){
    mainText = `Am Morgen ${tempDescText(w.morning.temp)} (${Math.round(w.morning.temp)}°), am Nachmittag ${tempDescText(w.afternoon.temp)}, um die ${Math.round(w.afternoon.temp)}°. Himmel: ${weatherCloudText(w.code)}.`;
  }else{
    mainText = `Tagsüber zwischen ${w.tmin}° und ${w.tmax}°. Himmel: ${weatherCloudText(w.code)}.`;
  }
  const umbrellaText = needsUmbrella(w) ? `☂️ Regenschirm einpacken${w.precipProbMax!=null?` (Regenwahrscheinlichkeit ${w.precipProbMax}%)`:""}.` : `☂️ Regenschirm vermutlich nicht nötig.`;
  const windText = (w.windGustMax!=null && w.windGustMax>=35) ? `💨 Böiger Wind, Böen bis ${w.windGustMax} km/h.` : null;
  const sunriseText = w.sunrise ? `🌅 Sonnenaufgang: ${formatHM(w.sunrise)} Uhr` : null;
  const sunsetText = w.sunset ? `🌇 Sonnenuntergang: ${formatHM(w.sunset)} Uhr` : null;
  return {mainText, umbrellaText, windText, sunriseText, sunsetText};
}

function pollenSectionHtml(dayKeyStr){
  if(pollenError) return "";
  const day = pollenByDate[dayKeyStr];
  if(!day) return "";
  const relevant = POLLEN_TYPES.filter(p => day[p.key] != null && (p.key === "grass_pollen" || day[p.key] > 0.5));
  const grassMissing = day.grass_pollen == null;
  if(!relevant.length && !grassMissing) return `<p class="weather-line weather-line-pollen">🌸 ${t("pollenNone")}</p>`;
  const LEVEL_LABEL = {
    low:    LANG==="tr" ? "düşük" : "niedrig",
    medium: LANG==="tr" ? "orta" : "mittel",
    high:   LANG==="tr" ? "yüksek" : "hoch"
  };
  const LEVEL_CLASS = { low:"pollen-low", medium:"pollen-medium", high:"pollen-high" };
  const itemsHtml = relevant.map(p=>{
    const level = pollenLevel(day[p.key]);
    const label = LANG==="tr" ? p.labelTr : p.labelDe;
    return `<span class="pollen-chip ${LEVEL_CLASS[level]}">${escapeHtml(label)}: ${LEVEL_LABEL[level]}</span>`;
  }).join("");
  const grassLabel = LANG==="tr" ? "Çimen" : "Gräser";
  const grassFallbackHtml = grassMissing ? `<span class="pollen-chip pollen-low">${escapeHtml(grassLabel)}: ${t("pollenNoData")}</span>` : "";
  return `
    <div class="weather-line weather-line-pollen">
      <div class="pollen-title">🌸 ${t("pollenTitle")}</div>
      <div class="pollen-chips-row">${itemsHtml}${grassFallbackHtml}</div>
    </div>
  `;
}

async function showRankTitlePopup(elId, name, field, titlesArr){
  const el = document.getElementById(elId);
  if(!el) return;
  try{
    const allData = await cloudStore.listAll();
    let count = 0;
    const STAT_START = "2026-09-07";
    const todayKeyStr = dateKey(startOfToday());
    Object.keys(allData).forEach(key=>{
      if(!key.startsWith("tag_")) return;
      const dateStr = key.slice(4).replace(/_/g, "-");
      // Nur wirklich abgeschlossene Tage zählen — heute und im Voraus eingetragene Tage in der
      // Zukunft dürfen den Rang noch nicht erhöhen, sonst zeigt das Popup einen Rang, den man
      // noch gar nicht erreicht hat.
      if(dateStr < STAT_START || dateStr >= todayKeyStr) return;
      const d = allData[key];
      if(d && d[field] && Array.isArray(d[field].people) && d[field].people.includes(name)) count++;
    });
    const titleObj = getRankTitle(count, titlesArr, name);
    if(!titleObj) return;
    const nameColor = PERSON_COLORS[name] || "#999";
    const sentence = LANG === "tr" ? `${name} ${titleObj.label}` : `${name} ${titleObj.article} ${titleObj.label}`;
    el.innerHTML = `<span style="color:${nameColor};">${titleObj.emoji} ${escapeHtml(sentence)}</span>`;
    el.classList.remove("rank-title-popup-show");
    void el.offsetWidth;
    el.classList.add("rank-title-popup-show");
    setTimeout(()=>{ el.classList.remove("rank-title-popup-show"); el.innerHTML = ""; }, 2400);
  }catch(e){ /* stille Fehlschlag, keine Animation ist kein Beinbruch */ }
}

let suppressScrollRestore = false;
// Hält die Bildlaufposition über mehrere Frames hinweg fest, statt nur einmal. Bei Bereichen mit
// viel Inhalt (Fotos, die noch laden, Textfelder, die sich automatisch vergrößern) kann der
// ungewollte Sprung sonst erst ein paar Frames später passieren, nachdem die einmalige Korrektur
// schon vorbei war.
function holdScrollPosition(y, frames){
  window.scrollTo(0, y);
  if(frames > 0) requestAnimationFrame(()=> holdScrollPosition(y, frames - 1));
}
function jumpToChipTarget(key){
  suppressScrollRestore = true; // hier soll renderGlobalPanel() die Bildlaufposition NICHT zurücksetzen, wir scrollen ja bewusst weiter
  const scrollTo = (id)=>{
    const el = document.getElementById(id);
    if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
  };
  if(key === "events"){
    renderDay();
    scrollTo("eventsAnchor");
  }else if(key === "sick"){
    // WICHTIG: anders als bei den meisten anderen Zielen hier zuerst renderDay() aufrufen — sonst
    // kann sickAnchor im DOM (noch) fehlen, scrollIntoView passiert dann einfach gar nicht, und es
    // sieht so aus, als würde "falsch" zu einem Nachbarbereich (z.B. Dua) gesprungen, obwohl in
    // Wirklichkeit gar nichts gescrollt wurde.
    renderDay();
    scrollTo("sickAnchor");
  }else if(key === "notices"){
    renderDay();
    scrollTo("noticesAnchor");
  }else if(key === "dua"){
    duaOpen = true;
    renderDay();
    scrollTo("duaToggleLabel");
  }else if(key === "exceptions"){
    exceptionsOpen = true;
    renderDay();
    scrollTo("exceptionsToggleLabel");
  }else if(key === "eltern"){
    elternOpen = true;
    renderDay();
    scrollTo("elternToggleLabel");
  }else if(key === "remarkEflin" || key === "remarkNezir"){
    const kidKey = key === "remarkEflin" ? "eflin" : "nezir";
    if(kidKey==="eflin") remarkEflinOpen = true; else remarkNezirOpen = true;
    const todayEntry = getWeekdayShortList()[startOfToday().getDay()-1];
    const activeIdx = todayEntry ? globalData.remarks[kidKey].findIndex(r=>r.days.includes(todayEntry.k)) : -1;
    if(activeIdx>-1){
      const ek = kidKey+"_"+activeIdx;
      expandedRemarks.add(ek);
      remarkEditMode.delete(ek); // in der Leseansicht öffnen, nicht im Bearbeitungsmodus
    }
    renderGlobalPanel();
    scrollTo(kidKey==="eflin" ? "remarkEflinToggleLabel" : "remarkNezirToggleLabel");
  }else if(key === "extraPhotos"){
    extraPhotosOpen = true;
    renderGlobalPanel();
    scrollTo("extraPhotosToggleLabel");
  }else if(key === "weather"){
    weatherDetailOpen = true;
    renderGlobalPanel();
    scrollTo("weatherDetailToggleLabel");
  }else if(key === "wordGame"){
    wordGameOpen = true;
    syncWordGameLiveState().then(()=>{ renderGlobalPanel(); scrollTo("wordGameToggleLabel"); });
    return;
  }else if(key === "casino"){
    gameAreaOpen = true;
    renderGlobalPanel();
    scrollTo("gameAreaToggleLabel");
  }else if(key === "schoolDayCounter"){
    schoolDayCounterOpen = true;
    renderGlobalPanel();
    scrollTo("schoolDayCounterToggleLabel");
  }
}

function dayStatusChips(day){
  const chips = [];

  if(day.bring.people.length>0){
    chips.push({text:"🎒 "+t("bringt")+": " + day.bring.people.join(", "), tone:"ok"});
  }else{
    chips.push({text:t("bringerFehlt"), tone:"warn"});
  }

  if(day.abhol.people.length>0){
    chips.push({text:"🏡 "+t("holtAb")+": " + day.abhol.people.join(", "), tone:"ok"});
  }else{
    chips.push({text:t("holerFehlt"), tone:"warn"});
  }
  if(day.abhol.ownHomeIfNotPicked){
    chips.push({text:"⚠️ "+t("ownHomeIfNotPickedLabel"), tone:"alert"});
  }

  const selfTravel = day.readiness.child==="nezir" && day.readiness.transport;
  if(!day.readiness.child || (!day.readiness.time && !selfTravel)){
    chips.push({text:t("bereitFehlt"), tone:"warn"});
  }
  if(selfTravel){
    chips.push({text: day.readiness.transport==="bike" ? t("transportStatusBike") : t("transportStatusScooter"), tone:"alert"});
  }

  const hasException = day.exceptions.eflin.noBring || day.exceptions.eflin.noAbhol
    || day.exceptions.nezir.noBring || day.exceptions.nezir.noAbhol;
  if(hasException) chips.push({text:t("ausnahmeBeachten"), tone:"alert", key:"exceptions"});

  if(day.schoolEvents.length>0 || getMatchingSchoolYearEvents(dateKey(currentDate)).length>0) chips.push({text:"📅 "+t("terminVorhanden"), tone:"info", key:"events"});
  if(day.notices.length>0) chips.push({text:"📌 "+t("hinweisVorhanden"), tone:"info", key:"notices"});
  const duaHasNotice = day.dua.notices && day.dua.notices.some(n=>n.text && n.text.trim());
  if(day.dua.mustPickup) chips.push({text:"👶 "+t("duaBeachten"), tone:"alert", key:"dua"});
  // Eigener Chip für den Hinweistext — unabhängig davon, ob zusätzlich auch mustPickup aktiv ist.
  // Vorher wurde dieser Chip komplett unterdrückt, sobald mustPickup an war, wodurch ein
  // gleichzeitig eingetragener Hinweistext oben gar nicht mehr sichtbar war.
  if(duaHasNotice) chips.push({text:"👶 "+t("duaHinweisVorhanden"), tone:"info", key:"dua"});
  if(day.elternHinweise && day.elternHinweise.length>0) chips.push({text:t("elternHinzugefuegt"), tone:"info", key:"eltern"});

  if(day.extraPhotos && (day.extraPhotos.eflin.length>0 || day.extraPhotos.nezir.length>0 || day.extraPhotos.allgemein.length>0)){
    chips.push({text:"📸 "+t("extraPhotosVorhanden"), tone:"info", key:"extraPhotos"});
  }

  const todayWeekdayKey = getWeekdayShortList()[currentDate.getDay()-1] ? getWeekdayShortList()[currentDate.getDay()-1].k : null;
  if(todayWeekdayKey){
    const todayKeyStr = dateKey(currentDate);
    const isCancelled = r => r.days.includes(todayWeekdayKey) && Array.isArray(r.cancelledDates) && r.cancelledDates.includes(todayKeyStr);
    const isActiveCourse = r => r.days.includes(todayWeekdayKey) && !isCancelled(r);
    const eflinCancelled = globalData.remarks.eflin.some(isCancelled);
    const nezirCancelled = globalData.remarks.nezir.some(isCancelled);
    const eflinCourseToday = globalData.remarks.eflin.some(isActiveCourse);
    const nezirCourseToday = globalData.remarks.nezir.some(isActiveCourse);
    if(eflinCancelled) chips.push({text:t("kurstagEflin")+" — "+t("courseCancelledToday"), tone:"warn", key:"remarkEflin"});
    else if(eflinCourseToday) chips.push({text:t("kurstagEflin"), tone:"info", key:"remarkEflin"});
    if(globalData.remarks.eflin.some(r=>isActiveCourse(r) && r.otherPickupLocation)) chips.push({text:t("otherPickupWarning")+" (Eflin)", tone:"alert", key:"remarkEflin"});
    if(nezirCancelled) chips.push({text:t("kurstagNezir")+" — "+t("courseCancelledToday"), tone:"warn", key:"remarkNezir"});
    else if(nezirCourseToday) chips.push({text:t("kurstagNezir"), tone:"info", key:"remarkNezir"});
    if(globalData.remarks.nezir.some(r=>isActiveCourse(r) && r.otherPickupLocation)) chips.push({text:t("otherPickupWarning")+" (Nezir)", tone:"alert", key:"remarkNezir"});
  }

  return chips;
}

// Unterrichtsende: Mo-Do 15:30, Fr 14:00 — fix hinterlegt, da von der Schule so vorgegeben.
function schoolEndTimeForDate(date){
  return date.getDay()===5 ? {h:14,m:0} : {h:15,m:30};
}
function parseTimeToMinutes(str){
  if(!str) return null;
  const m = str.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  return Number(m[1])*60 + Number(m[2]);
}
let schoolCountdownTimer = null;
function stopSchoolCountdown(){
  if(schoolCountdownTimer){ clearInterval(schoolCountdownTimer); schoolCountdownTimer = null; }
}
function formatCountdown(totalMinutes){
  const h = Math.floor(totalMinutes/60), m = totalMinutes%60;
  return h>0 ? `${h} ${t("hoursShort")} ${m} ${t("minutesShort")}` : `${m} ${t("minutesShort")}`;
}
function renderSchoolCountdown(){
  stopSchoolCountdown();
  const box = document.getElementById("schoolCountdownBox");
  if(!box) return;
  const isToday = dateKey(currentDate) === dateKey(startOfToday());
  const isSchoolDay = computeSchoolDayInfo(currentDate).isSchoolDay;
  if(!isToday || !isSchoolDay){ box.innerHTML = ""; return; }

  const bringMin = parseTimeToMinutes(currentDay.bring.time);
  const abholMin = parseTimeToMinutes(currentDay.abhol.time);
  const end = schoolEndTimeForDate(currentDate);
  const endMin = end.h*60 + end.m;

  const tick = ()=>{
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
    if(bringMin==null || nowMin < bringMin){
      box.innerHTML = "";
      return;
    }
    if(abholMin!=null && nowMin >= abholMin){
      box.innerHTML = ""; // Abholzeit erreicht -> Bereich verschwindet komplett
      return;
    }
    let html = "";
    if(nowMin < endMin){
      const remain = Math.max(0, Math.ceil(endMin - nowMin));
      html += `<div class="school-countdown-row"><span class="school-countdown-icon">📚</span><div><div class="school-countdown-label">${t("countdownLessonEnd")}</div><div class="school-countdown-value">${formatCountdown(remain)}</div></div></div>`;
    }else{
      html += `<div class="school-countdown-row school-countdown-done"><span class="school-countdown-icon">🔔</span><div><div class="school-countdown-label">${t("countdownLessonOver")}</div></div></div>`;
    }
    if(abholMin!=null){
      const remain = Math.max(0, Math.ceil(abholMin - nowMin));
      html += `<div class="school-countdown-row"><span class="school-countdown-icon">🏡</span><div><div class="school-countdown-label">${t("countdownPickup")}</div><div class="school-countdown-value">${formatCountdown(remain)}</div></div></div>`;
    }
    box.innerHTML = html ? `<div class="school-countdown-box">${html}</div>` : "";
  };
  tick();
  schoolCountdownTimer = setInterval(tick, 1000);
}

let duaCountdownTimer = null;
function stopDuaCountdown(){
  if(duaCountdownTimer){ clearInterval(duaCountdownTimer); duaCountdownTimer = null; }
}
function renderDuaCountdown(){
  stopDuaCountdown();
  const box = document.getElementById("duaCountdownBox");
  if(!box) return;
  const isToday = dateKey(currentDate) === dateKey(startOfToday());
  if(!isToday || !currentDay.dua.mustPickup){ box.innerHTML = ""; return; }

  const wishMin = parseTimeToMinutes(currentDay.dua.wishTime);
  const byMin = parseTimeToMinutes(currentDay.dua.byTime);
  if(wishMin==null && byMin==null){ box.innerHTML = ""; return; }

  const tick = ()=>{
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
    if(nowMin < 8*60){ box.innerHTML = ""; return; } // startet erst ab 08:00, genau wie der Schul-Countdown erst ab der Bringzeit
    const lastMin = byMin!=null ? byMin : wishMin;
    if(nowMin >= lastMin){ box.innerHTML = ""; return; } // späteste (oder einzige) Zeit erreicht -> weg damit

    let html = "";
    if(wishMin!=null && nowMin < wishMin){
      const remain = Math.max(0, Math.ceil(wishMin - nowMin));
      html += `<div class="dua-countdown-row"><span class="dua-countdown-icon">👶</span><div><div class="dua-countdown-label">${t("countdownDuaWish")}</div><div class="dua-countdown-value">${formatCountdown(remain)}</div></div></div>`;
    }
    if(byMin!=null){
      const remain = Math.max(0, Math.ceil(byMin - nowMin));
      html += `<div class="dua-countdown-row"><span class="dua-countdown-icon">⏰</span><div><div class="dua-countdown-label">${t("countdownDuaLatest")}</div><div class="dua-countdown-value">${formatCountdown(remain)}</div></div></div>`;
    }
    box.innerHTML = html ? `<div class="dua-countdown-box">${html}</div>` : "";
  };
  tick();
  duaCountdownTimer = setInterval(tick, 1000);
}

      </div>

  `;
}

// Berechnet die Zieltage für "Krankenstand übertragen", abhängig vom gewählten Zeitraum.
// "nextday": nur morgen. "2days": heute + die folgenden 2 Tage (3 Tage insgesamt, heute wird
// dabei einfach nochmal mitgeschrieben — unschädlich). "week": von heute bis Freitag dieser
// Woche, geht NIE in die nächste Woche über, auch nicht am Montag.
function sickCopyTargetDates(fromDate, range){
  const dates = [];
  if(range === "nextday"){
    const d = new Date(fromDate); d.setDate(d.getDate()+1);
    dates.push(new Date(d));
  }else if(range === "2days"){
    for(let i=0;i<=2;i++){ const d = new Date(fromDate); d.setDate(d.getDate()+i); dates.push(d); }
  }else if(range === "week"){
    const dow = fromDate.getDay(); // 0=So,1=Mo,...,6=Sa
    if(dow>=1 && dow<=5){
      const daysUntilFriday = 5 - dow;
      for(let i=0;i<=daysUntilFriday;i++){ const d = new Date(fromDate); d.setDate(d.getDate()+i); dates.push(d); }
    }else{
      dates.push(new Date(fromDate)); // Wochenende: Randfall, nur der eine Tag
    }
  }
  return dates;
}
// Schreibt den Krankenstand-Status eines Kindes in die Cloud-Tagesobjekte der angegebenen Tage —
// lädt dafür jeden Tag einzeln (falls schon Daten existieren, bleiben die unangetastet, nur das
// sick-Feld wird ergänzt/überschrieben), damit nichts anderes auf diesen Tagen verloren geht.
async function copySickToDays(kid, dates, sickData){
  for(const d of dates){
    const ds = dateKey(d);
    const key = "tag:" + ds;
    let obj = {};
    try{
      const res = await cloudStore.get(key);
      obj = (res && res.value) ? JSON.parse(res.value) : {};
    }catch(e){ obj = {}; }
    obj.sick = Object.assign({eflin:{active:false,reason:"",endDate:""},nezir:{active:false,reason:"",endDate:""}}, obj.sick||{}, {[kid]: sickData});
    // Sind dadurch (bzw. schon vorher) beide Kinder an diesem Zukunftstag krank, auch dort eine
    // evtl. vorhandene Bring/Abhol-Eintragung entfernen — aus demselben Grund wie am aktuellen Tag.
    if(obj.sick.eflin.active && obj.sick.nezir.active){
      if(obj.bring) obj.bring.people = [];
      if(obj.abhol){ obj.abhol.people = []; obj.abhol.secondPeople = []; }
    }
    try{
      await cloudStore.set(key, JSON.stringify(obj));
    }catch(e){ /* best effort, einzelner Tag schlägt fehl ohne die anderen zu blockieren */ }
    // Falls genau der gerade angezeigte Tag mit betroffen ist (z.B. bei "2 Tage" ist das immer
    // der Fall), lokalen Stand synchron halten, damit kein zweiter Reload nötig ist.
    if(ds === dateKey(currentDate)) currentDay.sick[kid] = sickData;
  }
}

function getMatchingSchoolYearEvents(dk){

  return globalData.schoolYearEvents
    .map((e, idx)=>({e, idx}))
    .filter(({e})=>{
      if(!e.startDate) return false;
      const end = (e.hasEndDate && e.endDate) ? e.endDate : e.startDate;
      return dk >= e.startDate && dk <= end;
    });
}

function renderEventsList(){
  const day = currentDay;
  const wrap = document.getElementById("eventsList");
  const dk = dateKey(currentDate);
  const calendarEvents = getMatchingSchoolYearEvents(dk);
  const calendarHtml = calendarEvents.length>0 ? `
    <div class="cal-events-preview">
      ${calendarEvents.map(({e, idx})=>`
        <div class="cal-event-chip" data-gidx="${idx}">
          <div class="cal-event-chip-top">
            <span>📅 ${escapeHtml(e.text || t("noTitle")).replace(/\n/g, "<br>")}</span>
            <span class="cal-event-actions">
              <button type="button" class="cal-event-edit" data-gidx="${idx}">✏️ ${t("edit")}</button>
              <button type="button" class="cal-event-remove" data-gidx="${idx}">${t("remove")}</button>
            </span>
          </div>
          ${e.hasEndDate && e.endDate && e.endDate!==e.startDate ? `<span class="cal-event-time">🗓️ ${formatDateShort(e.startDate)} – ${formatDateShort(e.endDate)}</span>` : ""}
          ${e.hasTime && e.timeStart ? `<span class="cal-event-time">${e.timeStart}${e.hasEndTime&&e.timeEnd?"–"+e.timeEnd:""}</span>` : ""}
          ${e.location ? `<span class="cal-event-time">📍 ${escapeHtml(e.location)}</span>` : ""}
          ${e.kid ? `<span class="cal-event-kid" style="background:${KID_COLORS[e.kid]};">${e.kid==="eflin"?"E":"N"}</span>` : ""}
          ${e.photos && e.photos.length>0 ? `
            <div class="cal-event-photos">
              ${e.photos.map(p=>{
                const isPdf = /\.pdf$/i.test(p.name || p.url || "");
                const isVideo = /\.(mp4|mov|webm|m4v|avi)$/i.test(p.name || p.url || "");
                const thumbHtml = isVideo ? `<span class="photo-mini-thumb photo-mini-thumb-icon">🎥</span>` : (isPdf ? `<span class="photo-mini-thumb photo-mini-thumb-icon">📄</span>` : `<img class="photo-mini-thumb" src="${p.url}" alt="">`);
                return `<a href="${p.url}" target="_blank" rel="noopener" class="cal-event-photo-link" title="${escapeHtml(p.name||"")}">${thumbHtml}</a>`;
              }).join("")}
            </div>
          ` : ""}
        </div>
      `).join("")}
    </div>
  ` : "";
  const ownEventsHtml = day.schoolEvents.map((ev, idx)=>{
    const expanded = expandedSchoolEvents.has(idx);
    const timeLabel = ev.timeStart ? ` · ${ev.timeStart}${ev.hasEndTime&&ev.timeEnd?"–"+ev.timeEnd:""}` : "";
    const locLabel = ev.location ? ` · 📍 ${escapeHtml(ev.location)}` : "";
    const peopleLabel = ev.participants.length>0 ? ev.participants.join(", ") : "";
    const kidBadges = ev.kids.map(k=>`<span class="mini-summary-kid" style="background:${KID_COLORS[k]};">${k==="eflin"?"E":"N"}</span>`).join("");
    return `
    <div class="entry-card entry-mini" data-idx="${idx}">
      <div class="mini-summary-row">
        <div class="mini-summary-info">
          <div class="mini-summary-text">${escapeHtml(ev.name) || `<span class="mini-summary-empty">${t("noTitle")}</span>`}</div>
          <span class="mini-summary-meta">${peopleLabel}${timeLabel}${locLabel}</span>
          ${ev.photos.length ? evIconRowHtml(ev.photos) : ""}
          ${kidBadges ? `<span class="mini-summary-kids">${kidBadges}</span>` : ""}
        </div>
        <div class="mini-summary-actions">
          <button type="button" class="mini-edit-btn ev-edit">${expanded?t("done"):t("edit")}</button>
          <button type="button" class="remove-btn ev-remove">${t("remove")}</button>
        </div>
      </div>
      <div class="mini-detail" style="display:${expanded?"block":"none"};">
        <textarea class="ev-name autogrow" rows="1" placeholder="${t("placeholderEventName")}">${escapeHtml(ev.name)}</textarea>
        <div class="mini-time-row">
          ${selectHtml("evTimeStart"+idx, TIMES_15, ev.timeStart)}
          ${ev.hasEndTime ? `<span class="mini-time-sep">–</span>${selectHtml("evTimeEnd"+idx, TIMES_15, ev.timeEnd)}` : ""}
          <label class="mini-endtime-toggle"><input type="checkbox" class="ev-hasEndTime" ${ev.hasEndTime?"checked":""}> ${t("endTime")}</label>
        </div>
        <input type="text" class="ev-location mini-location" placeholder="${t("locEvent")}" value="${escapeHtml(ev.location)}">
        <div class="chips ev-chips mini-chips">${getActiveNames().map(n=>nameChipHtml(n, ev.participants.includes(n))).join("")}</div>
        <div class="chips ev-kid-chips mini-chips">${kidChips(ev.kids)}</div>
        ${photosHtml(ev.photos, true)}
      </div>
    </div>
  `;}).join("");
  wrap.innerHTML = calendarHtml + (ownEventsHtml || "");

  wrap.querySelectorAll(".cal-event-remove").forEach(btn=>{
    btn.onclick = ()=>{
      const gidx = Number(btn.dataset.gidx);
      if(!confirm(t("confirmRemoveCalendarEvent"))) return;
      globalData.schoolYearEvents.splice(gidx, 1);
      globalDirty = true;
      renderEventsList();
      renderDay();
    };
  });
  wrap.querySelectorAll(".cal-event-edit").forEach(btn=>{
    btn.onclick = ()=>{
      const gidx = Number(btn.dataset.gidx);
      const ev = globalData.schoolYearEvents[gidx];
      if(!ev) return;
      ferienOpen = true;
      selectedSchoolYearMonth = (ev.startDate||"").slice(0,7) || selectedSchoolYearMonth;
      expandedSchoolYearEntries.add(gidx);
      suppressScrollRestore = true; // sonst springt renderGlobalPanel() gleich wieder auf die alte Position zurück
      renderGlobalPanel();
      const target = document.getElementById("ferienToggleLabel");
      if(target && target.scrollIntoView) target.scrollIntoView({behavior:"smooth", block:"start"});
    };
  });

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const ev = day.schoolEvents[idx];
    card.querySelector(".ev-edit").onclick = ()=>{
      if(expandedSchoolEvents.has(idx)) expandedSchoolEvents.delete(idx);
      else expandedSchoolEvents.add(idx);
      renderEventsList();
    };
    card.querySelector(".ev-remove").onclick = ()=>{ day.schoolEvents.splice(idx,1); expandedSchoolEvents.delete(idx); renderEventsList(); markDirty(); refreshStatusChips(); };

function setKidChipColor(chip, kidKey, isSelected){
  chip.classList.toggle("selected", isSelected);
  if(isSelected){
    chip.style.background = KID_COLORS[kidKey];
    chip.style.borderColor = KID_COLORS[kidKey];
    chip.style.color = "#fff";
  }else{

    chip.style.color = "";
  }
}

// Türkische Ordnungszahl-Endung für ein Vielfaches von 10 (reicht für die Schultag-Meilensteine:
// 10, 20, 30 ... 100, 110 ... 200). Beispiel: 20 -> "20'nci", 30 -> "30'uncu", 100 -> "100'üncü".
const TR_ORDINAL_SUFFIX_BY_TENS = {1:"uncu", 2:"nci", 3:"uncu", 4:"ıncı", 5:"nci", 6:"ıncı", 7:"inci", 8:"inci", 9:"ıncı"};
// Türkische Possessiv-Endung ("-'in Rätsel") hängt vom letzten Vokal und davon ab, ob der Name
// auf einen Vokal endet — pro Name fest hinterlegt, da die App nur diese 6 Namen kennt.
const TR_POSSESSIVE_BY_NAME = {
  "Fırat":"Fırat'ın", "Ebru":"Ebru'nun", "Hande":"Hande'nin",
  "Ridvan":"Rıdvan'ın", "Murat":"Murat'ın", "Sevgi":"Sevgi'nin"
};
function turkishPossessive(name){ return TR_POSSESSIVE_BY_NAME[name] || (name + "'in"); }

function turkishOrdinal(n){
  if(n % 100 === 0) return n + "'üncü"; // yüzüncü, ikiyüzüncü, ...
  const tens = Math.floor((n % 100) / 10);
  return n + "'" + (TR_ORDINAL_SUFFIX_BY_TENS[tens] || "nci");
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function uploadPhoto(file, pathPrefix){
  if(!firebase.storage){
    throw new Error("Storage-SDK nicht geladen");
  }
  await authReady; // Storage braucht denselben Auth-Token wie die Datenbank
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${pathPrefix}/${Date.now()}_${safeName}`;
  const fileRef = firebase.storage().ref().child(path);

  const timeout = new Promise((_, reject)=>{
    setTimeout(()=> reject(new Error("Zeitüberschreitung — Storage evtl. nicht aktiviert")), 20000);
  });

  await Promise.race([fileRef.put(file), timeout]);
  const url = await Promise.race([fileRef.getDownloadURL(), timeout]);
  return { url, name: file.name };
}

function photosHtml(photos, mini, allowVideo){
  const acceptAttr = allowVideo ? "image/*,video/*" : "image/*,application/pdf";

          const thumbHtml = isVideo ? `<span class="photo-mini-thumb photo-mini-thumb-icon">🎥</span>` : (isPdf ? `<span class="photo-mini-thumb photo-mini-thumb-icon">📄</span>` : `<img class="photo-mini-thumb" src="${p.url}" alt="">`);

          📎
          <input type="file" accept="${acceptAttr}" multiple class="photo-input">

      <span class="photo-status"></span>

  }

        const isVideo = /\.(mp4|mov|webm|m4v|avi)$/i.test(p.name || p.url || "");
        return `
        <div class="photo-thumb" data-pidx="${i}">
          <a href="${p.url}" target="_blank" rel="noopener">${isVideo ? `<div class="pdf-thumb-icon">🎥<br>Video</div>` : (isPdf ? `<div class="pdf-thumb-icon">📄<br>PDF</div>` : `<img src="${p.url}" alt="">`)}</a>

    </label>

  `;

function bindPhotoWidget(card, photos, pathPrefix, rerender, dirtyFn){
  const markAsDirty = dirtyFn || markDirty;
  card.querySelectorAll(".photo-remove").forEach((btn, i)=>{
    btn.onclick = ()=>{ photos.splice(i,1); markAsDirty(); rerender(); };
  });
  card.querySelectorAll(".photo-name").forEach((inp, i)=>{
    inp.oninput = e=>{ photos[i].name = e.target.value; markAsDirty(); };
  });
  card.querySelectorAll(".photo-mini-remove").forEach((btn, i)=>{
    btn.onclick = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); photos.splice(i,1); markAsDirty(); rerender(); };
  });
  const fileInput = card.querySelector(".photo-input");
  const statusEl = card.querySelector(".photo-status");
  if(fileInput){
    fileInput.onchange = async (e)=>{
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      statusEl.textContent = "lädt hoch…";
      for(const file of files){
        try{
          const uploaded = await uploadPhoto(file, pathPrefix);
          photos.push(uploaded);
        }catch(err){
          statusEl.textContent = "Hochladen fehlgeschlagen (" + ((err && err.message) || "Fehler") + ")";
          return;
        }
      }
      markAsDirty();
      rerender();
    };
  }
}

/* ---------------- Design / Farbthemen ---------------- */
const THEME_KEY = "schulweg-theme";
const MANUAL_ACCENT_KEY = "schulweg-manual-accent";
const MANUAL_BG_KEY = "schulweg-manual-bg";

function hexToRgb(hex){
  hex = (hex||"#000000").replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16) || 0;
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHex(r,g,b){
  return "#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
}
function lightenHex(hex, amount){
  const {r,g,b} = hexToRgb(hex);
  return rgbToHex(r+(255-r)*amount, g+(255-g)*amount, b+(255-b)*amount);
}
function isLightColor(hex){
  const {r,g,b} = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.6;
}
function applyManualColors(accentHex, bgHex){
  const root = document.documentElement;
  const light = isLightColor(bgHex);
  root.style.setProperty("--paper", bgHex);
  root.style.setProperty("--paper-raised", lightenHex(bgHex, light?0.9:0.15));
  root.style.setProperty("--ink", light?"#2E2A22":"#F0ECE3");
  root.style.setProperty("--ink-soft", light?"#7A7364":"#A39C8C");
  root.style.setProperty("--line", lightenHex(bgHex, light?0.85:0.25));
  root.style.setProperty("--violet", accentHex);
  root.style.setProperty("--violet-soft", lightenHex(accentHex, 0.82));
  root.style.setProperty("--teal", accentHex);
  root.style.setProperty("--teal-soft", lightenHex(accentHex, 0.82));
}
const THEME_VARS = ["--paper","--paper-raised","--ink","--ink-soft","--line","--violet","--violet-soft","--teal","--teal-soft"];
function setTheme(name){
  const html = document.documentElement;
  if(name === "manual"){
    const accent = localStorage.getItem(MANUAL_ACCENT_KEY) || "#8B7FD9";
    const bg = localStorage.getItem(MANUAL_BG_KEY) || "#FFFDF8";
    html.setAttribute("data-theme", "manual");
    applyManualColors(accent, bg);
    const accentPicker = document.getElementById("themeAccentPicker");
    const bgPicker = document.getElementById("themeBgPicker");
    if(accentPicker) accentPicker.value = accent;
    if(bgPicker) bgPicker.value = bg;
    const row = document.getElementById("themeManualRow");
    if(row) row.style.display = "flex";
  }else{
    THEME_VARS.forEach(v=>html.style.removeProperty(v));
    if(name === "light") html.removeAttribute("data-theme");
    else html.setAttribute("data-theme", name);
    const row = document.getElementById("themeManualRow");
    if(row) row.style.display = "none";
  }
  localStorage.setItem(THEME_KEY, name);
  document.querySelectorAll(".theme-chip").forEach(chip=>{
    chip.classList.toggle("selected", chip.dataset.theme === name);
  });
}
function refreshThemeLabels(){
  const map = { themeLabelLight:"themeLight", themeLabelDark:"themeDark", themeLabelManual:"themeManual", themeAccentLabel:"themeAccent", themeBgLabel:"themeBg" };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = t(map[id]);
  });
}

function getByPath(obj, path){
  return path.reduce((o,k)=> (o && typeof o==="object") ? o[k] : undefined, obj);
}

function describeFieldChange(field, oldVal, newVal){
  const oldJson = JSON.stringify(oldVal===undefined?null:oldVal);
  const newJson = JSON.stringify(newVal===undefined?null:newVal);
  if(oldJson === newJson) return null;
  const label = field.label;
  if(field.type === "list"){
    const oldList = (Array.isArray(oldVal) && oldVal.length) ? oldVal.join(", ") : "niemand";
    const newList = (Array.isArray(newVal) && newVal.length) ? newVal.join(", ") : "niemand";
    return `${label} geändert: ${oldList} → ${newList}`;
  }
  if(field.type === "photo"){
    if(newVal && !oldVal) return `${label} hinzugefügt`;
    if(!newVal && oldVal) return `${label} entfernt`;
    return `${label} ausgetauscht`;
  }
  if(field.type === "array"){
    const oldLen = Array.isArray(oldVal) ? oldVal.length : 0;
    const newLen = Array.isArray(newVal) ? newVal.length : 0;
    if(newLen > oldLen) return `${label} hinzugefügt`;
    if(newLen < oldLen) return `${label} entfernt`;
    return `${label} bearbeitet`;
  }
  if(field.type === "bool"){
    return `${label} ${newVal ? "aktiviert" : "deaktiviert"}`;
  }
  if(field.type === "value"){
    const oldDisp = (oldVal===undefined||oldVal===null||oldVal==="") ? "leer" : oldVal;
    const newDisp = (newVal===undefined||newVal===null||newVal==="") ? "leer" : newVal;
    return `${label} geändert: ${oldDisp} → ${newDisp}`;
  }
  return `${label} geändert`;
}

function describeChanges(fields, oldObj, newObj){
  const changes = [];
  fields.forEach(f=>{
    const desc = describeFieldChange(f, getByPath(oldObj, f.path), getByPath(newObj, f.path));
    if(desc) changes.push(desc);
  });
  return changes;
}

  auditLoaded = true;
}

async function appendAuditLog(dayStr, changes){
  if(!changes || !changes.length) return;
  // Vor dem Schreiben immer den aktuellsten Stand aus der Cloud holen,
  // sonst überschreibt ein Gerät mit altem Stand die Einträge der anderen Geräte.
  try{
    const res = await cloudStore.get(AUDIT_KEY);
    auditLog = (res && res.value) ? JSON.parse(res.value) : [];
  }catch(e){ /* mit lokalem Stand weitermachen */ }
  auditLoaded = true;
  auditLog.push({ ts: Date.now(), day: dayStr, changes });
  if(auditLog.length > 300) auditLog = auditLog.slice(auditLog.length - 300);
  try{
    await cloudStore.set(AUDIT_KEY, JSON.stringify(auditLog));
  }catch(e){ /* Verlauf konnte nicht gespeichert werden — kein kritischer Fehler */ }
}

function mapsLinkHtml(address){
  if(!address || !address.trim()) return "";
  const trimmed = address.trim();
  // Wenn schon ein fertiger Link (z.B. aus Google Maps geteilt) oder Koordinaten eingefügt wurden,
  // direkt verwenden — sonst als Adress-Suche behandeln. So kann man auch einen frei gewählten
  // Punkt aus Google Maps speichern, nicht nur eine Adresse.
  const url = /^https?:\/\//i.test(trimmed)
    ? trimmed
    : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(trimmed);
  return `<a href="${url}" target="_blank" rel="noopener" class="rk-maps-link">🗺️ ${t("openInMaps")}</a>`;
}
// Liefert "eflin" oder "nezir", wenn genau dieses Kind heute einen aktiven (nicht abgesagten) Kurstag
// mit "Abholung anderer Standort" hat — sonst null. Wird für den zweiten Abholer gebraucht.
function courseOtherLocationChildToday(forDate){
  const dateObj = forDate || currentDate;
  const wd = getWeekdayShortList()[dateObj.getDay()-1];
  if(!wd) return null;
  const dk = dateKey(dateObj);
  const matches = kidKey => globalData.remarks[kidKey].some(r =>
    r.days.includes(wd.k) && r.otherPickupLocation && !(Array.isArray(r.cancelledDates) && r.cancelledDates.includes(dk))
  );
  if(matches("eflin")) return "eflin";
  if(matches("nezir")) return "nezir";
  return null;
}

  return { name:r.name||"", notes:r.notes||"", days:Array.isArray(r.days)?r.days:[], timeStart:r.timeStart||"", timeEnd:r.timeEnd||"", location:r.location||"", roomInfo:r.roomInfo||"", photos:normalizePhotos(r.photos), otherPickupLocation:!!r.otherPickupLocation, cancelledDates:Array.isArray(r.cancelledDates)?r.cancelledDates:[] };

function renderRemarksList(kidKey){
  const wrap = document.getElementById("remarks-"+kidKey);
  const list = globalData.remarks[kidKey];
  wrap.innerHTML = list.map((r,idx)=>remarkCardHtml(kidKey,r,idx)).join("") || `<p class="participant-hint">${t("noRemark")}</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const r = list[idx];
    const expandKey = kidKey+"_"+idx;

    card.querySelector(".rk-toggle").onclick = ()=>{
      if(expandedRemarks.has(expandKey)) expandedRemarks.delete(expandKey);
      else expandedRemarks.add(expandKey);
      renderRemarksList(kidKey);
    };
    card.querySelectorAll(".rk-remove").forEach(btn=>{
      btn.onclick = ()=>{
        if(!confirm(t("evConfirmDelete"))) return;
        list.splice(idx,1); expandedRemarks.delete(expandKey); remarkEditMode.delete(expandKey);
        renderRemarksList(kidKey); globalDirty = true; refreshStatusChips();
      };
    });

    const editBtn = card.querySelector(".rk-edit");
    if(editBtn) editBtn.onclick = ()=>{ remarkEditMode.add(expandKey); renderRemarksList(kidKey); };
    const doneBtn = card.querySelector(".rk-done");
    if(doneBtn) doneBtn.onclick = ()=>{ remarkEditMode.delete(expandKey); renderRemarksList(kidKey); };

    const cancelBtn = card.querySelector(".rk-cancel-toggle");
    if(cancelBtn) cancelBtn.onclick = ()=>{
      const dk = cancelBtn.dataset.datekey;
      const isCurrentDay = dk === dateKey(currentDate);
      // Vorher merken, ob für diesen Tag gerade ein zweites Abholer-Feld aktiv war (Kurs mit
      // anderem Standort) — nur relevant, wenn es sich um den aktuell angezeigten Tag handelt,
      // da wir sonst keinen geladenen Tagesobjekt für dk zur Hand haben.
      const wasOtherLocKid = isCurrentDay ? courseOtherLocationChildToday(currentDate) : null;
      const i = r.cancelledDates.indexOf(dk);
      if(i>-1) r.cancelledDates.splice(i,1); else r.cancelledDates.push(dk);
      globalDirty = true;
      renderRemarksList(kidKey);
      refreshStatusChips();
      if(isCurrentDay){
        const nowOtherLocKid = courseOtherLocationChildToday(currentDate);
        // Kurs gerade abgesagt (Feld verschwindet gleich): die Person, die eigentlich das
        // Kurs-Kind am anderen Standort abholen sollte, übernimmt jetzt die normale, einzelne
        // Abholung — die bisherige Hauptfeld-Person war nur die Notlösung für das andere Kind
        // während der Aufteilung und wird nicht mehr gebraucht.
        if(wasOtherLocKid && !nowOtherLocKid && (currentDay.abhol.secondPeople.length || currentDay.abhol.secondTime)){
          currentDay.abhol.people = currentDay.abhol.secondPeople.slice();
          currentDay.abhol.time = currentDay.abhol.secondTime;
          currentDay.abhol.secondPeople = [];
          currentDay.abhol.secondTime = "";
        }
        // Umgekehrter Fall: Kurs findet jetzt doch wieder statt, das zweite Feld taucht wieder auf.
        // Die Person im Hauptfeld war aber die normale Einzel-Abholung für BEIDE Kinder (galt noch
        // nicht für das andere Kind speziell) — die wird jetzt zurückgesetzt, damit bewusst neu
        // ausgewählt wird, wer das andere Kind (nicht das Kurs-Kind) abholt.
        if(!wasOtherLocKid && nowOtherLocKid){
          currentDay.abhol.people = [];
          currentDay.abhol.time = "";
        }
        renderDay();
      }
    };

    if(!remarkEditMode.has(expandKey)) return; // Leseansicht braucht keine weiteren Bindings

    const detail = card.querySelector(".mini-detail");
    if(!detail) return;
    detail.querySelector(".rk-title").oninput = e=>{ r.name = e.target.value; globalDirty = true; };
    detail.querySelector(".rk-notes").oninput = e=>{ r.notes = e.target.value; autoGrow(e.target); globalDirty = true; };
    detail.querySelector(`#rkStart${kidKey}${idx}`).onchange = e=>{ r.timeStart = e.target.value; globalDirty = true; };
    detail.querySelector(`#rkEnd${kidKey}${idx}`).onchange = e=>{ r.timeEnd = e.target.value; globalDirty = true; };
    detail.querySelector(".rk-location").oninput = e=>{
      r.location = e.target.value;
      globalDirty = true;
      const linkWrap = detail.querySelector(".rk-maps-link-wrap");
      if(linkWrap) linkWrap.innerHTML = mapsLinkHtml(r.location); // nur den Link aktualisieren, nicht die ganze Liste — sonst verliert das Feld beim Tippen den Fokus
    };
    detail.querySelector(".rk-room").oninput = e=>{ r.roomInfo = e.target.value; globalDirty = true; };
    detail.querySelector(".rk-other-pickup").onchange = e=>{ r.otherPickupLocation = e.target.checked; globalDirty = true; refreshStatusChips(); };
    detail.querySelectorAll(".rk-days .chip").forEach(chip=>{
      chip.onclick = ()=>{
        const d = chip.dataset.day;
        const i = r.days.indexOf(d);
        if(i>-1) r.days.splice(i,1); else r.days.push(d);
        globalDirty = true;
        renderRemarksList(kidKey);
        refreshStatusChips();
      };
    });
    bindPhotoWidget(detail, r.photos, `photos/global/${kidKey}${idx}`, ()=>renderRemarksList(kidKey), ()=>{globalDirty=true;});
  });
  initAutoGrow(wrap);
}

const NAME_GENDER = {"Fırat":"m", "Ebru":"f", "Hande":"f", "Ridvan":"m", "Murat":"m", "Sevgi":"f"};
// Türkçe belirtme hâli (-ı/-i/-u/-ü) — feste Namen der Familie, damit die Grammatik immer stimmt.
const NAME_ACCUSATIVE_TR = {"Fırat":"Fırat'ı", "Ebru":"Ebru'yu", "Hande":"Hande'yi", "Ridvan":"Ridvan'ı", "Murat":"Murat'ı", "Sevgi":"Sevgi'yi"};
const GRANDPARENT_LEVEL_STEP = 5;   // Murat & Sevgi steigen alle 5 statt alle 15 auf
const NORMAL_LEVEL_STEP = 15;
function getRankLevelIndex(count, titles, name){
  const isGrandparent = (name === "Murat" || name === "Sevgi");
  const effectiveCount = isGrandparent ? Math.round(count * (NORMAL_LEVEL_STEP / GRANDPARENT_LEVEL_STEP)) : count;
  let levelIdx = 0;
  titles.forEach((tier, idx)=>{ if(effectiveCount >= tier.threshold) levelIdx = idx; });
  return levelIdx;
}

function getRankTitle(count, titles, name){
  const isGrandparent = (name === "Murat" || name === "Sevgi");
  const effectiveCount = isGrandparent ? Math.round(count * (NORMAL_LEVEL_STEP / GRANDPARENT_LEVEL_STEP)) : count;
  let result = null;
  let levelIdx = 0;
  titles.forEach((tier, idx)=>{ if(effectiveCount >= tier.threshold){ result = tier; levelIdx = idx; } });
  if(!result) return null;
  const gender = NAME_GENDER[name] || "m";
  const isF = gender === "f";
  let label, article;
  if(LANG === "tr"){
    label = isF ? (result.tr_f || result.tr) : (result.tr_m || result.tr);
    article = "";
  }else{
    label = isF ? result.de_f : result.de_m;
    article = isF ? "die" : "der";
  }
  return { label, emoji: LEVEL_EMOJIS[levelIdx] || levelIdx, article };
}

// und Sprache/Tastatur. Türkisches İ/ı und I werden gleich behandelt, ebenso Ö/Ü/Ş/Ç/Ğ und O/U/S/C/G.
function normalizeWordGameText(str){
  return (str||"")
    .replace(/İ/g, "I").replace(/ı/g, "I")
    .toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Z0-9]/g, "");
}

function isWordGameLetter(ch){ return /\p{L}/u.test(ch); }

  4: new Date(2026, 8, 17), // Donnerstag

};
function getWeekIndex(date, weekday){
  const first = WORDGAME_FIRST_DATES[weekday] || WORDGAME_FIRST_DATES[1];

  return Math.floor(diffDays / 7);
}

function getPuzzleForDate(date, playerName){
  const dk = dateKey(date);
  const scheduled = DAILY_WORDGAME_SCHEDULE[dk];
  if(scheduled){
    const category = LANG==="tr" ? scheduled.catTr : scheduled.catDe;
    if(playerName && scheduled.words[playerName]){
      const pair = scheduled.words[playerName];
      const answer = (LANG==="tr" ? pair[1] : pair[0]).toUpperCase();
      return { category, answer };
    }
    return { category, answer: null }; // Kategorie schon bekannt, Wort erst nach Auswahl der Person
  }
  return getPuzzleForDateFallback(date);
}
function getPuzzleForDateFallback(date){
  const wd = date.getDay();
  let bank, catDe, catTr;
  if(wd===1){ bank=FILMS; catDe="Film"; catTr="Film"; }
  else if(wd===2){ bank=TIERE; catDe="Tier"; catTr="Hayvan"; }
  else if(wd===3){ bank=LAENDER; catDe="Land"; catTr="Ülke"; }
  else if(wd===4){ bank=STAEDTE; catDe="Stadt"; catTr="Şehir"; }
  else { bank=ESSEN; catDe="Essen"; catTr="Yemek"; }
  let idx = getWeekIndex(date, wd===0||wd===6 ? 5 : wd);
  idx = ((idx % bank.length) + bank.length) % bank.length;
  const entry = bank[idx];
  const answer = (LANG==="tr" ? entry[1] : entry[0]).toUpperCase();
  const category = LANG==="tr" ? catTr : catDe;
  return { category, answer };
}
function getTodayPuzzle(playerName){ return getPuzzleForDate(startOfToday(), playerName); }
const WORDGAME_MISSED_PENALTY = 30; // wie bei Zeitablauf/App-Wechsel während des Spiels
function maxHintsForDate(date, playerName){
  const puzzle = getPuzzleForDate(date, playerName);
  if(!puzzle.answer) return 0;
  return new Set(puzzle.answer.split("").filter(isWordGameLetter)).size;
}
function getWeekdayDatesInRange(fromDate, toDate){
  const dates = [];
  const d = new Date(fromDate);
  while(d <= toDate){
    const wd = d.getDay();
    if(wd>=1 && wd<=5) dates.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return dates;
}

// Zeitfenster für die Gewinner-Ankündigung: vom Hochladen des Fotos (üblicherweise letzter
// Tag des Monats) bis 23:00 am 1. Tag des Folgemonats. Danach verschwindet der Banner wieder.
function activeMonthlyPrizeKey(){
  const now = new Date();
  let best = null;
  Object.keys(globalData.monthlyPrizes).forEach(key=>{
    const prize = globalData.monthlyPrizes[key];
    if(!prize || !prize.photos || prize.photos.length===0) return; // nur wenn schon ein Foto hochgeladen wurde
    const m = key.match(/^(\d{4})-(\d{2})$/);
    if(!m) return;
    const y = Number(m[1]), mo = Number(m[2]);
    const monthStart = new Date(y, mo-1, 1, 0, 0, 0);
    const windowEnd = new Date(y, mo, 1, 23, 0, 0); // 1. des Folgemonats, 23:00
    if(now >= monthStart && now <= windowEnd){
      if(!best || key > best) best = key;
    }
  });
  return best;
}

async function computeMonthWinner(monthKeyStr){
  const m = monthKeyStr.match(/^(\d{4})-(\d{2})$/);
  if(!m) return null;
  const y = Number(m[1]), mo = Number(m[2]);
  let allData;
  try{ allData = await cloudStore.listAll(); }catch(e){ return null; }
  const counts = {};
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-");
    const dParts = dateStr.split("-").map(Number);
    if(dParts[0]!==y || dParts[1]!==mo) return;
    const dd = allData[key];
    if(!dd) return;
    if(dd.bring && Array.isArray(dd.bring.people)) dd.bring.people.forEach(n=>{ counts[n]=(counts[n]||0)+1; });
    if(dd.abhol && Array.isArray(dd.abhol.people)) dd.abhol.people.forEach(n=>{ counts[n]=(counts[n]||0)+1; });
    // Zweite Abholung (Kurstag mit anderem Standort) zählt genauso mit — die Person holt ja auch ab.
    if(dd.abhol && Array.isArray(dd.abhol.secondPeople)) dd.abhol.secondPeople.forEach(n=>{ counts[n]=(counts[n]||0)+1; });
    // Manuell gesplittete Abholung (z.B. krankes Kind) — jedes der beiden Felder zählt separat.
    if(dd.abhol && Array.isArray(dd.abhol.eflinPeople)) dd.abhol.eflinPeople.forEach(n=>{ counts[n]=(counts[n]||0)+1; });
    if(dd.abhol && Array.isArray(dd.abhol.nezirPeople)) dd.abhol.nezirPeople.forEach(n=>{ counts[n]=(counts[n]||0)+1; });
  });
  const names = Object.keys(counts);
  if(!names.length) return null;
  const winnerName = names.reduce((a,b)=> counts[b]>counts[a] ? b : a);
  return { name: winnerName, count: counts[winnerName] };
}

const RANK_UP_WINDOW_MS = 24 * 3600 * 1000; // Rückfallwert für ältere Events ohne expiresAt, siehe unten
// Der Titel wird immer erst ab Mitternacht vergeben: der auslösende Tag (an dem die entscheidende
// Abholung/Bringung stattfand) zählt erst ab dem darauffolgenden Mitternacht als abgeschlossen —
// und GENAU DANN (also am Tag NACH dem auslösenden Tag) wird der Rang-Aufstieg erkannt, ts liegt
// also immer schon einen Tag NACH dem eigentlichen Auslöser. Normalerweise wird das Banner dann
// für genau diesen einen Tag (ts' eigenen Kalendertag) gezeigt, von 00:01 bis 23:59. War der
// AUSLÖSENDE Tag ein Freitag, liegt ts an einem Samstag — dann soll es von Samstag 00:01 bis
// Montag 23:59 sichtbar bleiben (übers ganze Wochenende).
function rankUpBannerCalendarExpiry(ts){
  const d = new Date(ts);
  const extraDays = d.getDay() === 6 ? 2 : 0; // ts an einem Samstag (Auslöser war Freitag) -> bis Montag
  const nextDayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  nextDayStart.setDate(nextDayStart.getDate() + extraDays + 1); // Start des Folgetags = Ende des (verschobenen) Zieltags
  return nextDayStart.getTime();
}
// Immer frisch aus ts berechnen statt ein einmal gespeichertes expiresAt zu vertrauen — so
// wirkt eine spätere Korrektur der Formel auch rückwirkend auf schon gespeicherte Events,
// ohne dass man sie migrieren müsste. ts allein reicht, da die Formel rein davon abhängt.
function rankUpEventExpiry(e){ return e.ts ? rankUpBannerCalendarExpiry(e.ts) : (e.expiresAt || (Date.now()+RANK_UP_WINDOW_MS)); }

// Prüft, ob jemand seit dem letzten Check einen neuen Rang beim Bringen oder Abholen erreicht hat.
// Zählt nur wirklich abgeschlossene Tage (wie die Statistik-Seite), damit ein im Voraus
// eingetragener Tag noch keinen verfrühten Rang-Aufstieg auslöst.
async function checkForRankUps(){
  let allData;
  try{ allData = await cloudStore.listAll(); }catch(e){ return; }
  const STAT_START = "2026-09-07";
  const todayKeyStr = dateKey(startOfToday());
  const bringCounts = {}, abholCounts = {};
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-");
    if(dateStr < STAT_START || dateStr >= todayKeyStr) return;
    const d = allData[key];
    if(!d) return;
    if(d.bring && Array.isArray(d.bring.people)) d.bring.people.forEach(n=>{ bringCounts[n]=(bringCounts[n]||0)+1; });
    if(d.abhol && Array.isArray(d.abhol.people)) d.abhol.people.forEach(n=>{ abholCounts[n]=(abholCounts[n]||0)+1; });
    // Zweite Abholung (Kurstag mit anderem Standort) zählt genauso mit — die Person holt ja auch ab.
    if(d.abhol && Array.isArray(d.abhol.secondPeople)) d.abhol.secondPeople.forEach(n=>{ abholCounts[n]=(abholCounts[n]||0)+1; });
    if(d.abhol && Array.isArray(d.abhol.eflinPeople)) d.abhol.eflinPeople.forEach(n=>{ abholCounts[n]=(abholCounts[n]||0)+1; });
    if(d.abhol && Array.isArray(d.abhol.nezirPeople)) d.abhol.nezirPeople.forEach(n=>{ abholCounts[n]=(abholCounts[n]||0)+1; });
  });

  const allNames = NAMES_BASE.concat(GRANDPARENT_NAMES);
  let changed = false;
  [
    ["bring", bringCounts, BRING_TITLES],
    ["abhol", abholCounts, ABHOL_TITLES]
  ].forEach(([field, counts, titles])=>{
    allNames.forEach(name=>{
      const level = getRankLevelIndex(counts[name]||0, titles, name);
      const known = globalData.lastKnownRanks[field][name];
      if(known === undefined){
        // Erster Check überhaupt für diese Person/Kategorie — nur Basiswert merken,
        // kein Banner für längst erreichte alte Ränge.
        globalData.lastKnownRanks[field][name] = level;
        changed = true;
      }else if(level > known){
        globalData.rankUpEvents.push({ name, field, level, count: counts[name]||0, ts: Date.now() });
        globalData.lastKnownRanks[field][name] = level;
        changed = true;
      }
    });
  });

  if(changed){
    globalData.rankUpEvents = globalData.rankUpEvents.filter(e => Date.now() < rankUpEventExpiry(e));
    try{ await cloudStore.set(GLOBAL_KEY, JSON.stringify(globalData)); }catch(e){ /* nicht kritisch, nächster Check versucht es wieder */ }
    renderRankUpBanners();
  }
}

// Einfachere, iOS-verträglichere Sperre: nur overflow:hidden statt body zu verschieben.
// Die vorherige position:fixed-Variante hat auf iOS mit der dynamischen Adressleiste
// kollidiert und dadurch den X-Knopf manchmal aus dem sichtbaren Bereich gedrückt.
function lockBodyScrollForQuickJump(){
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
}
function unlockBodyScrollForQuickJump(){
  document.documentElement.style.overflow = "";
  document.body.style.overflow = "";
}

// Universeller Foto-Viewer: ersetzt das bloße "in neuem Tab öffnen" an allen Foto-Stellen der App.
// Zeigt das Bild groß mit einem Teilen-Knopf, der auf dem iPhone direkt den nativen Share-Sheet
// öffnet — "Bild sichern" steht dort schon bereit, kein Wissen über Lange-Drücken nötig.
let photoViewerCurrentUrl = "";
function openPhotoViewer(url){
  const overlay = document.getElementById("photoViewerOverlay");
  const img = document.getElementById("photoViewerImg");
  if(!overlay || !img) return;
  photoViewerCurrentUrl = url;
  img.src = url;
  overlay.style.display = "flex";
}
function closePhotoViewer(){
  const overlay = document.getElementById("photoViewerOverlay");
  if(overlay) overlay.style.display = "none";
  const img = document.getElementById("photoViewerImg");
  if(img) img.src = "";
}
async function sharePhotoViewerImage(){
  if(!photoViewerCurrentUrl) return;
  try{
    const resp = await fetch(photoViewerCurrentUrl);
    const blob = await resp.blob();
    const fileName = "foto." + (blob.type.split("/")[1] || "jpg");
    const file = new File([blob], fileName, {type: blob.type || "image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
      return;
    }
  }catch(e){ /* fällt unten auf den einfachen Tab-Öffner zurück */ }
  // Kein Share-Sheet verfügbar (z.B. Desktop-Browser) — Bild wenigstens in neuem Tab öffnen,
  // dort funktioniert Rechtsklick/Lange-Drücken zum Speichern wie gewohnt.
  window.open(photoViewerCurrentUrl, "_blank", "noopener");
}
document.getElementById("photoViewerBackdrop").onclick = closePhotoViewer;
document.getElementById("photoViewerCloseBtn").onclick = closePhotoViewer;
document.getElementById("photoViewerShareBtn").onclick = sharePhotoViewerImage;

let slotRedemptionsAdmin = []; // [{id, name, coinsSpent, couponsGained, ts}]
let slotAdminGrantMsg = "";
const SLOT_ADMIN_GRANT_AMOUNT = 10;
// Admin kann jeder Person direkt Jetons gutschreiben (z.B. als kleines Extra) — fließt in denselben
// Topf wie Gewinne, zählt also auch für die ewige Bestenliste mit.
async function adminGrantSlotCoins(name){
  try{
    const res = await cloudStore.get(SLOT_COINS_KEY);
    const data = (res && res.value) ? JSON.parse(res.value) : {};
    const personData = data[name] || {coins:0, coupons:0, lifetimeCoins:0, lifetimeCoupons:0};
    personData.coins = (personData.coins||0) + SLOT_ADMIN_GRANT_AMOUNT;
    personData.lifetimeCoins = (personData.lifetimeCoins||0) + SLOT_ADMIN_GRANT_AMOUNT;
    await cloudStore.setChild(SLOT_COINS_KEY, name, personData);
    // Lokalen Stand auch aktualisieren, falls gerade im Casino-Bereich offen.
    slotMachineCoins[name] = personData.coins;
    slotMachineLifetimeCoins[name] = personData.lifetimeCoins;
    slotAdminGrantMsg = `✓ ${name}: +${SLOT_ADMIN_GRANT_AMOUNT} 🪙`;
  }catch(e){
    slotAdminGrantMsg = t("statusSaveFailed") + ((e&&e.message)||"");
  }
  renderWordGameAdminBody();
}
// Admin kann einer Person stattdessen auch 10 zusätzliche Drehungen für heute schenken (statt
// Jetons) — über denselben "schon benutzt verringern"-Trick wie beim 🎁-Bonussymbol.
async function adminGrantSlotSpins(name){
  const todayStr = dateKey(startOfToday());
  try{
    const res = await cloudStore.get(slotSpinsUsedKey(todayStr));
    const data = (res && res.value) ? JSON.parse(res.value) : {};
    // Kein Math.max(0,...) — derselbe Fehler wie bei der Tagesspiel-Belohnung: ohne das würde ein
    // Bonus verloren gehen, wenn heute noch gar nichts gedreht wurde.
    const newUsed = (data[name]||0) - SLOT_ADMIN_GRANT_AMOUNT;
    data[name] = newUsed;
    slotSpinsUsedToday[name] = newUsed;
    await cloudStore.setChild(slotSpinsUsedKey(todayStr), name, newUsed);
    slotAdminGrantMsg = `✓ ${name}: +${SLOT_ADMIN_GRANT_AMOUNT} 🎟️`;
  }catch(e){
    slotAdminGrantMsg = t("statusSaveFailed") + ((e&&e.message)||"");
  }
  renderWordGameAdminBody();
}
async function loadSlotRedemptionsAdmin(){
  try{
    const res = await cloudStore.get(SLOT_REDEMPTIONS_KEY);
    const data = (res && res.value) ? JSON.parse(res.value) : {};
    slotRedemptionsAdmin = Object.keys(data).map(id=>Object.assign({id}, data[id])).sort((a,b)=>b.ts-a.ts);
  }catch(e){ slotRedemptionsAdmin = []; }
  renderWordGameAdminBody();
}
async function markSlotRedemptionHandled(id){
  const entry = slotRedemptionsAdmin.find(r=>r.id===id);
  if(entry){
    // Die AKTUELLEN (nicht die lebenslangen) Kupons dieser Person um genau die Anzahl verringern,
    // die bei dieser Einlösung gutgeschrieben wurde — die lebenslange Summe bleibt unangetastet,
    // die zählt für die Bestenliste weiter. Admin-Bereich ist ein eigener Ladekontext, deshalb
    // hier den aktuellsten Stand frisch aus der Cloud holen statt dem evtl. veralteten lokalen.
    try{
      const res = await cloudStore.get(SLOT_COINS_KEY);
      const data = (res && res.value) ? JSON.parse(res.value) : {};
      const personData = data[entry.name] || {coins:0, coupons:0, lifetimeCoins:0, lifetimeCoupons:0};
      personData.coupons = Math.max(0, (personData.coupons||0) - entry.couponsGained);
      await cloudStore.setChild(SLOT_COINS_KEY, entry.name, personData);
    }catch(e){ /* best effort — die Einlösung selbst wird unten trotzdem als erledigt entfernt */ }
  }
  try{ await cloudStore.deleteChild(SLOT_REDEMPTIONS_KEY, id); }catch(e){ /* best effort */ }
  slotRedemptionsAdmin = slotRedemptionsAdmin.filter(r=>r.id!==id);
  renderWordGameAdminBody();
}
