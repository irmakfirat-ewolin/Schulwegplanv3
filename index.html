<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulwegplan</title>
<style>
  :root{
    --paper:#FFFDF8;
    --paper-raised:#FFFFFF;
    --ink:#2E2A22;
    --ink-soft:#7A7364;
    --line:#EDE6D6;
    --amber:#F2A93B;
    --amber-soft:#FDECC9;
    --teal:#2E9E8F;
    --teal-soft:#D9F1EC;
    --brick:#EF6F5B;
    --brick-soft:#FDE1DA;
    --violet:#8B7FD9;
    --violet-soft:#EAE6FB;
    --pink:#EE7FA8;
    --pink-soft:#FCE3ED;
    --blue:#4FA3D1;
    --blue-soft:#DDF0FA;
    --tint-03:rgba(0,0,0,0.03);
    --tint-04:rgba(0,0,0,0.04);
    --tint-06:rgba(0,0,0,0.06);
    --tint-08:rgba(0,0,0,0.08);
    --tint-10:rgba(0,0,0,0.1);
    --tint-15:rgba(0,0,0,0.15);
    --tint-18:rgba(0,0,0,0.18);
    --pinkdark-bg:#F6BAD5;
    --pinkdark-border:#E85A93;
    --bluedark-bg:#A9D8EF;
    --bluedark-border:#2E86BE;
    --tone-ok-text:#1F6D5E;
    --tone-warn-text:#8A5A0F;
    --tone-alert-text:#A23F2C;
    --tone-info-text:#5A4FA0;
  }
  html[data-theme="dark"]{
    --paper:#1C1A17;
    --paper-raised:#26231F;
    --ink:#F0ECE3;
    --ink-soft:#A39C8C;
    --line:#3A3630;
    --amber:#F2A93B;
    --amber-soft:#4A3A1C;
    --teal:#3FBBA8;
    --teal-soft:#1D3B36;
    --brick:#F08872;
    --brick-soft:#4A2620;
    --violet:#A79AEE;
    --violet-soft:#2E2A4A;
    --pink:#F3A0C0;
    --pink-soft:#4A2836;
    --blue:#6FB8E0;
    --blue-soft:#1E3648;
    --pinkdark-bg:#5C2A42;
    --pinkdark-border:#B85C82;
    --bluedark-bg:#1C4258;
    --bluedark-border:#5CA0C4;
    --tone-ok-text:#7EE8CF;
    --tone-warn-text:#F7CB80;
    --tone-alert-text:#F7AB98;
    --tone-info-text:#CBBEF7;
    --tint-03:rgba(255,255,255,0.06);
    --tint-04:rgba(255,255,255,0.08);
    --tint-06:rgba(255,255,255,0.12);
    --tint-08:rgba(255,255,255,0.16);
    --tint-10:rgba(255,255,255,0.2);
    --tint-15:rgba(255,255,255,0.26);
    --tint-18:rgba(255,255,255,0.3);
  }
  html[data-theme="eflin"]{
    --paper:#F3DEF0;
    --paper-raised:#FDF3FB;
    --ink:#3A2A38;
    --ink-soft:#7D5E78;
    --line:#E4BEDC;
    --amber:#F2A93B;
    --amber-soft:#FDECC9;
    --teal:#2E9E8F;
    --teal-soft:#D9F1EC;
    --brick:#EF6F5B;
    --brick-soft:#FDE1DA;
    --violet:#A339BF;
    --violet-soft:#EAC3EA;
    --pink:#D93D80;
    --pink-soft:#F5B8D4;
    --blue:#4FA3D1;
    --blue-soft:#DDF0FA;
  }
  html[data-theme="nezir"]{
    --paper:#CFE6F4;
    --paper-raised:#F0F9FD;
    --ink:#16262F;
    --ink-soft:#4F6C7C;
    --line:#B7D9EC;
    --amber:#F2A93B;
    --amber-soft:#FDECC9;
    --teal:#2E9E8F;
    --teal-soft:#D9F1EC;
    --brick:#EF6F5B;
    --brick-soft:#FDE1DA;
    --violet:#3D6FCB;
    --violet-soft:#C3DBF5;
    --pink:#EE7FA8;
    --pink-soft:#FCE3ED;
    --blue:#0D6AAD;
    --blue-soft:#B9DDF2;
    --blue-soft:#CBE6F8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 92% 0%, var(--blue-soft) 0%, transparent 40%),
      radial-gradient(circle at 4% 8%, var(--pink-soft) 0%, transparent 35%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,h3,.rounded{font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;}
  header{
    padding:22px 18px 14px;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:2px solid var(--line);
  }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .title-row h1{ margin:0 0 4px; }
  header h1{
    margin:0 0 4px;
    font-size:29px;
    font-weight:700;
    color:var(--teal);
  }
  header p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .datebar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .datenav-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper-raised);
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  #dateInput{
    flex:1;
    font-family:-apple-system,system-ui,sans-serif;
    font-size:15px;
    font-weight:600;
    padding:9px 10px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .today-btn{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:13px;
    font-weight:600;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:10px;
    padding:0 14px;
    height:38px;
    cursor:pointer;
    flex-shrink:0;
  }
  .weekday-chip{
    font-family: ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:var(--ink-soft);
    border-radius:8px;
    padding:9px 10px;
    flex-shrink:0;
    min-width:30px;
    text-align:center;
  }
  .dateinfo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
  }
  .dateinfo-row .today-btn{margin-left:auto;}
  .controls-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    margin-top:8px;
  }
  .lang-btn{
    font-size:20px;
    background:none;
    border:2px solid transparent;
    border-radius:8px;
    padding:2px 4px;
    cursor:pointer;
    opacity:0.5;
  }
  .lang-btn.selected{opacity:1;border-color:var(--teal);}
  .theme-btn{
    font-size:18px;
    background:var(--paper-raised);
    border:2px solid var(--line);
    border-radius:20px;
    padding:5px 10px;
    cursor:pointer;
    margin-left:auto;
  }
  .theme-picker{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
    padding:10px;
    background:var(--paper-raised);
    border:2px solid var(--line);
    border-radius:12px;
  }
  .theme-chip{
    font-size:12.5px;
    font-weight:700;
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:16px;
    padding:6px 12px;
    cursor:pointer;
    color:var(--ink);
  }
  .theme-chip.selected{
    border-color:var(--teal);
    background:var(--teal-soft);
  }
  .theme-manual-row{
    display:flex;
    gap:14px;
    width:100%;
    margin-top:6px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .theme-manual-row label{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .theme-manual-row input[type=color]{
    width:34px;
    height:28px;
    border:2px solid var(--line);
    border-radius:8px;
    padding:0;
    cursor:pointer;
  }
  .weather-chip{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper-raised);
    border:2px solid var(--line);
    border-radius:20px;
    padding:5px 12px;
  }

  .school-photo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
  }
  .school-photo-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    font-size:20px;
    background:var(--paper-raised);
    border:2px solid var(--line);
    border-radius:12px;
    cursor:pointer;
  }
  .photo-check{
    position:absolute;
    top:-6px;
    right:-6px;
    background:var(--teal);
    color:#fff;
    width:16px;
    height:16px;
    border-radius:50%;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .school-photo-view{
    font-size:16px;
    text-decoration:none;
  }
  .school-photo-status{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .topsave-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .save-btn-top{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:9px;
    padding:6px 11px;
    cursor:pointer;
  }
  .topsave-status{
    font-size:12px;
    color:var(--ink-soft);
    flex:1;
  }
  .topsave-status.error{
    color:var(--brick);
    font-weight:700;
  }
  .reset-link{
    font-size:11.5px;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
    flex-shrink:0;
  }
  .weekday-badge{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:15px;
    font-weight:700;
  }
  main{padding:18px;max-width:560px;margin:0 auto;}

  .c-pink-dark{background:var(--pinkdark-bg) !important;border-color:var(--pinkdark-border) !important;}
  .c-blue-dark{background:var(--bluedark-bg) !important;border-color:var(--bluedark-border) !important;}

  .savebar{
    margin-top:10px;
  }
  .save-btn{
    width:100%;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:17px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:14px;
    padding:15px;
    cursor:pointer;
  }
  .save-btn:active{background:#267C70;}
  .save-btn-slim{
    width:auto;
    display:inline-block;
    font-size:13.5px;
    padding:8px 18px;
    border-radius:10px;
  }

  /* --- day panel --- */
  .daypanel h2.daytitle{
    font-size:27px;
    margin:0 0 6px;
    font-weight:700;
  }
  .day-status-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:16px;
  }
  .holiday-banner{
    background:var(--brick);
    color:#fff;
    font-weight:700;
    font-size:14px;
    padding:10px 14px;
    border-radius:12px;
    margin-bottom:14px;
  }
  .day-status-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    background:var(--line);
    color:var(--ink-soft);
    border:none;
    font-family:inherit;
  }
  button.day-status-chip{ cursor:pointer; }
  button.day-status-chip:active{ opacity:0.75; }
  .day-status-chip .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:currentColor;
    opacity:0.6;
  }
  .day-status-chip.tone-ok{background:var(--teal-soft);color:var(--tone-ok-text);}
  .day-status-chip.tone-warn{background:var(--amber-soft);color:var(--tone-warn-text);}
  .day-status-chip.tone-alert{background:var(--brick-soft);color:var(--tone-alert-text);}
  .day-status-chip.tone-info{background:var(--violet-soft);color:var(--tone-info-text);}
  section.field{
    margin-bottom:16px;
    padding:16px 16px 18px;
    border-radius:16px;
    border:2px solid var(--line);
  }
  .readiness-section{
    padding:10px 14px 12px !important;
    margin-bottom:12px !important;
  }
  .readiness-section .field-label{ margin-bottom:5px !important; }
  .readiness-section .chips{ margin-bottom:0 !important; }
  .field label.field-label{
    display:block;
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:10px;
  }
  section.field.c-amber{background:var(--amber-soft);border-color:#F3D796;}
  section.field.c-teal{background:var(--teal-soft);border-color:#AEE0D6;}
  section.field.c-blue{background:var(--blue-soft);border-color:#B7DCEE;}
  section.field.c-brick{background:var(--brick-soft);border-color:#F4C1B3;}
  section.field.c-violet{background:var(--violet-soft);border-color:#CBC1F2;}
  section.field.c-pink{background:var(--pink-soft);border-color:#F5BFD5;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{
    padding:8px 15px;
    border-radius:20px;
    border:2px solid var(--tint-08);
    background:var(--paper-raised);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .chip.selected{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  select, input[type=text]{
    font-family:-apple-system,system-ui,sans-serif;
    font-size:14.5px;
    padding:10px 10px;
    border-radius:10px;
    border:2px solid var(--tint-08);
    background:var(--paper-raised);
    color:var(--ink);
    width:100%;
  }
  textarea.autogrow{
    font-family:-apple-system,system-ui,sans-serif;
    font-size:14.5px;
    padding:10px 10px;
    border-radius:10px;
    border:2px solid var(--tint-08);
    background:var(--paper-raised);
    color:var(--ink);
    width:100%;
    resize:none;
    overflow:hidden;
    line-height:1.4;
  }
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .subrow{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    font-size:13.5px;
  }
  .subrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--brick);}
  .kidblock{
    background:var(--paper-raised);
    border:2px solid var(--tint-06);
    border-radius:12px;
    padding:12px 14px;
    margin-top:10px;
  }
  .kidblock .kidname{font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--brick);}
  .readiness-grid{display:flex;gap:10px;margin-top:2px;}
  .readiness-grid > div{flex:1;}
  .readiness-grid label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .exception-reason{margin-top:8px;}
  .dua-note{
    margin-top:10px;
    padding:10px 12px;
    background:var(--paper-raised);
    border:2px dashed var(--pink);
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    color:#B4527A;
  }
  .add-btn{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    background:var(--violet);
    border:none;
    border-radius:10px;
    padding:9px 14px;
    cursor:pointer;
    margin-top:4px;
  }
  .add-btn-slim{
    font-size:12px;
    padding:6px 12px;
  }
  .cal-events-preview{
    background:var(--tint-03);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .cal-event-chip{
    display:block;
    font-size:13px;
    font-weight:600;
    padding:7px 0;
    border-top:1px dashed var(--tint-08);
  }
  .cal-event-chip:first-child{ border-top:none; }
  .cal-event-chip-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .cal-event-remove{
    background:none;
    border:none;
    color:var(--brick);
    font-size:11px;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
  }
  .cal-event-time{
    display:inline-block;
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:400;
    margin-top:3px;
    margin-right:8px;
  }
  .cal-event-photos{
    margin-top:4px;
  }
  .cal-event-photo-link{
    display:inline-block;
    font-size:12px;
    color:var(--violet);
    text-decoration:underline;
    margin-right:10px;
  }
  .cal-event-kid{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;
    height:18px;
    border-radius:50%;
    color:#fff;
    font-size:10px;
    font-weight:800;
    margin-top:3px;
  }
  .entry-card{
    background:var(--paper-raised);
    border:2px solid var(--tint-06);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .entry-card .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .entry-card .field-label{
    margin-top:7px !important;
    margin-bottom:4px;
    font-size:11.5px !important;
  }
  .entry-card .chips{
    gap:5px;
    margin-bottom:4px;
  }
  .entry-card .chip{
    padding:5px 11px;
    font-size:12px;
  }
  .entry-card select,
  .entry-card input[type=text],
  .entry-card input[type=date],
  .entry-card textarea.autogrow{
    font-size:13px;
    padding:7px 9px;
  }
  .entry-card .row2{ gap:7px; }
  .entry-card .subrow{
    margin-top:6px;
    font-size:12px;
    gap:6px;
  }
  .entry-card .subrow input[type=checkbox]{ width:16px; height:16px; }
  .entry-card .photos-row{ gap:7px; margin-top:6px; }
  .entry-card .photo-thumb{ width:58px; }
  .entry-card .photo-thumb img,
  .entry-card .pdf-thumb-icon{ width:58px; height:58px; font-size:16px; }
  .entry-card .pdf-thumb-icon br + *{ font-size:9px; }
  .entry-card .photo-thumb .photo-name{ width:58px; font-size:9.5px; padding:3px 4px; }
  .entry-card .photo-add-btn{ margin-top:6px; padding:6px 10px; font-size:12px; }
  .entry-card .remove-btn{ font-size:12px; }
  .entry-mini{ padding:8px 10px; }
  .mini-top-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .mini-top-row textarea.autogrow{
    padding:5px 7px;
    font-size:13px;
  }
  .mini-top-row .remove-btn{ flex-shrink:0; padding-top:3px; }
  .mini-chips{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin:4px 0 0;
  }
  .mini-chips .chip{
    padding:3px 9px;
    font-size:11px;
  }
  .mini-time-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:5px;
    flex-wrap:wrap;
  }
  .mini-time-row select{
    width:auto;
    padding:4px 6px;
    font-size:12px;
  }
  .mini-time-sep{
    font-size:12px;
    color:var(--ink-soft);
  }
  .mini-endtime-toggle{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .mini-endtime-toggle input[type=checkbox]{
    width:14px;
    height:14px;
    accent-color:var(--brick);
  }
  .mini-location{
    margin-top:5px;
    padding:5px 7px !important;
    font-size:12px !important;
  }
  .photos-mini-row{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:5px;
  }
  .photo-mini-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--tint-04);
    border-radius:8px;
    padding:3px 6px 3px 8px;
    font-size:11px;
    color:var(--violet);
    text-decoration:none;
    max-width:140px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .photo-mini-remove{

// Nachgebautes storage-Objekt mit derselben Schnittstelle wie vorher (get/set/delete),

const cloudStore = {
  async get(key){
    const snap = await db.ref(key.replace(/:/g, "_")).once("value");
    if(snap.val() === null || typeof snap.val() === "undefined"){
      throw new Error("not found");
    }
    return { value: JSON.stringify(snap.val()) };
  },
  async set(key, valueStr){
    await db.ref(key.replace(/:/g, "_")).set(JSON.parse(valueStr));
    return { key, value: valueStr };
  },
  async delete(key){
    await db.ref(key.replace(/:/g, "_")).remove();
    return { key, deleted: true };
  },
  async listAll(){
    const snap = await db.ref().once("value");
    return snap.val() || {};
  }
};

// ---- Österreichische Feiertage (Wien) ----
function easterSunday(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, month-1, day);
}
function addDaysToDate(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function austrianHolidays(year){
  const easter = easterSunday(year);
  const fixed = [
    [0,1,"Neujahr"], [0,6,"Heilige Drei Könige"], [4,1,"Staatsfeiertag"],
    [7,15,"Mariä Himmelfahrt"], [9,26,"Nationalfeiertag"], [10,1,"Allerheiligen"],
    [11,8,"Mariä Empfängnis"], [11,25,"Christtag"], [11,26,"Stefanitag"]
  ];
  const map = {};
  fixed.forEach(([m,d,name])=>{ map[dateKey(new Date(year,m,d))] = name; });
  map[dateKey(addDaysToDate(easter,1))]  = "Ostermontag";
  map[dateKey(addDaysToDate(easter,39))] = "Christi Himmelfahrt";
  map[dateKey(addDaysToDate(easter,50))] = "Pfingstmontag";
  map[dateKey(addDaysToDate(easter,60))] = "Fronleichnam";
  return map;
}
let HOLIDAYS = {};
function refreshHolidays(year){
  HOLIDAYS = Object.assign({}, austrianHolidays(year-1), austrianHolidays(year), austrianHolidays(year+1));
}

function mergeDay(parsed){
  const day = emptyDay();
  day.bring = Object.assign({people:[],time:""}, parsed.bring||{});
  day.abhol = Object.assign({people:[],time:""}, parsed.abhol||{});
  day.bringPhoto = (parsed.bringPhoto && parsed.bringPhoto.url) ? {url:parsed.bringPhoto.url, name:parsed.bringPhoto.name||""} : {url:"",name:""};
  day.abholPhoto = (parsed.abholPhoto && parsed.abholPhoto.url) ? {url:parsed.abholPhoto.url, name:parsed.abholPhoto.name||""} : {url:"",name:""};
  day.lunchPhoto = (parsed.lunchPhoto && parsed.lunchPhoto.url) ? {url:parsed.lunchPhoto.url, name:parsed.lunchPhoto.name||""} : {url:"",name:""};
  const oldReadiness = parsed.readiness || {};
  if(typeof oldReadiness.child !== "undefined"){
    day.readiness = Object.assign({child:"",time:""}, oldReadiness);
  }else if(oldReadiness.eflin){
    day.readiness = {child:"eflin", time:oldReadiness.eflin};
  }else if(oldReadiness.nezir){
    day.readiness = {child:"nezir", time:oldReadiness.nezir};
  }
  day.exceptions = {
    eflin: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).eflin||{}),
    nezir: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).nezir||{})
  };
  day.dua = Object.assign({mustPickup:false,wishTime:"",byTime:"",notices:[],kindergartenEvents:[]}, parsed.dua||{});
  day.dua.notices = Array.isArray(day.dua.notices) ? day.dua.notices.map(normalizeDuaNotice) : [];
  day.dua.kindergartenEvents = Array.isArray(day.dua.kindergartenEvents) ? day.dua.kindergartenEvents.map(normalizeKindergartenEvent) : [];
  day.schoolEvents = Array.isArray(parsed.schoolEvents) ? parsed.schoolEvents.map(ev=>{
    const merged = Object.assign({name:"",timeStart:"",timeEnd:"",hasEndTime:false,location:"",participants:[],kids:[],photos:[]}, ev);
    if(!merged.timeStart && ev.time) merged.timeStart = ev.time; // altes Format "time" übernehmen
    merged.photos = normalizePhotos(merged.photos);
    return merged;
  }) : [];
  day.notices = Array.isArray(parsed.notices) ? parsed.notices.map(normalizeNotice) : [];
  day.elternHinweise = Array.isArray(parsed.elternHinweise) ? parsed.elternHinweise.map(normalizeElternHinweis) : [];
  return day;
}

function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");

}

function addDays(d, n){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+n);
  return nd;
}
function startOfToday(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}
function isWeekend(d){
  const wd = d.getDay();
  return wd===0 || wd===6;
}
function snapToWeekday(d){
  // Samstag/Sonntag überspringen, landet auf dem nächsten Montag
  const nd = new Date(d);
  if(nd.getDay()===6) nd.setDate(nd.getDate()+2);
  else if(nd.getDay()===0) nd.setDate(nd.getDate()+1);
  return nd;
}
function stepWeekday(d, direction){
  // einen Tag in Richtung "direction" (+1/-1), Wochenenden werden übersprungen
  const nd = new Date(d);
  do{
    nd.setDate(nd.getDate()+direction);
  }while(isWeekend(nd));
  return nd;
}

/* ---------------- Wetter (nächste 5 Tage) ---------------- */
const WEATHER_LAT = 48.135;   // Liesing, Wien
const WEATHER_LON = 16.283;
let weatherByDate = {};
let weatherError = "";

function weatherEmoji(code){
  if(code===0) return "☀️";
  if(code===1||code===2) return "🌤️";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if(code>=51&&code<=57) return "🌦️";
  if(code>=61&&code<=67) return "🌧️";
  if(code>=71&&code<=77) return "❄️";
  if(code>=80&&code<=82) return "🌦️";
  if(code>=85&&code<=86) return "🌨️";
  if(code>=95) return "⛈️";
  return "🌡️";
}

async function loadWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FVienna&forecast_days=7`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const days = data.daily;
    if(!days || !days.time) throw new Error("unerwartetes Datenformat");
    const map = {};
    days.time.forEach((dateStr, i)=>{
      map[dateStr] = {
        code: days.weather_code[i],
        tmax: Math.round(days.temperature_2m_max[i]),
        tmin: Math.round(days.temperature_2m_min[i])
      };
    });
    weatherByDate = map;
    weatherError = "";
  }catch(e){
    weatherError = (e && e.message) ? e.message : "unbekannter Fehler";
  }
  renderWeatherChip();
}

function renderWeatherChip(){
  const chip = document.getElementById("weatherChip");
  if(!chip) return;
  const diffDays = Math.round((currentDate - startOfToday()) / 86400000);
  const withinRange = diffDays>=0 && diffDays<=4;
  if(!withinRange){
    chip.style.display = "none";
    return;
  }
  const w = weatherByDate[dateKey(currentDate)];
  if(w){
    chip.textContent = `${weatherEmoji(w.code)} ${w.tmin}° / ${w.tmax}°`;
    chip.style.display = "inline-block";
  }else if(weatherError){
    chip.textContent = "Wetter nicht verfügbar (" + weatherError + ")";
    chip.style.display = "inline-block";
  }else{
    chip.style.display = "none";
  }
}

  }else{
    chips.push({text:t("bringerFehlt"), tone:"warn"});

  }else{
    chips.push({text:t("holerFehlt"), tone:"warn"});
  }

  if(!day.readiness.child || !day.readiness.time){
    chips.push({text:t("bereitFehlt"), tone:"warn"});
  }

  const hasException = day.exceptions.eflin.noBring || day.exceptions.eflin.noAbhol
    || day.exceptions.nezir.noBring || day.exceptions.nezir.noAbhol;
  if(hasException) chips.push({text:t("ausnahmeBeachten"), tone:"alert", key:"exceptions"});

  if(day.schoolEvents.length>0 || getMatchingSchoolYearEvents(dateKey(currentDate)).length>0) chips.push({text:t("terminVorhanden"), tone:"info", key:"events"});
  if(day.notices.length>0) chips.push({text:t("hinweisVorhanden"), tone:"info", key:"notices"});
  if(day.dua.mustPickup) chips.push({text:t("duaBeachten"), tone:"alert", key:"dua"});
  if(!day.dua.mustPickup && day.dua.notices && day.dua.notices.some(n=>n.text && n.text.trim())) chips.push({text:t("duaHinweisVorhanden"), tone:"info", key:"dua"});
  if(day.elternHinweise && day.elternHinweise.length>0) chips.push({text:t("elternHinzugefuegt"), tone:"info", key:"eltern"});

  const todayWeekdayKey = getWeekdayShortList()[currentDate.getDay()-1] ? getWeekdayShortList()[currentDate.getDay()-1].k : null;
  if(todayWeekdayKey){
    if(globalData.remarks.eflin.some(r=>r.days.includes(todayWeekdayKey))) chips.push({text:t("kurstagEflin"), tone:"info", key:"remarkEflin"});
    if(globalData.remarks.nezir.some(r=>r.days.includes(todayWeekdayKey))) chips.push({text:t("kurstagNezir"), tone:"info", key:"remarkNezir"});
  }

  return chips;
}

function getMatchingSchoolYearEvents(dk){
  if(!globalData.schoolYearEnabled) return [];
  return globalData.schoolYearEvents
    .map((e, idx)=>({e, idx}))
    .filter(({e})=>{
      if(!e.startDate) return false;
      const end = (e.hasEndDate && e.endDate) ? e.endDate : e.startDate;
      return dk >= e.startDate && dk <= end;
    });
}

  }else{

}

async function uploadPhoto(file, pathPrefix){
  if(!firebase.storage){
    throw new Error("Storage-SDK nicht geladen");
  }
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${pathPrefix}/${Date.now()}_${safeName}`;
  const fileRef = firebase.storage().ref().child(path);

  const timeout = new Promise((_, reject)=>{
    setTimeout(()=> reject(new Error("Zeitüberschreitung — Storage evtl. nicht aktiviert")), 20000);
  });

  await Promise.race([fileRef.put(file), timeout]);
  const url = await Promise.race([fileRef.getDownloadURL(), timeout]);
  return { url, name: file.name };
}

function bindPhotoWidget(card, photos, pathPrefix, rerender, dirtyFn){
  const markAsDirty = dirtyFn || markDirty;
  card.querySelectorAll(".photo-remove").forEach((btn, i)=>{
    btn.onclick = ()=>{ photos.splice(i,1); markAsDirty(); rerender(); };
  });
  card.querySelectorAll(".photo-name").forEach((inp, i)=>{
    inp.oninput = e=>{ photos[i].name = e.target.value; markAsDirty(); };
  });
  card.querySelectorAll(".photo-mini-remove").forEach((btn, i)=>{
    btn.onclick = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); photos.splice(i,1); markAsDirty(); rerender(); };
  });
  const fileInput = card.querySelector(".photo-input");
  const statusEl = card.querySelector(".photo-status");
  if(fileInput){
    fileInput.onchange = async (e)=>{
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      statusEl.textContent = "lädt hoch…";
      for(const file of files){
        try{
          const uploaded = await uploadPhoto(file, pathPrefix);
          photos.push(uploaded);
        }catch(err){
          statusEl.textContent = "Hochladen fehlgeschlagen (" + ((err && err.message) || "Fehler") + ")";
          return;
        }
      }
      markAsDirty();
      rerender();
    };
  }
}

    const ke = day.dua.kindergartenEvents[idx];
    card.querySelector(".dke-text").oninput = e=>{ ke.text = e.target.value; autoGrow(e.target); markDirty(); };
    card.querySelector(`#dkeStart${idx}`).onchange = e=>{ ke.timeStart = e.target.value; markDirty(); };
    card.querySelector(`#dkeEnd${idx}`).onchange = e=>{ ke.timeEnd = e.target.value; markDirty(); };
    card.querySelector(".dke-remove").onclick = ()=>{ day.dua.kindergartenEvents.splice(idx,1); renderDuaEventsList(); markDirty(); };
    bindPhotoWidget(card, ke.photos, `photos/${dateKey(currentDate)}/kindergarten${idx}`, renderDuaEventsList);
  });
  initAutoGrow(wrap);
}

function renderElternHinweiseList(){
  const day = currentDay;
  const wrap = document.getElementById("elternHinweiseList");
  wrap.innerHTML = day.elternHinweise.map((eh, idx)=>{
    const expanded = expandedElternHinweise.has(idx);
    const timeLabel = eh.timeStart ? ` · ${eh.timeStart}${eh.timeEnd?"–"+eh.timeEnd:""}` : "";
    const attachLabel = eh.photos.length>0 ? ` · 📎 ${eh.photos.length}` : "";
    return `
    <div class="entry-card entry-mini" data-idx="${idx}">
      <div class="mini-summary-row">
        <div class="mini-summary-info">
          ${eh.person ? `<span class="mini-summary-person" style="color:${PERSON_COLORS[eh.person]||'var(--ink)'};">👤 ${escapeHtml(eh.person)}</span>` : `<span class="mini-summary-person mini-summary-empty">${t("noPersonYet")}</span>`}
          <span class="mini-summary-meta">${timeLabel}${attachLabel}</span>
          ${eh.text ? `<div class="mini-summary-text">${escapeHtml(eh.text)}</div>` : ""}
        </div>
        <div class="mini-summary-actions">
          <button type="button" class="mini-edit-btn eh-edit">${expanded?t("done"):t("edit")}</button>
          <button type="button" class="remove-btn eh-remove">${t("remove")}</button>
        </div>
      </div>
      <div class="mini-detail" style="display:${expanded?"block":"none"};">
        <div class="chips eh-chips mini-chips">${getActiveNames().map(n=>nameChipHtml(n, eh.person===n)).join("")}</div>
        <textarea class="eh-text autogrow" rows="1" placeholder="${t("placeholderEltern")}">${escapeHtml(eh.text)}</textarea>
        <div class="mini-time-row">
          ${selectHtml("ehStart"+idx, TIMES_15, eh.timeStart)}
          <span class="mini-time-sep">–</span>
          ${selectHtml("ehEnd"+idx, TIMES_15, eh.timeEnd)}
        </div>
        ${photosHtml(eh.photos, true)}
      </div>
    </div>
  `;}).join("") || `<p class="participant-hint">${t("noEltern")}</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const eh = day.elternHinweise[idx];
    card.querySelector(".eh-edit").onclick = ()=>{
      if(expandedElternHinweise.has(idx)) expandedElternHinweise.delete(idx);
      else expandedElternHinweise.add(idx);
      renderElternHinweiseList();
    };
    card.querySelector(".eh-remove").onclick = ()=>{ day.elternHinweise.splice(idx,1); expandedElternHinweise.delete(idx); renderElternHinweiseList(); markDirty(); };
    const detail = card.querySelector(".mini-detail");
    if(!detail) return;
    detail.querySelectorAll(".eh-chips .chip").forEach(chip=>{
      chip.onclick = ()=>{
        eh.person = (eh.person === chip.dataset.name) ? "" : chip.dataset.name; // einzelne Person, erneutes Antippen hebt auf
        markDirty();
        renderElternHinweiseList();
      };
    });
    detail.querySelector(".eh-text").oninput = e=>{ eh.text = e.target.value; autoGrow(e.target); markDirty(); };
    detail.querySelector(`#ehStart${idx}`).onchange = e=>{ eh.timeStart = e.target.value; markDirty(); };
    detail.querySelector(`#ehEnd${idx}`).onchange = e=>{ eh.timeEnd = e.target.value; markDirty(); };
    bindPhotoWidget(detail, eh.photos, `photos/${dateKey(currentDate)}/eltern${idx}`, renderElternHinweiseList);
  });
  initAutoGrow(wrap);
}

/* ---------------- Design / Farbthemen ---------------- */
const THEME_KEY = "schulweg-theme";
const MANUAL_ACCENT_KEY = "schulweg-manual-accent";
const MANUAL_BG_KEY = "schulweg-manual-bg";

function hexToRgb(hex){
  hex = (hex||"#000000").replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16) || 0;
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHex(r,g,b){
  return "#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
}
function lightenHex(hex, amount){
  const {r,g,b} = hexToRgb(hex);
  return rgbToHex(r+(255-r)*amount, g+(255-g)*amount, b+(255-b)*amount);
}
function isLightColor(hex){
  const {r,g,b} = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.6;
}
function applyManualColors(accentHex, bgHex){
  const root = document.documentElement;
  const light = isLightColor(bgHex);
  root.style.setProperty("--paper", bgHex);
  root.style.setProperty("--paper-raised", lightenHex(bgHex, light?0.9:0.15));
  root.style.setProperty("--ink", light?"#2E2A22":"#F0ECE3");
  root.style.setProperty("--ink-soft", light?"#7A7364":"#A39C8C");
  root.style.setProperty("--line", lightenHex(bgHex, light?0.85:0.25));
  root.style.setProperty("--violet", accentHex);
  root.style.setProperty("--violet-soft", lightenHex(accentHex, 0.82));
  root.style.setProperty("--teal", accentHex);
  root.style.setProperty("--teal-soft", lightenHex(accentHex, 0.82));
}
const THEME_VARS = ["--paper","--paper-raised","--ink","--ink-soft","--line","--violet","--violet-soft","--teal","--teal-soft"];
function setTheme(name){
  const html = document.documentElement;
  if(name === "manual"){
    const accent = localStorage.getItem(MANUAL_ACCENT_KEY) || "#8B7FD9";
    const bg = localStorage.getItem(MANUAL_BG_KEY) || "#FFFDF8";
    html.setAttribute("data-theme", "manual");
    applyManualColors(accent, bg);
    const accentPicker = document.getElementById("themeAccentPicker");
    const bgPicker = document.getElementById("themeBgPicker");
    if(accentPicker) accentPicker.value = accent;
    if(bgPicker) bgPicker.value = bg;
    const row = document.getElementById("themeManualRow");
    if(row) row.style.display = "flex";
  }else{
    THEME_VARS.forEach(v=>html.style.removeProperty(v));
    if(name === "light") html.removeAttribute("data-theme");
    else html.setAttribute("data-theme", name);
    const row = document.getElementById("themeManualRow");
    if(row) row.style.display = "none";
  }
  localStorage.setItem(THEME_KEY, name);
  document.querySelectorAll(".theme-chip").forEach(chip=>{
    chip.classList.toggle("selected", chip.dataset.theme === name);
  });
}
function refreshThemeLabels(){
  const map = { themeLabelLight:"themeLight", themeLabelDark:"themeDark", themeLabelManual:"themeManual", themeAccentLabel:"themeAccent", themeBgLabel:"themeBg" };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = t(map[id]);
  });
}

const GLOBAL_KEY = "global:settings";
let globalData = { remarks:{eflin:[], nezir:[]}, grandparentsEnabled:false, schoolYearEnabled:false, schoolYearEvents:[], speiseplan:{url:"",name:""}, dokumente:[] };
let globalDirty = false;

function normalizeRemark(r){
  return { name:r.name||"", days:Array.isArray(r.days)?r.days:[], timeStart:r.timeStart||"", timeEnd:r.timeEnd||"", photos:normalizePhotos(r.photos) };
}

function normalizeSchoolYearEvent(e){
  return {
    startDate:e.startDate||"", hasEndDate:!!e.hasEndDate, endDate:e.endDate||"",
    hasTime:!!e.hasTime, timeStart:e.timeStart||"", hasEndTime:!!e.hasEndTime, timeEnd:e.timeEnd||"",
    kid:(e.kid==="eflin"||e.kid==="nezir")?e.kid:"", location:e.location||"",
    text:e.text||"", photos:normalizePhotos(e.photos)
  };
}

async function loadGlobalData(){
  try{
    const res = await cloudStore.get(GLOBAL_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      globalData.remarks = {
        eflin: Array.isArray(parsed.remarks && parsed.remarks.eflin) ? parsed.remarks.eflin.map(normalizeRemark) : [],
        nezir: Array.isArray(parsed.remarks && parsed.remarks.nezir) ? parsed.remarks.nezir.map(normalizeRemark) : []
      };
      globalData.grandparentsEnabled = !!parsed.grandparentsEnabled;
      globalData.schoolYearEnabled = !!parsed.schoolYearEnabled;
      globalData.schoolYearEvents = Array.isArray(parsed.schoolYearEvents) ? parsed.schoolYearEvents.map(normalizeSchoolYearEvent) : [];
      globalData.speiseplan = (parsed.speiseplan && parsed.speiseplan.url) ? {url:parsed.speiseplan.url, name:parsed.speiseplan.name||""} : {url:"",name:""};
      globalData.dokumente = Array.isArray(parsed.dokumente) ? parsed.dokumente.map(d=>({url:d.url||"", name:d.name||""})) : [];
    }
  }catch(e){ /* noch nichts gespeichert — Standardwerte bleiben */ }
  grandparentsEnabled = globalData.grandparentsEnabled;
  renderGlobalPanel();
  renderDay(); // damit z. B. der Speiseplan-Bereich im Tagesbereich die geladenen Daten zeigt
}

async function saveGlobalData(){
  const statusEl = document.getElementById("globalStatus");
  statusEl.textContent = t("statusSaving");
  try{
    await cloudStore.set(GLOBAL_KEY, JSON.stringify(globalData));
    globalDirty = false;
    statusEl.textContent = t("globalSaved");
  }catch(e){
    statusEl.textContent = t("globalSaveFailed") + ((e&&e.message)||"Fehler") + ")";
  }
}

function remarkCardHtml(kidKey, r, idx){
  const expandKey = kidKey+"_"+idx;
  const expanded = expandedRemarks.has(expandKey);
  const daysLabel = r.days.length>0 ? r.days.map(d=>{
    const w = getWeekdayShortList().find(x=>x.k===d);
    return w ? w.l : d;
  }).join(",") : "";
  const timeLabel = r.timeStart ? ` · ${r.timeStart}${r.timeEnd?"–"+r.timeEnd:""}` : "";
  const attachLabel = r.photos.length>0 ? ` · 📎 ${r.photos.length}` : "";
  return `
    <div class="entry-card entry-mini" data-kid="${kidKey}" data-idx="${idx}">
      <div class="mini-summary-row">
        <div class="mini-summary-info">
          <div class="mini-summary-text">${escapeHtml(r.name) || `<span class="mini-summary-empty">${t("noTitle")}</span>`}</div>
          <span class="mini-summary-meta">${daysLabel}${timeLabel}${attachLabel}</span>
        </div>
        <div class="mini-summary-actions">
          <button type="button" class="mini-edit-btn rk-edit">${expanded?t("done"):t("edit")}</button>
          <button type="button" class="remove-btn rk-remove">${t("remove")}</button>
        </div>
      </div>
      <div class="mini-detail" style="display:${expanded?"block":"none"};">
        <textarea class="rk-text autogrow" rows="1" placeholder="${t("placeholderRemark")}">${escapeHtml(r.name)}</textarea>
        <div class="chips rk-days mini-chips">
          ${getWeekdayShortList().map(w=>`<button type="button" class="chip ${r.days.includes(w.k)?"selected":""}" data-day="${w.k}">${w.l}</button>`).join("")}
        </div>
        <div class="mini-time-row">
          ${selectHtml("rkStart"+kidKey+idx, TIMES_15, r.timeStart)}
          <span class="mini-time-sep">–</span>
          ${selectHtml("rkEnd"+kidKey+idx, TIMES_15, r.timeEnd)}
        </div>
        ${photosHtml(r.photos, true)}
      </div>
    </div>
  `;
}

function renderRemarksList(kidKey){
  const wrap = document.getElementById("remarks-"+kidKey);
  const list = globalData.remarks[kidKey];
  wrap.innerHTML = list.map((r,idx)=>remarkCardHtml(kidKey,r,idx)).join("") || `<p class="participant-hint">${t("noRemark")}</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const r = list[idx];
    const expandKey = kidKey+"_"+idx;
    card.querySelector(".rk-edit").onclick = ()=>{
      if(expandedRemarks.has(expandKey)) expandedRemarks.delete(expandKey);
      else expandedRemarks.add(expandKey);
      renderRemarksList(kidKey);
    };
    card.querySelector(".rk-remove").onclick = ()=>{ list.splice(idx,1); expandedRemarks.delete(expandKey); renderRemarksList(kidKey); globalDirty = true; };
    const detail = card.querySelector(".mini-detail");
    if(!detail) return;
    detail.querySelector(".rk-text").oninput = e=>{ r.name = e.target.value; autoGrow(e.target); globalDirty = true; };
    detail.querySelector(`#rkStart${kidKey}${idx}`).onchange = e=>{ r.timeStart = e.target.value; globalDirty = true; };
    detail.querySelector(`#rkEnd${kidKey}${idx}`).onchange = e=>{ r.timeEnd = e.target.value; globalDirty = true; };
    detail.querySelectorAll(".rk-days .chip").forEach(chip=>{
      chip.onclick = ()=>{
        const d = chip.dataset.day;
        const i = r.days.indexOf(d);
        if(i>-1) r.days.splice(i,1); else r.days.push(d);
        globalDirty = true;
        renderRemarksList(kidKey);
      };
    });
    bindPhotoWidget(detail, r.photos, `photos/global/${kidKey}${idx}`, ()=>renderRemarksList(kidKey), ()=>{globalDirty=true;});
  });
  initAutoGrow(wrap);
}

const NAME_GENDER = {"Fırat":"m", "Ebru":"f", "Hande":"f", "Ridvan":"m", "Murat":"m", "Sevgi":"f"};
const GRANDPARENT_LEVEL_STEP = 5;   // Murat & Sevgi steigen alle 5 statt alle 15 auf
const NORMAL_LEVEL_STEP = 15;
function getRankTitle(count, titles, name){
  const isGrandparent = (name === "Murat" || name === "Sevgi");
  const effectiveCount = isGrandparent ? Math.round(count * (NORMAL_LEVEL_STEP / GRANDPARENT_LEVEL_STEP)) : count;
  let result = null;
  let levelIdx = 0;
  titles.forEach((tier, idx)=>{ if(effectiveCount >= tier.threshold){ result = tier; levelIdx = idx; } });
  if(!result) return null;
  const gender = NAME_GENDER[name] || "m";
  const isF = gender === "f";
  let label, article;
  if(LANG === "tr"){
    label = isF ? (result.tr_f || result.tr) : (result.tr_m || result.tr);
    article = "";
  }else{
    label = isF ? result.de_f : result.de_m;
    article = isF ? "die" : "der";
  }
  return { label, emoji: LEVEL_EMOJIS[levelIdx] || levelIdx, article };
}

const WORDGAME_KEYS_DE = "ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ".split("");

function getWordGameKeys(){ return LANG==="tr" ? WORDGAME_KEYS_TR : WORDGAME_KEYS_DE; }

function daysSinceEpoch(d){ return Math.floor(d.getTime() / 86400000); }
const WORDGAME_FIRST_DATES = {
  1: new Date(2026, 8, 14), // Montag
  2: new Date(2026, 8, 15), // Dienstag
  3: new Date(2026, 8, 16), // Mittwoch
  4: new Date(2026, 8, 17), // Donnerstag
  5: new Date(2026, 8, 11)  // Freitag (Start bereits vor dem ersten vollen Wochenblock)
};
function getWeekIndex(date, weekday){
  const first = WORDGAME_FIRST_DATES[weekday] || WORDGAME_FIRST_DATES[1];
  const diffDays = daysSinceEpoch(date) - daysSinceEpoch(first);
  return Math.floor(diffDays / 7);
}
function getPuzzleForDate(date){
  const wd = date.getDay();
  let bank, catDe, catTr;
  if(wd===1){ bank=FILMS; catDe="Film"; catTr="Film"; }
  else if(wd===2){ bank=TIERE; catDe="Tier"; catTr="Hayvan"; }
  else if(wd===3){ bank=LAENDER; catDe="Land"; catTr="Ülke"; }
  else if(wd===4){ bank=STAEDTE; catDe="Stadt"; catTr="Şehir"; }
  else { bank=ESSEN; catDe="Essen"; catTr="Yemek"; }
  let idx = getWeekIndex(date, wd===0||wd===6 ? 5 : wd);
  idx = ((idx % bank.length) + bank.length) % bank.length;
  const entry = bank[idx];
  const answer = (LANG==="tr" ? entry[1] : entry[0]).toUpperCase();
  const category = LANG==="tr" ? catTr : catDe;
  return { category, answer };
}
function getTodayPuzzle(){ return getPuzzleForDate(startOfToday()); }
const WORDGAME_MISSED_PENALTY = 15;
function maxHintsForDate(date){
  const puzzle = getPuzzleForDate(date);
  return new Set(puzzle.answer.split("").filter(c=>c!==" ")).size;
}
function getWeekdayDatesInRange(fromDate, toDate){
  const dates = [];
  const d = new Date(fromDate);
  while(d <= toDate){
    const wd = d.getDay();
    if(wd>=1 && wd<=5) dates.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return dates;
}

let wordGameRevealed = new Set();
let wordGameLetterCount = 0;

function wordGameKey(dateStr){ return "wortspiel:" + dateStr; }

async function loadWordGameResults(){
  try{
    const res = await cloudStore.get(wordGameKey(dateKey(startOfToday())));
    wordGameResults = (res && res.value) ? JSON.parse(res.value) : {};
  }catch(e){
    wordGameResults = {};
  }
  wordGameLoaded = true;
}

function wordGameBlanks(answer, revealed){
  return answer.split("").map(ch=>{
    if(ch === " ") return '<span class="wg-wordgap"></span>';
    const shown = revealed.has(ch) ? ch : "&nbsp;";
    return `<span class="wg-letter">${shown}</span>`;
  }).join("");
}

function checkWordGameAutoSolved(answer, revealed){
  const uniqueLetters = new Set(answer.split("").filter(c=>c!==" "));
  for(const c of uniqueLetters){ if(!revealed.has(c)) return false; }
  return true;
}

async function fetchAllWordGameResults(){
  const allData = await cloudStore.listAll();
  const out = []; // {date, name, count}
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("wortspiel_")) return;
    const dateStr = key.slice("wortspiel_".length).replace(/_/g, "-");
    const entryData = allData[key];
    if(!entryData) return;
    Object.keys(entryData).forEach(name=>{
      out.push({date: dateStr, name, count: entryData[name]});
    });
  });
  return out;
}

function computeLeaderboard(allResults, period){
  const todayStr = dateKey(startOfToday());
  const today = startOfToday();
  const WORDGAME_LAUNCH_DATE = new Date(2026, 8, 11); // Start des Spiels — davor gab es keine Rätsel
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  let fromDate;
  if(period === "today"){ fromDate = today; }
  else if(period === "week"){ fromDate = getMondayOfCurrentWeek(today); }
  else if(period === "month"){ fromDate = new Date(today.getFullYear(), today.getMonth(), 1); }
  else { fromDate = WORDGAME_LAUNCH_DATE; }
  if(fromDate < WORDGAME_LAUNCH_DATE) fromDate = WORDGAME_LAUNCH_DATE;
  const fromStr = dateKey(fromDate);

  // Nur bereits abgeschlossene Tage (bis gestern) werden automatisch mit einer Strafe belegt,
  // falls nicht gespielt wurde. Der heutige Tag ist noch nicht vorbei — er zählt nur mit,
  // wenn bereits gespielt wurde, sonst gibt es dafür (noch) keine Strafe.
  const requiredDateKeys = (fromDate <= yesterday) ? getWeekdayDatesInRange(fromDate, yesterday).map(d=>dateKey(d)) : [];

  const filtered = allResults.filter(r => r.date >= fromStr && r.date <= todayStr);
  const byName = {};
  filtered.forEach(r=>{
    if(!byName[r.name]) byName[r.name] = {};
    byName[r.name][r.date] = r.count;
  });
  // Alle Namen einbeziehen, auch wer noch nie gespielt hat — sonst fehlt die Strafe komplett
  NAMES_BASE.concat(GRANDPARENT_NAMES).forEach(n=>{
    if(!byName[n]) byName[n] = {};
  });

  const rows = Object.keys(byName).map(name=>{
    let total = 0, playedCount = 0, dayCount = 0;
    requiredDateKeys.forEach(dk=>{
      dayCount++;
      if(byName[name].hasOwnProperty(dk)){
        total += byName[name][dk];
        playedCount++;
      }else{
        total += WORDGAME_MISSED_PENALTY;
      }
    });
    if(byName[name].hasOwnProperty(todayStr) && fromStr <= todayStr){
      total += byName[name][todayStr];
      playedCount++;
      dayCount++;
    }
    return {
      name,
      avg: dayCount>0 ? total/dayCount : null,
      played: playedCount,
      totalDays: dayCount
    };
  });
  rows.sort((a,b)=> {
    if(a.avg===null && b.avg===null) return 0;
    if(a.avg===null) return 1;
    if(b.avg===null) return -1;
    return a.avg - b.avg;
  });
  return rows;
}

function getMondayOfCurrentWeek(d){
  const nd = new Date(d);
  const wd = nd.getDay();
  const diff = wd===0 ? -6 : 1-wd;
  nd.setDate(nd.getDate()+diff);
  return nd;
}

function renderWordGame(){
  const body = document.getElementById("wordGameBody");
  if(!body) return;

  const realToday = new Date();
  const realWeekday = realToday.getDay(); // tatsächliches Gerätedatum, unabhängig von der Tagesplan-Navigation
  const isWeekend = (realWeekday === 0 || realWeekday === 6);

  let puzzle = null, displayLen = 0, alreadyClaimedNames = [], activeNames = [];
  if(!isWeekend){
    puzzle = getTodayPuzzle();
    displayLen = puzzle.answer.replace(/ /g, "").length;
    wordGameSolved = wordGameSolved || checkWordGameAutoSolved(puzzle.answer, wordGameRevealed);
    alreadyClaimedNames = Object.keys(wordGameResults);
    activeNames = NAMES_BASE.concat(GRANDPARENT_NAMES); // im Wortspiel spielen Murat & Sevgi immer mit, unabhängig vom Schalter
  }

  const playSectionHtml = isWeekend ? `<p class="participant-hint">📅 ${t("wordGameWeekendOff")}</p>` : `
    <div class="wg-title-banner">🔍 ${t("wordGameTodaySearch")}: <strong>${escapeHtml(puzzle.category)}</strong> (${displayLen} ${t("wordGameLetters")})</div>
    <div class="wg-blanks ${wordGameJustSolved?"wg-celebrate":""}">${wordGameBlanks(puzzle.answer, wordGameRevealed)}</div>
    <p class="participant-hint">${t("wordGameUsed")}: <strong>${wordGameLetterCount}</strong></p>

    ${!wordGameSolved ? `
      <div class="wg-keyboard">
        ${getWordGameKeys().map(k=>`<button type="button" class="wg-key ${wordGameRevealed.has(k)?"used":""}" data-letter="${k}" ${wordGameRevealed.has(k)?"disabled":""}>${k}</button>`).join("")}
      </div>
      <div class="wg-guess-row">
        <input type="text" id="wordGameGuessInput" placeholder="${t("wordGameGuessPlaceholder")}" autocomplete="off">
        <button type="button" class="add-btn" id="wordGameGuessBtn">${t("wordGameGuessBtn")}</button>
      </div>
      ${wordGameWrongGuessMsg ? `<p class="wg-wrong-msg">${escapeHtml(wordGameWrongGuessMsg)}</p>` : ""}
    ` : `
      <div class="wg-solved-banner">🎉 ${t("wordGameSolved")} ${wordGameLetterCount} ${t("wordGameHints")}! 🎉</div>
      <label class="field-label" style="margin-top:10px;font-size:13px;">${t("wordGameWhoPlayed")}</label>
      <div class="chips">
        ${activeNames.map(n=>{
          const taken = wordGameResults.hasOwnProperty(n);
          const style = taken ? ` style="background:#ddd;border-color:#ddd;color:#888;"` : ` style="background:${PERSON_COLORS[n]};border-color:${PERSON_COLORS[n]};color:#fff;"`;
          return `<button type="button" class="chip wg-claim-chip" data-name="${n}" ${taken?"disabled":""}${style}>${n}${taken?" ("+wordGameResults[n]+")":""}</button>`;
        }).join("")}
      </div>
    `}

    <label class="field-label" style="margin-top:16px;font-size:13px;">${t("wordGameTodayBoard")}</label>
    <div class="wg-today-board">
      ${activeNames.map(n=>{
        const played = wordGameResults.hasOwnProperty(n);
        return `<div class="wg-today-row"><span style="color:${PERSON_COLORS[n]||'#999'};font-weight:700;">${n}</span><span>${played ? t("wordGamePlayedWith")+" "+wordGameResults[n]+" "+t("wordGameHintsShort") : t("wordGameNotPlayed")}</span></div>`;
      }).join("")}
    </div>
    ${(() => {
      const played = Object.entries(wordGameResults);
      if(played.length===0) return "";
      const winner = played.reduce((a,b)=> b[1]<a[1] ? b : a);
      return `<div class="wg-winner-banner">🏆 ${t("wordGameWinnerToday")}: <strong style="color:${PERSON_COLORS[winner[0]]||'#999'};">${winner[0]}</strong> (${winner[1]} ${t("wordGameHintsShort")})</div>`;
    })()}
  `;

  body.innerHTML = `
    ${playSectionHtml}
    <button type="button" class="collapse-toggle-btn" id="wgLeaderboardToggle" style="margin-top:12px;">${t("wordGameOverallList")} ${wordGameLeaderboardPeriod?"▾":"▸"}</button>
    ${wordGameLeaderboardPeriod ? `
      <div class="wg-lb-tabs">
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="today"?"selected":""}" data-period="today">${t("wordGameToday")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="week"?"selected":""}" data-period="week">${t("wordGameThisWeek")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="month"?"selected":""}" data-period="month">${t("wordGameThisMonth")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="all"?"selected":""}" data-period="all">${t("wordGameAllTime")}</button>
      </div>
      <p class="participant-hint">${t("wordGameFewerBetter")}</p>
      <div id="wgLeaderboardBody"><p class="participant-hint">${t("statusLoading")}</p></div>
    ` : ``}
  `;

  if(!isWeekend){
  if(!wordGameSolved){
    body.querySelectorAll(".wg-key").forEach(btn=>{
      btn.onclick = ()=>{
        const letter = btn.dataset.letter;
        if(wordGameRevealed.has(letter)) return;
        wordGameRevealed.add(letter);
        wordGameLetterCount++;
        wordGameWrongGuessMsg = "";
        renderWordGame();
      };
    });
    const guessBtn = document.getElementById("wordGameGuessBtn");
    const guessInput = document.getElementById("wordGameGuessInput");
    const normalizeGuess = s => (s||"").toLocaleUpperCase(LANG==="tr" ? "tr" : "de").replace(/\s+/g, "");
    const submitGuess = ()=>{
      const val = normalizeGuess(guessInput.value);
      const target = normalizeGuess(puzzle.answer);
      if(val === target){
        puzzle.answer.split("").forEach(ch=>{ if(ch !== " ") wordGameRevealed.add(ch); });
        wordGameSolved = true;
        wordGameJustSolved = true;
        wordGameWrongGuessMsg = "";
        renderWordGame();
      }else{
        wordGameLetterCount++;
        wordGameWrongGuessMsg = t("wordGameWrongGuess");
        guessInput.value = "";
        renderWordGame();
      }
    };
    if(guessBtn) guessBtn.onclick = submitGuess;
    if(guessInput) guessInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitGuess(); });
  }else{
    body.querySelectorAll(".wg-claim-chip").forEach(chip=>{
      chip.onclick = async ()=>{
        const name = chip.dataset.name;
        if(wordGameResults.hasOwnProperty(name)) return;
        wordGameResults[name] = wordGameLetterCount;
        try{
          await cloudStore.set(wordGameKey(dateKey(startOfToday())), JSON.stringify(wordGameResults));
        }catch(e){ /* stiller Fehlschlag, lokal bleibt es trotzdem sichtbar */ }
        wordGameJustSolved = false;
        renderWordGame();
      };
    });
  }
  } // Ende if(!isWeekend)

  const lbToggle = document.getElementById("wgLeaderboardToggle");
  if(lbToggle) lbToggle.onclick = ()=>{
    wordGameLeaderboardPeriod = wordGameLeaderboardPeriod ? null : "today";
    renderWordGame();
    if(wordGameLeaderboardPeriod) loadWordGameLeaderboard();
  };
  body.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = ()=>{
      wordGameLeaderboardPeriod = btn.dataset.period;
      renderWordGame();
      loadWordGameLeaderboard();
    };
  });
  if(wordGameLeaderboardPeriod) loadWordGameLeaderboard();
}

async function loadWordGameLeaderboard(){
  const el = document.getElementById("wgLeaderboardBody");
  if(!el) return;
  try{
    const all = await fetchAllWordGameResults();
    const rows = computeLeaderboard(all, wordGameLeaderboardPeriod);
    const targetEl = document.getElementById("wgLeaderboardBody");
    if(!targetEl) return;
    if(rows.length===0){
      targetEl.innerHTML = `<p class="participant-hint">${t("wordGameNoData")}</p>`;
      return;
    }
    targetEl.innerHTML = rows.map((r,i)=>`
      <div class="wg-rank-row">
        <span class="wg-rank-num">${i+1}.</span>
        <span class="wg-rank-name" style="color:${PERSON_COLORS[r.name]||'#999'};">${r.name}</span>
        <span class="wg-rank-avg">${r.avg===null ? t("wordGameNoDataYet") : (r.avg % 1 === 0 ? r.avg.toFixed(0) : r.avg.toFixed(1)) + " " + t("wordGameHintsShort")}</span>
      </div>
    `).join("");
  }catch(e){
    const targetEl = document.getElementById("wgLeaderboardBody");
    if(targetEl) targetEl.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
  }
}

async function renderStatistics(){
  const body = document.getElementById("statisticsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const bringCounts = {};
  const abholCounts = {};
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-"); // "tag_2026_09_07" -> "2026-09-07"
    if(dateStr < STAT_START || dateStr >= todayKey) return; // nur abgeschlossene Tage ab Startdatum
    const d = allData[key];
    if(!d) return;
    if(d.bring && Array.isArray(d.bring.people)){
      d.bring.people.forEach(n=>{ bringCounts[n] = (bringCounts[n]||0)+1; });
    }
    if(d.abhol && Array.isArray(d.abhol.people)){
      d.abhol.people.forEach(n=>{ abholCounts[n] = (abholCounts[n]||0)+1; });
    }
  });

  const allNames = Array.from(new Set([...getActiveNames(), ...Object.keys(bringCounts), ...Object.keys(abholCounts)]));
  const maxBring = Math.max(1, ...allNames.map(n=>bringCounts[n]||0));
  const maxAbhol = Math.max(1, ...allNames.map(n=>abholCounts[n]||0));

  function barRow(n, count, max){
    const pct = Math.max(4, Math.round((count/max)*100));
    const color = PERSON_COLORS[n] || "#999";
    return `
      <div class="stat-bar-row">
        <span class="stat-bar-name">${n}</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <span class="stat-bar-count">${count}</span>
      </div>`;
  }

  function titleLine(n, titleObj){
    if(!titleObj) return "";
    const nameColor = PERSON_COLORS[n] || "#999";
    const sentence = LANG === "tr"
      ? `${n} ${titleObj.label}`
      : `${n} ${titleObj.article} ${titleObj.label}`;
    return `<div class="stat-rank-line"><span style="color:${nameColor};">${titleObj.emoji} ${escapeHtml(sentence)}</span></div>`;
  }

  body.innerHTML = `
    <label class="field-label" style="font-size:14px;font-weight:800;">${t("statBring")}</label>
    ${allNames.map(n=>barRow(n, bringCounts[n]||0, maxBring)).join("")}
    <div class="stat-rank-group">
      ${allNames.map(n=>titleLine(n, getRankTitle(bringCounts[n]||0, BRING_TITLES, n))).join("")}
    </div>

    <label class="field-label" style="font-size:14px;font-weight:800;margin-top:18px;">${t("statAbhol")}</label>
    ${allNames.map(n=>barRow(n, abholCounts[n]||0, maxAbhol)).join("")}
    <div class="stat-rank-group">
      ${allNames.map(n=>titleLine(n, getRankTitle(abholCounts[n]||0, ABHOL_TITLES, n))).join("")}
    </div>
  `;
}

async function renderPickupTimeStats(){
  const body = document.getElementById("pickupStatsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  const entries = [];
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-");
    if(dateStr < STAT_START || dateStr >= todayKey) return; // nur abgeschlossene Tage
    const d = allData[key];
    if(!d || !d.abhol || !d.abhol.time) return;
    const wd = new Date(dateStr+"T00:00:00").getDay();
    entries.push({date:dateStr, time:d.abhol.time, weekday:wd});
  });

  const today = startOfToday();
  const mondayStr = dateKey(getMondayOfCurrentWeek(today));
  const monthPrefix = todayKey.slice(0,7);

  function timeToMinutes(tm){ const p = tm.split(":"); return Number(p[0])*60+Number(p[1]); }
  function minutesToTime(m){ const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }

  function computeGroup(filterFn){
    const filtered = entries.filter(filterFn);
    const counts = {};
    filtered.forEach(e=>{ counts[e.time] = (counts[e.time]||0)+1; });
    const times = Object.keys(counts).sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
    let avg=null, min=null, max=null;
    if(filtered.length>0){
      const mins = filtered.map(e=>timeToMinutes(e.time));
      avg = minutesToTime(Math.round(mins.reduce((a,b)=>a+b,0)/mins.length));
      min = minutesToTime(Math.min(...mins));
      max = minutesToTime(Math.max(...mins));
    }
    return {counts, times, avg, min, max, total:filtered.length};
  }

  const groups = {
    week: computeGroup(e=>e.date>=mondayStr),
    month: computeGroup(e=>e.date.slice(0,7)===monthPrefix),
    all: computeGroup(()=>true),
    1: computeGroup(e=>e.weekday===1),
    2: computeGroup(e=>e.weekday===2),
    3: computeGroup(e=>e.weekday===3),
    4: computeGroup(e=>e.weekday===4),
    5: computeGroup(e=>e.weekday===5)
  };

  const wdLabels = getWeekdayShortList(); // [{k,l}] fuer mo..fr, index 0-4 -> Wochentag 1-5

  const periodTabs = [
    {key:"week", label:t("pickupStatsWeek")},
    {key:"month", label:t("pickupStatsMonth")},
    {key:"all", label:t("pickupStatsAll")}
  ];
  const weekdayTabs = [
    {key:"1", label:wdLabels[0].l},
    {key:"2", label:wdLabels[1].l},
    {key:"3", label:wdLabels[2].l},
    {key:"4", label:wdLabels[3].l},
    {key:"5", label:wdLabels[4].l}
  ];

  const g = groups[pickupStatsPeriod] || groups.all;
  const maxCount = Math.max(1, ...g.times.map(tm=>g.counts[tm]));

  body.innerHTML = `
    <div class="wg-lb-tabs">
      ${periodTabs.map(tb=>`<button type="button" class="chip pickup-tab-period ${pickupStatsPeriod===tb.key?"selected":""}" data-period="${tb.key}">${tb.label}</button>`).join("")}
    </div>
    <div class="wg-lb-tabs" style="margin-top:6px;">
      ${weekdayTabs.map(tb=>`<button type="button" class="chip pickup-tab-weekday ${pickupStatsPeriod===tb.key?"selected":""}" data-period="${tb.key}">${tb.label}</button>`).join("")}
    </div>
    ${g.total===0 ? `<p class="participant-hint" style="margin-top:10px;">${t("pickupStatsNoData")}</p>` : `
      ${g.avg ? `<p class="participant-hint" style="margin-top:10px;">${t("pickupStatsAvg")}: <strong>${g.avg}</strong> · ${t("pickupStatsMin")}: <strong>${g.min}</strong> · ${t("pickupStatsMax")}: <strong>${g.max}</strong></p>` : ``}
      <div style="margin-top:8px;">
        ${g.times.map(tm=>{
          const cnt = g.counts[tm];
          const pct = Math.max(4, Math.round((cnt/maxCount)*100));
          return `
            <div class="stat-bar-row">
              <span class="stat-bar-name">${tm}</span>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:var(--blue);"></div></div>
              <span class="stat-bar-count">${cnt}</span>
            </div>`;
        }).join("")}
      </div>
    `}
  `;

  body.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = ()=>{
      pickupStatsPeriod = btn.dataset.period;
      renderPickupTimeStats();
    };
  });
}

    return `

      </div>
    </div>
  `;}).join("") || `<p class="participant-hint">${t("noDocuments")}</p>`;

  wrap.querySelectorAll(".doc-card").forEach(row=>{
    const idx = Number(row.dataset.idx);
    const nameEl = row.querySelector(".doc-name");
    nameEl.oninput = e=>{ globalData.dokumente[idx].name = e.target.value; globalDirty = true; autoGrow(e.target); };

      globalData.dokumente.splice(idx,1);

      saveGlobalData();
      renderDocumentsList();
    };
  });
  initAutoGrow(wrap);
}

const MONTH_COLORS = ["#EF6F5B","#F2A93B","#D9C34A","#2E9E8F","#4FA3D1","#7C8FE0","#8B7FD9","#B57FDB","#EE7FA8","#E5946B","#6BAE8E","#9AA0A8"];
const MONTH_NAMES_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTH_NAMES_TR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const MONTH_SHORT_DE = ["Jän","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTH_SHORT_TR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

function schoolYearMonths(){
  // 12 aufeinanderfolgende Monate ab dem laufenden Schuljahresstart (September)
  const now = startOfToday();
  const startYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear()-1; // Monat-Index 8 = September
  const months = [];
  for(let i=0;i<12;i++){
    const m = (8+i) % 12;
    const y = startYear + Math.floor((8+i)/12);
    months.push({ y, m, key: y+"-"+String(m+1).padStart(2,"0"), color: MONTH_COLORS[i] });
  }
  return months;
}

function renderSchoolYearList(){
  const months = schoolYearMonths();
  if(!selectedSchoolYearMonth){
    const now = startOfToday();
    const nowKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    selectedSchoolYearMonth = months.find(mo=>mo.key===nowKey) ? nowKey : months[0].key;
  }
  const shortNames = LANG==="tr" ? MONTH_SHORT_TR : MONTH_SHORT_DE;
  const wrap = document.getElementById("schoolYearList");

  const monthChips = months.map(mo=>{
    const sel = mo.key === selectedSchoolYearMonth;
    const style = sel ? ` style="background:${mo.color};border-color:${mo.color};color:#fff;"` : "";
    return `<button type="button" class="chip sy-month-chip" data-key="${mo.key}"${style}>${shortNames[mo.m]}</button>`;
  }).join("");

  const sorted = globalData.schoolYearEvents
    .map((e, idx)=>({e, idx}))
    .filter(o=>(o.e.startDate||"").slice(0,7) === selectedSchoolYearMonth)
    .sort((a,b)=> (a.e.startDate||"").localeCompare(b.e.startDate||""));

  const listHtml = sorted.map(({e, idx})=>{
    const expanded = expandedSchoolYearEntries.has(idx);
    const dateLabel = e.startDate ? new Date(e.startDate+"T00:00:00").toLocaleDateString(LANG==="tr"?"tr-TR":"de-AT",{day:"numeric",month:"short"}) : t("selectPlaceholder");
    const dateRangeLabel = e.hasEndDate && e.endDate ? ` – ${new Date(e.endDate+"T00:00:00").toLocaleDateString(LANG==="tr"?"tr-TR":"de-AT",{day:"numeric",month:"short"})}` : "";
    const timeLabel = e.hasTime && e.timeStart ? ` · ${e.timeStart}${e.hasEndTime && e.timeEnd ? "–"+e.timeEnd : ""}` : "";
    const kidColor = e.kid==="eflin" ? KID_COLORS.eflin : (e.kid==="nezir" ? KID_COLORS.nezir : "var(--violet)");
    const kidBadge = e.kid ? `<span class="sy-kid-badge" style="background:${kidColor};">${e.kid==="eflin"?"E":"N"}</span>` : "";
    return `
      <div class="sy-entry-row" data-idx="${idx}">
        <div class="sy-entry-summary">
          ${kidBadge}
          <span class="sy-entry-date" style="color:${kidColor};">${dateLabel}${dateRangeLabel}${timeLabel}</span>
          <span class="sy-entry-text-preview">${escapeHtml((e.text||"").slice(0,40))}${(e.text||"").length>40?"…":""}</span>
          <span class="sy-entry-arrow">${expanded?"▾":"▸"}</span>
        </div>
        <div class="sy-entry-detail" style="display:${expanded?"block":"none"};">
          <textarea class="sy-text autogrow" rows="1" placeholder="${t("schoolYearTextPlaceholder")}">${escapeHtml(e.text)}</textarea>
          <input type="text" class="sy-location" placeholder="${t("locEvent")}" value="${escapeHtml(e.location||"")}" style="margin-top:10px;">
          <label class="field-label" style="margin-top:10px;font-size:13px;">${t("whichKid")}</label>
          <div class="chips sy-kid-chips">
            <button type="button" class="chip ${e.kid==="eflin"?"selected":""}" data-kid="eflin"${e.kid==="eflin"?` style="background:${KID_COLORS.eflin};border-color:${KID_COLORS.eflin};color:#fff;"`:""}>E — Eflin</button>
            <button type="button" class="chip ${e.kid==="nezir"?"selected":""}" data-kid="nezir"${e.kid==="nezir"?` style="background:${KID_COLORS.nezir};border-color:${KID_COLORS.nezir};color:#fff;"`:""}>N — Nezir</button>
          </div>
          <div class="row2" style="margin-top:10px;">
            <div><input type="date" class="sy-start-date" value="${e.startDate}"></div>
          </div>
          <div class="subrow">
            <input type="checkbox" class="sy-has-end-date" ${e.hasEndDate?"checked":""}>
            <label>${t("schoolYearEndDateLabel")}</label>
          </div>
          ${e.hasEndDate ? `<div class="row2" style="margin-top:6px;"><div><input type="date" class="sy-end-date" value="${e.endDate}"></div></div>` : ""}
          <div class="subrow">
            <input type="checkbox" class="sy-has-time" ${e.hasTime?"checked":""}>
            <label>${t("schoolYearTimeLabel")}</label>
          </div>
          ${e.hasTime ? `
            <div class="row2" style="margin-top:6px;">
              <div>${selectHtml("syTimeStart"+idx, TIMES_15, e.timeStart)}</div>
              ${e.hasEndTime ? `<div>${selectHtml("syTimeEnd"+idx, TIMES_15, e.timeEnd)}</div>` : ""}
            </div>
            <div class="subrow">
              <input type="checkbox" class="sy-has-end-time" ${e.hasEndTime?"checked":""}>
              <label>${t("endTime")}</label>
            </div>
          ` : ""}
          <label class="field-label" style="margin-top:10px;font-size:13px;">${t("photos")}</label>
          ${photosHtml(e.photos)}
          <button type="button" class="remove-btn sy-remove" style="margin-top:8px;">${t("remove")}</button>
        </div>
      </div>
    `;
  }).join("") || `<p class="participant-hint">${t("noSchoolYearEvents")}</p>`;

  const prevScrollWrap = wrap.querySelector(".sy-month-chips");
  const prevScrollLeft = prevScrollWrap ? prevScrollWrap.scrollLeft : 0;
  wrap.innerHTML = `<div class="chips sy-month-chips">${monthChips}</div><div class="sy-entries">${listHtml}</div>`;
  const newScrollWrap = wrap.querySelector(".sy-month-chips");
  if(newScrollWrap) newScrollWrap.scrollLeft = prevScrollLeft;

  wrap.querySelectorAll(".sy-month-chip").forEach(chip=>{
    chip.onclick = ()=>{
      selectedSchoolYearMonth = chip.dataset.key;
      renderSchoolYearList();
    };
  });

  wrap.querySelectorAll(".sy-entry-row").forEach(row=>{
    const idx = Number(row.dataset.idx);
    const e = globalData.schoolYearEvents[idx];
    row.querySelector(".sy-entry-summary").onclick = ()=>{
      if(expandedSchoolYearEntries.has(idx)) expandedSchoolYearEntries.delete(idx);
      else expandedSchoolYearEntries.add(idx);
      renderSchoolYearList();
    };
    const detail = row.querySelector(".sy-entry-detail");
    if(!detail) return;
    const textEl = detail.querySelector(".sy-text");
    if(textEl) textEl.oninput = ev=>{ e.text = ev.target.value; autoGrow(ev.target); globalDirty = true; };
    const locEl = detail.querySelector(".sy-location");
    if(locEl) locEl.oninput = ev=>{ e.location = ev.target.value; globalDirty = true; };
    const startEl = detail.querySelector(".sy-start-date");
    if(startEl) startEl.onchange = ev=>{ e.startDate = ev.target.value; globalDirty = true; renderSchoolYearList(); };
    const endToggle = detail.querySelector(".sy-has-end-date");
    if(endToggle) endToggle.onchange = ev=>{ e.hasEndDate = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const endEl = detail.querySelector(".sy-end-date");
    if(endEl) endEl.onchange = ev=>{ e.endDate = ev.target.value; globalDirty = true; };
    const timeToggle = detail.querySelector(".sy-has-time");
    if(timeToggle) timeToggle.onchange = ev=>{ e.hasTime = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const timeStartEl = detail.querySelector(`#syTimeStart${idx}`);
    if(timeStartEl) timeStartEl.onchange = ev=>{ e.timeStart = ev.target.value; globalDirty = true; };
    const endTimeToggle = detail.querySelector(".sy-has-end-time");
    if(endTimeToggle) endTimeToggle.onchange = ev=>{ e.hasEndTime = ev.target.checked; globalDirty = true; renderSchoolYearList(); };
    const timeEndEl = detail.querySelector(`#syTimeEnd${idx}`);
    if(timeEndEl) timeEndEl.onchange = ev=>{ e.timeEnd = ev.target.value; globalDirty = true; };
    detail.querySelectorAll(".sy-kid-chips .chip").forEach(chip=>{
      chip.onclick = ()=>{
        e.kid = (e.kid === chip.dataset.kid) ? "" : chip.dataset.kid;
        globalDirty = true;
        renderSchoolYearList();
      };
    });
    const removeBtn = detail.querySelector(".sy-remove");
    if(removeBtn) removeBtn.onclick = ()=>{
      globalData.schoolYearEvents.splice(idx,1);
      expandedSchoolYearEntries.delete(idx);
      renderSchoolYearList();
      globalDirty = true;
    };
    bindPhotoWidget(detail, e.photos, `photos/global/schuljahr${idx}`, renderSchoolYearList, ()=>{globalDirty=true;});
  });
  initAutoGrow(wrap);
}
