      const uploaded = await uploadPhoto(file, "documents/speiseplan");
      globalData.speiseplan = uploaded;
      globalDirty = true;
      saveGlobalData();
      renderGlobalPanel();
    }catch(err){
      statusEl.textContent = t("statusSaveFailed") + ((err&&err.message)||"") + t("statusRetry");
    }
  };
  const speiseplanRemoveBtn = document.getElementById("speiseplanRemoveBtn");
  if(speiseplanRemoveBtn) speiseplanRemoveBtn.onclick = ()=>{
    globalData.speiseplan = {url:"",name:""};
    globalDirty = true;
    saveGlobalData();
    renderGlobalPanel();
  };
  const lunchPhotoInput = document.getElementById("lunchPhotoInput");
  if(lunchPhotoInput) lunchPhotoInput.onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById("lunchPhotoStatus");
    statusEl.textContent = t("statusLoading");
    try{
      const uploaded = await uploadPhoto(file, `photos/${dateKey(currentDate)}/lunchPhoto`);
      currentDay.lunchPhoto = uploaded;
      markDirty();
      renderGlobalPanel();
      const lunchView = document.getElementById("lunchPhotoView");
      if(lunchView){ lunchView.style.display = "inline"; lunchView.href = uploaded.url; }
    }catch(err){
      statusEl.textContent = t("statusSaveFailed") + ((err&&err.message)||"") + t("statusRetry");
    }
  };

  const statisticsToggleLabel = document.getElementById("statisticsToggleLabel");
  if(statisticsToggleLabel) statisticsToggleLabel.onclick = ()=>{ statisticsOpen = !statisticsOpen; renderGlobalPanel(); };

  const pickupStatsToggleLabel = document.getElementById("pickupStatsToggleLabel");
  if(pickupStatsToggleLabel) pickupStatsToggleLabel.onclick = ()=>{ pickupStatsOpen = !pickupStatsOpen; renderGlobalPanel(); };

  const contactToggleLabel = document.getElementById("contactToggleLabel");
  if(contactToggleLabel) contactToggleLabel.onclick = ()=>{ contactOpen = !contactOpen; renderGlobalPanel(); };
}


function bindEvents(){
  const day = currentDay;
  const isPastDay = dateKey(currentDate) < dateKey(startOfToday());

  document.querySelectorAll(".chip-jump").forEach(btn=>{
    btn.onclick = ()=> jumpToChipTarget(btn.dataset.key);
  });

  document.getElementById("bringPhotoCheck").style.display = day.bringPhoto.url ? "flex" : "none";
  document.getElementById("abholPhotoCheck").style.display = day.abholPhoto.url ? "flex" : "none";
  const bringView = document.getElementById("bringPhotoView");
  bringView.style.display = day.bringPhoto.url ? "inline" : "none";
  bringView.href = day.bringPhoto.url || "#";
  const abholView = document.getElementById("abholPhotoView");
  abholView.style.display = day.abholPhoto.url ? "inline" : "none";
  abholView.href = day.abholPhoto.url || "#";
  const lunchView = document.getElementById("lunchPhotoView");
  if(lunchView){
    lunchView.style.display = day.lunchPhoto.url ? "inline" : "none";
    lunchView.href = day.lunchPhoto.url || "#";
  }

  document.getElementById("bringPhotoInput").onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById("schoolPhotoStatus");
    statusEl.textContent = t("statusLoading");
    try{
      const uploaded = await uploadPhoto(file, `photos/${dateKey(currentDate)}/bringPhoto`);
      currentDay.bringPhoto = uploaded;
      markDirty();
      statusEl.textContent = "";
      document.getElementById("bringPhotoCheck").style.display = "flex";
      const v = document.getElementById("bringPhotoView");
      v.style.display = "inline"; v.href = uploaded.url;
    }catch(err){
      statusEl.textContent = t("statusSaveFailed") + ((err&&err.message)||"") + t("statusRetry");
    }
  };
  document.getElementById("abholPhotoInput").onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById("schoolPhotoStatus");
    statusEl.textContent = t("statusLoading");
    try{
      const uploaded = await uploadPhoto(file, `photos/${dateKey(currentDate)}/abholPhoto`);
      currentDay.abholPhoto = uploaded;
      markDirty();
      statusEl.textContent = "";
      document.getElementById("abholPhotoCheck").style.display = "flex";
      const v = document.getElementById("abholPhotoView");
      v.style.display = "inline"; v.href = uploaded.url;
    }catch(err){
      statusEl.textContent = t("statusSaveFailed") + ((err&&err.message)||"") + t("statusRetry");
    }
  };

  const exceptionsToggle = document.getElementById("exceptionsToggleLabel");
  if(exceptionsToggle) exceptionsToggle.onclick = ()=>{ exceptionsOpen = !exceptionsOpen; renderDay(); };

  if(!isPastDay){
    document.getElementById("bringChips").querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = day.bring.people.indexOf(n);
        if(i>-1) day.bring.people.splice(i,1); else day.bring.people.push(n);
        setChipColor(chip, n, day.bring.people.includes(n));
        markDirty();
      };
    });
  }
  document.getElementById("bringTime").onchange = e=>{ day.bring.time = e.target.value; markDirty(); };

  if(!isPastDay){
    document.getElementById("abholChips").querySelectorAll(".chip").forEach(chip=>{
      chip.onclick = ()=>{
        const n = chip.dataset.name;
        const i = day.abhol.people.indexOf(n);
        if(i>-1) day.abhol.people.splice(i,1); else day.abhol.people.push(n);
        setChipColor(chip, n, day.abhol.people.includes(n));
        markDirty();
      };
    });
  }
  document.getElementById("abholTime").onchange = e=>{ day.abhol.time = e.target.value; markDirty(); };

  const readinessChips = document.querySelectorAll("#readinessChildChips .chip");
  readinessChips.forEach(chip=>{
    chip.onclick = ()=>{
      day.readiness.child = chip.dataset.child; // einmal gewählt, bleibt ein Kind gewählt — kein Zurück auf "keines"
      markDirty();
      renderDay(); // komplett neu aufbauen, damit die Uhrzeit garantiert erscheint
    };
  });
  document.getElementById("readyTime").onchange = e=>{ day.readiness.time = e.target.value; markDirty(); };

  if(exceptionsOpen){
    ["eflin","nezir"].forEach(key=>{
      const block = document.querySelector(`.kidblock[data-kid="${key}"]`);
      if(!block) return;
      const ex = day.exceptions[key];

      const noBring = block.querySelector(".exc-noBring");
      const noBringReasonWrap = block.querySelector(".exc-noBring").closest(".subrow").nextElementSibling;
      noBring.onchange = e=>{
        ex.noBring = e.target.checked;
        noBringReasonWrap.style.display = ex.noBring ? "block" : "none";
        markDirty();
      };
      block.querySelector(".exc-noBringReason").oninput = e=>{ ex.noBringReason = e.target.value; markDirty(); };

      const noAbhol = block.querySelector(".exc-noAbhol");
      const noAbholReasonWrap = block.querySelector(".exc-noAbhol").closest(".subrow").nextElementSibling;
      noAbhol.onchange = e=>{
        ex.noAbhol = e.target.checked;
        noAbholReasonWrap.style.display = ex.noAbhol ? "block" : "none";
        markDirty();
      };
      block.querySelector(".exc-noAbholReason").oninput = e=>{ ex.noAbholReason = e.target.value; markDirty(); };
    });
  }

  document.getElementById("goToFerienBtn").onclick = ()=>{
    ferienOpen = true;
    globalData.schoolYearEnabled = true;
    const todayKey = dateKey(currentDate);
    selectedSchoolYearMonth = todayKey.slice(0,7);
    globalData.schoolYearEvents.push({startDate:todayKey, hasEndDate:false, endDate:"", hasTime:false, timeStart:"", hasEndTime:false, timeEnd:"", kid:"", location:"", text:"", photos:[]});
    expandedSchoolYearEntries.add(globalData.schoolYearEvents.length-1);
    globalDirty = true;
    renderGlobalPanel();
    const target = document.getElementById("ferienToggleLabel");
    if(target && target.scrollIntoView) target.scrollIntoView({behavior:"smooth", block:"start"});
  };

  document.getElementById("addNoticeBtn").onclick = ()=>{
    day.notices.push({text:"", kids:[], photos:[], location:""});
    renderNoticesList();
    markDirty();
  };

  const duaToggle = document.getElementById("duaToggleLabel");
  if(duaToggle) duaToggle.onclick = ()=>{ duaOpen = !duaOpen; renderDay(); };

  if(duaOpen){
    document.getElementById("duaPickup").onchange = e=>{
      day.dua.mustPickup = e.target.checked;
      document.getElementById("duaTimeWrap").style.display = day.dua.mustPickup ? "block" : "none";
      updateDuaNote();
      markDirty();
    };
    document.getElementById("duaWishTime").onchange = e=>{
      day.dua.wishTime = e.target.value;
      updateDuaNote();
      markDirty();
    };
    document.getElementById("duaTime").onchange = e=>{
      day.dua.byTime = e.target.value;
      updateDuaNote();
      markDirty();
    };

    document.getElementById("addDuaEventBtn").onclick = ()=>{
      day.dua.kindergartenEvents.push({timeStart:"", timeEnd:"", text:"", photos:[]});
      renderDuaEventsList();
      markDirty();
    };

    document.getElementById("addDuaNoticeBtn").onclick = ()=>{
      day.dua.notices.push({text:"", photos:[]});
      renderDuaNoticesList();
      markDirty();
    };
  }

  const addElternHinweisBtn = document.getElementById("addElternHinweisBtn");
  if(addElternHinweisBtn) addElternHinweisBtn.onclick = ()=>{
    day.elternHinweise.push({person:"", text:"", timeStart:"", timeEnd:"", photos:[]});
    renderElternHinweiseList();
    markDirty();
  };
  const elternToggleLabel = document.getElementById("elternToggleLabel");
  if(elternToggleLabel) elternToggleLabel.onclick = ()=>{ elternOpen = !elternOpen; renderDay(); };

  document.getElementById("saveDayBtn").onclick = performSave;
}

document.getElementById("saveDayBtnTop").onclick = performSave;
document.getElementById("resetDayBtn").onclick = resetCurrentDay;
document.getElementById("prevDayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = stepWeekday(currentDate,-1);
  loadDay();
};
document.getElementById("nextDayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = stepWeekday(currentDate,1);
  loadDay();
};
document.getElementById("todayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = snapToWeekday(startOfToday());
  loadDay();
};
document.getElementById("dateInput").onchange = e=>{
  if(!confirmLeaveIfDirty()){
    renderDateNav(); // Datumsfeld auf den bisherigen Wert zurücksetzen
    return;
  }
  const [y,m,d] = e.target.value.split("-").map(Number);
  if(!y||!m||!d) return;
  currentDate = snapToWeekday(new Date(y, m-1, d));
  loadDay();
};

const APP_PIN = "1999";

function startApp(){
  refreshHolidays(new Date().getFullYear());
  loadGlobalData();
  loadDay();
  loadWeather();
}

function tryUnlock(){
  const val = document.getElementById("pinInput").value.trim();
  if(val === APP_PIN){
    localStorage.setItem("schulweg-unlocked", "yes");
    document.getElementById("pinGate").style.display = "none";
    startApp();
  }else{
    document.getElementById("pinError").textContent = "Falscher Code, bitte nochmal.";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }
}
document.getElementById("pinSubmit").onclick = tryUnlock;
document.getElementById("pinInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") tryUnlock();
});
document.getElementById("langAt").onclick = ()=> setLang("de");
document.getElementById("langTr").onclick = ()=> setLang("tr");

// Ausgangstexte gemäß gespeicherter Sprache setzen (vor dem eigentlichen App-Start)
document.getElementById("langAt").classList.toggle("selected", LANG==="de");
document.getElementById("langTr").classList.toggle("selected", LANG==="tr");
document.getElementById("appTitle").innerHTML = t("title") + ' <span style="font-size:13px;color:var(--ink-soft);font-weight:400;">v4</span>';
document.getElementById("todayBtn").textContent = t("today");
document.getElementById("saveDayBtnTop").textContent = t("saveTop");
document.getElementById("resetDayBtn").textContent = t("resetDay");
document.getElementById("pinTitle").textContent = t("pinTitle");
document.getElementById("pinPrompt").textContent = t("pinPrompt");
document.getElementById("pinSubmit").textContent = t("pinButton");
refreshThemeLabels();

document.getElementById("themeToggleBtn").onclick = ()=>{
  const picker = document.getElementById("themePicker");
  picker.style.display = picker.style.display === "none" ? "flex" : "none";
};
document.querySelectorAll(".theme-chip").forEach(chip=>{
  chip.onclick = ()=> setTheme(chip.dataset.theme);
});
document.getElementById("themeAccentPicker").oninput = e=>{
  localStorage.setItem(MANUAL_ACCENT_KEY, e.target.value);
  applyManualColors(e.target.value, document.getElementById("themeBgPicker").value);
};
document.getElementById("themeBgPicker").oninput = e=>{
  localStorage.setItem(MANUAL_BG_KEY, e.target.value);
  applyManualColors(document.getElementById("themeAccentPicker").value, e.target.value);
};
setTheme(localStorage.getItem(THEME_KEY) || "light");

if(localStorage.getItem("schulweg-unlocked") === "yes"){
  document.getElementById("pinGate").style.display = "none";
  startApp();
}else{
  document.getElementById("pinInput").focus();
}
</script>
