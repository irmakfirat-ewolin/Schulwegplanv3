  html[data-theme="eflin"]{
    --paper:#F3DEF0;
    --paper-raised:#FDF3FB;
    --ink:#3A2A38;

    --amber-soft:#FDECC9;

    --teal-soft:#D9F1EC;

    --brick-soft:#FDE1DA;

    --violet-soft:#EAC3EA;

    --blue:#4FA3D1;

  html[data-theme="nezir"]{
    --paper:#CFE6F4;
    --paper-raised:#F0F9FD;
    --ink:#16262F;
    --ink-soft:#4F6C7C;
    --line:#B7D9EC;
    --amber:#F2A93B;
    --amber-soft:#FDECC9;
    --teal:#2E9E8F;
    --teal-soft:#D9F1EC;
    --brick:#EF6F5B;
    --brick-soft:#FDE1DA;
    --violet:#3D6FCB;
    --violet-soft:#C3DBF5;
    --pink:#EE7FA8;
    --pink-soft:#FCE3ED;
    --blue:#0D6AAD;
    --blue-soft:#B9DDF2;
    --blue-soft:#CBE6F8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 92% 0%, var(--blue-soft) 0%, transparent 40%),
      radial-gradient(circle at 4% 8%, var(--pink-soft) 0%, transparent 35%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,h3,.rounded{font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;}
  header{
    padding:22px 18px 14px;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:2px solid var(--line);
  }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .title-row h1{ margin:0 0 4px; }
  header h1{
    margin:0 0 4px;
    font-size:29px;
    font-weight:700;
    color:var(--teal);
  }
  header p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .datebar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .datenav-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper-raised);
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  #dateInput{
    flex:1;
    font-family:-apple-system,system-ui,sans-serif;
    font-size:15px;
    font-weight:600;
    padding:9px 10px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .today-btn{
    font-family:ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
    font-size:13px;
    font-weight:600;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:10px;
    padding:0 14px;
    height:38px;
    cursor:pointer;
    flex-shrink:0;
  }
  .weekday-chip{
    font-family: ui-rounded,'SF Pro Rounded',system-ui,sans-serif;

const cloudStore = {
  async get(key){
    const snap = await db.ref(key.replace(/:/g, "_")).once("value");
    if(snap.val() === null || typeof snap.val() === "undefined"){
      throw new Error("not found");
    }
    return { value: JSON.stringify(snap.val()) };
  },
  async set(key, valueStr){
    await db.ref(key.replace(/:/g, "_")).set(JSON.parse(valueStr));
    return { key, value: valueStr };
  },
  async delete(key){
    await db.ref(key.replace(/:/g, "_")).remove();
    return { key, deleted: true };
  },
  async listAll(){
    const snap = await db.ref().once("value");
    return snap.val() || {};
  }
};

// ---- Österreichische Feiertage (Wien) ----
function easterSunday(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, month-1, day);
}
function addDaysToDate(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function austrianHolidays(year){
  const easter = easterSunday(year);
  const fixed = [
    [0,1,"Neujahr"], [0,6,"Heilige Drei Könige"], [4,1,"Staatsfeiertag"],
    [7,15,"Mariä Himmelfahrt"], [9,26,"Nationalfeiertag"], [10,1,"Allerheiligen"],
    [11,8,"Mariä Empfängnis"], [11,25,"Christtag"], [11,26,"Stefanitag"]
  ];
  const map = {};
  fixed.forEach(([m,d,name])=>{ map[dateKey(new Date(year,m,d))] = name; });
  map[dateKey(addDaysToDate(easter,1))]  = "Ostermontag";
  map[dateKey(addDaysToDate(easter,39))] = "Christi Himmelfahrt";
  map[dateKey(addDaysToDate(easter,50))] = "Pfingstmontag";
  map[dateKey(addDaysToDate(easter,60))] = "Fronleichnam";
  return map;
}

function mergeDay(parsed){
  const day = emptyDay();
  day.bring = Object.assign({people:[],time:""}, parsed.bring||{});
  day.abhol = Object.assign({people:[],time:""}, parsed.abhol||{});
  day.bringPhoto = (parsed.bringPhoto && parsed.bringPhoto.url) ? {url:parsed.bringPhoto.url, name:parsed.bringPhoto.name||""} : {url:"",name:""};
  day.abholPhoto = (parsed.abholPhoto && parsed.abholPhoto.url) ? {url:parsed.abholPhoto.url, name:parsed.abholPhoto.name||""} : {url:"",name:""};
  day.lunchPhoto = (parsed.lunchPhoto && parsed.lunchPhoto.url) ? {url:parsed.lunchPhoto.url, name:parsed.lunchPhoto.name||""} : {url:"",name:""};
  const oldReadiness = parsed.readiness || {};
  if(typeof oldReadiness.child !== "undefined"){
    day.readiness = Object.assign({child:"",time:""}, oldReadiness);
  }else if(oldReadiness.eflin){
    day.readiness = {child:"eflin", time:oldReadiness.eflin};
  }else if(oldReadiness.nezir){
    day.readiness = {child:"nezir", time:oldReadiness.nezir};
  }
  day.exceptions = {
    eflin: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).eflin||{}),
    nezir: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).nezir||{})
  };
  day.dua = Object.assign({mustPickup:false,wishTime:"",byTime:"",notices:[],kindergartenEvents:[]}, parsed.dua||{});
  day.dua.notices = Array.isArray(day.dua.notices) ? day.dua.notices.map(normalizeDuaNotice) : [];
  day.dua.kindergartenEvents = Array.isArray(day.dua.kindergartenEvents) ? day.dua.kindergartenEvents.map(normalizeKindergartenEvent) : [];
  day.schoolEvents = Array.isArray(parsed.schoolEvents) ? parsed.schoolEvents.map(ev=>{
    const merged = Object.assign({name:"",timeStart:"",timeEnd:"",hasEndTime:false,location:"",participants:[],kids:[],photos:[]}, ev);
    if(!merged.timeStart && ev.time) merged.timeStart = ev.time; // altes Format "time" übernehmen
    merged.photos = normalizePhotos(merged.photos);
    return merged;
  }) : [];
  day.notices = Array.isArray(parsed.notices) ? parsed.notices.map(normalizeNotice) : [];
  day.elternHinweise = Array.isArray(parsed.elternHinweise) ? parsed.elternHinweise.map(normalizeElternHinweis) : [];
  const ep = parsed.extraPhotos || {};
  day.extraPhotos = {
    eflin: normalizePhotos(ep.eflin),
    nezir: normalizePhotos(ep.nezir),
    allgemein: normalizePhotos(ep.allgemein)
  };
  return day;
}

function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function formatDateShort(dateStr){
  if(!dateStr) return "";
  return new Date(dateStr+"T00:00:00").toLocaleDateString(LANG==="tr"?"tr-TR":"de-AT", {day:"numeric", month:"short"});
}
function addDays(d, n){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+n);
  return nd;
}
function startOfToday(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}
function isWeekend(d){
  const wd = d.getDay();
  return wd===0 || wd===6;
}
function snapToWeekday(d){
  // Samstag/Sonntag überspringen, landet auf dem nächsten Montag
  const nd = new Date(d);
  if(nd.getDay()===6) nd.setDate(nd.getDate()+2);
  else if(nd.getDay()===0) nd.setDate(nd.getDate()+1);
  return nd;
}
function stepWeekday(d, direction){
  // einen Tag in Richtung "direction" (+1/-1), Wochenenden werden übersprungen
  const nd = new Date(d);
  do{
    nd.setDate(nd.getDate()+direction);
  }while(isWeekend(nd));
  return nd;
}

function quizPlayedAgeDays(ts){
  return (Date.now() - ts) / 86400000;
}

function quizPlayedAgeClass(ts){
  if(!ts) return "";
  const days = quizPlayedAgeDays(ts);
  if(days < 30) return "quiz-age-recent";
  if(days < 90) return "quiz-age-due";
  return "quiz-age-overdue";
}

function quizPlayedAgeLabel(ts){
  if(!ts) return "";
  const days = Math.floor(quizPlayedAgeDays(ts));
  if(days < 1) return "heute gespielt";
  if(days === 1) return "vor 1 Tag gespielt";
  if(days < 30) return `vor ${days} Tagen gespielt`;
  const months = Math.floor(days / 30);
  return months === 1 ? "vor 1 Monat gespielt" : `vor ${months} Monaten gespielt`;
}

function quizMatchesFilter(ts, filter){
  if(filter === "all") return true;
  if(filter === "unplayed") return !ts;
  if(filter === "played") return !!ts;
  if(filter === "over1m") return !!ts && quizPlayedAgeDays(ts) > 30;
  if(filter === "over3m") return !!ts && quizPlayedAgeDays(ts) > 90;
  return true;
}

function triggerHaptic(){
  // Android/Chrome: klassische Vibration API
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  // iOS Safari (17.4+): hat keine Vibration API, aber ein <input type="checkbox" switch>
  // löst beim Umschalten über sein <label> spürbares Haptik-Feedback aus (inoffizieller Kniff,
  // da Apple die echte Vibration API in Safari nie eingebaut hat).
  try{
    const label = document.getElementById("hapticSwitchLabel");
    if(label) label.click();
  }catch(e){}
}

async function loadDay(){
  clampDate();
  const token = ++loadToken;
  const key = "tag:" + dateKey(currentDate);
  setSaveState(t("statusLoading"), false);
  dirty = false;
  renderDateNav();
  expandedElternHinweise = new Set();
  expandedSchoolEvents = new Set();
  expandedNotices = new Set();

  let loaded = emptyDay();
  try{
    const res = await cloudStore.get(key);
    if(res && res.value){
      loaded = mergeDay(JSON.parse(res.value));
    }
  }catch(e){
    // Für diesen Tag ist noch nichts gespeichert — das ist der Normalfall, kein echter Fehler.
  }
  if(token !== loadToken) return; // eine neuere Auswahl läuft bereits
  currentDay = loaded;
  daySnapshotJson = JSON.stringify(currentDay);
  setSaveState("", false);
  renderDay();
  renderGlobalPanel();
}

function validateDay(day){
  const errors = [];
  day.schoolEvents.forEach((ev, i)=>{
    if(!ev.name.trim()) errors.push(`Termin ${i+1}: Bezeichnung fehlt`);
    if(ev.kids.length===0) errors.push(`Termin ${i+1}: Kind wählen`);
  });
  day.notices.forEach((n, i)=>{
    if(!n.text.trim()) errors.push(`Hinweis ${i+1}: Text fehlt`);
    if(n.kids.length===0) errors.push(`Hinweis ${i+1}: Kind wählen`);
  });
  return errors;
}

async function saveNow(attempt){
  const key = "tag:" + dateKey(currentDate);
  setSaveState(attempt===1 ? t("statusSaving") : t("statusSavingRetry") + " " + attempt + ")", false);
  try{
    const result = await cloudStore.set(key, JSON.stringify(currentDay));
    if(result){
      dirty = false;
      setSaveState(t("statusSaved"), false);
      const dayChanges = describeChanges(DAY_CHANGE_FIELDS, JSON.parse(daySnapshotJson || "{}"), currentDay);
      daySnapshotJson = JSON.stringify(currentDay);
      appendAuditLog(dateKey(currentDate), dayChanges);
    }else{
      throw new Error("kein Ergebnis vom Speicher");
    }
  }catch(e){
    if(attempt < 3){
      setTimeout(()=>saveNow(attempt+1), 800 * attempt);
    }else{
      const msg = (e && e.message) ? e.message : "unbekannter Fehler";
      setSaveState(t("statusSaveFailed") + msg + t("statusRetry"), true);
    }
  }
}

function weatherEmoji(code){
  if(code===0) return "☀️";
  if(code===1||code===2) return "🌤️";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if(code>=51&&code<=57) return "🌦️";
  if(code>=61&&code<=67) return "🌧️";
  if(code>=71&&code<=77) return "❄️";
  if(code>=80&&code<=82) return "🌦️";
  if(code>=85&&code<=86) return "🌨️";
  if(code>=95) return "⛈️";
  return "🌡️";
}

async function loadWeather(){
  try{
    const district = VIENNA_DISTRICTS.find(d=>d.id===weatherDistrict) || VIENNA_DISTRICTS[22];
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${district.lat}&longitude=${district.lon}`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,relative_humidity_2m_mean,sunrise,sunset`
      + `&hourly=temperature_2m,weather_code,precipitation_probability,wind_gusts_10m,relative_humidity_2m,apparent_temperature`
      + `&timezone=Europe%2FVienna&forecast_days=7`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const days = data.daily;
    const hrs = data.hourly;
    if(!days || !days.time) throw new Error("unerwartetes Datenformat");
    const hourlyIndex = {};
    const byDayHumidity = {};   // dateStr -> [values] für Tages-Fallback
    const byDayAppTemp = {};    // dateStr -> [values] für Tages-Fallback
    if(hrs && hrs.time){
      hrs.time.forEach((ts, i)=>{
        const humidityVal = hrs.relative_humidity_2m ? hrs.relative_humidity_2m[i] : null;
        const appTempVal = hrs.apparent_temperature ? hrs.apparent_temperature[i] : null;
        hourlyIndex[ts] = {
          temp: hrs.temperature_2m[i],
          code: hrs.weather_code[i],
          precip: hrs.precipitation_probability ? hrs.precipitation_probability[i] : null,
          gust: hrs.wind_gusts_10m ? hrs.wind_gusts_10m[i] : null,
          humidity: humidityVal,
          appTemp: appTempVal
        };
        const dayPrefix = ts.slice(0, 10);
        if(humidityVal!=null){
          (byDayHumidity[dayPrefix] = byDayHumidity[dayPrefix] || []).push(humidityVal);
        }
        if(appTempVal!=null){
          (byDayAppTemp[dayPrefix] = byDayAppTemp[dayPrefix] || []).push(appTempVal);
        }
      });
    }
    const map = {};
    days.time.forEach((dateStr, i)=>{
      const slot = h => hourlyIndex[`${dateStr}T${h}`] || null;
      const middaySlot = slot("13:00");

      // Tageswert bevorzugt, sonst aus den Stundenwerten des Tages berechnet
      let appTmax = (days.apparent_temperature_max && days.apparent_temperature_max[i]!=null) ? days.apparent_temperature_max[i] : null;
      let appTmin = (days.apparent_temperature_min && days.apparent_temperature_min[i]!=null) ? days.apparent_temperature_min[i] : null;
      if((appTmax==null || appTmin==null) && byDayAppTemp[dateStr] && byDayAppTemp[dateStr].length){
        const vals = byDayAppTemp[dateStr];
        if(appTmax==null) appTmax = Math.max(...vals);
        if(appTmin==null) appTmin = Math.min(...vals);
      }

      let humidity = (days.relative_humidity_2m_mean && days.relative_humidity_2m_mean[i]!=null) ? days.relative_humidity_2m_mean[i] : null;
      if(humidity==null && byDayHumidity[dateStr] && byDayHumidity[dateStr].length){
        const vals = byDayHumidity[dateStr];
        humidity = vals.reduce((s,v)=>s+v,0) / vals.length;
      }else if(humidity==null && middaySlot && middaySlot.humidity!=null){
        humidity = middaySlot.humidity;
      }

      map[dateStr] = {
        code: days.weather_code[i],
        tmax: Math.round(days.temperature_2m_max[i]),
        tmin: Math.round(days.temperature_2m_min[i]),
        appTmax: appTmax!=null ? Math.round(appTmax) : null,
        appTmin: appTmin!=null ? Math.round(appTmin) : null,
        precipProbMax: (days.precipitation_probability_max && days.precipitation_probability_max[i]!=null) ? Math.round(days.precipitation_probability_max[i]) : null,
        windGustMax: (days.wind_gusts_10m_max && days.wind_gusts_10m_max[i]!=null) ? Math.round(days.wind_gusts_10m_max[i]) : null,
        humidity: humidity!=null ? Math.round(humidity) : null,
        sunrise: days.sunrise ? days.sunrise[i] : null,
        sunset: days.sunset ? days.sunset[i] : null,
        morning: slot("08:00"),
        midday: middaySlot,
        afternoon: slot("16:00"),
        pickup17: slot("17:00"),
        evening: slot("19:00")
      };
    });
    weatherByDate = map;
    weatherError = "";
  }catch(e){
    weatherError = (e && e.message) ? e.message : "unbekannter Fehler";
  }
  renderWeatherChip();
  renderWeatherDetailBody();
}

function weatherCloudText(code){
  if(code===0) return LANG==="tr" ? "açık gökyüzü" : "klarer Himmel";
  if(code===1) return LANG==="tr" ? "genelde açık" : "überwiegend klar";
  if(code===2) return LANG==="tr" ? "parçalı bulutlu" : "teilweise bewölkt";
  if(code===3) return LANG==="tr" ? "çok bulutlu" : "stark bewölkt";
  if(code===45||code===48) return LANG==="tr" ? "sisli" : "neblig";
  if(code>=51&&code<=57) return LANG==="tr" ? "hafif çisenti" : "leichter Nieselregen";
  if(code>=61&&code<=67) return LANG==="tr" ? "yağmurlu" : "Regen";
  if(code>=71&&code<=77) return LANG==="tr" ? "kar yağışı" : "Schneefall";
  if(code>=80&&code<=82) return LANG==="tr" ? "sağanak yağış" : "Regenschauer";
  if(code>=85&&code<=86) return LANG==="tr" ? "kar sağanağı" : "Schneeschauer";
  if(code>=95) return LANG==="tr" ? "gök gürültülü fırtına" : "Gewitter";
  return LANG==="tr" ? "değişken" : "wechselhaft";
}

function tempDescText(t){
  if(t==null) return "";
  if(LANG==="tr"){
    if(t<0) return "dondurucu";
    if(t<11) return "serin";
    if(t<17) return "ılık";
    if(t<23) return "hoş sıcaklıkta";
    if(t<28) return "sıcak";
    return "çok sıcak";
  }
  if(t<0) return "frostig";
  if(t<11) return "kühl";
  if(t<17) return "mild";
  if(t<23) return "angenehm warm";
  if(t<28) return "warm";
  return "heiß";
}

function formatHM(iso){
  if(!iso) return "";
  const parts = iso.split("T");
  return parts[1] ? parts[1].slice(0,5) : "";
}

function needsUmbrella(w){
  if(!w) return false;
  const rainCode = (w.code>=51&&w.code<=67) || (w.code>=80&&w.code<=82) || w.code>=95;
  return (w.precipProbMax!=null && w.precipProbMax>=40) || rainCode;
}

function needsUmbrellaSlot(slot){
  if(!slot) return false;
  const rainCode = (slot.code>=51&&slot.code<=67) || (slot.code>=80&&slot.code<=82) || slot.code>=95;
  return (slot.precip!=null && slot.precip>=40) || rainCode;
}

function needsUmbrellaPickup(w){
  if(!w) return false;
  if(needsUmbrellaSlot(w.afternoon) || needsUmbrellaSlot(w.pickup17)) return true;
  return needsUmbrella(w); // Fallback, falls keine Stundenwerte vorliegen
}

function weatherDistrictName(){
  const d = VIENNA_DISTRICTS.find(x=>x.id===weatherDistrict) || VIENNA_DISTRICTS[22];
  return d.name;
}

function weatherWeekOutlookText(startDate){
  const days = [];
  let d = new Date(startDate);
  for(let i=0;i<5;i++){
    const w = weatherByDate[dateKey(d)];
    if(w) days.push(w);
    d = stepWeekday(d, 1);
  }
  if(days.length===0) return null;
  const rainyCount = days.filter(w=>needsUmbrella(w)).length;
  const avgMax = Math.round(days.reduce((s,w)=>s+w.tmax,0) / days.length);
  const windyCount = days.filter(w=>w.windGustMax!=null && w.windGustMax>=35).length;

  if(LANG==="tr"){
    let txt;
    if(rainyCount===0) txt = `Önümüzdeki günler büyük ölçüde kuru geçecek, ortalama ${avgMax}° civarında.`;
    else if(rainyCount>=days.length-1) txt = `Önümüzdeki günler değişken ve çoğunlukla yağışlı, ortalama ${avgMax}° civarında.`;
    else txt = `Önümüzdeki günler değişken, ${rainyCount} gün yağış olasılığı yüksek, ortalama ${avgMax}° civarında.`;
    if(windyCount>0) txt += ` Bazı günlerde rüzgar hamleleri olabilir.`;
    return `🔭 ${txt}`;
  }
  let txt;
  if(rainyCount===0) txt = `Die kommenden Tage bleiben größtenteils trocken, im Schnitt um die ${avgMax}°.`;
  else if(rainyCount>=days.length-1) txt = `Die kommenden Tage werden unbeständig mit häufigerem Regen, im Schnitt um die ${avgMax}°.`;
  else txt = `Die kommenden Tage sind wechselhaft, an ${rainyCount} von ${days.length} Tagen ist Regen wahrscheinlich, im Schnitt um die ${avgMax}°.`;
  if(windyCount>0) txt += ` An manchen Tagen ist mit böigem Wind zu rechnen.`;
  return `🔭 ${txt}`;
}

function weatherFeelsLikeText(w){
  if(!w || w.appTmax==null || w.appTmin==null) return null;
  if(LANG==="tr"){
    return `🌡️ Hissedilen sıcaklık: ${w.appTmin}° / ${w.appTmax}°`;
  }
  return `🌡️ Gefühlte Temperatur: ${w.appTmin}° / ${w.appTmax}°`;
}

function weatherHumidityText(w){
  if(!w || w.humidity==null) return null;
  if(LANG==="tr"){
    return `💧 Nem oranı: %${w.humidity}`;
  }
  return `💧 Luftfeuchtigkeit: ${w.humidity}%`;
}

function weatherNarrativeParts(dateStr){
  const w = weatherByDate[dateStr];
  if(!w) return null;
  let mainText;
  if(LANG==="tr"){
    if(w.morning && w.afternoon){
      mainText = `Sabah ${tempDescText(w.morning.temp)} (${Math.round(w.morning.temp)}°), öğleden sonra ${tempDescText(w.afternoon.temp)}, ${Math.round(w.afternoon.temp)}° civarı. Gökyüzü: ${weatherCloudText(w.code)}.`;
    }else{
      mainText = `Gün içinde ${w.tmin}° ile ${w.tmax}° arası. Gökyüzü: ${weatherCloudText(w.code)}.`;
    }
    const umbrellaText = needsUmbrella(w) ? `☂️ Şemsiye alın${w.precipProbMax!=null?` (yağış olasılığı %${w.precipProbMax})`:""}.` : `☂️ Şemsiyeye muhtemelen gerek yok.`;
    const windText = (w.windGustMax!=null && w.windGustMax>=35) ? `💨 Rüzgar hamleleri ${w.windGustMax} km/s'e kadar.` : null;
    const sunriseText = w.sunrise ? `🌅 Gün doğumu: ${formatHM(w.sunrise)}` : null;
    const sunsetText = w.sunset ? `🌇 Gün batımı: ${formatHM(w.sunset)}` : null;
    return {mainText, umbrellaText, windText, sunriseText, sunsetText};
  }
  if(w.morning && w.afternoon){
    mainText = `Am Morgen ${tempDescText(w.morning.temp)} (${Math.round(w.morning.temp)}°), am Nachmittag ${tempDescText(w.afternoon.temp)}, um die ${Math.round(w.afternoon.temp)}°. Himmel: ${weatherCloudText(w.code)}.`;
  }else{
    mainText = `Tagsüber zwischen ${w.tmin}° und ${w.tmax}°. Himmel: ${weatherCloudText(w.code)}.`;
  }
  const umbrellaText = needsUmbrella(w) ? `☂️ Regenschirm einpacken${w.precipProbMax!=null?` (Regenwahrscheinlichkeit ${w.precipProbMax}%)`:""}.` : `☂️ Regenschirm vermutlich nicht nötig.`;
  const windText = (w.windGustMax!=null && w.windGustMax>=35) ? `💨 Böiger Wind, Böen bis ${w.windGustMax} km/h.` : null;
  const sunriseText = w.sunrise ? `🌅 Sonnenaufgang: ${formatHM(w.sunrise)} Uhr` : null;
  const sunsetText = w.sunset ? `🌇 Sonnenuntergang: ${formatHM(w.sunset)} Uhr` : null;
  return {mainText, umbrellaText, windText, sunriseText, sunsetText};
}

function weatherDetailBodyHtml(){
  const districtMapHtml = `
    <div class="weather-district-row">
      <label for="weatherDistrictSelect">${t("weatherDistrictLabel")}</label>
      <select id="weatherDistrictSelect">
        ${VIENNA_DISTRICTS.map(d=>`<option value="${d.id}" ${d.id===weatherDistrict?"selected":""}>${d.id}. ${escapeHtml(d.name)}</option>`).join("")}
      </select>
    </div>
  `;

  if(weatherError){
    return districtMapHtml + `<p class="participant-hint">${t("weatherUnavailable")} (${escapeHtml(weatherError)})</p>`;
  }
  const dayKeyStr = dateKey(currentDate);
  const w = weatherByDate[dayKeyStr];
  if(!w){
    return districtMapHtml + `<p class="participant-hint">${t("weatherLoading")}</p>`;
  }
  const parts = weatherNarrativeParts(dayKeyStr) || {};
  const dateLabel = currentDate.toLocaleDateString(LANG==="tr"?"tr-TR":"de-AT", {weekday:"long", day:"numeric", month:"long"});
  const feelsLike = weatherFeelsLikeText(w);
  const humidity = weatherHumidityText(w);
  const outlook = weatherWeekOutlookText(currentDate);
  const pickupNeedsUmbrella = needsUmbrellaPickup(w);
  const pickupText = LANG==="tr"
    ? `🎒 Alım saatinde (16–17), ${weatherDistrictName()} (${weatherDistrict}. Bölge): ${pickupNeedsUmbrella ? "Şemsiye gerekli." : "Şemsiyeye gerek yok."}`
    : `🎒 Zur Abholzeit (16–17 Uhr) im ${weatherDistrict}. Bezirk (${escapeHtml(weatherDistrictName())}): ${pickupNeedsUmbrella ? "Regenschirm nötig." : "Regenschirm nicht nötig."}`;

  const upcoming = [];
  let d = currentDate;
  for(let i=0;i<4;i++){
    d = stepWeekday(d, 1);
    const key = dateKey(d);
    const dw = weatherByDate[key];
    if(dw) upcoming.push({date:new Date(d), key, w:dw});
  }
  const upcomingHtml = upcoming.map(u=>{
    const label = u.date.toLocaleDateString(LANG==="tr"?"tr-TR":"de-AT", {weekday:"short", day:"numeric", month:"numeric"});
    const umbrella = needsUmbrella(u.w) ? "☂️" : "";
    return `
      <div class="weather-day-card" data-date="${u.key}">
        <div class="weather-day-label">${escapeHtml(label)}</div>
        <div class="weather-day-emoji">${weatherEmoji(u.w.code)}</div>
        <div class="weather-day-temps">${u.w.tmin}° / ${u.w.tmax}°</div>
        <div class="weather-day-extra">${escapeHtml(weatherCloudText(u.w.code))} ${umbrella}</div>
      </div>
    `;
  }).join("");

  return `
    ${districtMapHtml}
    <div class="weather-today-block">
      <div class="weather-today-date">${weatherEmoji(w.code)} ${escapeHtml(dateLabel)}</div>
      <div class="weather-temps-big"><span class="temp-min">${w.tmin}°</span><span class="temp-sep">/</span><span class="temp-max">${w.tmax}°</span></div>
      ${parts.mainText ? `<p class="weather-line">${escapeHtml(parts.mainText)}</p>` : ""}
      ${parts.umbrellaText ? `<p class="weather-line weather-line-umbrella">${escapeHtml(parts.umbrellaText)}</p>` : ""}
      ${parts.windText ? `<p class="weather-line weather-line-wind">${escapeHtml(parts.windText)}</p>` : ""}
      ${parts.sunriseText ? `<p class="weather-line weather-line-sun">${escapeHtml(parts.sunriseText)}</p>` : ""}
      ${parts.sunsetText ? `<p class="weather-line weather-line-sun">${escapeHtml(parts.sunsetText)}</p>` : ""}
      ${feelsLike ? `<p class="weather-line weather-line-feels">${escapeHtml(feelsLike)}</p>` : ""}
      ${humidity ? `<p class="weather-line weather-line-humidity">${escapeHtml(humidity)}</p>` : ""}
      ${outlook ? `<p class="weather-line weather-line-outlook">${escapeHtml(outlook)}</p>` : ""}
    </div>
    ${upcomingHtml ? `<div class="weather-upcoming-row">${upcomingHtml}</div>` : ""}
    <p class="weather-line weather-line-pickup">${escapeHtml(pickupText)}</p>
    <p class="weather-live-note">${t("weatherLiveNote")}</p>
  `;
}

function switchWeatherDistrict(id){
  if(id === weatherDistrict) return;
  weatherDistrict = id;
  localStorage.setItem("schulweg-weather-district", String(weatherDistrict));
  weatherByDate = {};
  renderWeatherDetailBody();
  loadWeather();
}

function renderWeatherDetailBody(){
  const body = document.getElementById("weatherDetailBody");
  if(!body) return;
  body.innerHTML = weatherDetailBodyHtml();
  body.querySelectorAll(".weather-day-card").forEach(card=>{
    card.onclick = ()=>{
      if(!confirmLeaveIfDirty()) return;
      const [y,m,dd] = card.dataset.date.split("-").map(Number);
      currentDate = snapToWeekday(new Date(y, m-1, dd));
      loadDay();
    };
  });
  const districtSelect = document.getElementById("weatherDistrictSelect");
  if(districtSelect) districtSelect.onchange = e=>switchWeatherDistrict(Number(e.target.value));
}

function renderWeatherChip(){
  const chip = document.getElementById("weatherChip");
  if(!chip) return;
  chip.style.cursor = "pointer";
  chip.onclick = ()=>jumpToChipTarget("weather");
  const diffDays = Math.round((currentDate - startOfToday()) / 86400000);
  const withinRange = diffDays>=0 && diffDays<=4;
  if(!withinRange){
    chip.style.display = "none";
    return;
  }
  const w = weatherByDate[dateKey(currentDate)];
  if(w){
    chip.textContent = `${weatherEmoji(w.code)} ${w.tmin}° / ${w.tmax}°`;
    chip.style.display = "inline-block";
  }else if(weatherError){
    chip.textContent = "Wetter nicht verfügbar (" + weatherError + ")";
    chip.style.display = "inline-block";
  }else{
    chip.style.display = "none";
  }
}

}

function dayStatusChips(day){
  const chips = [];

  if(day.bring.people.length>0){
    chips.push({text:t("bringt")+": " + day.bring.people.join(", "), tone:"ok"});
  }else{
    chips.push({text:t("bringerFehlt"), tone:"warn"});
  }

  if(day.abhol.people.length>0){
    chips.push({text:t("holtAb")+": " + day.abhol.people.join(", "), tone:"ok"});
  }else{
    chips.push({text:t("holerFehlt"), tone:"warn"});
  }

  if(!day.readiness.child || !day.readiness.time){
    chips.push({text:t("bereitFehlt"), tone:"warn"});
  }

  const hasException = day.exceptions.eflin.noBring || day.exceptions.eflin.noAbhol
    || day.exceptions.nezir.noBring || day.exceptions.nezir.noAbhol;
  if(hasException) chips.push({text:t("ausnahmeBeachten"), tone:"alert", key:"exceptions"});

  if(day.schoolEvents.length>0 || getMatchingSchoolYearEvents(dateKey(currentDate)).length>0) chips.push({text:t("terminVorhanden"), tone:"info", key:"events"});
  if(day.notices.length>0) chips.push({text:t("hinweisVorhanden"), tone:"info", key:"notices"});
  if(day.dua.mustPickup) chips.push({text:t("duaBeachten"), tone:"alert", key:"dua"});
  if(!day.dua.mustPickup && day.dua.notices && day.dua.notices.some(n=>n.text && n.text.trim())) chips.push({text:t("duaHinweisVorhanden"), tone:"info", key:"dua"});
  if(day.elternHinweise && day.elternHinweise.length>0) chips.push({text:t("elternHinzugefuegt"), tone:"info", key:"eltern"});

  if(day.extraPhotos && (day.extraPhotos.eflin.length>0 || day.extraPhotos.nezir.length>0 || day.extraPhotos.allgemein.length>0)){
    chips.push({text:t("extraPhotosVorhanden"), tone:"info", key:"extraPhotos"});
  }

  const todayWeekdayKey = getWeekdayShortList()[currentDate.getDay()-1] ? getWeekdayShortList()[currentDate.getDay()-1].k : null;
  if(todayWeekdayKey){
    if(globalData.remarks.eflin.some(r=>r.days.includes(todayWeekdayKey))) chips.push({text:t("kurstagEflin"), tone:"info", key:"remarkEflin"});
    if(globalData.remarks.nezir.some(r=>r.days.includes(todayWeekdayKey))) chips.push({text:t("kurstagNezir"), tone:"info", key:"remarkNezir"});
  }

  return chips;
}

function getMatchingSchoolYearEvents(dk){
  if(!globalData.schoolYearEnabled) return [];
  return globalData.schoolYearEvents
    .map((e, idx)=>({e, idx}))
    .filter(({e})=>{
      if(!e.startDate) return false;
      const end = (e.hasEndDate && e.endDate) ? e.endDate : e.startDate;
      return dk >= e.startDate && dk <= end;
    });
}

function kidChipHtml(kidKey, isSelected){
  const style = isSelected ? ` style="background:${KID_COLORS[kidKey]};border-color:${KID_COLORS[kidKey]};color:#fff;"` : "";
  return `<button type="button" class="chip ${isSelected?"selected":""}" data-kid="${kidKey}"${style}>${KID_LABELS[kidKey]}</button>`;
}
function setKidChipColor(chip, kidKey, isSelected){
  chip.classList.toggle("selected", isSelected);
  if(isSelected){
    chip.style.background = KID_COLORS[kidKey];
    chip.style.borderColor = KID_COLORS[kidKey];
    chip.style.color = "#fff";
  }else{
    chip.style.background = "";
    chip.style.borderColor = "";
    chip.style.color = "";
  }
}
function kidChips(selectedKids, includeDua){
  const keys = includeDua ? ["eflin","nezir","dua"] : ["eflin","nezir"];
  return keys.map(k=> kidChipHtml(k, selectedKids.includes(k))).join("");
}

async function uploadPhoto(file, pathPrefix){
  if(!firebase.storage){
    throw new Error("Storage-SDK nicht geladen");
  }
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${pathPrefix}/${Date.now()}_${safeName}`;
  const fileRef = firebase.storage().ref().child(path);

  const timeout = new Promise((_, reject)=>{
    setTimeout(()=> reject(new Error("Zeitüberschreitung — Storage evtl. nicht aktiviert")), 20000);
  });

  await Promise.race([fileRef.put(file), timeout]);
  const url = await Promise.race([fileRef.getDownloadURL(), timeout]);
  return { url, name: file.name };
}

function photosHtml(photos, mini, allowVideo){
  const acceptAttr = allowVideo ? "image/*,video/*" : "image/*,application/pdf";
  if(mini){
    return `

        ${photos.map((p, i)=>{
          const isPdf = /\.pdf$/i.test(p.name || p.url || "");
          const isVideo = /\.(mp4|mov|webm|m4v|avi)$/i.test(p.name || p.url || "");
          const icon = isVideo ? "🎥" : (isPdf?"📄":"🖼️");
          return `<a href="${p.url}" target="_blank" rel="noopener" class="photo-mini-link" data-pidx="${i}">${icon} ${escapeHtml(p.name || t("photos"))}<span class="photo-mini-remove" data-pidx="${i}">✕</span></a>`;
        }).join("")}
        <label class="photo-mini-add">
          📎
          <input type="file" accept="${acceptAttr}" multiple class="photo-input">
        </label>
      </div>
      <span class="photo-status"></span>
    `;
  }
  return `
    <div class="photos-row">
      ${photos.map((p, i)=>{
        const isPdf = /\.pdf$/i.test(p.name || p.url || "");
        const isVideo = /\.(mp4|mov|webm|m4v|avi)$/i.test(p.name || p.url || "");
        return `
        <div class="photo-thumb" data-pidx="${i}">
          <a href="${p.url}" target="_blank" rel="noopener">${isVideo ? `<div class="pdf-thumb-icon">🎥<br>Video</div>` : (isPdf ? `<div class="pdf-thumb-icon">📄<br>PDF</div>` : `<img src="${p.url}" alt="">`)}</a>
          <input type="text" class="photo-name" placeholder="${t("photoNameOptional")}" value="${escapeHtml(p.name)}">
          <button type="button" class="photo-remove">${t("remove")}</button>
        </div>
      `;}).join("")}
    </div>
    <label class="photo-add-btn">
      📎 ${t("photos")}
      <input type="file" accept="${acceptAttr}" multiple class="photo-input">
    </label>
    <span class="photo-status"></span>
  `;
}

function bindPhotoWidget(card, photos, pathPrefix, rerender, dirtyFn){
  const markAsDirty = dirtyFn || markDirty;
  card.querySelectorAll(".photo-remove").forEach((btn, i)=>{
    btn.onclick = ()=>{ photos.splice(i,1); markAsDirty(); rerender(); };
  });
  card.querySelectorAll(".photo-name").forEach((inp, i)=>{
    inp.oninput = e=>{ photos[i].name = e.target.value; markAsDirty(); };
  });
  card.querySelectorAll(".photo-mini-remove").forEach((btn, i)=>{
    btn.onclick = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); photos.splice(i,1); markAsDirty(); rerender(); };
  });
  const fileInput = card.querySelector(".photo-input");
  const statusEl = card.querySelector(".photo-status");
  if(fileInput){
    fileInput.onchange = async (e)=>{
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      statusEl.textContent = "lädt hoch…";
      for(const file of files){
        try{
          const uploaded = await uploadPhoto(file, pathPrefix);
          photos.push(uploaded);
        }catch(err){
          statusEl.textContent = "Hochladen fehlgeschlagen (" + ((err && err.message) || "Fehler") + ")";
          return;
        }
      }
      markAsDirty();
      rerender();
    };
  }
}

function autoGrow(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
function initAutoGrow(container){
  container.querySelectorAll("textarea.autogrow").forEach(autoGrow);
}

function updateDuaNote(){
  const day = currentDay;
  const noteEl = document.getElementById("duaNote");
  if(day.dua.mustPickup && (day.dua.wishTime || day.dua.byTime)){
    const parts = [];
    const uhrSuffix = LANG==="tr" ? "" : " Uhr";
    if(day.dua.wishTime) parts.push(`${t("duaWishLabel")}: ${day.dua.wishTime}${uhrSuffix}`);
    if(day.dua.byTime) parts.push(`${t("duaLatestLabel")} ${day.dua.byTime}${uhrSuffix}`);
    noteEl.innerHTML = `<div class="dua-note">${t("duaPickupHint")} ${parts.join(", ")}</div>`;
  }else if(day.dua.mustPickup){
    noteEl.innerHTML = `<div class="dua-note">${t("duaWaiting")}</div>`;
  }else{
    noteEl.innerHTML = "";
  }
}

function renderDuaEventsList(){
  const day = currentDay;
  const wrap = document.getElementById("duaEventsList");
  wrap.innerHTML = day.dua.kindergartenEvents.map((ke, idx)=>`
    <div class="entry-card" data-idx="${idx}">
      <div class="entry-top">
        <textarea class="dke-text autogrow" rows="1" placeholder="${t("placeholderKinder")}" style="flex:1;">${escapeHtml(ke.text)}</textarea>
        <button type="button" class="remove-btn dke-remove">${t("remove")}</button>
      </div>
      <div class="row2" style="margin-top:10px;">
        <div>${selectHtml("dkeStart"+idx, TIMES_15, ke.timeStart)}</div>
        <div>${selectHtml("dkeEnd"+idx, TIMES_15, ke.timeEnd)}</div>
      </div>
      <label class="field-label" style="margin-top:10px;font-size:13px;">${t("photos")}</label>
      ${photosHtml(ke.photos)}
    </div>
  `).join("") || `<p class="participant-hint">${t("noKinder")}</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const ke = day.dua.kindergartenEvents[idx];
    card.querySelector(".dke-text").oninput = e=>{ ke.text = e.target.value; autoGrow(e.target); markDirty(); };
    card.querySelector(`#dkeStart${idx}`).onchange = e=>{ ke.timeStart = e.target.value; markDirty(); };
    card.querySelector(`#dkeEnd${idx}`).onchange = e=>{ ke.timeEnd = e.target.value; markDirty(); };
    card.querySelector(".dke-remove").onclick = ()=>{ day.dua.kindergartenEvents.splice(idx,1); renderDuaEventsList(); markDirty(); };
    bindPhotoWidget(card, ke.photos, `photos/${dateKey(currentDate)}/kindergarten${idx}`, renderDuaEventsList);
  });
  initAutoGrow(wrap);
}

function renderElternHinweiseList(){
  const day = currentDay;
  const wrap = document.getElementById("elternHinweiseList");
  wrap.innerHTML = day.elternHinweise.map((eh, idx)=>{
    const expanded = expandedElternHinweise.has(idx);
    const timeLabel = eh.timeStart ? ` · ${eh.timeStart}${eh.timeEnd?"–"+eh.timeEnd:""}` : "";
    const attachLabel = eh.photos.length>0 ? ` · 📎 ${eh.photos.length}` : "";
    return `
    <div class="entry-card entry-mini" data-idx="${idx}">
      <div class="mini-summary-row">
        <div class="mini-summary-info">
          ${eh.person ? `<span class="mini-summary-person" style="color:${PERSON_COLORS[eh.person]||'var(--ink)'};">👤 ${escapeHtml(eh.person)}</span>` : `<span class="mini-summary-person mini-summary-empty">${t("noPersonYet")}</span>`}
          <span class="mini-summary-meta">${timeLabel}${attachLabel}</span>
          ${eh.text ? `<div class="mini-summary-text">${escapeHtml(eh.text)}</div>` : ""}
        </div>
        <div class="mini-summary-actions">
          <button type="button" class="mini-edit-btn eh-edit">${expanded?t("done"):t("edit")}</button>
          <button type="button" class="remove-btn eh-remove">${t("remove")}</button>
        </div>
      </div>
      <div class="mini-detail" style="display:${expanded?"block":"none"};">
        <div class="chips eh-chips mini-chips">${getActiveNames().map(n=>nameChipHtml(n, eh.person===n)).join("")}</div>
        <textarea class="eh-text autogrow" rows="1" placeholder="${t("placeholderEltern")}">${escapeHtml(eh.text)}</textarea>
        <div class="mini-time-row">
          ${selectHtml("ehStart"+idx, TIMES_15, eh.timeStart)}
          <span class="mini-time-sep">–</span>
          ${selectHtml("ehEnd"+idx, TIMES_15, eh.timeEnd)}
        </div>
        ${photosHtml(eh.photos, true)}
      </div>
    </div>
  `;}).join("") || `<p class="participant-hint">${t("noEltern")}</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const eh = day.elternHinweise[idx];
    card.querySelector(".eh-edit").onclick = ()=>{
      if(expandedElternHinweise.has(idx)) expandedElternHinweise.delete(idx);
      else expandedElternHinweise.add(idx);
      renderElternHinweiseList();
    };
    card.querySelector(".eh-remove").onclick = ()=>{ day.elternHinweise.splice(idx,1); expandedElternHinweise.delete(idx); renderElternHinweiseList(); markDirty(); refreshStatusChips(); };
    const detail = card.querySelector(".mini-detail");
    if(!detail) return;
    detail.querySelectorAll(".eh-chips .chip").forEach(chip=>{
      chip.onclick = ()=>{
        eh.person = (eh.person === chip.dataset.name) ? "" : chip.dataset.name; // einzelne Person, erneutes Antippen hebt auf
        markDirty();
        renderElternHinweiseList();
      };
    });
    detail.querySelector(".eh-text").oninput = e=>{ eh.text = e.target.value; autoGrow(e.target); markDirty(); };
    detail.querySelector(`#ehStart${idx}`).onchange = e=>{ eh.timeStart = e.target.value; markDirty(); };
    detail.querySelector(`#ehEnd${idx}`).onchange = e=>{ eh.timeEnd = e.target.value; markDirty(); };
    bindPhotoWidget(detail, eh.photos, `photos/${dateKey(currentDate)}/eltern${idx}`, renderElternHinweiseList);
  });
  initAutoGrow(wrap);
}

const THEME_KEY = "schulweg-theme";
const MANUAL_ACCENT_KEY = "schulweg-manual-accent";
const MANUAL_BG_KEY = "schulweg-manual-bg";

function hexToRgb(hex){
  hex = (hex||"#000000").replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16) || 0;
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHex(r,g,b){
  return "#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
}
function lightenHex(hex, amount){
  const {r,g,b} = hexToRgb(hex);
  return rgbToHex(r+(255-r)*amount, g+(255-g)*amount, b+(255-b)*amount);
}
function isLightColor(hex){
  const {r,g,b} = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.6;
}
function applyManualColors(accentHex, bgHex){
  const root = document.documentElement;
  const light = isLightColor(bgHex);
  root.style.setProperty("--paper", bgHex);
  root.style.setProperty("--paper-raised", lightenHex(bgHex, light?0.9:0.15));
  root.style.setProperty("--ink", light?"#2E2A22":"#F0ECE3");
  root.style.setProperty("--ink-soft", light?"#7A7364":"#A39C8C");
  root.style.setProperty("--line", lightenHex(bgHex, light?0.85:0.25));
  root.style.setProperty("--violet", accentHex);
  root.style.setProperty("--violet-soft", lightenHex(accentHex, 0.82));
  root.style.setProperty("--teal", accentHex);
  root.style.setProperty("--teal-soft", lightenHex(accentHex, 0.82));
}
const THEME_VARS = ["--paper","--paper-raised","--ink","--ink-soft","--line","--violet","--violet-soft","--teal","--teal-soft"];
function setTheme(name){
  const html = document.documentElement;
  if(name === "manual"){
    const accent = localStorage.getItem(MANUAL_ACCENT_KEY) || "#8B7FD9";
    const bg = localStorage.getItem(MANUAL_BG_KEY) || "#FFFDF8";
    html.setAttribute("data-theme", "manual");
    applyManualColors(accent, bg);
    const accentPicker = document.getElementById("themeAccentPicker");
    const bgPicker = document.getElementById("themeBgPicker");
    if(accentPicker) accentPicker.value = accent;
    if(bgPicker) bgPicker.value = bg;
    const row = document.getElementById("themeManualRow");
    if(row) row.style.display = "flex";
  }else{
    THEME_VARS.forEach(v=>html.style.removeProperty(v));
    if(name === "light") html.removeAttribute("data-theme");
    else html.setAttribute("data-theme", name);
    const row = document.getElementById("themeManualRow");
    if(row) row.style.display = "none";
  }
  localStorage.setItem(THEME_KEY, name);
  document.querySelectorAll(".theme-chip").forEach(chip=>{
    chip.classList.toggle("selected", chip.dataset.theme === name);
  });
}
function refreshThemeLabels(){
  const map = { themeLabelLight:"themeLight", themeLabelDark:"themeDark", themeLabelManual:"themeManual", themeAccentLabel:"themeAccent", themeBgLabel:"themeBg" };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = t(map[id]);
  });
}

function getByPath(obj, path){
  return path.reduce((o,k)=> (o && typeof o==="object") ? o[k] : undefined, obj);
}

function describeFieldChange(field, oldVal, newVal){
  const oldJson = JSON.stringify(oldVal===undefined?null:oldVal);
  const newJson = JSON.stringify(newVal===undefined?null:newVal);
  if(oldJson === newJson) return null;
  const label = field.label;
  if(field.type === "list"){
    const oldList = (Array.isArray(oldVal) && oldVal.length) ? oldVal.join(", ") : "niemand";
    const newList = (Array.isArray(newVal) && newVal.length) ? newVal.join(", ") : "niemand";
    return `${label} geändert: ${oldList} → ${newList}`;
  }
  if(field.type === "photo"){
    if(newVal && !oldVal) return `${label} hinzugefügt`;
    if(!newVal && oldVal) return `${label} entfernt`;
    return `${label} ausgetauscht`;
  }
  if(field.type === "array"){
    const oldLen = Array.isArray(oldVal) ? oldVal.length : 0;
    const newLen = Array.isArray(newVal) ? newVal.length : 0;
    if(newLen > oldLen) return `${label} hinzugefügt`;
    if(newLen < oldLen) return `${label} entfernt`;
    return `${label} bearbeitet`;
  }
  if(field.type === "bool"){
    return `${label} ${newVal ? "aktiviert" : "deaktiviert"}`;
  }
  if(field.type === "value"){
    const oldDisp = (oldVal===undefined||oldVal===null||oldVal==="") ? "leer" : oldVal;
    const newDisp = (newVal===undefined||newVal===null||newVal==="") ? "leer" : newVal;
    return `${label} geändert: ${oldDisp} → ${newDisp}`;
  }
  return `${label} geändert`;
}

function describeChanges(fields, oldObj, newObj){
  const changes = [];
  fields.forEach(f=>{
    const desc = describeFieldChange(f, getByPath(oldObj, f.path), getByPath(newObj, f.path));
    if(desc) changes.push(desc);
  });
  return changes;
}

async function loadAuditLog(){
  try{
    const res = await cloudStore.get(AUDIT_KEY);
    auditLog = (res && res.value) ? JSON.parse(res.value) : [];
  }catch(e){
    auditLog = [];
  }
  auditLoaded = true;
}

async function appendAuditLog(dayStr, changes){
  if(!changes || !changes.length) return;
  auditLog.push({ ts: Date.now(), day: dayStr, changes });
  if(auditLog.length > 300) auditLog = auditLog.slice(auditLog.length - 300);
  try{
    await cloudStore.set(AUDIT_KEY, JSON.stringify(auditLog));
  }catch(e){ /* Verlauf konnte nicht gespeichert werden — kein kritischer Fehler */ }
}

function remarkCardHtml(kidKey, r, idx){

    const w = getWeekdayShortList().find(x=>x.k===d);
    return w ? w.l : d;
  }).join(",") : "";
  const timeLabel = r.timeStart ? ` · ${r.timeStart}${r.timeEnd?"–"+r.timeEnd:""}` : "";
  const locLabel = r.location ? ` · 📍 ${escapeHtml(r.location)}` : "";
  const attachLabel = r.photos.length>0 ? ` · 📎 ${r.photos.length}` : "";
  return `
    <div class="entry-card entry-mini" data-kid="${kidKey}" data-idx="${idx}">
      <div class="mini-summary-row">
        <div class="mini-summary-info">
          <div class="mini-summary-text">${escapeHtml(r.name) || `<span class="mini-summary-empty">${t("noTitle")}</span>`}</div>
          <span class="mini-summary-meta">${daysLabel}${timeLabel}${locLabel}${attachLabel}</span>
        </div>
        <div class="mini-summary-actions">
          <button type="button" class="mini-edit-btn rk-edit">${expanded?t("done"):t("edit")}</button>
          <button type="button" class="remove-btn rk-remove">${t("remove")}</button>
        </div>
      </div>
      <div class="mini-detail" style="display:${expanded?"block":"none"};">
        <textarea class="rk-text autogrow" rows="1" placeholder="${t("placeholderRemark")}">${escapeHtml(r.name)}</textarea>
        <div class="chips rk-days mini-chips">
          ${getWeekdayShortList().map(w=>`<button type="button" class="chip ${r.days.includes(w.k)?"selected":""}" data-day="${w.k}">${w.l}</button>`).join("")}
        </div>
        <div class="mini-time-row">
          ${selectHtml("rkStart"+kidKey+idx, TIMES_15, r.timeStart)}
          <span class="mini-time-sep">–</span>
          ${selectHtml("rkEnd"+kidKey+idx, TIMES_15, r.timeEnd)}
        </div>
        <input type="text" class="rk-location mini-location" placeholder="${t("locEvent")}" value="${escapeHtml(r.location)}">
        ${photosHtml(r.photos, true)}
      </div>
    </div>
  `;
}

function renderRemarksList(kidKey){
  const wrap = document.getElementById("remarks-"+kidKey);
  const list = globalData.remarks[kidKey];
  wrap.innerHTML = list.map((r,idx)=>remarkCardHtml(kidKey,r,idx)).join("") || `<p class="participant-hint">${t("noRemark")}</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const r = list[idx];
    const expandKey = kidKey+"_"+idx;
    card.querySelector(".rk-edit").onclick = ()=>{
      if(expandedRemarks.has(expandKey)) expandedRemarks.delete(expandKey);
      else expandedRemarks.add(expandKey);
      renderRemarksList(kidKey);
    };
    card.querySelector(".rk-remove").onclick = ()=>{ list.splice(idx,1); expandedRemarks.delete(expandKey); renderRemarksList(kidKey); globalDirty = true; refreshStatusChips(); };
    const detail = card.querySelector(".mini-detail");
    if(!detail) return;
    detail.querySelector(".rk-text").oninput = e=>{ r.name = e.target.value; autoGrow(e.target); globalDirty = true; };
    detail.querySelector(`#rkStart${kidKey}${idx}`).onchange = e=>{ r.timeStart = e.target.value; globalDirty = true; };
    detail.querySelector(`#rkEnd${kidKey}${idx}`).onchange = e=>{ r.timeEnd = e.target.value; globalDirty = true; };
    detail.querySelector(".rk-location").oninput = e=>{ r.location = e.target.value; globalDirty = true; };
    detail.querySelectorAll(".rk-days .chip").forEach(chip=>{
      chip.onclick = ()=>{
        const d = chip.dataset.day;
        const i = r.days.indexOf(d);
        if(i>-1) r.days.splice(i,1); else r.days.push(d);
        globalDirty = true;
        renderRemarksList(kidKey);
        refreshStatusChips();
      };
    });
    bindPhotoWidget(detail, r.photos, `photos/global/${kidKey}${idx}`, ()=>renderRemarksList(kidKey), ()=>{globalDirty=true;});
  });
  initAutoGrow(wrap);
}

const NAME_GENDER = {"Fırat":"m", "Ebru":"f", "Hande":"f", "Ridvan":"m", "Murat":"m", "Sevgi":"f"};
const GRANDPARENT_LEVEL_STEP = 5;   // Murat & Sevgi steigen alle 5 statt alle 15 auf
const NORMAL_LEVEL_STEP = 15;
function getRankTitle(count, titles, name){
  const isGrandparent = (name === "Murat" || name === "Sevgi");
  const effectiveCount = isGrandparent ? Math.round(count * (NORMAL_LEVEL_STEP / GRANDPARENT_LEVEL_STEP)) : count;
  let result = null;
  let levelIdx = 0;
  titles.forEach((tier, idx)=>{ if(effectiveCount >= tier.threshold){ result = tier; levelIdx = idx; } });
  if(!result) return null;
  const gender = NAME_GENDER[name] || "m";
  const isF = gender === "f";
  let label, article;
  if(LANG === "tr"){
    label = isF ? (result.tr_f || result.tr) : (result.tr_m || result.tr);
    article = "";
  }else{
    label = isF ? result.de_f : result.de_m;
    article = isF ? "die" : "der";
  }
  return { label, emoji: LEVEL_EMOJIS[levelIdx] || levelIdx, article };
}

function daysSinceEpoch(d){ return Math.floor(d.getTime() / 86400000); }
const WORDGAME_FIRST_DATES = {
  1: new Date(2026, 8, 14), // Montag
  2: new Date(2026, 8, 15), // Dienstag
  3: new Date(2026, 8, 16), // Mittwoch
  4: new Date(2026, 8, 17), // Donnerstag
  5: new Date(2026, 8, 11)  // Freitag (Start bereits vor dem ersten vollen Wochenblock)
};
function getWeekIndex(date, weekday){
  const first = WORDGAME_FIRST_DATES[weekday] || WORDGAME_FIRST_DATES[1];
  const diffDays = daysSinceEpoch(date) - daysSinceEpoch(first);
  return Math.floor(diffDays / 7);
}
function getPuzzleForDate(date){
  const wd = date.getDay();
  let bank, catDe, catTr;
  if(wd===1){ bank=FILMS; catDe="Film"; catTr="Film"; }
  else if(wd===2){ bank=TIERE; catDe="Tier"; catTr="Hayvan"; }
  else if(wd===3){ bank=LAENDER; catDe="Land"; catTr="Ülke"; }
  else if(wd===4){ bank=STAEDTE; catDe="Stadt"; catTr="Şehir"; }
  else { bank=ESSEN; catDe="Essen"; catTr="Yemek"; }
  let idx = getWeekIndex(date, wd===0||wd===6 ? 5 : wd);
  idx = ((idx % bank.length) + bank.length) % bank.length;
  const entry = bank[idx];
  const answer = (LANG==="tr" ? entry[1] : entry[0]).toUpperCase();
  const category = LANG==="tr" ? catTr : catDe;
  return { category, answer };
}
function getTodayPuzzle(){ return getPuzzleForDate(startOfToday()); }
const WORDGAME_MISSED_PENALTY = 15;
function maxHintsForDate(date){
  const puzzle = getPuzzleForDate(date);
  return new Set(puzzle.answer.split("").filter(c=>c!==" ")).size;
}
function getWeekdayDatesInRange(fromDate, toDate){
  const dates = [];
  const d = new Date(fromDate);
  while(d <= toDate){
    const wd = d.getDay();
    if(wd>=1 && wd<=5) dates.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return dates;
}

function wordGameBlanks(answer, revealed){
  return answer.split("").map(ch=>{
    if(ch === " ") return '<span class="wg-wordgap"></span>';
    const shown = revealed.has(ch) ? ch : "&nbsp;";
    return `<span class="wg-letter">${shown}</span>`;
  }).join("");
}

function checkWordGameAutoSolved(answer, revealed){
  const uniqueLetters = new Set(answer.split("").filter(c=>c!==" "));
  for(const c of uniqueLetters){ if(!revealed.has(c)) return false; }
  return true;
}

async function fetchAllWordGameResults(){
  const allData = await cloudStore.listAll();
  const out = []; // {date, name, count}
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("wortspiel_")) return;
    const dateStr = key.slice("wortspiel_".length).replace(/_/g, "-");
    const entryData = allData[key];
    if(!entryData) return;
    Object.keys(entryData).forEach(name=>{
      out.push({date: dateStr, name, count: entryData[name]});
    });
  });
  return out;
}

function computeLeaderboard(allResults, period){
  const todayStr = dateKey(startOfToday());
  const today = startOfToday();
  const WORDGAME_LAUNCH_DATE = new Date(2026, 8, 11); // Start des Spiels — davor gab es keine Rätsel
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  let fromDate;
  if(period === "today"){ fromDate = today; }
  else if(period === "week"){ fromDate = getMondayOfCurrentWeek(today); }
  else if(period === "month"){ fromDate = new Date(today.getFullYear(), today.getMonth(), 1); }
  else { fromDate = WORDGAME_LAUNCH_DATE; }
  if(fromDate < WORDGAME_LAUNCH_DATE) fromDate = WORDGAME_LAUNCH_DATE;
  const fromStr = dateKey(fromDate);

  // Nur bereits abgeschlossene Tage (bis gestern) werden automatisch mit einer Strafe belegt,
  // falls nicht gespielt wurde. Der heutige Tag ist noch nicht vorbei — er zählt nur mit,
  // wenn bereits gespielt wurde, sonst gibt es dafür (noch) keine Strafe.
  const requiredDateKeys = (fromDate <= yesterday) ? getWeekdayDatesInRange(fromDate, yesterday).map(d=>dateKey(d)) : [];

  const filtered = allResults.filter(r => r.date >= fromStr && r.date <= todayStr);
  const byName = {};
  filtered.forEach(r=>{
    if(!byName[r.name]) byName[r.name] = {};
    byName[r.name][r.date] = r.count;
  });
  // Alle Namen einbeziehen, auch wer noch nie gespielt hat — sonst fehlt die Strafe komplett
  NAMES_BASE.concat(GRANDPARENT_NAMES).forEach(n=>{
    if(!byName[n]) byName[n] = {};
  });

  const rows = Object.keys(byName).map(name=>{
    let total = 0, playedCount = 0, dayCount = 0;
    requiredDateKeys.forEach(dk=>{
      dayCount++;
      if(byName[name].hasOwnProperty(dk)){
        total += byName[name][dk];
        playedCount++;
      }else{
        total += WORDGAME_MISSED_PENALTY;
      }
    });
    if(byName[name].hasOwnProperty(todayStr) && fromStr <= todayStr){
      total += byName[name][todayStr];
      playedCount++;
      dayCount++;
    }
    return {
      name,
      avg: dayCount>0 ? total/dayCount : null,
      played: playedCount,
      totalDays: dayCount
    };
  });
  rows.sort((a,b)=> {
    if(a.avg===null && b.avg===null) return 0;
    if(a.avg===null) return 1;
    if(b.avg===null) return -1;
    return a.avg - b.avg;
  });
  return rows;
}

function getMondayOfCurrentWeek(d){
  const nd = new Date(d);
  const wd = nd.getDay();
  const diff = wd===0 ? -6 : 1-wd;
  nd.setDate(nd.getDate()+diff);
  return nd;
}

    ${(() => {

      if(played.length===0) return "";
      const winner = played.reduce((a,b)=> b[1]<a[1] ? b : a);
      return `<div class="wg-winner-banner">🏆 ${t("wordGameWinnerToday")}: <strong style="color:${PERSON_COLORS[winner[0]]||'#999'};">${winner[0]}</strong> (${winner[1]} ${t("wordGameHintsShort")})</div>`;
    })()}
  `;

  body.innerHTML = `
    ${playSectionHtml}
    <button type="button" class="collapse-toggle-btn" id="wgLeaderboardToggle" style="margin-top:12px;">${t("wordGameOverallList")} ${wordGameLeaderboardPeriod?"▾":"▸"}</button>
    ${wordGameLeaderboardPeriod ? `
      <div class="wg-lb-tabs">
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="today"?"selected":""}" data-period="today">${t("wordGameToday")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="week"?"selected":""}" data-period="week">${t("wordGameThisWeek")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="month"?"selected":""}" data-period="month">${t("wordGameThisMonth")}</button>
        <button type="button" class="chip ${wordGameLeaderboardPeriod==="all"?"selected":""}" data-period="all">${t("wordGameAllTime")}</button>
      </div>
      <p class="participant-hint">${t("wordGameFewerBetter")}</p>
      <div id="wgLeaderboardBody"><p class="participant-hint">${t("statusLoading")}</p></div>
    ` : ``}
  `;

  if(!isWeekend){
  if(!wordGameSolved){
    body.querySelectorAll(".wg-key").forEach(btn=>{
      btn.onclick = ()=>{
        const letter = btn.dataset.letter;
        if(wordGameRevealed.has(letter)) return;
        wordGameRevealed.add(letter);
        wordGameLetterCount++;
        wordGameWrongGuessMsg = "";
        saveWordGameProgress();
        renderWordGame();
      };
    });
    const guessBtn = document.getElementById("wordGameGuessBtn");
    const guessInput = document.getElementById("wordGameGuessInput");
    const normalizeGuess = s => (s||"").toLocaleUpperCase(LANG==="tr" ? "tr" : "de").replace(/\s+/g, "");
    const submitGuess = ()=>{
      const val = normalizeGuess(guessInput.value);
      const target = normalizeGuess(puzzle.answer);
      if(val === target){
        puzzle.answer.split("").forEach(ch=>{ if(ch !== " ") wordGameRevealed.add(ch); });
        wordGameSolved = true;
        wordGameJustSolved = true;
        wordGameWrongGuessMsg = "";
        saveWordGameProgress();
        renderWordGame();
      }else{
        wordGameLetterCount++;
        wordGameWrongGuessMsg = t("wordGameWrongGuess");
        guessInput.value = "";
        saveWordGameProgress();
        renderWordGame();
      }
    };
    if(guessBtn) guessBtn.onclick = submitGuess;
    if(guessInput) guessInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitGuess(); });
  }else{
    body.querySelectorAll(".wg-claim-chip").forEach(chip=>{
      chip.onclick = async ()=>{
        const name = chip.dataset.name;
        if(wordGameResults.hasOwnProperty(name)) return;
        wordGameResults[name] = wordGameLetterCount;
        try{
          await cloudStore.set(wordGameKey(dateKey(startOfToday())), JSON.stringify(wordGameResults));
        }catch(e){ /* stiller Fehlschlag, lokal bleibt es trotzdem sichtbar */ }
        appendAuditLog(dateKey(startOfToday()), [`Tägliches Spiel gespielt: ${name} mit ${wordGameLetterCount} ${wordGameLetterCount===1?"Hinweis":"Hinweisen"}`]);
        wordGameJustSolved = false;
        renderWordGame();
      };
    });
  }
  } // Ende if(!isWeekend)

  const lbToggle = document.getElementById("wgLeaderboardToggle");
  if(lbToggle) lbToggle.onclick = ()=>{
    wordGameLeaderboardPeriod = wordGameLeaderboardPeriod ? null : "today";
    renderWordGame();
    if(wordGameLeaderboardPeriod) loadWordGameLeaderboard();
  };
  body.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = ()=>{
      wordGameLeaderboardPeriod = btn.dataset.period;
      renderWordGame();
      loadWordGameLeaderboard();
    };
  });
  if(wordGameLeaderboardPeriod) loadWordGameLeaderboard();
}

async function renderStatistics(){
  const body = document.getElementById("statisticsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const bringCounts = {};
  const abholCounts = {};
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-"); // "tag_2026_09_07" -> "2026-09-07"
    if(dateStr < STAT_START || dateStr >= todayKey) return; // nur abgeschlossene Tage ab Startdatum
    const d = allData[key];
    if(!d) return;
    if(d.bring && Array.isArray(d.bring.people)){
      d.bring.people.forEach(n=>{ bringCounts[n] = (bringCounts[n]||0)+1; });
    }
    if(d.abhol && Array.isArray(d.abhol.people)){
      d.abhol.people.forEach(n=>{ abholCounts[n] = (abholCounts[n]||0)+1; });
    }
  });

  const allNames = Array.from(new Set([...getActiveNames(), ...Object.keys(bringCounts), ...Object.keys(abholCounts)]));
  const maxBring = Math.max(1, ...allNames.map(n=>bringCounts[n]||0));
  const maxAbhol = Math.max(1, ...allNames.map(n=>abholCounts[n]||0));

  // Beste Serie (aufeinanderfolgende Schultage) je Person, getrennt fuer Bringen/Abholen
  const statStartDate = new Date(2026, 8, 7);
  const yesterday = new Date(startOfToday());
  yesterday.setDate(yesterday.getDate() - 1);
  const seriesDates = statStartDate <= yesterday ? getWeekdayDatesInRange(statStartDate, yesterday) : [];
  const bestBringStreak = {}, bestAbholStreak = {};
  const curBringStreak = {}, curAbholStreak = {};
  seriesDates.forEach(d=>{
    const key = "tag_" + dateKey(d);
    const dd = allData[key];
    const bringPeople = (dd && dd.bring && Array.isArray(dd.bring.people)) ? dd.bring.people : [];
    const abholPeople = (dd && dd.abhol && Array.isArray(dd.abhol.people)) ? dd.abhol.people : [];
    allNames.forEach(n=>{
      if(bringPeople.includes(n)){
        curBringStreak[n] = (curBringStreak[n]||0)+1;
        bestBringStreak[n] = Math.max(bestBringStreak[n]||0, curBringStreak[n]);
      }else{
        curBringStreak[n] = 0;
      }
      if(abholPeople.includes(n)){
        curAbholStreak[n] = (curAbholStreak[n]||0)+1;
        bestAbholStreak[n] = Math.max(bestAbholStreak[n]||0, curAbholStreak[n]);
      }else{
        curAbholStreak[n] = 0;
      }
    });
  });

  function barRow(n, count, max){
    const pct = Math.max(4, Math.round((count/max)*100));
    const color = PERSON_COLORS[n] || "#999";
    return `
      <div class="stat-bar-row">
        <span class="stat-bar-name">${n}</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <span class="stat-bar-count">${count}</span>
      </div>`;
  }

  function titleLine(n, titleObj){
    if(!titleObj) return "";
    const nameColor = PERSON_COLORS[n] || "#999";
    const sentence = LANG === "tr"
      ? `${n} ${titleObj.label}`
      : `${n} ${titleObj.article} ${titleObj.label}`;
    return `<div class="stat-rank-line"><span style="color:${nameColor};">${titleObj.emoji} ${escapeHtml(sentence)}</span></div>`;
  }

  body.innerHTML = `
    <label class="field-label" style="font-size:14px;font-weight:800;">${t("statBring")}</label>
    ${allNames.map(n=>barRow(n, bringCounts[n]||0, maxBring)).join("")}
    <div class="stat-rank-group">
      ${allNames.map(n=>titleLine(n, getRankTitle(bringCounts[n]||0, BRING_TITLES, n))).join("")}
    </div>

    <label class="field-label" style="font-size:14px;font-weight:800;margin-top:18px;">${t("statAbhol")}</label>
    ${allNames.map(n=>barRow(n, abholCounts[n]||0, maxAbhol)).join("")}
    <div class="stat-rank-group">
      ${allNames.map(n=>titleLine(n, getRankTitle(abholCounts[n]||0, ABHOL_TITLES, n))).join("")}
    </div>

    <label class="field-label" style="font-size:14px;font-weight:800;margin-top:18px;">${t("statSeriesBringTitle")}</label>
    <div class="stat-rank-group">
      ${(()=>{
        const sorted = allNames.filter(n=>(bestBringStreak[n]||0)>0).sort((a,b)=>(bestBringStreak[b]||0)-(bestBringStreak[a]||0));
        return sorted.length ? sorted.map((n,i)=>{
          const emoji = RANK_EMOJIS[i] || "▪️";
          const size = Math.max(11, 20 - i*1.6);
          return `<div class="stat-rank-line"><span style="color:${PERSON_COLORS[n]||'#999'};font-size:${size}px;">${emoji} ${escapeHtml(n)}: ${bestBringStreak[n]}</span></div>`;
        }).join("") : `<p class="participant-hint">${t("statNoSeries")}</p>`;
      })()}
    </div>

    <label class="field-label" style="font-size:14px;font-weight:800;margin-top:18px;">${t("statSeriesAbholTitle")}</label>
    <div class="stat-rank-group">
      ${(()=>{
        const sorted = allNames.filter(n=>(bestAbholStreak[n]||0)>0).sort((a,b)=>(bestAbholStreak[b]||0)-(bestAbholStreak[a]||0));
        return sorted.length ? sorted.map((n,i)=>{
          const emoji = RANK_EMOJIS[i] || "▪️";
          const size = Math.max(11, 20 - i*1.6);
          return `<div class="stat-rank-line"><span style="color:${PERSON_COLORS[n]||'#999'};font-size:${size}px;">${emoji} ${escapeHtml(n)}: ${bestAbholStreak[n]}</span></div>`;
        }).join("") : `<p class="participant-hint">${t("statNoSeries")}</p>`;
      })()}
    </div>
  `;
}

async function renderPickupTimeStats(){
  const body = document.getElementById("pickupStatsBody");
  if(!body) return;
  body.innerHTML = `<p class="participant-hint">${t("statusLoading")}</p>`;
  let allData;
  try{
    allData = await cloudStore.listAll();
  }catch(e){
    body.innerHTML = `<p class="participant-hint">${t("statusSaveFailed")}${(e&&e.message)||""}</p>`;
    return;
  }
  const STAT_START = "2026-09-07";
  const todayKey = dateKey(startOfToday());
  const entries = [];
  Object.keys(allData).forEach(key=>{
    if(!key.startsWith("tag_")) return;
    const dateStr = key.slice(4).replace(/_/g, "-");
    if(dateStr < STAT_START || dateStr >= todayKey) return; // nur abgeschlossene Tage
    const d = allData[key];
    if(!d || !d.abhol || !d.abhol.time) return;
    const wd = new Date(dateStr+"T00:00:00").getDay();
    entries.push({date:dateStr, time:d.abhol.time, weekday:wd});
  });

  const today = startOfToday();
  const mondayStr = dateKey(getMondayOfCurrentWeek(today));
  const monthPrefix = todayKey.slice(0,7);

  function timeToMinutes(tm){ const p = tm.split(":"); return Number(p[0])*60+Number(p[1]); }
  function minutesToTime(m){ const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"); }

  function computeGroup(filterFn){
    const filtered = entries.filter(filterFn);
    const counts = {};
    filtered.forEach(e=>{ counts[e.time] = (counts[e.time]||0)+1; });
    const times = Object.keys(counts).sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
    let avg=null, min=null, max=null;
    if(filtered.length>0){
      const mins = filtered.map(e=>timeToMinutes(e.time));
      avg = minutesToTime(Math.round(mins.reduce((a,b)=>a+b,0)/mins.length));
      min = minutesToTime(Math.min(...mins));
      max = minutesToTime(Math.max(...mins));
    }
    return {counts, times, avg, min, max, total:filtered.length};
  }

  const groups = {
    week: computeGroup(e=>e.date>=mondayStr),
    month: computeGroup(e=>e.date.slice(0,7)===monthPrefix),
    all: computeGroup(()=>true),
    1: computeGroup(e=>e.weekday===1),
    2: computeGroup(e=>e.weekday===2),
    3: computeGroup(e=>e.weekday===3),
    4: computeGroup(e=>e.weekday===4),
    5: computeGroup(e=>e.weekday===5)
  };

  const wdLabels = getWeekdayShortList(); // [{k,l}] fuer mo..fr, index 0-4 -> Wochentag 1-5

  const periodTabs = [
    {key:"week", label:t("pickupStatsWeek")},
    {key:"month", label:t("pickupStatsMonth")},
    {key:"all", label:t("pickupStatsAll")}
  ];
  const weekdayTabs = [
    {key:"1", label:wdLabels[0].l},
    {key:"2", label:wdLabels[1].l},
    {key:"3", label:wdLabels[2].l},
    {key:"4", label:wdLabels[3].l},
    {key:"5", label:wdLabels[4].l}
  ];

  const g = groups[pickupStatsPeriod] || groups.all;
  const maxCount = Math.max(1, ...g.times.map(tm=>g.counts[tm]));

  body.innerHTML = `
    <div class="wg-lb-tabs">
      ${periodTabs.map(tb=>`<button type="button" class="chip pickup-tab-period ${pickupStatsPeriod===tb.key?"selected":""}" data-period="${tb.key}">${tb.label}</button>`).join("")}
    </div>
    <div class="wg-lb-tabs" style="margin-top:6px;">
      ${weekdayTabs.map(tb=>`<button type="button" class="chip pickup-tab-weekday ${pickupStatsPeriod===tb.key?"selected":""}" data-period="${tb.key}">${tb.label}</button>`).join("")}
    </div>
    ${g.total===0 ? `<p class="participant-hint" style="margin-top:10px;">${t("pickupStatsNoData")}</p>` : `
      ${g.avg ? `<p class="participant-hint" style="margin-top:10px;">${t("pickupStatsAvg")}: <strong>${g.avg}</strong> · ${t("pickupStatsMin")}: <strong>${g.min}</strong> · ${t("pickupStatsMax")}: <strong>${g.max}</strong></p>` : ``}
      <div style="margin-top:8px;">
        ${g.times.map(tm=>{
          const cnt = g.counts[tm];
          const pct = Math.max(4, Math.round((cnt/maxCount)*100));
          return `
            <div class="stat-bar-row">
              <span class="stat-bar-name">${tm}</span>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:var(--blue);"></div></div>
              <span class="stat-bar-count">${cnt}</span>
            </div>`;
        }).join("")}
      </div>
    `}
  `;

  body.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = ()=>{
      pickupStatsPeriod = btn.dataset.period;
      renderPickupTimeStats();
    };
  });
}

function kidsQuizBodyHtml(){
  const filterBar = `
    <div class="quiz-filter-bar" id="kidsQuizFilterBar">
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="all"?"selected":""}" data-filter="all">Alle</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="unplayed"?"selected":""}" data-filter="unplayed">Noch nie gespielt</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="played"?"selected":""}" data-filter="played">Schon gespielt</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="over1m"?"selected":""}" data-filter="over1m">&gt;1 Monat her</button>
      <button type="button" class="quiz-filter-chip ${kidsQuizFilter==="over3m"?"selected":""}" data-filter="over3m">&gt;3 Monate her</button>
      <button type="button" class="quiz-filter-chip quiz-random-btn" id="quizRandomBtn">🎲 Zufallskategorie</button>
    </div>
  `;

  const catsHtml = KIDS_QUIZ.map(cat=>{
    const total = cat.questions.length;
    const playedCount = cat.questions.filter((_, qi)=>!!kidsQuizPlayed[cat.id+"__"+qi]).length;

    // Nur Fragen, die zum aktiven Filter passen
    const visibleIdx = cat.questions
      .map((_, qi)=>qi)
      .filter(qi=>quizMatchesFilter(kidsQuizPlayed[cat.id+"__"+qi], kidsQuizFilter));
    if(kidsQuizFilter !== "all" && visibleIdx.length === 0) return ""; // Kategorie ohne Treffer ausblenden

    const catExpanded = expandedQuizCategories.has(cat.id);
    // Ungespielte Fragen zuerst, gespielte ans Ende — damit man immer neue bekommt
    const orderedIdx = visibleIdx.slice().sort((a,b)=>{
      const aTs = kidsQuizPlayed[cat.id+"__"+a] || 0;
      const bTs = kidsQuizPlayed[cat.id+"__"+b] || 0;
      const aPlayed = aTs ? 1 : 0;
      const bPlayed = bTs ? 1 : 0;
      if(aPlayed !== bPlayed) return aPlayed - bPlayed;
      return a - b;
    });

    return `
      <div class="quiz-cat ${cat.color}" data-cat="${cat.id}">
        <div class="quiz-cat-header-row">
          <button type="button" class="quiz-cat-header">
            <span class="quiz-cat-title">${cat.title}</span>
            <span class="quiz-cat-meta">${playedCount}/${total} gespielt ${catExpanded?"▾":"▸"}</span>
          </button>
          <button type="button" class="quiz-cat-up-btn" aria-label="Nach oben zu den Filtern">⬆️</button>
        </div>
        ${catExpanded ? `
          <div class="quiz-questions">
            ${orderedIdx.map(qi=>{
              const item = cat.questions[qi];
              const qKey = cat.id + "__" + qi;
              const qExpanded = expandedQuizQuestions.has(qKey);
              const ts = kidsQuizPlayed[qKey];
              const ageClass = quizPlayedAgeClass(ts);
              return `
                <div class="quiz-question ${ts?"quiz-question-played":""} ${ageClass}" data-qkey="${qKey}">
                  <div class="quiz-question-row">
                    <button type="button" class="quiz-check-btn" aria-label="Als gespielt markieren">${ts?"✅":"⬜"}</button>
                    <button type="button" class="quiz-question-btn">
                      <span>${escapeHtml(item.q)}</span>
                      <span class="quiz-q-arrow">${qExpanded?"▾":"▸"}</span>
                    </button>
                  </div>
                  ${ts ? `<div class="quiz-age-label">${escapeHtml(quizPlayedAgeLabel(ts))}</div>` : ``}
                  ${qExpanded ? `<div class="quiz-answer">${escapeHtml(item.a)}</div>` : ``}
                </div>
              `;
            }).join("")}
          </div>
        ` : ``}
      </div>
    `;
  }).join("");

  return filterBar + (catsHtml.trim() ? catsHtml : `<p class="participant-hint">Keine Fragen für diesen Filter — versuch's mit einem anderen!</p>`);
}

function minutesUntilNextBus(times){
  const now = new Date();
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  for(const tm of times){
    const p = tm.split(":");
    const t = Number(p[0])*60 + Number(p[1]);
    if(t >= nowMinutes) return t - nowMinutes;
  }
  return null;
}
function busNextSummaryText(){
  const toSchool = minutesUntilNextBus(BUS_TO_SCHOOL);
  const fromSchool = minutesUntilNextBus(BUS_FROM_SCHOOL);
  const homeText = fromSchool===null ? t("busNoMore") : `${fromSchool} ${t("busMinShort")}`;
  const schoolText = toSchool===null ? t("busNoMore") : `${toSchool} ${t("busMinShort")}`;
  return `🏠 ${t("busDirHome")}: ${homeText} · 🏫 ${t("busDirSchool")}: ${schoolText}`;
}

function schoolYearMonths(){
  // 12 aufeinanderfolgende Monate ab dem laufenden Schuljahresstart (September)
  const now = startOfToday();
  const startYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear()-1; // Monat-Index 8 = September
  const months = [];
  for(let i=0;i<12;i++){
    const m = (8+i) % 12;
    const y = startYear + Math.floor((8+i)/12);
    months.push({ y, m, key: y+"-"+String(m+1).padStart(2,"0"), color: MONTH_COLORS[i] });
  }
  return months;
}

(function initSwipeDayNav(){
  const panel = document.getElementById("daypanel");
  if(!panel) return;
  let sx = 0, sy = 0, st = 0, tracking = false;
  panel.addEventListener("touchstart", e=>{
    if(e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    st = Date.now();
    tracking = true;
  }, {passive:true});
  panel.addEventListener("touchend", e=>{
    if(!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - sx;
    const dy = touch.clientY - sy;
    const dt = Date.now() - st;
    if(Math.abs(dx) < 70) return;   // zu kurze Bewegung
    if(Math.abs(dy) > 60) return;   // eher vertikales Scrollen als Swipe
    if(dt > 700) return;            // zu langsam für einen Swipe
    if(dx < 0) goToNextDay(); else goToPrevDay();
  }, {passive:true});
})();

function formatAuditDay(dayStr){
  if(!dayStr) return "Allgemein";
  const [y,m,d] = dayStr.split("-");
  return `${d}.${m}.${y}`;
}
function formatAuditTimestamp(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric"}) + ", " + d.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"}) + " Uhr";
}
function renderAuditLogBody(){
  const body = document.getElementById("auditLogBody");
  if(!body) return;
  if(!auditLog.length){
    body.innerHTML = `<p class="participant-hint">Noch keine Änderungen aufgezeichnet.</p>`;
    return;
  }
  const sorted = auditLog.slice().sort((a,b)=> b.ts - a.ts);
  body.innerHTML = sorted.map(entry=>`
    <div class="audit-log-entry">
      <div class="audit-log-entry-head">
        <span class="audit-log-entry-day">📅 ${escapeHtml(formatAuditDay(entry.day))}</span>
        <span class="audit-log-entry-time">${escapeHtml(formatAuditTimestamp(entry.ts))}</span>
      </div>
      <ul>${entry.changes.map(c=>`<li>${escapeHtml(c)}</li>`).join("")}</ul>
    </div>
  `).join("") + `<button type="button" class="audit-log-clear-btn" id="auditLogClearBtn">Verlauf leeren</button>`;
  const clearBtn = document.getElementById("auditLogClearBtn");
  if(clearBtn) clearBtn.onclick = async ()=>{
    if(!confirm("Gesamten Änderungsverlauf wirklich löschen?")) return;
    auditLog = [];
    try{ await cloudStore.set(AUDIT_KEY, JSON.stringify(auditLog)); }catch(e){}
    renderAuditLogBody();
  };
}
async function openAuditLog(){
  document.getElementById("auditLogOverlay").style.display = "flex";
  if(!auditLoaded){
    document.getElementById("auditLogBody").innerHTML = `<p class="participant-hint">Lädt…</p>`;
    await loadAuditLog();
  }
  renderAuditLogBody();
}
function closeAuditLog(){
  document.getElementById("auditLogOverlay").style.display = "none";
}
document.getElementById("auditLogBackdrop").onclick = closeAuditLog;
document.getElementById("auditLogCloseBtn").onclick = closeAuditLog;

const SEASONAL_EMOJI = {
  halloween: ["🎃","👻","🦇","🕸️","🧙"],
  christmas: ["❄️","🎄","⭐","🎅","🔔"],
  easter: ["🐰","🥚","🌷","🐣"]
};
function renderSeasonalDecor(){
  const old = document.getElementById("seasonalDecor");
  if(old) old.remove();
  if(seasonalTheme === "none" || !SEASONAL_EMOJI[seasonalTheme]) return;
  const emojis = SEASONAL_EMOJI[seasonalTheme];
  const wrap = document.createElement("div");
  wrap.className = "seasonal-decor";
  wrap.id = "seasonalDecor";
  let html = "";
  for(let i=0;i<16;i++){
    const emoji = emojis[i % emojis.length];
    const left = Math.round(Math.random()*96);
    const duration = (9 + Math.random()*10).toFixed(1);
    const delay = (-Math.random()*18).toFixed(1);
    const size = (16 + Math.random()*14).toFixed(0);
    html += `<span style="left:${left}%;font-size:${size}px;animation-duration:${duration}s;animation-delay:${delay}s;">${emoji}</span>`;
  }
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
}

  startApp();
