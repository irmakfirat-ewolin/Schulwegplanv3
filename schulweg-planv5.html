<script>
// ---- Firebase-Anbindung: ersetzt Claudes Speicher, funktioniert ohne Konto für die Nutzer ----
const firebaseConfig = {
  apiKey: "AIzaSyBZUgoJIh2flCdR4lNU8q4VxeB4G-St2Y0",
  authDomain: "schulwegend.firebaseapp.com",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Nachgebautes storage-Objekt mit derselben Schnittstelle wie vorher (get/set/delete),
// damit der Rest der App unverändert bleibt.
const cloudStore = {
  async get(key){
    const snap = await db.ref(key.replace(/:/g, "_")).once("value");
    if(snap.val() === null || typeof snap.val() === "undefined"){
      throw new Error("not found");
    }
    return { value: JSON.stringify(snap.val()) };
  },
  async set(key, valueStr){
    await db.ref(key.replace(/:/g, "_")).set(JSON.parse(valueStr));
    return { key, value: valueStr };
  },
  async delete(key){
    await db.ref(key.replace(/:/g, "_")).remove();
    return { key, deleted: true };
  }
};


const NAMES = ["Fırat","Ebru","Hande","Ridvan"];
const WEEKDAY_INFO = {
  1:{label:"Montag",     short:"Mo", color:"#EF6F5B"},
  2:{label:"Dienstag",   short:"Di", color:"#F2A93B"},
  3:{label:"Mittwoch",   short:"Mi", color:"#2E9E8F"},
  4:{label:"Donnerstag", short:"Do", color:"#4FA3D1"},
  5:{label:"Freitag",    short:"Fr", color:"#8B7FD9"},
  6:{label:"Samstag",    short:"Sa", color:"#B9B4A6"},
  0:{label:"Sonntag",    short:"So", color:"#B9B4A6"}
};

function timeOptions(startH,endH,stepMin){
  const out=[""];
  for(let m=startH*60; m<=endH*60; m+=stepMin){
    const h=String(Math.floor(m/60)).padStart(2,"0");
    const mm=String(m%60).padStart(2,"0");
    out.push(`${h}:${mm}`);
  }
  return out;
}
const TIMES_15 = timeOptions(6,21,15);
const TIMES_5  = timeOptions(6,21,5);

function emptyDay(){
  return {
    bring:{people:[], time:"08:00"},
    abhol:{people:[], time:"16:30"},
    readiness:{child:"", time:""},
    exceptions:{
      eflin:{noBring:false, noBringReason:"", noAbhol:false, noAbholReason:""},
      nezir:{noBring:false, noBringReason:"", noAbhol:false, noAbholReason:""}
    },
    schoolEvents:[],
    notices:[],
    dua:{mustPickup:false, wishTime:"", byTime:"", notices:[], kindergartenEvents:[]},
    elternHinweise:[]
  };
}

function noticeText(n){
  return typeof n === "string" ? n : (n && n.text) || "";
}

function normalizePhotos(arr){
  return Array.isArray(arr) ? arr.map(p=>({url:p.url||"", name:p.name||""})) : [];
}

function normalizeDuaNotice(n){
  if(typeof n === "string") return {text:n, photos:[]};
  return {text:n.text||"", photos:normalizePhotos(n.photos)};
}

function normalizeNotice(n){
  if(typeof n === "string") return {text:n, kids:[], photos:[], location:""};
  return {text:n.text||"", kids:Array.isArray(n.kids)?n.kids:[], photos:normalizePhotos(n.photos), location:n.location||""};
}

function normalizeKindergartenEvent(k){
  return {timeStart:k.timeStart||"", timeEnd:k.timeEnd||"", text:k.text||"", photos:normalizePhotos(k.photos)};
}

function normalizeElternHinweis(e){
  return {person:e.person||"", text:e.text||"", timeStart:e.timeStart||"", timeEnd:e.timeEnd||"", photos:normalizePhotos(e.photos)};
}

function mergeDay(parsed){
  const day = emptyDay();
  day.bring = Object.assign({people:[],time:""}, parsed.bring||{});
  day.abhol = Object.assign({people:[],time:""}, parsed.abhol||{});
  const oldReadiness = parsed.readiness || {};
  if(typeof oldReadiness.child !== "undefined"){
    day.readiness = Object.assign({child:"",time:""}, oldReadiness);
  }else if(oldReadiness.eflin){
    day.readiness = {child:"eflin", time:oldReadiness.eflin};
  }else if(oldReadiness.nezir){
    day.readiness = {child:"nezir", time:oldReadiness.nezir};
  }
  day.exceptions = {
    eflin: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).eflin||{}),
    nezir: Object.assign({noBring:false,noBringReason:"",noAbhol:false,noAbholReason:""}, (parsed.exceptions||{}).nezir||{})
  };
  day.dua = Object.assign({mustPickup:false,wishTime:"",byTime:"",notices:[],kindergartenEvents:[]}, parsed.dua||{});
  day.dua.notices = Array.isArray(day.dua.notices) ? day.dua.notices.map(normalizeDuaNotice) : [];
  day.dua.kindergartenEvents = Array.isArray(day.dua.kindergartenEvents) ? day.dua.kindergartenEvents.map(normalizeKindergartenEvent) : [];
  day.schoolEvents = Array.isArray(parsed.schoolEvents) ? parsed.schoolEvents.map(ev=>{
    const merged = Object.assign({name:"",timeStart:"",timeEnd:"",hasEndTime:false,location:"",participants:[],kids:[],photos:[]}, ev);
    if(!merged.timeStart && ev.time) merged.timeStart = ev.time; // altes Format "time" übernehmen
    merged.photos = normalizePhotos(merged.photos);
    return merged;
  }) : [];
  day.notices = Array.isArray(parsed.notices) ? parsed.notices.map(normalizeNotice) : [];
  day.elternHinweise = Array.isArray(parsed.elternHinweise) ? parsed.elternHinweise.map(normalizeElternHinweis) : [];
  return day;
}

function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function addDays(d, n){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+n);
  return nd;
}
function startOfToday(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}
function isWeekend(d){
  const wd = d.getDay();
  return wd===0 || wd===6;
}
function snapToWeekday(d){
  // Samstag/Sonntag überspringen, landet auf dem nächsten Montag
  const nd = new Date(d);
  if(nd.getDay()===6) nd.setDate(nd.getDate()+2);
  else if(nd.getDay()===0) nd.setDate(nd.getDate()+1);
  return nd;
}
function stepWeekday(d, direction){
  // einen Tag in Richtung "direction" (+1/-1), Wochenenden werden übersprungen
  const nd = new Date(d);
  do{
    nd.setDate(nd.getDate()+direction);
  }while(isWeekend(nd));
  return nd;
}

const MIN_DATE = addDays(startOfToday(), -365);
const MAX_DATE = addDays(startOfToday(), 365);

let currentDate = snapToWeekday(startOfToday());
let currentDay = emptyDay();
let loadToken = 0;
let dirty = false;

function clampDate(){
  if(currentDate < MIN_DATE) currentDate = new Date(MIN_DATE);
  if(currentDate > MAX_DATE) currentDate = new Date(MAX_DATE);
  currentDate = snapToWeekday(currentDate);
}

function confirmLeaveIfDirty(){
  // Kein blockierender Dialog mehr (führte in mancher Vorschau-Umgebung zu Fehlern).
  // Der Hinweistext "Ungespeicherte Änderungen" bleibt sichtbar, bis gespeichert wird.
  return true;
}

function setSaveState(text, isError){
  const el = document.getElementById("saveState");
  el.textContent = text;
  el.classList.toggle("error", !!isError);
  const topEl = document.getElementById("topSaveStatus");
  if(topEl){
    topEl.textContent = text;
    topEl.classList.toggle("error", !!isError);
  }
}

async function resetCurrentDay(){
  const label = dateKey(currentDate);
  const ok = confirm(`Alle Einträge für ${label} wirklich entfernen? Der Tag wird wieder unbearbeitet.`);
  if(!ok) return;
  const key = "tag:" + label;
  try{
    await cloudStore.delete(key);
  }catch(e){
    // gab evtl. noch keinen gespeicherten Eintrag für diesen Tag — kein Problem
  }
  currentDay = emptyDay();
  dirty = false;
  setSaveState("Tag wurde geleert.", false);
  renderDay();
}

function performSave(){
  const errors = validateDay(currentDay);
  if(errors.length){
    setSaveState("Bitte ergänzen: " + errors.join(" · "), true);
    return;
  }
  saveNow(1);
}

async function loadDay(){
  clampDate();
  const token = ++loadToken;
  const key = "tag:" + dateKey(currentDate);
  setSaveState("lädt…", false);
  dirty = false;
  renderDateNav();

  let loaded = emptyDay();
  try{
    const res = await cloudStore.get(key);
    if(res && res.value){
      loaded = mergeDay(JSON.parse(res.value));
    }
  }catch(e){
    // Für diesen Tag ist noch nichts gespeichert — das ist der Normalfall, kein echter Fehler.
  }
  if(token !== loadToken) return; // eine neuere Auswahl läuft bereits
  currentDay = loaded;
  setSaveState("", false);
  renderDay();
}

function markDirty(){
  dirty = true;
  setSaveState("Ungespeicherte Änderungen — unten auf „Speichern“ tippen", false);
}

function validateDay(day){
  const errors = [];
  day.schoolEvents.forEach((ev, i)=>{
    if(!ev.name.trim()) errors.push(`Termin ${i+1}: Bezeichnung fehlt`);
    if(ev.kids.length===0) errors.push(`Termin ${i+1}: Kind wählen`);
  });
  day.notices.forEach((n, i)=>{
    if(!n.text.trim()) errors.push(`Hinweis ${i+1}: Text fehlt`);
    if(n.kids.length===0) errors.push(`Hinweis ${i+1}: Kind wählen`);
  });
  return errors;
}

async function saveNow(attempt){
  const key = "tag:" + dateKey(currentDate);
  setSaveState(attempt===1 ? "speichert…" : "speichert… (Versuch " + attempt + ")", false);
  try{
    const result = await cloudStore.set(key, JSON.stringify(currentDay));
    if(result){
      dirty = false;
      setSaveState("gespeichert · für alle vier sichtbar", false);
    }else{
      throw new Error("kein Ergebnis vom Speicher");
    }
  }catch(e){
    if(attempt < 3){
      setTimeout(()=>saveNow(attempt+1), 800 * attempt);
    }else{
      const msg = (e && e.message) ? e.message : "unbekannter Fehler";
      setSaveState("Speichern fehlgeschlagen (" + msg + ") — bitte erneut versuchen", true);
    }
  }
}

/* ---------------- Wetter (nächste 5 Tage) ---------------- */
const WEATHER_LAT = 48.135;   // Liesing, Wien
const WEATHER_LON = 16.283;
let weatherByDate = {};
let weatherError = "";

function weatherEmoji(code){
  if(code===0) return "☀️";
  if(code===1||code===2) return "🌤️";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if(code>=51&&code<=57) return "🌦️";
  if(code>=61&&code<=67) return "🌧️";
  if(code>=71&&code<=77) return "❄️";
  if(code>=80&&code<=82) return "🌦️";
  if(code>=85&&code<=86) return "🌨️";
  if(code>=95) return "⛈️";
  return "🌡️";
}

async function loadWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FVienna&forecast_days=7`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const days = data.daily;
    if(!days || !days.time) throw new Error("unerwartetes Datenformat");
    const map = {};
    days.time.forEach((dateStr, i)=>{
      map[dateStr] = {
        code: days.weather_code[i],
        tmax: Math.round(days.temperature_2m_max[i]),
        tmin: Math.round(days.temperature_2m_min[i])
      };
    });
    weatherByDate = map;
    weatherError = "";
  }catch(e){
    weatherError = (e && e.message) ? e.message : "unbekannter Fehler";
  }
  renderWeatherChip();
}

function renderWeatherChip(){
  const chip = document.getElementById("weatherChip");
  if(!chip) return;
  const diffDays = Math.round((currentDate - startOfToday()) / 86400000);
  const withinRange = diffDays>=0 && diffDays<=4;
  if(!withinRange){
    chip.style.display = "none";
    return;
  }
  const w = weatherByDate[dateKey(currentDate)];
  if(w){
    chip.textContent = `${weatherEmoji(w.code)} ${w.tmin}° / ${w.tmax}°`;
    chip.style.display = "inline-block";
  }else if(weatherError){
    chip.textContent = "Wetter nicht verfügbar (" + weatherError + ")";
    chip.style.display = "inline-block";
  }else{
    chip.style.display = "none";
  }
}

function dayStatusChips(day){

  }else{

  }

    chips.push({text:"Bereitschaftszeit fehlt", tone:"warn"});
  }

  const hasException = day.exceptions.eflin.noBring || day.exceptions.eflin.noAbhol
    || day.exceptions.nezir.noBring || day.exceptions.nezir.noAbhol;
  if(hasException) chips.push({text:"Ausnahme beachten!", tone:"alert"});

  if(day.schoolEvents.length>0) chips.push({text:"Schultermin vorhanden", tone:"info"});
  if(day.notices.length>0) chips.push({text:"Hinweis vorhanden", tone:"info"});
  if(day.dua.mustPickup) chips.push({text:"Dua Abholung beachten", tone:"alert"});
  if(day.elternHinweise && day.elternHinweise.length>0) chips.push({text:"Eltern Arbeitszeit hinzugefügt", tone:"info"});

  return chips;
}

async function uploadPhoto(file, pathPrefix){
  if(!firebase.storage){
    throw new Error("Storage-SDK nicht geladen");
  }
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${pathPrefix}/${Date.now()}_${safeName}`;
  const fileRef = firebase.storage().ref().child(path);

  const timeout = new Promise((_, reject)=>{
    setTimeout(()=> reject(new Error("Zeitüberschreitung — Storage evtl. nicht aktiviert")), 20000);
  });

  await Promise.race([fileRef.put(file), timeout]);
  const url = await Promise.race([fileRef.getDownloadURL(), timeout]);
  return { url, name: file.name };
}

function photosHtml(photos){
  return `
    <div class="photos-row">
      ${photos.map((p, i)=>`
        <div class="photo-thumb" data-pidx="${i}">
          <a href="${p.url}" target="_blank" rel="noopener"><img src="${p.url}" alt=""></a>
          <input type="text" class="photo-name" placeholder="Name (optional)" value="${escapeHtml(p.name)}">
          <button type="button" class="photo-remove">entfernen</button>
        </div>
      `).join("")}
    </div>
    <label class="photo-add-btn">
      📷 Foto hinzufügen
      <input type="file" accept="image/*" multiple class="photo-input">
    </label>
    <span class="photo-status"></span>
  `;
}

function bindPhotoWidget(card, photos, pathPrefix, rerender){
  card.querySelectorAll(".photo-remove").forEach((btn, i)=>{
    btn.onclick = ()=>{ photos.splice(i,1); markDirty(); rerender(); };
  });
  card.querySelectorAll(".photo-name").forEach((inp, i)=>{
    inp.oninput = e=>{ photos[i].name = e.target.value; markDirty(); };
  });
  const fileInput = card.querySelector(".photo-input");
  const statusEl = card.querySelector(".photo-status");
  if(fileInput){
    fileInput.onchange = async (e)=>{
      const files = Array.from(e.target.files || []);
      if(!files.length) return;
      statusEl.textContent = "lädt hoch…";
      for(const file of files){
        try{
          const uploaded = await uploadPhoto(file, pathPrefix);
          photos.push(uploaded);
        }catch(err){
          statusEl.textContent = "Hochladen fehlgeschlagen (" + ((err && err.message) || "Fehler") + ")";
          return;
        }
      }
      markDirty();
      rerender();
    };
  }
}

function autoGrow(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
function initAutoGrow(container){
  container.querySelectorAll("textarea.autogrow").forEach(autoGrow);
}

function updateDuaNote(){
  const day = currentDay;
  const noteEl = document.getElementById("duaNote");
  if(day.dua.mustPickup && (day.dua.wishTime || day.dua.byTime)){
    const parts = [];
    if(day.dua.wishTime) parts.push(`Wunsch: ${day.dua.wishTime} Uhr`);
    if(day.dua.byTime) parts.push(`spätestens ${day.dua.byTime} Uhr`);
    noteEl.innerHTML = `<div class="dua-note">Familie Irmak: Dua abholen — ${parts.join(", ")}</div>`;
  }else if(day.dua.mustPickup){
    noteEl.innerHTML = `<div class="dua-note">Familie Irmak: Dua heute abholen — bitte Uhrzeit wählen</div>`;
  }else{
    noteEl.innerHTML = "";
  }
}

function renderDuaEventsList(){
  const day = currentDay;
  const wrap = document.getElementById("duaEventsList");
  wrap.innerHTML = day.dua.kindergartenEvents.map((ke, idx)=>`
    <div class="entry-card" data-idx="${idx}">
      <div class="entry-top">
        <textarea class="dke-text autogrow" rows="1" placeholder="Was steht an? (z. B. Laternenfest)" style="flex:1;">${escapeHtml(ke.text)}</textarea>
        <button type="button" class="remove-btn dke-remove">entfernen</button>
      </div>
      <div class="row2" style="margin-top:10px;">
        <div>${selectHtml("dkeStart"+idx, TIMES_15, ke.timeStart)}</div>
        <div>${selectHtml("dkeEnd"+idx, TIMES_15, ke.timeEnd)}</div>
      </div>
      <label class="field-label" style="margin-top:10px;font-size:13px;">Fotos</label>
      ${photosHtml(ke.photos)}
    </div>
  `).join("") || `<p class="participant-hint">Kein Kindergarten-Termin eingetragen.</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const ke = day.dua.kindergartenEvents[idx];
    card.querySelector(".dke-text").oninput = e=>{ ke.text = e.target.value; autoGrow(e.target); markDirty(); };
    card.querySelector(`#dkeStart${idx}`).onchange = e=>{ ke.timeStart = e.target.value; markDirty(); };
    card.querySelector(`#dkeEnd${idx}`).onchange = e=>{ ke.timeEnd = e.target.value; markDirty(); };
    card.querySelector(".dke-remove").onclick = ()=>{ day.dua.kindergartenEvents.splice(idx,1); renderDuaEventsList(); markDirty(); };
    bindPhotoWidget(card, ke.photos, `photos/${dateKey(currentDate)}/kindergarten${idx}`, renderDuaEventsList);
  });
  initAutoGrow(wrap);
}

function renderElternHinweiseList(){
  const day = currentDay;
  const wrap = document.getElementById("elternHinweiseList");
  wrap.innerHTML = day.elternHinweise.map((eh, idx)=>`
    <div class="entry-card" data-idx="${idx}">
      <label class="field-label" style="font-size:13px;">Name</label>
      <div class="chips eh-chips">${NAMES.map(n=>nameChipHtml(n, eh.person===n)).join("")}</div>
      <label class="field-label" style="margin-top:10px;font-size:13px;">Termine</label>
      <textarea class="eh-text autogrow" rows="1" placeholder="z. B. muss länger arbeiten">${escapeHtml(eh.text)}</textarea>
      <label class="field-label" style="margin-top:10px;font-size:13px;">Arbeitszeit</label>
      <div class="row2">
        <div>${selectHtml("ehStart"+idx, TIMES_15, eh.timeStart)}</div>
        <div>${selectHtml("ehEnd"+idx, TIMES_15, eh.timeEnd)}</div>
      </div>
      <label class="field-label" style="margin-top:10px;font-size:13px;">Fotos</label>
      ${photosHtml(eh.photos)}
      <button type="button" class="remove-btn eh-remove" style="margin-top:8px;">entfernen</button>
    </div>
  `).join("") || `<p class="participant-hint">Noch kein Eltern-Hinweis eingetragen.</p>`;

  wrap.querySelectorAll(".entry-card").forEach(card=>{
    const idx = Number(card.dataset.idx);
    const eh = day.elternHinweise[idx];
    card.querySelectorAll(".eh-chips .chip").forEach(chip=>{
      chip.onclick = ()=>{
        eh.person = (eh.person === chip.dataset.name) ? "" : chip.dataset.name; // einzelne Person, erneutes Antippen hebt auf
        markDirty();
        renderElternHinweiseList();
      };
    });
    card.querySelector(".eh-text").oninput = e=>{ eh.text = e.target.value; autoGrow(e.target); markDirty(); };
    card.querySelector(`#ehStart${idx}`).onchange = e=>{ eh.timeStart = e.target.value; markDirty(); };
    card.querySelector(`#ehEnd${idx}`).onchange = e=>{ eh.timeEnd = e.target.value; markDirty(); };
    card.querySelector(".eh-remove").onclick = ()=>{ day.elternHinweise.splice(idx,1); renderElternHinweiseList(); markDirty(); };
    bindPhotoWidget(card, eh.photos, `photos/${dateKey(currentDate)}/eltern${idx}`, renderElternHinweiseList);
  });
  initAutoGrow(wrap);
}

function bindEvents(){
  const day = currentDay;

  document.getElementById("bringChips").querySelectorAll(".chip").forEach(chip=>{
    chip.onclick = ()=>{
      const n = chip.dataset.name;
      const i = day.bring.people.indexOf(n);
      if(i>-1) day.bring.people.splice(i,1); else day.bring.people.push(n);
      setChipColor(chip, n, day.bring.people.includes(n));
      markDirty();
    };
  });
  document.getElementById("bringTime").onchange = e=>{ day.bring.time = e.target.value; markDirty(); };

  document.getElementById("abholChips").querySelectorAll(".chip").forEach(chip=>{
    chip.onclick = ()=>{
      const n = chip.dataset.name;
      const i = day.abhol.people.indexOf(n);
      if(i>-1) day.abhol.people.splice(i,1); else day.abhol.people.push(n);
      setChipColor(chip, n, day.abhol.people.includes(n));
      markDirty();
    };
  });
  document.getElementById("abholTime").onchange = e=>{ day.abhol.time = e.target.value; markDirty(); };

  const readinessChips = document.querySelectorAll("#readinessChildChips .chip");
  readinessChips.forEach(chip=>{
    chip.onclick = ()=>{
      day.readiness.child = chip.dataset.child; // einmal gewählt, bleibt ein Kind gewählt — kein Zurück auf "keines"
      markDirty();
      renderDay(); // komplett neu aufbauen, damit die Uhrzeit garantiert erscheint
    };
  });
  document.getElementById("readyTime").onchange = e=>{ day.readiness.time = e.target.value; markDirty(); };

  ["eflin","nezir"].forEach(key=>{
    const block = document.querySelector(`.kidblock[data-kid="${key}"]`);
    const ex = day.exceptions[key];

    const noBring = block.querySelector(".exc-noBring");
    const noBringReasonWrap = block.querySelector(".exc-noBring").closest(".subrow").nextElementSibling;
    noBring.onchange = e=>{
      ex.noBring = e.target.checked;
      noBringReasonWrap.style.display = ex.noBring ? "block" : "none";
      markDirty();
    };
    block.querySelector(".exc-noBringReason").oninput = e=>{ ex.noBringReason = e.target.value; markDirty(); };

    const noAbhol = block.querySelector(".exc-noAbhol");
    const noAbholReasonWrap = block.querySelector(".exc-noAbhol").closest(".subrow").nextElementSibling;
    noAbhol.onchange = e=>{
      ex.noAbhol = e.target.checked;
      noAbholReasonWrap.style.display = ex.noAbhol ? "block" : "none";
      markDirty();
    };
    block.querySelector(".exc-noAbholReason").oninput = e=>{ ex.noAbholReason = e.target.value; markDirty(); };
  });

  document.getElementById("addEventBtn").onclick = ()=>{
    day.schoolEvents.push({name:"", timeStart:"", timeEnd:"", hasEndTime:false, location:"", participants:[], kids:[], photos:[]});
    renderEventsList();
    markDirty();
  };

  document.getElementById("addNoticeBtn").onclick = ()=>{
    day.notices.push({text:"", kids:[], photos:[], location:""});
    renderNoticesList();
    markDirty();
  };

  document.getElementById("duaPickup").onchange = e=>{
    day.dua.mustPickup = e.target.checked;
    document.getElementById("duaTimeWrap").style.display = day.dua.mustPickup ? "block" : "none";
    updateDuaNote();
    markDirty();
  };
  document.getElementById("duaWishTime").onchange = e=>{
    day.dua.wishTime = e.target.value;
    updateDuaNote();
    markDirty();
  };
  document.getElementById("duaTime").onchange = e=>{
    day.dua.byTime = e.target.value;
    updateDuaNote();
    markDirty();
  };

  document.getElementById("addDuaEventBtn").onclick = ()=>{
    day.dua.kindergartenEvents.push({timeStart:"", timeEnd:"", text:"", photos:[]});
    renderDuaEventsList();
    markDirty();
  };

  document.getElementById("addDuaNoticeBtn").onclick = ()=>{
    day.dua.notices.push({text:"", photos:[]});
    renderDuaNoticesList();
    markDirty();
  };

  document.getElementById("addElternHinweisBtn").onclick = ()=>{
    day.elternHinweise.push({person:"", text:"", timeStart:"", timeEnd:"", photos:[]});
    renderElternHinweiseList();
    markDirty();
  };

  document.getElementById("saveDayBtn").onclick = performSave;
}

document.getElementById("saveDayBtnTop").onclick = performSave;
document.getElementById("resetDayBtn").onclick = resetCurrentDay;
document.getElementById("prevDayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = stepWeekday(currentDate,-1);
  loadDay();
};
document.getElementById("nextDayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = stepWeekday(currentDate,1);
  loadDay();
};
document.getElementById("todayBtn").onclick = ()=>{
  if(!confirmLeaveIfDirty()) return;
  currentDate = snapToWeekday(startOfToday());
  loadDay();
};
document.getElementById("dateInput").onchange = e=>{
  if(!confirmLeaveIfDirty()){
    renderDateNav(); // Datumsfeld auf den bisherigen Wert zurücksetzen
    return;
  }
  const [y,m,d] = e.target.value.split("-").map(Number);
  if(!y||!m||!d) return;
  currentDate = snapToWeekday(new Date(y, m-1, d));
  loadDay();
};

const APP_PIN = "1999";

function startApp(){
  loadDay();
  loadWeather();
}

function tryUnlock(){
  const val = document.getElementById("pinInput").value.trim();
  if(val === APP_PIN){
    localStorage.setItem("schulweg-unlocked", "yes");
    document.getElementById("pinGate").style.display = "none";
    startApp();
  }else{
    document.getElementById("pinError").textContent = "Falscher Code, bitte nochmal.";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  }
}
document.getElementById("pinSubmit").onclick = tryUnlock;
document.getElementById("pinInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") tryUnlock();
});

if(localStorage.getItem("schulweg-unlocked") === "yes"){
  document.getElementById("pinGate").style.display = "none";
  startApp();
}else{
  document.getElementById("pinInput").focus();
}
</script>
